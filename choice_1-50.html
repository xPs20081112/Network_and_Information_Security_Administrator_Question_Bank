<script>
const PAGE_FILE = "choice_1-50.html";
const PAGE_QUESTIONS = [{"id":"choice-001","type":"choice","number":1,"globalNumber":1,"stem":"下列关于加强职业道德建设的重要意义的描述，不正确的是 (　　)","images":[],"options":{"A":"提高劳动生产力的关键","B":"社会主义精神文明建设有重要内容","C":"提高劳动者素质的重要途径","D":"社会主义道德建设的中重要任务"},"answer":"A","analysis":"提高劳动生产力的关键因素有很多，如技术创新、科学管理等，加强职业道德建设并非提高劳动生产力的关键，B、C、D 选项对加强职业道德建设意义的描述均正确","source":"职业道德与计算机基础综合课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-002","type":"choice","number":2,"globalNumber":2,"stem":"(　　) 是高尚道德情操在职业活动中的重要体现","images":[],"options":{"A":"忠于职守","B":"尽职尽责","C":"廉洁奉公","D":"恪守信用"},"answer":"B","analysis":"尽职尽责要求从业者对工作认真负责、全身心投入，是高尚道德情操在职业活动中的重要体现。忠于职守强调坚守岗位；廉洁奉公侧重于廉洁自律；恪守信用主要关乎诚信，相比之下 B 更符合题意","source":"职业道德与计算机基础综合课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-003","type":"choice","number":3,"globalNumber":3,"stem":"任何从业人员都严格按照各自职业的规范和不同的职业内容去调适自己的行为，属于 (　　) 的职业道德的特点","images":[],"options":{"A":"相对稳定性和连续性","B":"操作性和准强度性","C":"普适性和广泛性","D":"规范性和专业性"},"answer":"D","analysis":"规范性和专业性体现在从业人员需遵循职业规范和特定职业内容调整行为。相对稳定性和连续性侧重于职业特点的传承；操作性和准强度性强调操作和约束程度；普适性和广泛性指适用范围，均不符合题意","source":"职业道德与计算机基础综合课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-004","type":"choice","number":4,"globalNumber":4,"stem":"下列关于诚实守信，说法错误的是 (　　)","images":[],"options":{"A":"诚实是守信的基础，守信是诚实的具体表现","B":"不诚实很难做到守信，不守信也很难说是真正的诚实","C":"诚实和守信在含义是完全一样的，没有任何区别","D":"不诚实守信必然要付出昂贵的代价，最终受损失的是自己"},"answer":"C","analysis":"诚实侧重于真实、不虚假，守信侧重于遵守承诺，二者含义有区别但紧密相关，A、B、D 选项表述正确","source":"职业道德与计算机基础综合课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-005","type":"choice","number":5,"globalNumber":5,"stem":"就职业纪律的特性来说，它一般具有 (　　)","images":[],"options":{"A":"一定的模糊性","B":"执行上的非强制性","C":"明确的规定性","D":"法律强制性"},"answer":"C","analysis":"职业纪律有明确的规定，用于约束从业者行为，不具有模糊性；职业纪律具有一定强制性，但并非法律强制性，B 选项错误","source":"职业道德与计算机基础综合课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-006","type":"choice","number":6,"globalNumber":6,"stem":"字长是 CPU 的主要性能指标之一，它表示 (　　)","images":[],"options":{"A":"CPU 最大的有效数字位数","B":"CPU 最长的十进制整数的位数","C":"CPU 一次能处理二进制数据的位数","D":"CPU 计算结果的有效数字长度"},"answer":"C","analysis":"字长指 CPU 一次能处理二进制数据的位数，这是其基本概念，A、B、D 选项对字长的理解错误","source":"计算机硬件基础课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-007","type":"choice","number":7,"globalNumber":7,"stem":"下列关于操作系统的描述，正确的是 (　　)","images":[],"options":{"A":"操作系统是一种最重要的应用软件","B":"操作系统提供的人机交互接口其它软件无法使用","C":"一台计算机可以安装多个操作系统","D":"操作系统中只有程序没有数据"},"answer":"C","analysis":"操作系统是系统软件，不是应用软件；其提供的人机交互接口其他软件可以使用；操作系统中既有程序也有数据，A、B、D 选项错误","source":"操作系统基础课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-008","type":"choice","number":8,"globalNumber":8,"stem":"云计算技术中最为关键的支撑技术之一就是 (　　)","images":[],"options":{"A":"物联网技术","B":"大数据技术","C":"虚拟化技术","D":"5G 通信技术"},"answer":"C","analysis":"虚拟化技术可实现资源的虚拟划分和灵活调配，是云计算的关键支撑技术。物联网技术侧重于物物相连；大数据技术用于数据处理；5G 通信技术提供高速通信，均不是云计算最关键的支撑技术","source":"云计算技术基础课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-009","type":"choice","number":9,"globalNumber":9,"stem":"在开放系统互连参考模型（OSI/RM）中，处于最低层的是 (　　)","images":[],"options":{"A":"应用层","B":"传输层","C":"数据链路层","D":"物理层"},"answer":"D","analysis":"OSI/RM 模型从低到高依次为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层，物理层处于最低层","source":"计算机网络基础课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-010","type":"choice","number":10,"globalNumber":10,"stem":"TCP/IP 协议体系结构中，IP 层对应 OSI 模型的 (　　) 层","images":[],"options":{"A":"网络层","B":"会话层","C":"数据链路层","D":"传输层"},"answer":"A","analysis":"TCP/IP 协议体系结构的 IP 层负责网络层功能，与 OSI 模型的网络层相对应，B、C、D 选项错误","source":"计算机网络协议课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-011","type":"choice","number":11,"globalNumber":11,"stem":"网络层位于通信子网的 (　　) 层","images":[],"options":{"A":"最高","B":"中间","C":"最低","D":"不属于通信子网"},"answer":"A","analysis":"通信子网包括物理层、数据链路层和网络层，网络层在通信子网中处于最高层，B、C、D 选项错误","source":"计算机网络基础课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-012","type":"choice","number":12,"globalNumber":12,"stem":"目前最常用的超五类非屏蔽双绞线由 (　　) 根线芯组成","images":[],"options":{"A":"4","B":"6","C":"8","D":"10"},"answer":"C","analysis":"目前最常用的超五类非屏蔽双绞线由 8 根线芯组成，这是常见网络布线知识，A、B、D 选项错误","source":"计算机网络布线课程","difficulty":"简单","file":"choice_1-50.html"},{"id":"choice-013","type":"choice","number":13,"globalNumber":13,"stem":"小李是公司网管员，他想检查本机的路由表信息，可以执行 (　　) 实现","images":[],"options":{"A":"netstat -a","B":"netstat -n","C":"netstat -e","D":"netstat -r"},"answer":"D","analysis":"netstat -r 命令用于显示路由表信息，netstat -a 用于显示所有连接和侦听端口；netstat -n 以数字形式显示地址和端口号；netstat -e 用于显示以太网统计信息，A、B、C 选项错误","source":"计算机网络管理课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-014","type":"choice","number":14,"globalNumber":14,"stem":"下列选择中不属于数据库中的故障是 (　　)","images":[],"options":{"A":"计算机电源故障","B":"系统故障","C":"介质故障","D":"计算机病毒"},"answer":"A","analysis":"计算机电源故障属于硬件故障，并非数据库特有的故障类型。系统故障、介质故障、计算机病毒都可能导致数据库出现问题，B、C、D 选项属于数据库故障","source":"数据库原理与应用课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-015","type":"choice","number":15,"globalNumber":15,"stem":"合同解除针对的标的是 (　　)","images":[],"options":{"A":"无效合同","B":"有效合同","C":"可撤销合同","D":"效力待定合同"},"answer":"B","analysis":"合同解除是针对有效合同而言，使其提前终止法律效力。无效合同自始无效，无需解除；可撤销合同在撤销前有效，撤销后自始无效；效力待定合同需经追认等才能确定效力，A、C、D 选项错误","source":"合同法基础课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-016","type":"choice","number":16,"globalNumber":16,"stem":"WWW 客户与 WWW 服务器之间的信息传输使用的协议为 (　　)","images":[],"options":{"A":"HTML","B":"HTTP","C":"SMTP","D":"IMAP"},"answer":"B","analysis":"HTTP 是超文本传输协议，用于 WWW 客户与 WWW 服务器之间传输信息。HTML 是超文本标记语言，用于描述网页结构；SMTP 用于邮件发送；IMAP 用于邮件接收，A、C、D 选项错误","source":"计算机网络应用课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-017","type":"choice","number":17,"globalNumber":17,"stem":"在 TCP/IP 模型中网络接口层规定了 OSI 模型的 (　　)","images":[],"options":{"A":"物理和数据链路层","B":"数据链路和网络层","C":"物理层","D":"表示层"},"answer":"A","analysis":"TCP/IP 模型的网络接口层对应 OSI 模型的物理层和数据链路层，负责处理物理介质上的信号传输和数据帧的封装、解封装，B、C、D 选项错误","source":"计算机网络协议课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-018","type":"choice","number":18,"globalNumber":18,"stem":"在以下几种传输媒体中，哪种传输速率最高 (　　)","images":[],"options":{"A":"双绞线","B":"同轴电缆","C":"光纤","D":"通信卫星"},"answer":"C","analysis":"光纤利用光信号传输数据，具有带宽大、传输速率高、抗干扰能力强等优点，相比双绞线、同轴电缆和通信卫星，传输速率最高，A、B、D 选项错误","source":"计算机网络传输介质课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-019","type":"choice","number":19,"globalNumber":19,"stem":"哪种 IPv4 地址让主机能够将信息发送给一组主机 (　　)","images":[],"options":{"A":"单播地址","B":"组播地址","C":"主机地址","D":"网络地址"},"answer":"B","analysis":"组播地址用于将信息发送给一组主机，单播地址用于一对一通信；主机地址和网络地址是 IP 地址的组成部分，并非用于向一组主机发送信息，A、C、D 选项错误","source":"计算机网络 IP 地址课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-020","type":"choice","number":20,"globalNumber":20,"stem":"IPv6 地址的长度是 (　　)","images":[],"options":{"A":"32 位","B":"64 位","C":"128 位","D":"256 位"},"answer":"C","analysis":"IPv6 地址长度为 128 位，相比 IPv4 的 32 位地址空间大大扩展，A、B、D 选项错误","source":"计算机网络 IP 地址课程","difficulty":"中等","file":"choice_1-50.html"},{"id":"choice-021","type":"choice","number":21,"globalNumber":21,"stem":"下列选项中，在路由器上查看版本及引导信息的命令是 (　　)","images":[],"options":{"A":"router#show version","B":"router#show ip router","C":"router#show interface","D":"router#show run"},"answer":"A","analysis":"在路由器命令中，“router#show version” 用于查看版本及引导信息；“router#show ip router” 用于查看 IP 路由表；“router#show interface” 用于查看接口信息；“router#show run” 用于查看当前运行配置，所以 A 正确","source":"网络设备配置基础","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-022","type":"choice","number":22,"globalNumber":22,"stem":"下面两个标准之间是兼容的是 (　　)","images":[],"options":{"A":"802.11 和 802.11a","B":"802.11a 和 802.11b","C":"802.11a 和 802.11g","D":"802.11a 和 802.11n"},"answer":"D","analysis":"802.11n 向下兼容 802.11a、802.11b、802.11g 等标准，而 802.11a 与 802.11b、802.11g 工作频段不同，不兼容；802.11 和 802.11a 也不兼容，所以 D 正确","source":"无线网络技术基础","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-023","type":"choice","number":23,"globalNumber":23,"stem":"引导扇区病毒感染计算机上的哪一项信息 (　　)","images":[],"options":{"A":"DATA","B":"MBR","C":"E-Mail","D":"Word"},"answer":"B","analysis":"引导扇区病毒主要感染计算机的主引导记录（MBR），DATA 是数据，E-Mail 是电子邮件，Word 是文档格式，均不是引导扇区病毒感染的主要对象，所以 B 正确","source":"计算机病毒原理","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-024","type":"choice","number":24,"globalNumber":24,"stem":"目前使用的防病毒软件的作用是 (　　)","images":[],"options":{"A":"清除已感染的任何恶意代码","B":"查出已知名的恶意代码，清除部分恶意代码","C":"清除任何已感染的文件","D":"查出并清除任何恶意代码"},"answer":"B","analysis":"目前的防病毒软件能查出已知名的恶意代码，并清除部分恶意代码，但无法清除已感染的任何恶意代码和任何已感染的文件，也不能查出并清除所有恶意代码，所以 B 正确","source":"计算机安全防护技术","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-025","type":"choice","number":25,"globalNumber":25,"stem":"防病毒产品可以实施在网络中的 (　　) 三个层次中","images":[],"options":{"A":"网关、服务器、桌面","B":"互联网、内部网、桌面","C":"防火墙、代理服务器、邮件处理服务器","D":"网关、桌面、无线设备"},"answer":"A","analysis":"防病毒产品可部署在网关、服务器、桌面三个层次，实现网络不同层面的防护；互联网、内部网不是具体的部署层次；防火墙、代理服务器、邮件处理服务器只是网络设备，不是完整的部署层次；无线设备表述不全面，所以 A 正确","source":"网络安全防护体系","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-026","type":"choice","number":26,"globalNumber":26,"stem":"以下各种加密算法中属于对称加密算法的是 (　　)","images":[],"options":{"A":"Caesar 替代法","B":"DES 加密算法","C":"Vigenere 算法","D":"Diffie - Hellman 加密算法"},"answer":"B","analysis":"DES 加密算法是典型的对称加密算法；Caesar 替代法、Vigenere 算法是古典加密算法，不属于对称加密算法的典型代表；Diffie - Hellman 加密算法是一种非对称加密算法，所以 B 正确","source":"加密技术基础","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-027","type":"choice","number":27,"globalNumber":27,"stem":"FTP 代表的是 (　　)","images":[],"options":{"A":"电子邮件","B":"远程登陆","C":"文件传输","D":"网络会议"},"answer":"C","analysis":"FTP 是 File Transfer Protocol 的缩写，代表文件传输；电子邮件常用协议是 SMTP、POP3 等；远程登陆常用协议是 Telnet；网络会议有多种软件和协议，所以 C 正确","source":"网络协议基础","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-028","type":"choice","number":28,"globalNumber":28,"stem":"Linux 系统下 vsftpd 服务器设置将所有本地用户都锁定在主目录中的方法是 (　　)","images":[],"options":{"A":"修改 vsftpd 主配置文件，修改 chroot_list_enable=NO，chroot_local_user=Yes，重启服务","B":"修改 vsftpd 主配置文件，修改 chroot - list - enable=NO，chroot_local_user=Yes，重启服务","C":"修改 vsftpd 主配置文件，修改 chroot_list_enable=YES，chroot_local_user=NO，重启服务","D":"修改 vsftpd 主配置文件，修改 chroot - list - enable=YES，chroot_local_user=NO，重启服务"},"answer":"A","analysis":"在 Linux 系统的 vsftpd 服务器配置中，设置 chroot_list_enable=NO，chroot_local_user=Yes 可将所有本地用户锁定在主目录，重启服务使配置生效，B 选项中 chroot - list - enable 书写错误，C、D 选项配置错误，所以 A 正确","source":"Linux 服务器配置","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-029","type":"choice","number":29,"globalNumber":29,"stem":"Windows 服务器中文件系统使用的都是 (　　)","images":[],"options":{"A":"强制访问控制","B":"自主访问控制","C":"基于角色的访问控制","D":"基于防火墙的控制"},"answer":"C","analysis":"Windows 服务器文件系统主要使用基于角色的访问控制，通过为不同角色分配权限来控制访问；强制访问控制和自主访问控制不是 Windows 服务器文件系统的主要访问控制方式；基于防火墙的控制主要针对网络流量，而非文件系统访问，所以 C 正确","source":"Windows 服务器管理","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-030","type":"choice","number":30,"globalNumber":30,"stem":"某公司使用 Linux 系统搭建了 samba 文件服务器，账号为 zhang3 的员工出差期间，为了避免该账号被其它员工冒用，需要临时将其禁用，可以使用以下 (　　) 命令","images":[],"options":{"A":"smbpasswd -a zhang3","B":"smbpasswd -d zhang3","C":"smbpasswd -e zhang3","D":"smbpasswd -x zhang3"},"answer":"B","analysis":"在 samba 文件服务器中，“smbpasswd -d zhang3” 用于禁用用户 zhang3；“smbpasswd -a zhang3” 用于添加用户；“smbpasswd -e zhang3” 用于启用用户；“smbpasswd -x zhang3” 用于删除用户，所以 B 正确","source":"Linux 服务器配置","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-031","type":"choice","number":31,"globalNumber":31,"stem":"DHCP 服务器的主要功能是：动态分配 (　　)","images":[],"options":{"A":"主机名","B":"IP","C":"账户","D":"密码"},"answer":"B","analysis":"DHCP 服务器的主要功能是动态分配 IP 地址，为网络中的设备自动提供 IP 配置信息；主机名、账户、密码不是 DHCP 服务器分配的主要内容，所以 B 正确","source":"网络服务配置（DHCP）","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-032","type":"choice","number":32,"globalNumber":32,"stem":"下面各类端口对报文处理正确的是 (　　)","images":[],"options":{"A":"Access 端口可以接收和发生多个 VLAN 的报文","B":"Trunk 端口可以接收和发生多个 VLAN 的报文","C":"Hybrid 端口只可以接收和发送一个 VLAN 的报文","D":"Trunk 端口可以接收和发送多个不打 VLAN 标签的报文"},"answer":"B","analysis":"Access 端口只能属于一个 VLAN，接收和发送该 VLAN 的报文；Trunk 端口可以接收和发送多个 VLAN 的报文，且默认情况下会给不同 VLAN 的报文打标签；Hybrid 端口可以灵活配置接收和发送多个 VLAN 的报文；Trunk 端口接收和发送的报文通常都带有 VLAN 标签，所以 B 正确","source":"网络交换技术","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-033","type":"choice","number":33,"globalNumber":33,"stem":"下面对根端口和指定端口描述错误的是 (　　)","images":[],"options":{"A":"根端口是用来向根网桥发送数据的端口","B":"根端口在非根网桥上，而不是在根网桥上","C":"指定端口只在根网桥上，而不在非根网桥上","D":"指定端口是在每个 LAN 中距离根网桥最近的端口"},"answer":"C","analysis":"根端口在非根网桥上，用于向根网桥发送数据；指定端口不仅在根网桥上存在，在非根网桥上也存在，它是每个 LAN 中距离根网桥最近的端口，负责转发数据，所以 C 描述错误","source":"生成树协议（STP）","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-034","type":"choice","number":34,"globalNumber":34,"stem":"思科交换机上要把生成树模式设置为 mstp 的命令是 (　　)","images":[],"options":{"A":"Switch(config)#spanning - tree mode mst","B":"Switch#spanning - tree mode mst","C":"Switch(config)#spanning - tree mst enable","D":"Switch#spanning - tree mst enable"},"answer":"A","analysis":"在思科交换机上，进入配置模式（Switch (config)#）后，使用 “spanning - tree mode mst” 命令可将生成树模式设置为 mstp；B 选项未在配置模式下；C、D 选项命令格式错误，所以 A 正确","source":"思科交换机配置（生成树协议）","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-035","type":"choice","number":35,"globalNumber":35,"stem":"思科交换机中可以通过 privilege 命令为特权模式配置 (　　) 个层次的命令级别","images":[],"options":{"A":"3","B":"5","C":"16","D":"1024"},"answer":"C","analysis":"思科交换机中，使用 privilege 命令可以为特权模式配置 16 个层次的命令级别，所以 C 正确","source":"思科交换机配置（权限管理）","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-036","type":"choice","number":36,"globalNumber":36,"stem":"思科交换机上执行命令 “Router#dir” 默认显示的是 (　　)","images":[],"options":{"A":"flash 闪存设备的文件系统","B":"nvram 设备的文件系统","C":"network 网络文件系统","D":"opaque 本地产生的虚拟文件系统"},"answer":"A","analysis":"在思科交换机上执行 “Router#dir” 命令，默认显示的是 flash 闪存设备的文件系统；nvram 设备主要存储启动配置文件等；network 网络文件系统和 opaque 本地产生的虚拟文件系统不是 “dir” 命令默认显示的内容，所以 A 正确","source":"思科交换机配置（文件管理）","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-037","type":"choice","number":37,"globalNumber":37,"stem":"在配置用户名 + 密码（明文密码）组合登录认证的情况下，至少要配置一个本地用户并设置密码用来通过 SSH 远程登录设备，思科路由器配置本地用户的命令是 (　　)","images":[],"options":{"A":"Router(config)#username abc secret 123456","B":"Router(config)#username abc password 123456","C":"Router#username abc secret 123456","D":"Router#username abc password 123456"},"answer":"B","analysis":"在思科路由器配置本地用户时，若设置明文密码，使用 “Router (config)#username abc password 123456” 命令；“Router (config)#username abc secret 123456” 是设置加密密码；C、D 选项未在配置模式下，所以 B 正确","source":"思科路由器配置（用户认证）","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-038","type":"choice","number":38,"globalNumber":38,"stem":"思科路由器中可以通过 privilege 命令为特权模式配置 (　　) 个层次的命令级别","images":[],"options":{"A":"8","B":"16","C":"32","D":"64"},"answer":"B","analysis":"同第 35 题，思科路由器中，privilege 命令可为特权模式配置 16 个层次的命令级别，所以 B 正确","source":"思科路由器配置（权限管理）","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-039","type":"choice","number":39,"globalNumber":39,"stem":"思科路由器上把设备当前运行的配置文件更改保存到启动配置文件中的命令是 (　　)","images":[],"options":{"A":"Router#copy running - config startup - config","B":"Router#cp running - config startup - config","C":"Router#write running - config startup - config","D":"Router#save running - config startup - config"},"answer":"A","analysis":"在思科路由器上，使用 “Router#copy running - config startup - config” 命令可将当前运行配置保存到启动配置文件；“cp” 是 Linux 系统的复制命令，在思科路由器中不适用；“write” 和 “save” 在思科路由器保存配置的场景下命令格式错误，所以 A 正确","source":"思科路由器配置（配置管理）","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-040","type":"choice","number":40,"globalNumber":40,"stem":"小张的计算机使用 Windows7 操作系统，他常登陆的用户名为 zhang, 小张给他个人文件夹设置了权限为只有 zhang 这个用户有权访问这个目录，管理员在某次维护中无意将 zhang 这个用户删除了，随后又重新建了一个用户名为 zhang，小张使用 zhang 这个用户登陆系统后，发现无法访问他原来的个人文件夹，原因是 (　　)","images":[],"options":{"A":"任何一个新建用户都需要经过授权才能访问系统中的文件","B":"windows 不认为新建立的用户 zhang 与原来的用户 zhang 是同一个用户，因此无权访问","C":"用户被删除后，该用户创建的文件夹也会自动删除，新建用户找不到原来用户的文件夹，因此无法访问","D":"新建的用户 zhang 会继承原来用户的权限，之所以无权访问时因为文件夹经过了加密"},"answer":"B","analysis":"在 Windows 系统中，用户账号有唯一的安全标识符（SID），删除并重新创建同名用户后，新用户的 SID 与原用户不同，Windows 不认为是同一个用户，所以新用户无权访问原用户设置权限的文件夹；A 选项新建用户并非都需重新授权访问所有文件；C 选项用户被删除，其文件夹不会自动删除；D 选项新建用户不会继承原用户权限，所以 B 正确","source":"Windows 操作系统管理","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-041","type":"choice","number":41,"globalNumber":41,"stem":"账号锁定策略中对超过一定次数的错误登录账号进行锁定是为了对抗 (　　) 攻击。","images":[],"options":{"A":"分布式拒绝服务攻击 (DDoS)","B":"病毒传染","C":"口令暴力破解","D":"缓冲区溢出攻击"},"answer":"C","analysis":"口令暴力破解通常通过不断尝试错误密码来获取访问权限，账号锁定策略可有效对抗此类攻击。当错误登录次数达到一定阈值锁定账号，使攻击者难以持续尝试。而分布式拒绝服务攻击（DDoS）主要通过大量请求使服务器瘫痪；病毒传染是恶意程序传播；缓冲区溢出攻击利用程序漏洞，均与账号锁定策略无关","source":"信息安全基础","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-042","type":"choice","number":42,"globalNumber":42,"stem":"Windows 系统补丁更新设置，下列说法正确的是 (　　)。","images":[],"options":{"A":"只能设置系统自动更新","B":"可以设置为检查更新，但我不能选择是否安装更新","C":"下载更新，但是让我选择下载和更新","D":"只能更新系统补丁，不能接收其他 Microsoft 产品的更新"},"answer":"C","analysis":"Windows 系统补丁更新设置有多种方式，并非只能自动更新，也不是不能选择是否安装更新。用户可以设置为下载更新后自行选择是否安装，且不仅能更新系统补丁，也能接收其他 Microsoft 产品的更新","source":"Windows 操作系统应用","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-043","type":"choice","number":43,"globalNumber":43,"stem":"假如你已经把编译好的新内核复制到 /boot 目录，如果你想让系统启动时缺省使用新内核而旧的内核依然有效，你需要在 /etc/lilo.conf 文件中添加 (　　) 选项。","images":[],"options":{"A":"boot=","B":"image=","C":"install=","D":"map="},"answer":"B","analysis":"在 /etc/lilo.conf 文件中，“image=” 选项用于指定内核映像文件路径，通过设置该选项指向新内核，可使系统启动时默认使用新内核，同时旧内核依然保留有效。“boot=” 用于指定引导设备；“install=” 用于指定安装引导扇区的文件；“map=” 用于指定映射文件，均不符合题意","source":"Linux 系统管理","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-044","type":"choice","number":44,"globalNumber":44,"stem":"root 用户的 UID 和 GID 为 (　　)。","images":[],"options":{"A":"2 和 0","B":"0 和 0","C":"1 和 0","D":"500 和 500"},"answer":"B","analysis":"在 Linux 系统中，root 用户是系统管理员，其用户 ID（UID）和组 ID（GID）均为 0，这是系统默认的设定，用于区分不同用户和用户组的权限等属性","source":"Linux 系统基础","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-045","type":"choice","number":45,"globalNumber":45,"stem":"在删除组时报错：cannot remove the primary group of user ‘aming’，是因为 (　　)。","images":[],"options":{"A":"组不存在","B":"组内有用户","C":"系统错误，不用处理","D":"命令参数出错"},"answer":"B","analysis":"当尝试删除一个用户的主组时，如果组内还有用户存在，系统会阻止删除操作并提示该错误。组不存在会有其他报错提示；这不是系统错误也并非命令参数出错","source":"Linux 用户与组管理","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-046","type":"choice","number":46,"globalNumber":46,"stem":"在 Linux 中，当 root 口令丢失后，应该 (　　)。","images":[],"options":{"A":"使用软盘启动直接进入系统","B":"使用光盘启动直接进入系统","C":"进入单用户模式后修改 root 口令","D":"重新安装系统"},"answer":"C","analysis":"在 Linux 系统中，若 root 口令丢失，进入单用户模式可以绕过正常的用户认证机制，方便修改 root 口令。使用软盘或光盘启动直接进入系统无法修改口令；重新安装系统过于繁琐，且会丢失数据","source":"Linux 系统安全","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-047","type":"choice","number":47,"globalNumber":47,"stem":"一般说来，Red Hat Linux 内核的源程序可以在 (　　) 目录下找到。","images":[],"options":{"A":"/usr/local","B":"/usr/src","C":"/lib","D":"/usr/share"},"answer":"B","analysis":"在 Red Hat Linux 系统中，内核的源程序通常存放在 /usr/src 目录下。/usr/local 一般用于存放本地安装的软件；/lib 是存放系统库文件的目录；/usr/share 用于存放共享数据，如文档、图标等","source":"Linux 系统基础","difficulty":"易","file":"choice_1-50.html"},{"id":"choice-048","type":"choice","number":48,"globalNumber":48,"stem":"为了修改文件 test 的许可模式，使其文件属主具有读、写和运行的权限，组和其他用户可以读和运行，可以采用的方法 (　　)。","images":[],"options":{"A":"chmod 755 test","B":"chmod 700 test","C":"chmod ux+rwx test","D":"chmod g-w test"},"answer":"A","analysis":"在 Linux 中，chmod 命令用于修改文件权限。权限数字 7 表示读（4）、写（2）、执行（1）权限都有，5 表示读（4）和执行（1）权限。755 表示文件属主有读、写、执行权限，组和其他用户有读和执行权限。700 表示文件属主有读、写、执行权限，组和其他用户无任何权限；chmod ux+rwx test 语法错误；chmod g-w test 只是去掉组用户的写权限，不符合要求","source":"Linux 文件权限管理","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-049","type":"choice","number":49,"globalNumber":49,"stem":"SQL Server 支持两种身份验证模式，即 Windows 身份验证模式和混合模式。SQL Server 的混全模式是指：当网络用户尝试接到 SQL Server 数据库时 (　　)。","images":[],"options":{"A":"Windows 获取用户输入的用户和密码，并提交给 SQL Serve 进行身份验证，并决定用户的数据库访权限","B":"SQL Serve 根据用户输入的用户和密码，并提交给 Windows 进行身份验证，并决定用户的数据库访权限","C":"SQL Serve 根据已在 Windows 网络中登录的用户的网络安全属性，对用户进行身份验证，并决定用户的数据库访权限","D":"登录到本地 Windows 的用户均可无限制访问 SQL Serve 数据库"},"answer":"C","analysis":"在 SQL Server 的混合模式下，SQL Server 既可以使用 Windows 身份验证（根据已在 Windows 网络中登录的用户的网络安全属性进行验证），也可以使用 SQL Server 自身的身份验证（用户输入用户名和密码）。A 选项描述错误，不是 Windows 提交给 SQL Server 验证；B 选项也错误，不是 SQL Server 提交给 Windows 验证；D 选项登录到本地 Windows 的用户并非无限制访问，需要权限设置","source":"SQL Server 数据库管理","difficulty":"中","file":"choice_1-50.html"},{"id":"choice-050","type":"choice","number":50,"globalNumber":50,"stem":"域名解析的两种主要方式为 (　　)。","images":[],"options":{"A":"直接解析和间接解析","B":"直接解析和递归解析","C":"间接解析和反复解析","D":"反复解析和递归解析"},"answer":"D","analysis":"域名解析的两种主要方式是反复解析和递归解析。递归解析是指域名服务器接到查询请求后，会代替客户端向其他域名服务器进行查询，直到得到最终结果返回给客户端；反复解析是指客户端每次向不同的域名服务器发送查询请求，直到获得结果。不存在直接解析和间接解析这种说法","source":"计算机网络基础","difficulty":"中","file":"choice_1-50.html"}];

const STORAGE_KEYS={progress:"quiz_progress_v2",exam:"exam_session_v2",result:"last_result_v2",marker:"quiz_app_initialized_v2"};
const $=id=>document.getElementById(id);
const questionMap=Object.fromEntries(PAGE_QUESTIONS.map(q=>[q.id,q]));
let progress=null,examSession=null,lastResult=null,timerTick=null,safeStorage=true;
let currentOrder=[];
function parseJSON(v){try{return v?JSON.parse(v):null}catch(e){return null}}
function readKey(k){try{return parseJSON(localStorage.getItem(k))}catch(e){safeStorage=false;return null}}
function writeKey(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){safeStorage=false;showStorageWarning("浏览器未能保存状态。请不要清理此标签页数据，并从首页导出可恢复的进度。");return false}}
function removeKey(k){try{localStorage.removeItem(k)}catch(e){safeStorage=false}}
function baseProgress(){return {schema:2,active:false,mode:null,answers:{},stats:{},pins:[],currentFile:null,currentId:null,elapsedMs:0,timerRunning:false,timerStartedAt:null,wrongIds:[],completed:false}}
function readProgress(){const p=readKey(STORAGE_KEYS.progress);if(!p||typeof p!=="object")return baseProgress();p.answers=p.answers&&typeof p.answers==="object"?p.answers:{};p.stats=p.stats&&typeof p.stats==="object"?p.stats:{};p.pins=Array.isArray(p.pins)?p.pins:[];return Object.assign(baseProgress(),p)}
function saveProgress(){if(!progress)return false;return writeKey(STORAGE_KEYS.progress,progress)}
function getElapsed(){const base=Math.max(0,Number(progress?.elapsedMs)||0);if(progress?.timerRunning&&Number(progress.timerStartedAt))return base+Math.max(0,Date.now()-progress.timerStartedAt);return base}
function timerText(ms){let sec=Math.floor(Math.max(0,ms)/1000);const h=String(Math.floor(sec/3600)).padStart(2,"0");sec%=3600;const m=String(Math.floor(sec/60)).padStart(2,"0");const s=String(sec%60).padStart(2,"0");return `${h}:${m}:${s}`}
function renderTimer(){const n=$("timerValue");if(!n)return;n.textContent=timerText(getElapsed());const label=$("timerStatus");if(label)label.textContent=progress?.timerRunning?"计时中":"计时已暂停"}
function checkpointTimer(){if(!progress)return;if(progress.timerRunning){progress.elapsedMs=getElapsed();progress.timerStartedAt=Date.now()}saveProgress();if(progress.mode==="exam"&&examSession){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=progress.timerRunning;examSession.timerStartedAt=progress.timerStartedAt;writeKey(STORAGE_KEYS.exam,examSession)}}
function pauseTimer(){if(progress.timerRunning)progress.elapsedMs=getElapsed();progress.timerRunning=false;progress.timerStartedAt=null;if(examSession){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession)}saveProgress()}
function resumeTimer(){if(!progress.timerRunning){progress.timerRunning=true;progress.timerStartedAt=Date.now();if(examSession){examSession.timerRunning=true;examSession.timerStartedAt=progress.timerStartedAt;writeKey(STORAGE_KEYS.exam,examSession)}saveProgress()}}
function showStorageWarning(message){const w=$("storageWarning");if(w){w.textContent=message;w.classList.remove("hidden")}}
function typeName(type){return ({choice:"选择题",multi:"多选题",judgment:"判断题",fill:"填空题"})[type]||"题目"}
function statusText(){return ({practice:"做题模式",exam:"考试模式",wrong:"错题模式",review:"考试回看"})[progress.mode]||"刷题"}
function sortedUnique(a){return [...new Set(a||[])]}
function findMeta(id){return META.find(m=>m.id===id)}
function routeByFile(file){return ROUTES.find(r=>r.file===file)}
function resultQuestions(){return lastResult&&lastResult.questionStates?lastResult.questionStates:{}}
function activeRoutes(){if(progress.mode!=="wrong")return ROUTES;const wrong=new Set(progress.wrongIds||[]);return ROUTES.filter(r=>r.ids.some(id=>wrong.has(id)))}
function idsForPage(){const route=routeByFile(PAGE_FILE);if(!route)return [];let ids=route.ids.filter(id=>questionMap[id]);if(progress.mode==="wrong"){const w=new Set(progress.wrongIds||[]);ids=ids.filter(id=>w.has(id));return ids}if(progress.mode==="exam"&&examSession&&examSession.questionOrders&&Array.isArray(examSession.questionOrders[PAGE_FILE]))return examSession.questionOrders[PAGE_FILE].filter(id=>questionMap[id]);if(progress.mode==="review"&&lastResult&&lastResult.questionOrders&&Array.isArray(lastResult.questionOrders[PAGE_FILE]))return lastResult.questionOrders[PAGE_FILE].filter(id=>questionMap[id]);return ids}
function stateFor(q){if(progress.mode==="review"){const s=resultQuestions()[q.id];return s?Object.assign({selectedKeys:[],blanks:[],answered:false,correct:false},s):{selectedKeys:[],blanks:[],answered:false,correct:false}}const s=progress.answers[q.id];return s?Object.assign({selectedKeys:[],blanks:[],answered:false,locked:false},s):{selectedKeys:[],blanks:[],answered:false,locked:false}}
function optionsOrder(q){let order=Object.keys(q.options||{});if(progress.mode==="exam"&&examSession&&examSession.optionOrders&&Array.isArray(examSession.optionOrders[q.id]))order=examSession.optionOrders[q.id].filter(k=>Object.prototype.hasOwnProperty.call(q.options,k));else if(progress.mode==="review"&&lastResult&&lastResult.optionOrders&&Array.isArray(lastResult.optionOrders[q.id]))order=lastResult.optionOrders[q.id].filter(k=>Object.prototype.hasOwnProperty.call(q.options,k));return order.length?order:Object.keys(q.options||{})}
function labelMapFor(q){const order=optionsOrder(q);const map={};if(q.type==="judgment")return {"正确":"正确","错误":"错误"};order.forEach((key,i)=>map[key]=String.fromCharCode(65+i));return map}
function correctKeys(q){if(q.type==="judgment")return [q.answer];if(Array.isArray(q.answer))return q.answer;return [q.answer]}
function displayKey(q,key){if(key==null||key==="")return "";if(q.type==="judgment")return key;const map=labelMapFor(q);return map[key]||key}
function displayAnswer(q,keys){if(!Array.isArray(keys)||!keys.length)return "未作答";return keys.map(k=>displayKey(q,k)).join("、")}
function normalizeText(s){return String(s??"").normalize("NFKC").trim().replace(/[\u200B-\u200D\uFEFF]/g,"").toLocaleLowerCase()}
function answersMatch(q,s){const selected=Array.isArray(s.selectedKeys)?s.selectedKeys:[];if(q.type==="choice")return selected.length===1&&selected[0]===q.answer;if(q.type==="judgment")return selected.length===1&&selected[0]===q.answer;if(q.type==="multi"){const a=sortedUnique(selected).sort(),b=sortedUnique(correctKeys(q)).sort();return a.length===b.length&&a.every((v,i)=>v===b[i])}if(q.type==="fill"){const vals=Array.isArray(s.blanks)?s.blanks:[];const keys=Array.isArray(q.blanks)?q.blanks:[];return keys.length===vals.length&&keys.every((v,i)=>normalizeText(v)===normalizeText(vals[i]))}return false}
function isReadOnly(){return progress.mode==="review"||progress.mode==="exam"&&(progress.submitted===true||!examSession)}
function isExamOpen(){return progress.mode==="exam"&&progress.active===true&&!!examSession&&!progress.submitted}
function currentVisibleQuestions(){return idsForPage().map(id=>questionMap[id]).filter(Boolean)}
function element(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined&&text!==null)n.textContent=String(text);return n}
function appendStemWithBlanks(parent,q,s){const stem=String(q.stem||"");const rx=/___([①②③④⑤⑥⑦⑧⑨⑩])___/g;let last=0,m;while((m=rx.exec(stem))!==null){parent.append(document.createTextNode(stem.slice(last,m.index)));const marker=element("span","blank-marker",m[1]);parent.append(marker);last=rx.lastIndex}parent.append(document.createTextNode(stem.slice(last)))}
function analysisBlock(q,s){const d=element("section","analysis-block");const h=element("h4","","答案解析");d.append(h);const pairs=[["我的答案",q.type==="fill"?(s.blanks&&s.blanks.length?s.blanks.map((v,i)=>`${["①","②","③","④","⑤","⑥"][i]||i+1} ${v||"未作答"}`).join("；"):"未作答"):displayAnswer(q,s.selectedKeys)],["正确答案",q.type==="fill"?(q.blanks||[]).map((v,i)=>`${["①","②","③","④","⑤","⑥"][i]||i+1} ${v}`).join("；"):displayAnswer(q,correctKeys(q))],["解析",q.analysis||"未提供"],["来源",q.source||"未提供"],["难度",q.difficulty||"未提供"]];for(const [k,v] of pairs){const line=element("p","analysis-line");const strong=element("strong","",k+"：");line.append(strong,document.createTextNode(String(v||"未提供")));d.append(line)}return d}
function renderQuestionCard(q){const s=stateFor(q);const readOnly=isReadOnly();const card=element("article","question-card");card.id="q-"+q.id;card.dataset.qid=q.id;if(progress.currentId===q.id)card.classList.add("is-current");const isPinned=(progress.mode==="review"?((lastResult&&lastResult.pins)||[]):progress.pins||[]).includes(q.id);if(isPinned)card.classList.add("is-pinned");const head=element("div","question-head");const titleBox=element("div","");titleBox.append(element("div","question-title",`${typeName(q.type)} 第${q.number}题`));const label=element("div","muted",`题号 ${q.number}`);label.style.fontSize=".78rem";titleBox.append(label);const pin=element("button","pin-button"+(isPinned?" is-on":""),isPinned?"📌 已图钉":"📌 图钉");pin.type="button";pin.dataset.action="pin";pin.dataset.qid=q.id;pin.setAttribute("aria-pressed",String(isPinned));pin.disabled=readOnly;head.append(titleBox,pin);card.append(head);
const stem=element("div","question-stem");appendStemWithBlanks(stem,q,s);card.append(stem);
if(Array.isArray(q.images)&&q.images.length){const row=element("div","image-row");for(const src of q.images){if(!String(src).startsWith("data:image/"))continue;const im=element("img","question-image");im.src=src;im.alt="题目图片";im.loading="lazy";row.append(im)}if(row.childNodes.length)card.append(row)}
if(q.type==="fill"){
const fields=element("div","fill-inputs");const blankCount=(String(q.stem).match(/___[①②③④⑤⑥⑦⑧⑨⑩]___/g)||[]).length;const vals=Array.isArray(s.blanks)?s.blanks:[];for(let i=0;i<blankCount;i++){const field=element("label","fill-field");field.append(element("span","muted",`${["①","②","③","④","⑤","⑥"][i]||i+1} 空`));const input=element("input");input.maxLength=20;input.value=vals[i]||"";input.dataset.qid=q.id;input.dataset.blank=String(i);input.placeholder="输入答案（最多20字）";input.disabled=readOnly||Boolean(s.locked);if(s.answered&&s.correct)input.classList.add("is-correct");else if(s.answered&&!s.correct)input.classList.add("is-wrong");field.append(input);fields.append(field)}card.append(fields);if(!isExamOpen()&&!readOnly){const submit=element("button","btn btn-primary fill-submit","提交答案");submit.dataset.action="submit-fill";submit.dataset.qid=q.id;card.append(submit)}
}else{
const optionWrap=element("div","options");const order=optionsOrder(q);const labels=labelMapFor(q);const corr=correctKeys(q);const selected=Array.isArray(s.selectedKeys)?s.selectedKeys:[];const showJudged=(progress.mode==="practice"||progress.mode==="wrong")&&s.answered||progress.mode==="review"||s.answered&&progress.mode==="exam"&&progress.submitted;for(const key of order){const b=element("button","option");b.type="button";b.dataset.action="answer";b.dataset.qid=q.id;b.dataset.key=key;const lab=element("span","option-label",q.type==="judgment"?key:(labels[key]||key));const txt=element("span","option-text",q.options[key]);b.append(lab,txt);if(selected.includes(key))b.classList.add("is-selected");if(showJudged){if(s.correct===true){if(selected.includes(key))b.classList.add("is-correct")}else{if(corr.includes(key))b.classList.add("is-correct");else b.classList.add("is-wrong")}}else if(isExamOpen()){if(selected.includes(key))b.classList.add("is-correct")}else if(s.answered&&s.correct&&selected.includes(key)){b.classList.add("is-correct")}else if(s.answered&&!s.correct){if(corr.includes(key))b.classList.add("is-correct");else b.classList.add("is-wrong")}
b.disabled=readOnly||Boolean(s.locked);optionWrap.append(b)}card.append(optionWrap)}
const showAnalysis=progress.mode==="review"||(progress.mode==="practice"||progress.mode==="wrong")&&Boolean(s.answered)||(progress.mode==="exam"&&progress.submitted);if(showAnalysis)card.append(analysisBlock(q,s));return card}
function updateOneQuestion(id){const q=questionMap[id];if(!q)return;const old=$("q-"+id);if(old)old.replaceWith(renderQuestionCard(q));renderQuestionNavigation();renderPinList();renderTimer()}
function renderQuestionList(){const list=$("questionList");list.textContent="";const qs=currentVisibleQuestions();if(!qs.length){list.append(element("div","empty-questions",progress.mode==="wrong"?"当前分页没有需要复习的错题。":"当前分页暂无可显示的题目。"));return}for(const q of qs)list.append(renderQuestionCard(q));list.append(element("div","quiz-bottom-spacer"));}
function statusClass(qid){const q=questionMap[qid];if(!q)return "";const s=stateFor(q);if(progress.mode==="review")return s.correct?"is-correct":"is-wrong";if(progress.mode==="exam")return (s.selectedKeys||[]).length?"is-selected":"";if(s.answered)return s.correct?"is-correct":"is-wrong";return ""}
function renderQuestionNavigation(){const wrap=$("questionNav");wrap.textContent="";const qs=currentVisibleQuestions();wrap.append(element("div","side-section-title",typeName(qs[0]?.type||routeByFile(PAGE_FILE)?.type||"choice")));const grid=element("div","side-question-grid");for(const q of qs){const b=element("button","number-button",String(q.number));b.type="button";b.dataset.action="goto";b.dataset.qid=q.id;const s=stateFor(q);const cls=statusClass(q.id);if(cls)b.classList.add(cls);if(q.id===progress.currentId)b.classList.add("is-current");const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(pins.includes(q.id))b.classList.add("is-pinned");b.title=`${typeName(q.type)} 第${q.number}题`;grid.append(b)}wrap.append(grid)}
function renderPinList(){const wrap=$("pinList");wrap.textContent="";const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(!pins.length){wrap.append(element("div","side-muted","暂无图钉题目"));return}const known=pins.map(findMeta).filter(Boolean);const groupOrder=["choice","multi","judgment","fill"];for(const type of groupOrder){const items=known.filter(m=>m.type===type);if(!items.length)continue;wrap.append(element("div","side-section-title",typeName(type)));const row=element("div","pin-list");for(const m of items){const b=element("button","pin-chip",String(m.number));b.type="button";b.dataset.action="goto-meta";b.dataset.qid=m.id;b.title=typeName(m.type)+" 第"+m.number+"题";row.append(b)}wrap.append(row)}}
function routeForNavigation(){if(progress.mode==="wrong")return activeRoutes();return ROUTES}
function updatePager(){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);for(const b of document.querySelectorAll('[data-action="prev"],[data-action="next"]')){const isPrev=b.dataset.action==="prev";b.disabled=idx<0||(isPrev?idx===0:idx>=routes.length-1)}const submitVisible=isExamOpen();document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.classList.toggle("hidden",!submitVisible));document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.disabled=!submitVisible)}
function renderMode(){const n=$("modeLabel");if(n)n.textContent=statusText();const s=$("pageInfo");if(s){const r=routeByFile(PAGE_FILE);s.textContent=r?`${typeName(r.type)} · ${r.start}–${r.end} 题`:"刷题"}const top=$("quizMainTitle");if(top)top.textContent=statusText();}
function scrollToQuestion(id){const card=$("q-"+id);if(!card)return;progress.currentId=id;progress.currentFile=PAGE_FILE;saveProgress();document.querySelectorAll(".question-card.is-current").forEach(n=>n.classList.remove("is-current"));card.classList.add("is-current");renderQuestionNavigation();const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}
function gotoQuestion(id){const m=findMeta(id);if(!m)return;if(m.file!==PAGE_FILE){progress.currentFile=m.file;progress.currentId=id;saveProgress();location.href=m.file;return}if(!questionMap[id])return;scrollToQuestion(id)}
function switchPage(delta){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);const target=routes[idx+delta];if(!target)return;const ids=target.ids.filter(id=>progress.mode!=="wrong"||(progress.wrongIds||[]).includes(id));let ordered=ids;if(progress.mode==="exam"&&examSession&&examSession.questionOrders[target.file])ordered=examSession.questionOrders[target.file].filter(id=>ids.includes(id));if(progress.mode==="review"&&lastResult&&lastResult.questionOrders&&lastResult.questionOrders[target.file])ordered=lastResult.questionOrders[target.file].filter(id=>ids.includes(id));progress.currentFile=target.file;progress.currentId=ordered[0]||ids[0]||null;progress.openAtTop=true;saveProgress();location.href=target.file}
function togglePin(id){if(isReadOnly()||!id)return;const pins=new Set(progress.pins||[]);if(pins.has(id))pins.delete(id);else pins.add(id);progress.pins=[...pins];saveProgress();updateOneQuestion(id)}
function recordStats(q,correct,answered){if(!answered)return;progress.stats=progress.stats||{};progress.stats[q.id]={answered:true,correct:Boolean(correct),updatedAt:Date.now()}}
function answerQuestion(id,key){const q=questionMap[id];if(!q||isReadOnly())return;if(progress.mode==="wrong"&&!(progress.wrongIds||[]).includes(id))return;let s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};if(progress.mode==="exam"){
if(!isExamOpen())return;if(q.type==="multi"){const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set]}else s.selectedKeys=[key];s.answered=s.selectedKeys.length>0;s.locked=false;s.correct=null;progress.currentId=id;progress.currentFile=PAGE_FILE;progress.answers[id]=s;saveProgress();updateOneQuestion(id);return}
if(s.locked)return;if(q.type==="multi"){
const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set];const correct=new Set(correctKeys(q));const wrong=s.selectedKeys.some(k=>!correct.has(k));const complete=[...correct].every(k=>set.has(k))&&set.size===correct.size;if(wrong||complete){s.answered=true;s.locked=true;s.correct=!wrong&&complete;recordStats(q,s.correct,true)}else{s.answered=false;s.correct=null;s.locked=false}
}else{s.selectedKeys=[key];s.answered=true;s.locked=true;s.correct=answersMatch(q,s);recordStats(q,s.correct,true)}progress.currentId=id;progress.currentFile=PAGE_FILE;progress.answers[id]=s;saveProgress();updateOneQuestion(id)}
function submitFill(id){const q=questionMap[id];if(!q||isReadOnly()||progress.mode==="exam")return;const fields=[...document.querySelectorAll(`input[data-qid="${id}"][data-blank]`)];const vals=fields.map(n=>n.value.slice(0,20));if(!vals.some(v=>v.trim())){alert("请先填写答案。");return}const s={blanks:vals,selectedKeys:[],answered:true,locked:true};const correctAnswers=Array.isArray(q.blanks)?q.blanks:[];s.correct=correctAnswers.length===vals.length&&correctAnswers.every((v,i)=>normalizeText(v)===normalizeText(vals[i]));progress.answers[id]=s;recordStats(q,s.correct,true);saveProgress();updateOneQuestion(id)}
function exitToHome(){checkpointTimer();progress.active=true;progress.timerRunning=false;progress.timerStartedAt=null;saveProgress();if(examSession&&progress.mode==="exam"){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession)}location.href="index.html"}
const ALL_META_MAP=Object.fromEntries(META.map(m=>[m.id,m]));
function submitExam(){if(!isExamOpen())return;if(!confirm("确定交卷吗？未作答的题目将按错误计入，本次考试将停止计时。"))return;const now=Date.now();progress.elapsedMs=getElapsed();progress.timerRunning=false;progress.timerStartedAt=null;examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession);progress.stats={};const states={};const wrongIds=[];let total=0,correctCount=0;for(const m of META){const q=questionMap[m.id]||null;const answer=progress.answers[m.id]||{selectedKeys:[],blanks:[],answered:false,locked:false};const selected=Array.isArray(answer.selectedKeys)?answer.selectedKeys.slice():[];let hasAnswer=selected.length>0;if(m.type==="fill"){const blanks=Array.isArray(answer.blanks)?answer.blanks:[];hasAnswer=blanks.some(v=>String(v||"").trim()!=="")}
let correct=false;if(q){correct=hasAnswer&&answersMatch(q,answer)}else{const base=answer.correct;correct=hasAnswer&&base===true}
// This page includes only 50 questions, so exam submission must use source-independent answer snapshots captured at each page.
const snap=examSession.answerSnapshot&&examSession.answerSnapshot[m.id];if(snap){hasAnswer=!!snap.answered;correct=hasAnswer&&snap.correct===true;}
// The home page has no access to the page-specific current state; store all answers and their correctness in the shared progress object.
const allAnswer=progress.answers[m.id]||{};const answered=Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.length>0:(Array.isArray(allAnswer.blanks)&&allAnswer.blanks.some(v=>String(v||"").trim()!==""));
let finalCorrect=false;const ak=ANSWER_KEYS[m.id];if(answered&&ak){if(ak.type==="choice"||ak.type==="judgment")finalCorrect=allAnswer.selectedKeys?.length===1&&allAnswer.selectedKeys[0]===ak.answer;else if(ak.type==="multi"){const a=[...(allAnswer.selectedKeys||[])].sort(),b=[...(ak.answer||[])].sort();finalCorrect=a.length===b.length&&a.every((v,i)=>v===b[i])}else if(ak.type==="fill"){const norm=v=>String(v??"").normalize("NFKC").trim().toLowerCase();finalCorrect=(ak.blanks||[]).length===(allAnswer.blanks||[]).length&&(ak.blanks||[]).every((v,i)=>norm(v)==norm(allAnswer.blanks[i]))}}
states[m.id]={id:m.id,type:m.type,number:m.number,file:m.file,selectedKeys:Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.slice():[],blanks:Array.isArray(allAnswer.blanks)?allAnswer.blanks.slice():[],answered,correct:finalCorrect};total++;if(finalCorrect)correctCount++;else wrongIds.push(m.id);
progress.stats[m.id]={answered:true,correct:finalCorrect,updatedAt:now};}
const result={schema:2,resultId:"result-"+now.toString(36),mode:"考试模式",testAt:now,elapsedMs:progress.elapsedMs,total,correct:correctCount,accuracy:total?correctCount/total:0,wrongIds,questionStates:states,questionOrders:examSession.questionOrders||{},optionOrders:examSession.optionOrders||{},pins:(progress.pins||[]).slice()};writeKey(STORAGE_KEYS.result,result);progress.active=false;progress.mode=null;progress.answers={};progress.pins=result.pins.slice();progress.currentFile=null;progress.currentId=null;progress.timerRunning=false;progress.timerStartedAt=null;progress.completed=true;saveProgress();removeKey(STORAGE_KEYS.exam);location.href="result.html"}

function init(){progress=readProgress();examSession=readKey(STORAGE_KEYS.exam);lastResult=readKey(STORAGE_KEYS.result);const marker=readKey(STORAGE_KEYS.marker);if(location.protocol==="file:"){showStorageWarning("当前通过 file:// 直接打开。浏览器可能隔离不同 HTML 文件的本地存储；若跨页进度无法共享，请改用同源静态站点，或通过首页导入/导出备份。")}
if(!safeStorage)showStorageWarning("浏览器本地存储不可用，进度可能无法保存。请检查浏览器权限后再开始。")
if(!progress.active){const stats={};const route=routeByFile(PAGE_FILE);progress={...baseProgress(),active:true,mode:"practice",answers:{},stats,pins:[],currentFile:PAGE_FILE,currentId:route?.ids?.[0]||null,elapsedMs:0,timerRunning:true,timerStartedAt:Date.now(),wrongIds:[],createdAt:Date.now()};saveProgress()}
if(progress.mode==="exam"&&!examSession){showStorageWarning("没有读取到当前考试会话，已禁止自动开始或重新打乱。请返回首页并导入之前导出的进度，或在同源静态站点中重新进入考试。")}

if(progress.mode==="wrong"){const routes=activeRoutes();if(!routes.length){alert("暂无数据：没有可复习的错题。");location.href="index.html";return}if(!routes.some(r=>r.file===PAGE_FILE)){progress.currentFile=routes[0].file;progress.currentId=routes[0].ids.find(id=>(progress.wrongIds||[]).includes(id))||routes[0].ids[0];saveProgress();location.replace(progress.currentFile);return}}
if(progress.mode!=="wrong"&&progress.mode!=="exam"&&progress.mode!=="review"&&progress.mode!=="practice"){progress.mode="practice";progress.currentFile=PAGE_FILE;progress.currentId=PAGE_QUESTIONS[0]?.id||null;saveProgress()}
if(progress.currentFile!==PAGE_FILE){progress.currentFile=PAGE_FILE;if(!progress.currentId||!questionMap[progress.currentId])progress.currentId=idsForPage()[0]||null;saveProgress()}
const startAtPageTop=progress.openAtTop===true;if(startAtPageTop){progress.openAtTop=false;saveProgress()}const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(!startAtPageTop&&progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});else if(startAtPageTop)requestAnimationFrame(()=>window.scrollTo({top:0,behavior:"auto"}));if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
document.addEventListener("input",e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||!input.dataset.qid||input.dataset.blank===undefined||isReadOnly())return;const id=input.dataset.qid;const idx=Number(input.dataset.blank);const s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};s.blanks=s.blanks||[];s.blanks[idx]=input.value.slice(0,20);progress.currentId=id;progress.currentFile=PAGE_FILE;progress.answers[id]=s;});
function selfTestMapping(){const testOrder=["B","C","D","A"];const map={};testOrder.forEach((k,i)=>map[k]=String.fromCharCode(65+i));if(map.A!=="D")throw new Error("选项映射自测失败");const expected=["A","C"].map(k=>map[k]).sort().join(",");if(expected!=="B,D")throw new Error("多选题映射自测失败")}
