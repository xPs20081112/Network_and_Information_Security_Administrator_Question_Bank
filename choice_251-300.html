rong{border-color:#F0B7BB;background:var(--bad);color:#8B1E28}.option.is-wrong .option-label{background:#FFC9CD;color:#8B1E28}.option:disabled{opacity:1;cursor:default}.option:disabled:not(.is-correct):not(.is-wrong){color:var(--ink)}.analysis-block{margin-top:16px;padding:15px 16px;background:#F8F7FC;border:1px solid #E8E4F2;border-left:4px solid #A895E8;border-radius:12px;font-size:.92rem}.analysis-block h4{margin:0 0 8px;font-size:.95rem}.analysis-line{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.analysis-line strong{color:#55447F}.image-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.question-image{max-width:min(100%,360px);max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}.fill-inputs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}.fill-field{display:grid;gap:5px;min-width:min(100%,190px);flex:1}.fill-field input{width:100%;border:1px solid #D8D3E5;border-radius:10px;padding:11px 12px;min-height:44px}.fill-field input.is-correct{border-color:#82C99C;background:#EAF8EF}.fill-field input.is-wrong{border-color:#E99BA1;background:#FFF0F0}.fill-submit{margin-top:4px}.sidebar{position:fixed;z-index:20;top:18px;right:18px;bottom:18px;width:318px;padding:15px;background:#fff;border:1px solid #E2DDEA;border-radius:20px;box-shadow:0 8px 32px rgba(35,25,65,.11);display:flex;flex-direction:column;gap:13px;min-height:0}.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 10px;border-bottom:1px solid var(--line)}.timer-label{font-size:.78rem;color:var(--muted);font-weight:700}.timer-value{font-size:1.32rem;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.25}.side-toggle{border:1px solid var(--line);border-radius:10px;background:#FBFAFE;padding:7px 10px;color:var(--primary-dark);font-size:.82rem;font-weight:750}.sidebar-details{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding:0 2px 8px}.side- <script>
const PAGE_FILE = "choice_251-300.html";
const PAGE_QUESTIONS = [{"id":"choice-251","type":"choice","number":251,"globalNumber":251,"stem":"WWW 客户与 WWW 服务器之间的信息传输使用的协议为 ()。","images":[],"options":{"A":"HTML","B":"HTTP","C":"SMTP","D":"IMAP"},"answer":"B","analysis":"HTTP（超文本传输协议）用于 WWW 客户与 WWW 服务器之间传输超文本数据；HTML 是超文本标记语言，用于描述网页内容；SMTP 用于发送电子邮件；IMAP 用于接收电子邮件。所以选 B。","source":"未提供","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-252","type":"choice","number":252,"globalNumber":252,"stem":"双绞线由两根具有绝缘保护层的铜导线按一定密度互相绞在一起组成，这样可 ()。","images":[],"options":{"A":"降低信号干扰程度","B":"降低成本","C":"提高传输速度","D":"没有任何作用"},"answer":"A","analysis":"双绞线两根铜导线绞合在一起可以降低信号之间的电磁干扰，提高传输质量；绞合的目的不是降低成本和提高传输速度，且并非没有作用。所以选 A。","source":"未提供","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-253","type":"choice","number":253,"globalNumber":253,"stem":"光纤通信系统是以 () 的通信方式。","images":[],"options":{"A":"光波为载体、光导纤维为传输介质","B":"光导纤维为载体、光波为传输介质","C":"光波为载体、光接收机为传输介质","D":"光接收机为载体、光导纤维为传输介质"},"answer":"A","analysis":"光纤通信系统利用光波作为载体，通过光导纤维传输光信号进行通信。光接收机用于接收光信号，不是传输介质；光导纤维是传输介质，不是载体。所以选 A。","source":"未提供","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-254","type":"choice","number":254,"globalNumber":254,"stem":"交换机是基于 () 地址来实现数据转发的。","images":[],"options":{"A":"IP 地址","B":"MAC 地址","C":"居住地址","D":"电脑地址"},"answer":"B","analysis":"交换机根据 MAC（介质访问控制）地址进行数据帧的转发，IP 地址用于网络层寻址；居住地址和电脑地址与交换机数据转发无关。所以选 B。","source":"未提供","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-255","type":"choice","number":255,"globalNumber":255,"stem":"下列选项中，在路由器上查看版本及引导信息的命令是 ()。","images":[],"options":{"A":"router#show version","B":"router#show ip router","C":"router#show interface","D":"router#show run"},"answer":"A","analysis":"在路由器命令行中，router#show version 用于查看路由器的版本及引导信息；router#show ip router 用于查看路由表信息；router#show interface 用于查看接口状态信息；router#show run 用于查看当前运行配置。所以选 A。","source":"未提供","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-256","type":"choice","number":256,"globalNumber":256,"stem":"路由器启动时访问不同类型存储器的先后顺序是 ()。","images":[],"options":{"A":"ROM-\u003eFLASH-\u003eNVRAM","B":"FLASH-\u003eROM-\u003eNVRAM","C":"ROM-\u003eNVRAM-\u003eFLASH","D":"FLASH-\u003eNVRAM-\u003eROM"},"answer":"A","analysis":"路由器启动时，首先从 ROM（只读存储器）中读取引导程序，然后加载 FLASH（闪存）中的操作系统，最后读取 NVRAM（非易失性随机存取存储器）中的配置文件。所以选 A。","source":"未提供","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-257","type":"choice","number":257,"globalNumber":257,"stem":"使用链路状态算法的路由协议是 ()。","images":[],"options":{"A":"RIP","B":"BGP","C":"OSPF","D":"PPP"},"answer":"C","analysis":"OSPF（开放最短路径优先）协议使用链路状态算法计算路由；RIP 使用距离向量算法；BGP 是边界网关协议，用于不同自治系统间的路由选择；PPP 是数据链路层协议，不是路由协议。所以选 C。","source":"未提供","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-258","type":"choice","number":258,"globalNumber":258,"stem":"操作系统的安全威胁主要来自 ()。","images":[],"options":{"A":"局域网","B":"内网","C":"外网","D":"内网和外网"},"answer":"C","analysis":"外网存在大量未知和不可控因素，如恶意软件、网络攻击等，是操作系统安全的主要威胁来源；虽然内网也可能存在安全风险，但相对外网威胁较小；局域网范围较广，概念不准确。所以选 C。","source":"未提供","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-259","type":"choice","number":259,"globalNumber":259,"stem":"存储保护的工作通常由 () 实现。","images":[],"options":{"A":"软件","B":"硬件和软件配合","C":"硬件","D":"文件"},"answer":"B","analysis":"存储保护既需要硬件提供存储保护机制，如内存管理单元（MMU），也需要软件进行存储访问的控制和管理，两者配合才能实现存储保护功能。所以选 B。","source":"未提供","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-260","type":"choice","number":260,"globalNumber":260,"stem":"下面不属于本地用户组密码安全策略的内容是 ()。","images":[],"options":{"A":"设定用户不能更改密码","B":"设定密码长度最小值","C":"密码必须符合复杂性要求","D":"强制密码历史"},"answer":"A","analysis":"设定密码长度最小值、密码必须符合复杂性要求、强制密码历史都是常见的本地用户组密码安全策略，用于增强密码安全性；设定用户不能更改密码不属于通用的密码安全策略内容。所以选 A。","source":"未提供","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-261","type":"choice","number":261,"globalNumber":261,"stem":"下列保护系统账户安全的措施中，(　　) 措施对解决口令暴力破解无帮助。","images":[],"options":{"A":"使用屏幕保护并设置返回时需要提供口令","B":"设置系统的账户锁定策略，在用户登录输入错误次数达到一定数量时对账户进行锁定","C":"更改系统内宣管理员的用户名","D":"给管理员账户一个安全的口令"},"answer":"A","analysis":"使用屏幕保护并设置返回时需口令，主要是防止他人在设备使用间隙未经授权访问，无法阻止暴力破解；账户锁定策略可限制暴力破解尝试次数；更改管理员用户名和设置安全口令都有助于防范暴力破解","source":"网络安全基础","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-262","type":"choice","number":262,"globalNumber":262,"stem":"下列哪一种防病毒软件的实施策略在内部公司网络中是最有效的 (　　)。","images":[],"options":{"A":"服务器防毒软件","B":"病毒墙","C":"工作站防病毒软件","D":"病毒库及时更新"},"answer":"D","analysis":"病毒库及时更新能让防病毒软件识别最新病毒，无论服务器、工作站还是通过病毒墙防护，及时更新病毒库是有效防范病毒的关键，其他选项单独实施效果有限","source":"网络安全基础","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-263","type":"choice","number":263,"globalNumber":263,"stem":"假设使用一种加密算法，它的加密方法很简单：将每一个字母加 5，即加密成 f，这种算法的密钥就是 5，那么它属于 (　　)。","images":[],"options":{"A":"对称加密技术","B":"分组密码技术","C":"公钥加密技术","D":"单向函数密码技术"},"answer":"A","analysis":"该算法加密和解密使用同一密钥（5），符合对称加密技术特征；分组密码技术按固定长度分组加密，题干未体现；公钥加密使用公私钥对；单向函数密码技术具有不可逆性，均不符合","source":"密码学基础","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-264","type":"choice","number":264,"globalNumber":264,"stem":"Linux 系统下 vsftpd 服务器设置将所有本地用户都锁定在主目录中的方法是 (　　)。","images":[],"options":{"A":"修改 vsftpd 主配置文件，修改 chroot_list_enable=NO，chroot_local_user=Yes，重启服务","B":"修改 vsftpd 主配置文件，修改 chroot-list-enable=NO，chroot_local_user=Yes，重启服务","C":"修改 vsftpd 主配置文件，修改 chroot_list_enable=YES，chroot_local_user=NO，重启服务","D":"修改 vsftpd 主配置文件，修改 chroot-list-enable=YES，chroot_local_user=NO，重启服务"},"answer":"A","analysis":"chroot_list_enable=NO 表示不启用例外列表，chroot_local_user=Yes 表示将本地用户锁定在主目录，B 选项 chroot-list-enable 书写错误，C、D 选项配置错误","source":"Linux 服务器配置","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-265","type":"choice","number":265,"globalNumber":265,"stem":"关于 TCPWrapper 的描述不正确的是 (　　)。","images":[],"options":{"A":"TCPWrapper 中的各个部分都在记录和监视着远程客户端用户和服务器端的程序或守护进程之间的联系","B":"TCPWrapper 是一些服务器程序的集合，充当标准的服务程序的角色，并且提供了一些选项和记录日志的功能","C":"TCPWrapper 运行于一些 Unix 操作平台，并且可以被看成是应用网关的设置工具","D":"TCPWrapper 能恢复受损文件，而且能详细列出每一个受损文件的详细情况"},"answer":"D","analysis":"TCPWrapper 主要用于监控和管理网络连接，不具备恢复受损文件及列出受损文件详情的功能，A、B、C 选项对其描述正确","source":"网络安全技术","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-266","type":"choice","number":266,"globalNumber":266,"stem":"samba 服务的默认安全模式等级是 (　　)。","images":[],"options":{"A":"user","B":"share","C":"server","D":"ads"},"answer":"A","analysis":"samba 服务默认安全模式为 user，用户需提供用户名和密码进行访问；share 模式无需用户名和密码；server 模式使用其他服务器进行用户验证；ads 模式用于与 Active Directory 集成","source":"Samba 服务器配置","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-267","type":"choice","number":267,"globalNumber":267,"stem":"某公司使用 Linux 系统搭建了 samba 文件服务器，账号为 zhang3 的员工出差期间，为了避免该账号被其它员工冒用，需要临时将其禁用，可以使用以下 (　　) 命令。","images":[],"options":{"A":"smbpasswd -a zhang3","B":"smbpasswd -d zhang3","C":"smbpasswd -e zhang3","D":"smbpasswd -x zhang3"},"answer":"B","analysis":"smbpasswd -a 用于添加用户；smbpasswd -d 用于禁用用户；smbpasswd -e 用于启用用户；smbpasswd -x 用于删除用户","source":"Linux 服务器配置","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-268","type":"choice","number":268,"globalNumber":268,"stem":"不属于使用 DHCP 服务器功能的好处是 (　　)。","images":[],"options":{"A":"降低 TCP/IP 网络的配置工作量","B":"增加系统安全与依赖性","C":"对那些经常变动位置的工作站 DHCP 能迅速更新位置信息","D":"可以将域名转换成 IP 地址"},"answer":"D","analysis":"DHCP 可自动分配 IP 地址，降低配置工作量，方便工作站变动时更新信息，增强系统安全性；而将域名转换为 IP 地址是 DNS 的功能","source":"DHCP 服务器配置","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-269","type":"choice","number":269,"globalNumber":269,"stem":"有一台 DHCP 服务器上，若创建两个 Scope，一个 Scope 的地址范围是：10.0.0.1 - 10.0.0.254；另一个 Scope 的地址范围是：10.0.0.255 - 10.0.1.254，是否可以实现 (　　)。","images":[],"options":{"A":"可以实现，无需特殊设置","B":"可以实现，需要在服务器属性中设置","C":"不能实现","D":"可以实现，需要在 Scope 属性中设置"},"answer":"C","analysis":"10.0.0.255 是网络广播地址，不能用于分配，所以这样的两个 Scope 不能实现","source":"DHCP 服务器配置","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-270","type":"choice","number":270,"globalNumber":270,"stem":"你希望配置客户端 TCP/IP 属性在你的域中。你安装了 DHCP 服务在 Windows2008 的服务器并且配置了作用域。用户报告无法访问网络。你发现 DHCP 服务没有被 AD 授权。当你试图授权服务器时，你得到错误信息：“access denied”。你需要做的工作是 (　　)。","images":[],"options":{"A":"你必须在本地拥有域管理员的权限","B":"你必须有森林管理员的权限","C":"要求管理员配置策略允许你授权 DHCP 服务器","D":"你必须拥有所有管理员的权限" 定是本地用户名和密码；密文密码 show 查看时不会显示明文；同一类型密码多次配置，后配置的会覆盖前一个；通常不能同时配置明文和密文密码","source":"网络设备安全配置","difficulty":"中","file":"choice_251-300.html"},{"id":"choice-275","type":"choice","number":275,"globalNumber":275,"stem":"默认情况下，思科 IOS 系统只有两个密码安全模式，分别是 (　　)。","images":[],"options":{"A":"级别 1 用户模式和级别 15 特权模式","B":"级别 1 特权模式和级别 15 用户模式","C":"级别 1 用户模式和级别 3 管理员模式","D":"级别 1 管理员模式和级别 3 用户模式"},"answer":"A","analysis":"思科 IOS 系统默认的两个密码安全模式是级别 1 用户模式（基本权限）和级别 15 特权模式（最高权限）","source":"思科 IOS 系统基础","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-276","type":"choice","number":276,"globalNumber":276,"stem":"思科路由器配置接口 IP 地址正确的是 (　　)。","images":[],"options":{"A":"Router(config-if)#ip address 192.168.1.1","B":"Router(config-if)#ip address 192.168.1.1 255.255.255.0","C":"Router(config)#ip address 192.168.1.1","D":"Router(config)#ip address 192.168.1.1 255.255.255.0"},"answer":"B","analysis":"在思科路由器接口配置模式（config-if）下，使用 ip address 命令配置 IP 地址和子网掩码，A 选项缺少子网掩码；C、D 选项配置模式错误","source":"思科路由器配置","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-277","type":"choice","number":277,"globalNumber":277,"stem":"思科路由器进入全局配置视图的命令是 (　　)。","images":[],"options":{"A":"Router\u003econfigure","B":"Router#configure","C":"Router(config)#configure","D":"Router#enable"},"answer":"B","analysis":"在特权 EXEC 模式（# 提示符）下，使用 configure 命令进入全局配置视图；A 选项在用户 EXEC 模式下使用错误；C 选项在全局配置视图下该命令无意义；D 选项 enable 是进入特权 EXEC 模式的命令","source":"思科路由器配置基础","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-278","type":"choice","number":278,"globalNumber":278,"stem":"要删除思科路由器上的用户配置内容，可以使用 (　　) 命令。","images":[],"options":{"A":"Router#del startup-config","B":"Router#erase startup-config","C":"Router#remove startup-config","D":"Router#write startup-config"},"answer":"B","analysis":"erase startup-config 命令用于删除思科路由器的启动配置文件（保存用户配置内容）；del 在思科设备中不是删除配置文件的标准命令；remove 也不是；write startup-config 是保存配置","source":"思科路由器配置","difficulty":"易","file":"choice_251-300.html"},{"id":"choice-279","type":"choice","number":279,"globalNumb B":"网卡信息","C":"主机名","D":"NDS 服务器地址"},"answer":"D","analysis":"systeminfo 可查看系统已打补丁信息、网卡信息、主机名等，但无法查看 NDS 服务器地址，所以选 D。","source":"未提供","difficulty":"基础","file":"choice_251-300.html"},{"id":"choice-285","type":"choice","number":285,"globalNumber":285,"stem":"SELinux 是一种基于 (　　) 类型模型的强制访问控制（MAC）安全系统。","images":[],"options":{"A":"文件","B":"文件夹","C":"域","D":"链"},"answer":"C","analysis":"SELinux 是基于域类型模型的强制访问控制安全系统，所以选 C。","source":"未提供","difficulty":"基础","file":"choice_251-300.html"},{"id":"choice-286","type":"choice","number":286,"globalNumber":286,"stem":"root 用户的 UID 和 GID 为 (　　)。","images":[],"options":{"A":"2 和 0","B":"0 和 0","C":"1 和 0","D":"500 和 500"},"answer":"B","analysis":"在 Linux 系统中，root 用户的 UID 和 GID 均为 0，所以选 B。","source":"未提供","difficulty":"基础","file":"choice_251-300.html"},{"id":"choice-287","type":"choice","number":287,"globalNumber":287,"stem":"Linux 要给所有的人读取权限，用数字表示 (　　)。","images":[],"options":{"A":"441","B":"444","C":"222","D":"111"},"answer":"B","analysis":"在 Linux 权限数字表示中，4 表示读取权限，给所有人读取权限用 444 表示，所以选 B。","source":"未提供","difficulty":"基础","file":"choice_251-300.html"},{"id":"choice-288","type":"choice","number":288,"globalNumber":288,"stem":"在数据库安全性控制中，授权的数据对象 (　　)，授权子系统就越灵活。","images":[],"options":{"A":"粒度越小","B":"约束越细致","C":"范围越大","D":"约束范围大"},"answer":"A","analysis":"在数据库安全性控制中，授权数据对象粒度越小，授权子系统越能精准控制权限，也就越灵活，所以选 A。","source":"未提供","difficulty":"中等","file":"choice_251-300.html"},{"id":"choice-289","type":"choice","number":289,"globalNumber":289,"stem":"1996 年 6 月国务院成立中国互联网络信息中心负责我国的域名管理，以下有关我国域名体系的说法错误的是 (　　)。","images":[],"options":{"A":"最高级为 CN","B":"COM 属于二级域名的行政区域名","C":"COM 的含义为商业公司","D":"CN 即为 “中国” 的代码","E":"GOV 的含义为政府组织"},"answer":"B","analysis":"COM 属于二级域名中的类别域名，并非行政区域名，我国域名体系中最高级为 CN ，代表中国，COM 代表商业公司，GOV 代表政府组织，所以 B 错误。","source":"未提供","difficulty":"基础","file":"choice_251-300.html"},{"id":"choice-290","type":"choice","number":290,"globalNumber":290,"stem":"首次网站备案适用于的情况是 (　　)。","images":[],"options":{"A":"网站主办者首次提交网站备案申请或网站主办者以前取得的备案号被注销后，重新提交备案申请","B":"域名在别的接入商备案过，需要变更接入商或域名在别的接入商备案过，需要增加电信接入商","C":"原备案主体在其他接入商备案过，需要新增加备案或主体已备案过，要在此主体下新增网站","D":"在工信部备案通过后需要修改个别备案信息"},"answer":"A","analysis":"首次网站备案指网站主办者首次提交申请或原备案号被注销后重新提交，B 是变更接入商备案，C 是新增备案，D 是修改备案信息，所以选 A。","source":"未提供","difficulty":"基础","file":"choice_251-300.html"},{"id":"choice-291","type":"choice","number":291,"globalNumber":291,"stem":"网络管理是对网络设备及应用加以规划、监控和管理，并进行跟踪、记录、分析网络的异常情况，使网络管理人员能及时处理问题，网络管理具备以下几大功能：配置管理、(　　)、性能管理、安全管理和计费管理等。","images":[],"options":{"A":"故障管理","B":"日常备份管理","C":"升级管理","D":"发送邮件"},"answer":"A","analysis":"网络管理的基本功能包括配置管理、故障管理、性能管理、安全管理和计费管理，所以选 A。","source":"未提供","difficulty":"基础","file":"choice_251-300.html"},{"id":"choice-292","type":"choice","number":292,"globalNumber":292,"stem":"常用的数据备份方式包括完全备份、增量备份和差异备份，3 种方式在数据存储的空间利用率方面由多到少的顺序为 (　　)。","images":[],"options":{"A":"完全备份、增量备份、差异备份","B":"完全备份、差异备份、增量备份","C":"增量备份、差异备份、完全备份","D":"差异备份、增量备份、完全备份"},"answer":"C","analysis":"增量备份只备份上次备份后新增或修改的数据，差异备份备份上次完全备份后变化的数据，完全备份备份全部数据，所以空间利用率由多到少是增量备份、差异备份、完全备份，选 C。","source":"未提供","difficulty":"中等","file":"choice_251-300.html"},{"id":"choice-293","type":"choice","number":293,"globalNumber":293,"stem":"以下关于灾难恢复和数据备份的理解，说法相对正确的是 (　　)。","images":[],"options":{"A":"增量备份是备份从上次完全备份后更新的全部数据文件","B":"依据具备的灾难恢复资源程度的不同，灾难恢复能力分为 7 个等级","C":"数据备份按数据类型划分为系统数据备份和用户数据备份","D":"如果系统在一段时间内没有出现问题，就可以不用再进行容灾演练了"},"answer":"C","analysis":"增量备份是备份上次备份（完全或增量）后更新的数据，不是上次完全备份后全部更新数据，A 错误；灾难恢复能力分 6 个等级，B 错误；容灾演练需定期进行，D 错误；数据备份按数据类型可分为系统数据备份和用户数据备份，C 正确 。","source":"未提供","difficulty":"中等","file":"choice_251-300.html"},{"id":"choice-294","type":"choice","number":294,"globalNumber":294,"stem":"在以下选项中，不是 IP SAN 的特点是 (　　)。","images":[],"options":{"A":"设备整合，多台服务器可以通过存储网络同时访问后端存储系统，不必为每台服务器单独购买存储设备，降低存储设备异构化程度，减轻维护工作量，降低维护费用","B":"数据集中，不同应用和服务器的数据实现了物理上的集中，空间调整和数据复制等工作可以在一台设备上完成，大大提高了存储资源利用率","C":"兼容性好，FC 协议经过长期发展，已经形成大规模产品化，而且厂商之间均遵循统一的标准，以使目前 FC SAN 成为了主流的存储架构","D":"高扩展性，存储网络架构使得服务器可以方便的接入现有 SAN 环境，较好的适应应用变化的需求"},"answer":"C","analysis":"C 选项描述的是 FC SAN 的特点，不是 IP function renderQuestionList(){const list=$("questionList");list.textContent="";const qs=currentVisibleQuestions();if(!qs.length){list.append(element("div","empty-questions",progress.mode==="wrong"?"当前分页没有需要复习的错题。":"当前分页暂无可显示的题目。"));return}for(const q of qs)list.append(renderQuestionCard(q));list.append(element("div","quiz-bottom-spacer"));}

function renderQuestionNavigation(){const wrap=$("questionNav");wrap.textContent="";const qs=currentVisibleQuestions();wrap.append(element("div","side-section-title",typeName(qs[0]?.type||routeByFile(PAGE_FILE)?.type||"choice")));const grid=element("div","side-question-grid");for(const q of qs){const b=element("button","number-button",String(q.number));b.type="button";b.dataset.action="goto";b.dataset.qid=q.id;const s=stateFor(q);const cls=statusClass(q.id);if(cls)b.classList.add(cls);if(q.id===progress.currentId)b.classList.add("is-current");const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(pins.includes(q.id))b.classList.add("is-pinned");b.title=`${typeName(q.type)} 第${q.number}题`;grid.append(b)}wrap.append(grid)}
function renderPinList(){const wrap=$("pinList");wrap.textContent="";const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(!pins.length){wrap.append(element("div","side-muted","暂无图钉题目"));return}const known=pins.map(findMeta).filter(Boolean);const groupOrder=["choice","multi","judgment","fill"];for(const type of groupOrder){const items=known.filter(m=>m.type===type);if(!items.length)continue;wrap.append(element("div","side-section-title",typeName(type)));const row=element("div","pin-list");for(const m of items){const b=element("button","pin-chip",String(m.number));b.type="button";b.dataset.action="goto-meta";b.dataset.qid=m.id;b.title=typeName(m.type)+" 第"+m.number+"题";row.append(b)}wrap.append(row)}}
function routeForNavigation(){if(progress.mode==="wrong")return activeRoutes();return ROUTES}
function updatePager(){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);for(const b of document.querySelectorAll('[data-action="prev"],[data-action="next"]')){const isPrev=b.dataset.action==="prev";b.disabled=idx<0||(isPrev?idx===0:idx>=routes.length-1)}const submitVisible=isExamOpen();document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.classList.toggle("hidden",!submitVisible));document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.disabled=!submitVisible)}
function renderMode(){const n=$("modeLabel");if(n)n.textContent=statusText();const s=$("pageInfo");if(s){const r=routeByFile(PAGE_FILE);s.textContent=r?`${typeName(r.type)} · ${r.start}–${r.end} 题`:"刷题"}const top=$("quizMainTitle");if(top)top.textContent=statusText();}
function scrollToQuestion(id){const card=$("q-"+id);if(!card)return;progress.currentId=id;progress.currentFile=PAGE_FILE;saveProgress();document.querySelectorAll(".question-card.is-current").forEach(n=>n.classList.remove("is-current"));card.classList.add("is-current");renderQuestionNavigation();const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}
function gotoQuestion(id){const m=findMeta(id);if(!m)return;if(m.file!==PAGE_FILE){progress.currentFile=m.file;progress.currentId=id;saveProgress();location.href=m.file;return}if(!questionMap[id])return;scrollToQuestion(id)}
function switchPage(delta){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);const target=routes[idx+delta];if(!target)return;const ids=target.ids.filter(id=>progress.mode!=="wrong"||(progress.wrongIds||[]).includes(id));let ordered=ids;if(progress.mode==="exam"&&examSession&&examSession.questionOrders[target.file])ordered=examSession.questionOrders[target.file].filter(id=>ids.includes(id));if(progress.mode==="review"&&lastResult&&lastResult.questionOrders&&lastResult.questionOrders[target.file])ordered=lastResult.questionOrders[target.file].filter(id=>ids.includes(id));progress.currentFile=target.file;progress.currentId=ordered[0]||ids[0]||null;saveProgress();location.href=target.file}
function togglePin(id){if(isReadOnly()||!id)return;const pins=new Set(progress.pins||[]);if(pins.has(id))pins.delete(id);else pins.add(id);progress.pins=[...pins];saveProgress();updateOneQuestion(id)}
function recordStats(q,correct,answered){if(!answered)return;progress.stats=progress.stats||{};progress.stats[q.id]={answered:true,correct:Boolean(correct),updatedAt:Date.now()}}
function answerQuestion(id,key){const q=questionMap[id];if(!q||isReadOnly())return;if(progress.mode==="wrong"&&!(progress.wrongIds||[]).includes(id))return;let s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};if(progress.mode==="exam"){
if(!isExamOpen())return;if(q.type==="multi"){const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set]}else s.selectedKeys=[key];s.answered=s.selectedKeys.length>0;s.locked=false;s.correct=null;progress.answers[id]=s;saveProgress();updateOneQuestion(id);return}
if(s.locked)return;if(q.type==="multi"){
const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set];const correct=new Set(correctKeys(q));const wrong=s.selectedKeys.some(k=>!correct.has(k));const complete=[...correct].every(k=>set.has(k))&&set.size===correct.size;if(wrong||complete){s.answered=true;s.locked=true;s.correct=!wrong&&complete;recordStats(q,s.correct,true)}else{s.answered=false;s.correct=null;s.locked=false}
}else{s.selectedKeys=[key];s.answered=true;s.locked=true;s.correct=answersMatch(q,s);recordStats(q,s.correct,true)}progress.answers[id]=s;saveProgress();updateOneQuestion(id)}
function submitFill(id){const q=questionMap[id];if(!q||isReadOnly()||progress.mode==="exam")return;const fields=[...document.querySelectorAll(`input[data-qid="${id}"][data-blank]`)];const vals=fields.map(n=>n.value.slice(0,20));if(!vals.some(v=>v.trim())){alert("请先填写答案。");return}const s={blanks:vals,selectedKeys:[],answered:true,locked:true};const correctAnswers=Array.isArray(q.blanks)?q.blanks:[];s.correct=correctAnswers.length===vals.length&&correctAnswers.every((v,i)=>normalizeText(v)===normalizeText(vals[i]));progress.answers[id]=s;recordStats(q,s.correct,true);saveProgress();updateOneQuestion(id)}
function exitToHome(){checkpointTimer();progress.active=true;progress.timerRunning=false;progress.timerStartedAt=null;saveProgress();if(examSession&&progress.mode==="exam"){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession)}location.href="index.html"}
const ALL_META_MAP=Object.fromEntries(META.map(m=>[m.id,m]));
function submitExam(){if(!isExamOpen())return;if(!confirm("确定交卷吗？未作答的题目将按错误计入，本次考试将停止计时。"))return;const now=Date.now();progress.elapsedMs=getElapsed();progress.timerRunning=false;progress.timerStartedAt=null;examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession);const states={};const wrongIds=[];let total=0,correctCount=0;for(const m of META){const q=questionMap[m.id]||null;const answer=progress.answers[m.id]||{selectedKeys:[],blanks:[],answered:false,locked:false};const selected=Array.isArray(answer.selectedKeys)?answer.selectedKeys.slice():[];let hasAnswer=selected.length>0;if(m.type==="fill"){const blanks=Array.isArray(answer.blanks)?answer.blanks:[];hasAnswer=blanks.some(v=>String(v||"").trim()!=="")}
let correct=false;if(q){correct=hasAnswer&&answersMatch(q,answer)}else{const base=answer.correct;correct=hasAnswer&&base===true}
// This page includes only 50 questions, so exam submission must use source-independent answer snapshots captured at each page.
const snap=examSession.answerSnapshot&&examSession.answerSnapshot[m.id];if(snap){hasAnswer=!!snap.answered;correct=hasAnswer&&snap.correct===true;}
// The home page has no access to the page-specific current state; store all answers and their correctness in the shared progress object.
const allAnswer=progress.answers[m.id]||{};const answered=Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.length>0:(Array.isArray(allAnswer.blanks)&&allAnswer.blanks.some(v=>String(v||"").trim()!==""));
let finalCorrect=false;const ak=ANSWER_KEYS[m.id];if(answered&&ak){if(ak.type==="choice"||ak.type==="judgment")finalCorrect=allAnswer.selectedKeys?.length===1&&allAnswer.selectedKeys[0]===ak.answer;else if(ak.type==="multi"){const a=[...(allAnswer.selectedKeys||[])].sort(),b=[...(ak.answer||[])].sort();finalCorrect=a.length===b.length&&a.every((v,i)=>v===b[i])}else if(ak.type==="fill"){const norm=v=>String(v??"").normalize("NFKC").trim().toLowerCase();finalCorrect=(ak.blanks||[]).length===(allAnswer.blanks||[]).length&&(ak.blanks||[]).every((v,i)=>norm(v)==norm(allAnswer.blanks[i]))}}
states[m.id]={id:m.id,type:m.type,number:m.number,file:m.file,selectedKeys:Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.slice():[],blanks:Array.isArray(allAnswer.blanks)?allAnswer.blanks.slice():[],answered,correct:finalCorrect};total++;if(finalCorrect)correctCount++;else wrongIds.push(m.id);
if(answered)progress.stats[m.id]={answered:true,correct:finalCorrect,updatedAt:now};}
const result={schema:2,resultId:"result-"+now.toString(36),mode:"考试模式",testAt:now,elapsedMs:progress.elapsedMs,total,correct:correctCount,accuracy:total?correctCount/total:0,wrongIds,questionStates:states,questionOrders:examSession.questionOrders||{},optionOrders:examSession.optionOrders||{},pins:(progress.pins||[]).slice()};writeKey(STORAGE_KEYS.result,result);progress.active=false;progress.mode=null;progress.answers={};progress.pins=result.pins.slice();progress.currentFile=null;progress.currentId=null;progress.timerRunning=false;progress.timerStartedAt=null;progress.completed=true;saveProgress();removeKey(STORAGE_KEYS.exam);location.href="result.html"}
function renderAll(){currentOrder=idsForPage();renderMode();renderQuestionList();renderQuestionNavigation();renderPinList();renderTimer();updatePager()}
function init(){progress=readProgress();examSession=readKey(STORAGE_KEYS.exam);lastResult=readKey(STORAGE_KEYS.result);const marker=readKey(STORAGE_KEYS.marker);if(location.protocol==="file:"){showStorageWarning("当前通过 file:// 直接打开。浏览器可能隔离不同 HTML 文件的本地存储；若跨页进度无法共享，请改用同源静态站点，或通过首页导入/导出备份。")}
if(!safeStorage)showStorageWarning("浏览器本地存储不可用，进度可能无法保存。请检查浏览器权限后再开始。")
if(!progress.active){const stats=progress.stats||{};const route=routeByFile(PAGE_FILE);progress={...baseProgress(),active:true,mode:"practice",answers:{},stats,pins:[],currentFile:PAGE_FILE,currentId:route?.ids?.[0]||null,elapsedMs:0,timerRunning:true,timerStartedAt:Date.now(),wrongIds:[],createdAt:Date.now()};saveProgress()}
if(progress.mode==="exam"&&!examSession){showStorageWarning("没有读取到当前考试会话，已禁止自动开始或重新打乱。请返回首页并导入之前导出的进度，或在同源静态站点中重新进入考试。")}
if(progress.mode==="review")lastResult=readKey(STORAGE_KEYS.result);
if(progress.mode==="wrong"){const routes=activeRoutes();if(!routes.length){alert("暂无数据：没有可复习的错题。");location.href="index.html";return}if(!routes.some(r=>r.file===PAGE_FILE)){progress.currentFile=routes[0].file;progress.currentId=routes[0].ids.find(id=>(progress.wrongIds||[]).includes(id))||routes[0].ids[0];saveProgress();location.replace(progress.currentFile);return}}
if(progress.mode!=="wrong"&&progress.mode!=="exam"&&progress.mode!=="review"&&progress.mode!=="practice"){progress.mode="practice";progress.currentFile=PAGE_FILE;progress.currentId=PAGE_QUESTIONS[0]?.id||null;saveProgress()}
if(progress.currentFile!==PAGE_FILE){progress.currentFile=PAGE_FILE;if(!progress.currentId||!questionMap[progress.currentId])progress.currentId=idsForPage()[0]||null;saveProgress()}
const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
document.addEventListener("input",e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||!input.dataset.qid||input.dataset.blank===undefined||isReadOnly())return;const id=input.dataset.qid;const idx=Number(input.dataset.blank);const s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};s.blanks=s.blanks||[];s.blanks[idx]=input.value.slice(0,20);progress.answers[id]=s;});
function selfTestMapping(){const testOrder=["B","C","D","A"];const map={};testOrder.forEach((k,i)=>map[k]=String.fromCharCode(65+i));if(map.A!=="D")throw new Error("选项映射自测失败");const expected=["A","C"].map(k=>map[k]).sort().join(",");if(expected!=="B,D")throw new Error("多选题映射自测失败")}
try{selfTestMapping()}catch(e){showStorageWarning("答案映射检查未通过，已阻止继续作答。请返回首页重新进入考试。");}
init();
</script></body></html>
