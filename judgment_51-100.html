rong{border-color:#F0B7BB;background:var(--bad);color:#8B1E28}.option.is-wrong .option-label{background:#FFC9CD;color:#8B1E28}.option:disabled{opacity:1;cursor:default}.option:disabled:not(.is-correct):not(.is-wrong){color:var(--ink)}.analysis-block{margin-top:16px;padding:15px 16px;background:#F8F7FC;border:1px solid #E8E4F2;border-left:4px solid #A895E8;border-radius:12px;font-size:.92rem}.analysis-block h4{margin:0 0 8px;font-size:.95rem}.analysis-line{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.analysis-line strong{color:#55447F}.image-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.question-image{max-width:min(100%,360px);max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}.fill-inputs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}.fill-field{display:grid;gap:5px;min-width:min(100%,190px);flex:1}.fill-field input{width:100%;border:1px solid #D8D3E5;border-radius:10px;padding:11px 12px;min-height:44px}.fill-field input.is-correct{border-color:#82C99C;background:#EAF8EF}.fill-field input.is-wrong{border-color:#E99BA1;background:#FFF0F0}.fill-submit{margin-top:4px}.sidebar{position:fixed;z-index:20;top:18px;right:18px;bottom:18px;width:318px;padding:15px;background:#fff;border:1px solid #E2DDEA;border-radius:20px;box-shadow:0 8px 32px rgba(35,25,65,.11);display:flex;flex-direction:column;gap:13px;min-height:0}.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 10px;border-bottom:1px solid var(--line)}.timer-label{font-size:.78rem;color:var(--muted);font-weight:700}.timer-value{font-size:1.32rem;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.25}.side-toggle{border:1px solid var(--line);border-radius:10px;background:#FBFAFE;padding:7px 10px;color:var(--primary-dark);font-size:.82rem;font-weight:750}.sidebar-details{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding:0 2px 8px}.side-section-title{font-size:.86rem;font-weight:850;margin:0 0 8px}.sidebar.collapsed .sidebar-details{display:none}.number-button.is-selected{background:#F2EDFF;border-color:#C3B3FF;color:#59458F}.side-question-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.number-button{min-width:0;min-height:34px;padding:3px;border:1px solid #E5E1EC;border-radius:9px;background:white;color:#4E495D;font-weight:700;font-size:.83rem;font-variant-numeric:tabular-nums}.number-button.is-correct{background:var(--good);border-color:#B2DCC1;color:var(--good-ink)}.number-button.is-wrong{background:var(--bad);border-color:#F0B5B9;color:var(--bad-ink)}.number-button.is-current{box-shadow:inset 0 0 0 2px #9F8AE9;background:#F5F0FF}.number-button.is-pinned{border:2px solid #E1AD1F}.pin-list{display:flex;flex-wrap:wrap;gap:7px}.pin-chip{min-width:42px;padding:5px 8px;border:2px solid #E1AD1F;border-radius:9px;background:var(--pin-soft);font-weight:800;color:#6C5110}.side-muted{color:var(--muted);font-size:.84rem}.sidebar-footer{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px;background:#fff}.pager-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-exit{width:100%}.mode-label{font-size:.77rem;color:var(--muted);font-weight:700}.mobile-only{display:none}.storage-warning{margin:8px 0 0}.empty-questions{padding:30px;text-align:center;border:1px dashed #D6D0E3;border-radius:16px;color:var(--muted);background:#fff}.blank-marker{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;color:#6A559D;font-weight:850}.quiz-bottom-spacer{height:25px}

<script>
const PAGE_FILE = "judgment_51-100.html";
const PAGE_QUESTIONS = [{"id":"judgment-051","type":"judgment","number":51,"globalNumber":451,"stem":"设置了交换机端口安全时，违反规则后的处理策略不包括 shutdown。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"交换机端口安全设置中，当违反端口安全规则（如连接的 MAC 地址数量超过限制等）时，常见的处理策略包括 shutdown（关闭端口）、restrict（限制连接并记录违规信息）、protect（丢弃违规流量但不关闭端口）等。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-052","type":"judgment","number":52,"globalNumber":452,"stem":"拥塞就是要传送的用户数量超出了网络处理能力，导致网络服务性能下降的现象。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"网络拥塞是指在某段时间，若对网络中某一资源的需求超过了该资源所能提供的可用部分，网络性能就要变坏，即网络服务性能下降，常见表现如延迟增加、吞吐量降低等。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-053","type":"judgment","number":53,"globalNumber":453,"stem":"RIP 是距离矢量路由协议的一种，使用跳数作为路径选择的依据。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"RIP（路由信息协议）属于距离矢量路由协议，它以跳数作为衡量路由好坏的标准，选择跳数最少的路径作为最佳路由。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-054","type":"judgment","number":54,"globalNumber":454,"stem":"无线控制器 + 瘦 AP 的系统有非常强大的集中管理功能，所有的关于无线网络的配置都可以通过配置无线控制器统一完成。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在无线控制器 + 瘦 AP 的网络架构中，无线控制器负责对多个瘦 AP 进行集中管理和配置，包括无线网络的 SSID 设置、加密方式、信道选择等功能，瘦 AP 本身功能相对简单，主要负责无线信号的收发。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-055","type":"judgment","number":55,"globalNumber":455,"stem":"入侵检测系统完全可以替换所有的防火墙来使用。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"入侵检测系统（IDS）和防火墙功能不同，不能相互完全替代。防火墙主要是基于访问控制策略对网络流量进行过滤，防止外部非法访问内部网络；入侵检测系统则侧重于对网络活动进行实时监测，发现入侵行为并报警，但它无法像防火墙那样阻止未经授权的访问。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-056","type":"judgment","number":56,"globalNumber":456,"stem":"单击第一项，按住 Ctrl 键，然后再单击最后一个要选定的项，即可以选中多个连续的文件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"按住 Ctrl 键单击是用于选中多个不连续的文件；若要选中多个连续的文件，应单击第一项，然后按住 Shift 键，再单击最后一个要选定的项。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-057","type":"judgment","number":57,"globalNumber":457,"stem":"Linux 系统管理员的权限和普通用户的权限相同。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"Linux 系统中，系统管理员（root 用户）拥有最高权限，可以对系统进行全面的管理和配置，如安装软件、修改系统文件等；普通用户权限受限，只能在自己的用户目录及被授权的范围内进行操作。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-058","type":"judgment","number":58,"globalNumber":458,"stem":"Windows 10 中，进程是资源分配和处理机调度的基本单位。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"在 Windows 10 中，线程是处理机调度的基本单位，进程是资源分配的基本单位。线程比进程更轻量级，多个线程可以共享进程的资源，提高程序执行效率。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-059","type":"judgment","number":59,"globalNumber":459,"stem":"为了保证计算机信息安全，通常使用口令，以使计算机只允许用户在输入正确的保密信息时进入系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"口令是一种简单有效的身份验证方式，用户输入正确的口令才能访问计算机系统，防止未经授权的访问，保障计算机信息安全。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-060","type":"judgment","number":60,"globalNumber":460,"stem":"防火墙对内部网起到了很好的保护作用，并且它是坚不可摧的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"防火墙虽然能有效保护内部网络免受外部非法访问和攻击，但并非坚不可摧。黑客可以通过各种手段绕过防火墙的检测，如利用防火墙未检测到的协议漏洞、进行社会工程学攻击等。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-061","type":"judgment","number":61,"globalNumber":461,"stem":"职业道德对从事医务工作的人们有重要意义，医生的道德比知识和技能更为可贵。医生除了应有高度的知识修养和技能培训外，还应该具有明确、坚定、正确的信念。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在医疗行业，职业道德至关重要。医生面对患者的生命健康，良好的职业道德能确保其正确运用知识和技能，全心全意为患者服务，所以医生不仅要有专业知识和技能，更要有正确的信念和高尚的道德。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-062","type":"judgment","number":62,"globalNumber":462,"stem":"遵纪守法是爱岗敬业的思想指导，爱岗敬业是遵纪守法在职业生涯中个人能力素质的客观反映。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"遵纪守法为爱岗敬业提供了行为准则和规范，引导从业者在合法合规的框架内工作；爱岗敬业则体现了从业者在遵守法律法规的基础上，通过个人的工作态度和能力素质，积极履行工作职责，是遵纪守法在工作中的具体体现。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-063","type":"judgment","number":63,"globalNumber":463,"stem":"诚实守信的具体要求是忠诚所属组织、维护组织信誉不保守组织秘密。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"诚实守信要求忠诚所属组织、维护组织信誉，但同时也要保守组织秘密。泄露组织秘密违背了诚实守信原则，会损害组织利益。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-064","type":"judgment","number":64,"globalNumber":464,"stem":"装机过程中不要连接电源线，严禁带电插拔硬件，以免烧坏芯片或部件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在计算机装机过程中，带电插拔硬件可能会产生瞬间的电流冲击，极易损坏芯片或部件，所以装机时应先断开电源线，避免带电操作。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-065","type":"judgment","number":65,"globalNumber":465,"stem":"遵循网络体系结构标准建成的网络被称为第三代网络。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"第一代网络以面向终端的计算机通信网为代表；第二代网络是基于分组交换技术的计算机网络；第三代网络则是遵循网络体系结构标准（如 OSI/RM、TCP/IP 等）建成的网络，实现了不同厂商设备的互联互通。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-066","type":"judgment","number":66,"globalNumber":466,"stem":"开放系统互连参考模型（OSI/RM）将整个网络的功能划分成 7 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI/RM 从下到上依次为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层，共 7 个层次，用于规范网络通信功能。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-067","type":"judgment","number":67,"globalNumber":467,"stem":"模块化交换机可以灵活扩展额外的端口模块，增加端口数量。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"模块化交换机的优势在于其具有可扩展性，通过添加不同类型和数量的端口模块，可以根据实际需求灵活增加端口数量，满足不同网络规模的需求。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-068","type":"judgment","number":68,"globalNumber":468,"stem":"主机配置的 IP 地址与其他主机冲突时仍然可以正常上网。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"当主机配置的 IP 地址与其他主机冲突时，网络中的设备无法准确识别该主机，会导致网络通信异常，该主机不能正常上网，需要重新配置唯一的 IP 地址。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-069","type":"judgment","number":69,"globalNumber":469,"stem":"根据《中华人民共和国民法典》的规定，因国际货物买卖合同和技术进出口合同争议提起诉讼或者申请仲裁的时效期间为两年。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"根据《中华人民共和国民法典》规定，因国际货物买卖合同和技术进出口合同争议提起诉讼或者申请仲裁的时效期间为四年，并非两年。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-070","type":"judgment","number":70,"globalNumber":470,"stem":"《数据安全法》适用于在中华人民共和国境内外开展数据处理活动及其安全监管。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"《数据安全法》适用于在中华人民共和国境内开展的数据处理活动及其安全监管。在境外开展数据处理活动，损害中华人民共和国国家安全、公共利益或者公民、组织合法权益的，依法追究法律责任，但主要适用范围还是境内。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-071","type":"judgment","number":71,"globalNumber":471,"stem":"与 OSI 参考模型一样，TCP/IP 模型也采用层次化结构，每一层负责不同的通信功能。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"TCP/IP 模型和 OSI 参考模型都是层次化的网络体系结构，TCP/IP 模型包含应用层、传输层、网际层、网络接口层，各层分工明确，负责不同的通信功能，共同实现网络通信。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-072","type":"judgment","number":72,"globalNumber":472,"stem":"无线传播一般通过的路径不包括视距。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"无线传播路径包括视距传播、非视距传播等。视距传播是指在发射天线和接收天线之间没有阻挡的情况下，电磁波直接从发射端传播到接收端，是无线传播的常见路径之一。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-073","type":"judgment","number":73,"globalNumber":473,"stem":"无线 AP 其性能的好坏以及位置的摆放，直接影响着无线网络传输信号的强弱。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"无线 AP（无线接入点）是无线网络的关键设备，其性能（如发射功率、灵敏度等）以及位置摆放（如是否存在遮挡、安装高度等）会对无线网络信号的覆盖范围和强度产生直接影响，进而影响网络传输质量。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-074","type":"judgment","number":74,"globalNumber":474,"stem":"配置了操作系统的计算机是一台比原来的物理计算机功能更强大的计算机，这样的计算机只是一台逻辑上的计算机，称为虚拟计算机。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"操作系统为计算机提供了资源管理、任务调度等功能，使得计算机在逻辑上具备更强大的功能。从用户角度看，使用配置了操作系统的计算机如同使用一台功能增强的逻辑计算机，即虚拟计算机。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-075","type":"judgment","number":75,"globalNumber":475,"stem":"操作系统在计算机系统中处于处理机和用户之间的位置。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"操作系统作为计算机系统的核心软件，一方面管理计算机硬件资源（包括处理机），为上层软件和用户提供服务；另一方面，用户通过操作系统提供的接口（如命令行、图形界面等）使用计算机，所以操作系统处于处理机和用户之间。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-076","type":"judgment","number":76,"globalNumber":476,"stem":"UNIX 操作系统的文件系统是分级树型结构。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"UNIX 操作系统的文件系统采用分级树型结构，以根目录 “/” 为起点，下面可以有多个子目录和文件，子目录下又可以继续包含子目录和文件，这种结构便于文件的组织和管理。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-077","type":"judgment","number":77,"globalNumber":477,"stem":"感染性是计算机病毒造成的最显著的后果。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"计算机病毒造成的最显著后果是破坏性，它可以破坏计算机中的数据、程序，影响计算机系统的正常运行；感染性是计算机病毒的特性之一，指病毒能够自我复制并传播到其他程序或计算机上。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-078","type":"judgment","number":78,"globalNumber":478,"stem":"计算机病毒和生物病毒一样，可以感染人。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"计算机病毒是一种能够自我复制、传播并破坏计算机系统的程序代码，它只对计算机系统起作用，不会感染人类；生物病毒是一类能够在生物体内寄生、繁殖并引发疾病的微生物，二者本质不同。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-079","type":"judgment","number":79,"globalNumber":479,"stem":"Web 应用安全的核心问题在于 Web 服务器存在漏洞。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"Web 应用安全的核心问题是多方面的，不仅仅是 Web 服务器存在漏洞，还包括应用程序代码漏洞（如 SQL 注入、跨站脚本攻击等）、用户认证和授权机制不完善、数据传输安全等问题。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-080","type":"judgment","number":80,"globalNumber":480,"stem":"DNS 的中文名称是域名系统，其服务器类型只有主域名服务器、辅助域名服务器。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"DNS（Domain Name System）中文名称是域名系统，其服务器类型除了主域名服务器、辅助域名服务器外，还有缓存域名服务器、转发域名服务器等，不同类型的服务器在域名解析过程中发挥不同作用。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-081","type":"judgment","number":81,"globalNumber":481,"stem":"职业是社会分工的产物，每一种职业都体现了社会分工的细化，不同的社会成员必须在一定的社会构成的不同职业岗位上工作或劳动。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"社会发展促使分工细化，形成了不同职业，人们需在相应岗位工作以推动社会运转，该表述符合职业与社会分工的关系。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-082","type":"judgment","number":82,"globalNumber":482,"stem":"社会主义荣辱观是社会主义公民道德建设的重要内容。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"社会主义荣辱观涵盖了社会生活多个方面的道德准则，为公民道德建设提供价值导向，是重要组成部分。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-083","type":"judgment","number":83,"globalNumber":483,"stem":"诚实守信是每一个行业树立形象的根本，是社会健康发展的重要保障。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"行业靠诚信赢得客户信任、树立口碑；社会经济、文化等各方面发展依赖诚信，诚信缺失会破坏市场秩序、阻碍社会进步。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-084","type":"judgment","number":84,"globalNumber":484,"stem":"团结是为了集中力量实现共同理想或者完成共同任务，团结是一种力量、一种境界、一种品格，协作是指共同从事某种活动。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"团结凝聚力量实现目标，从个人品德到集体力量层面都有体现；协作就是多人共同开展活动，表述准确。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-085","type":"judgment","number":85,"globalNumber":485,"stem":"计算机信息系统，是指由计算机软件及其相关的和配套的设备、设施（含网络）构成的，按照一定的应用目标和规则对信息进行采集、加工、储存、传输和检索等处理的人机系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"符合计算机信息系统的定义，强调了硬件、软件、网络以及信息处理功能等关键要素。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-086","type":"judgment","number":86,"globalNumber":486,"stem":"数据库管理系统提供了 4 个方面的数据控制功能：数据定义、数据操作、数据库管理、数据库建立和维护以及通信。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"数据库管理系统具备这些功能，用于高效管理和维护数据库，确保数据的安全、准确和有效利用。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-087","type":"judgment","number":87,"globalNumber":487,"stem":"开放系统互连参考模型（OSI/RM）将整个网络的功能划分成 5 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"OSI/RM 把网络功能划分为 7 层，从物理层到应用层，各层分工协作实现网络通信，不是 5 层。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-088","type":"judgment","number":88,"globalNumber":488,"stem":"当网管员想要测试两台主机之间的网络是否连通时可以使用 ping 命令。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"ping 命令通过发送 ICMP 报文测试网络连通性，是网络管理中常用的故障排查工具。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-089","type":"judgment","number":89,"globalNumber":489,"stem":"光纤是一种可以传输电信号的网络传输介质。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"光纤利用光信号传输数据，通过光的全反射原理在纤芯中传播，不是传输电信号。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-090","type":"judgment","number":90,"globalNumber":490,"stem":"OSPF 交换的是 LSA, 不是路由条目，每台路由器向每个邻居发送链路状态通告 (LSA), 每个邻居在收到 LSA 之后要依次向它的邻居转发这些 LSA。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSPF 基于链路状态算法，通过交换 LSA 构建链路状态数据库，进而计算路由，该过程符合其工作原理。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-091","type":"judgment","number":91,"globalNumber":491,"stem":"注册表是 Windows 的核心，通过修改注册表，可以对系统进行限制和优化。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"注册表存储系统配置、用户设置等重要信息，合理修改可调整系统功能、优化性能，但操作不当易引发系统问题。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"},{"id":"judgment-092","type":"judgment","number":92,"globalNumber":492,"stem":"防火墙策略也称为防火墙的安全规则，它是防火墙实施网络保护的重要依据。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"防火墙依据策略规则，对网络流量进行过滤和控制，决定哪些流量允许通过，哪些被阻止，保障网络安全。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-093","type":"judgment","number":93,"globalNumber":493,"stem":"在大多数情况下，病毒侵入计算机系统以后病毒将迅速屏蔽计算机的硬盘、鼠标等输入设备。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"病毒主要目的通常不是屏蔽输入设备，常见行为是破坏数据、占用系统资源、传播自身等。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-094","type":"judgment","number":94,"globalNumber":494,"stem":"文本文件通常不会受电子邮件中的恶意代码的感染或携带恶意代码。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"文本文件格式简单，缺乏执行恶意代码的环境，相比可执行文件等，不易感染和携带恶意代码，但不绝对。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-095","type":"judgment","number":95,"globalNumber":495,"stem":"已被感染过的计算机具有对该恶意代码的免疫性。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"计算机感染恶意代码后不会产生类似生物免疫的效果，若不彻底清除，可能再次被同一恶意代码攻击，甚至感染新的恶意代码。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-096","type":"judgment","number":96,"globalNumber":496,"stem":"正版杀毒软件一般都能正常升级。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"正版杀毒软件厂商为保障其防护能力，会持续更新病毒库和软件功能，用户正常情况下能通过官方渠道进行升级。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-097","type":"judgment","number":97,"globalNumber":497,"stem":"在默认配置下，用匿名账户登陆 vsftpd 服务器后，其默认根目录是 /var/ftp。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在常见的 vsftpd 服务器默认配置中，匿名账户登录后的根目录通常设置为 /var/ftp，用于限制匿名用户访问范围。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-098","type":"judgment","number":98,"globalNumber":498,"stem":"启动 samba 服务时，smbd 是必须运行的端口监控程序。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"samba 服务中，smbd 负责处理客户端与服务器之间的文件和打印机共享请求，是服务正常运行的关键监控程序。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-099","type":"judgment","number":99,"globalNumber":499,"stem":"用 ftp 进行文件传输时，有两种模式：ASCII 和 binary。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"ASCII 模式用于传输文本文件，会对文件内容进行格式转换；binary 模式用于传输二进制文件，保持文件原貌，这两种模式满足不同文件传输需求。","source":"未提供","difficulty":"较低","file":"judgment_51-100.html"},{"id":"judgment-100","type":"judgment","number":100,"globalNumber":500,"stem":"一般客户机和服务器之间域名查询为非递归方式查询。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"一般客户机和服务器之间域名查询为递归方式查询，客户机向本地域名服务器发出查询请求后，本地域名服务器会代替客户机完成整个查询过程并返回结果；而非递归方式是服务器只返回部分信息，让客户机继续查询。","source":"未提供","difficulty":"中等","file":"judgment_51-100.html"}];

function renderQuestionList(){const list=$("questionList");list.textContent="";const qs=currentVisibleQuestions();if(!qs.length){list.append(element("div","empty-questions",progress.mode==="wrong"?"当前分页没有需要复习的错题。":"当前分页暂无可显示的题目。"));return}for(const q of qs)list.append(renderQuestionCard(q));list.append(element("div","quiz-bottom-spacer"));}

function renderQuestionNavigation(){const wrap=$("questionNav");wrap.textContent="";const qs=currentVisibleQuestions();wrap.append(element("div","side-section-title",typeName(qs[0]?.type||routeByFile(PAGE_FILE)?.type||"choice")));const grid=element("div","side-question-grid");for(const q of qs){const b=element("button","number-button",String(q.number));b.type="button";b.dataset.action="goto";b.dataset.qid=q.id;const s=stateFor(q);const cls=statusClass(q.id);if(cls)b.classList.add(cls);if(q.id===progress.currentId)b.classList.add("is-current");const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(pins.includes(q.id))b.classList.add("is-pinned");b.title=`${typeName(q.type)} 第${q.number}题`;grid.append(b)}wrap.append(grid)}
function renderPinList(){const wrap=$("pinList");wrap.textContent="";const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(!pins.length){wrap.append(element("div","side-muted","暂无图钉题目"));return}const known=pins.map(findMeta).filter(Boolean);const groupOrder=["choice","multi","judgment","fill"];for(const type of groupOrder){const items=known.filter(m=>m.type===type);if(!items.length)continue;wrap.append(element("div","side-section-title",typeName(type)));const row=element("div","pin-list");for(const m of items){const b=element("button","pin-chip",String(m.number));b.type="button";b.dataset.action="goto-meta";b.dataset.qid=m.id;b.title=typeName(m.type)+" 第"+m.number+"题";row.append(b)}wrap.append(row)}}
function routeForNavigation(){if(progress.mode==="wrong")return activeRoutes();return ROUTES}
function updatePager(){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);for(const b of document.querySelectorAll('[data-action="prev"],[data-action="next"]')){const isPrev=b.dataset.action==="prev";b.disabled=idx<0||(isPrev?idx===0:idx>=routes.length-1)}const submitVisible=isExamOpen();document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.classList.toggle("hidden",!submitVisible));document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.disabled=!submitVisible)}
function renderMode(){const n=$("modeLabel");if(n)n.textContent=statusText();const s=$("pageInfo");if(s){const r=routeByFile(PAGE_FILE);s.textContent=r?`${typeName(r.type)} · ${r.start}–${r.end} 题`:"刷题"}const top=$("quizMainTitle");if(top)top.textContent=statusText();}
function scrollToQuestion(id){const card=$("q-"+id);if(!card)return;progress.currentId=id;progress.currentFile=PAGE_FILE;saveProgress();document.querySelectorAll(".question-card.is-current").forEach(n=>n.classList.remove("is-current"));card.classList.add("is-current");renderQuestionNavigation();const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}
function gotoQuestion(id){const m=findMeta(id);if(!m)return;if(m.file!==PAGE_FILE){progress.currentFile=m.file;progress.currentId=id;saveProgress();location.href=m.file;return}if(!questionMap[id])return;scrollToQuestion(id)}
function switchPage(delta){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);const target=routes[idx+delta];if(!target)return;const ids=target.ids.filter(id=>progress.mode!=="wrong"||(progress.wrongIds||[]).includes(id));let ordered=ids;if(progress.mode==="exam"&&examSession&&examSession.questionOrders[target.file])ordered=examSession.questionOrders[target.file].filter(id=>ids.includes(id));if(progress.mode==="review"&&lastResult&&lastResult.questionOrders&&lastResult.questionOrders[target.file])ordered=lastResult.questionOrders[target.file].filter(id=>ids.includes(id));progress.currentFile=target.file;progress.currentId=ordered[0]||ids[0]||null;progress.openAtTop=true;saveProgress();location.href=target.file}
function togglePin(id){if(isReadOnly()||!id)return;const pins=new Set(progress.pins||[]);if(pins.has(id))pins.delete(id);else pins.add(id);progress.pins=[...pins];saveProgress();updateOneQuestion(id)}
function recordStats(q,correct,answered){if(!answered)return;progress.stats=progress.stats||{};progress.stats[q.id]={answered:true,correct:Boolean(correct),updatedAt:Date.now()}}
function answerQuestion(id,key){const q=questionMap[id];if(!q||isReadOnly())return;if(progress.mode==="wrong"&&!(progress.wrongIds||[]).includes(id))return;let s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};if(progress.mode==="exam"){
if(!isExamOpen())return;if(q.type==="multi"){const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set]}else s.selectedKeys=[key];s.answered=s.selectedKeys.length>0;s.locked=false;s.correct=null;progress.currentId=id;progress.currentFile=PAGE_FILE;progress.answers[id]=s;saveProgress();updateOneQuestion(id);return}
if(s.locked)return;if(q.type==="multi"){
const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set];const correct=new Set(correctKeys(q));const wrong=s.selectedKeys.some(k=>!correct.has(k));const complete=[...correct].every(k=>set.has(k))&&set.size===correct.size;if(wrong||complete){s.answered=true;s.locked=true;s.correct=!wrong&&complete;recordStats(q,s.correct,true)}else{s.answered=false;s.correct=null;s.locked=false}
}else{s.selectedKeys=[key];s.answered=true;s.locked=true;s.correct=answersMatch(q,s);recordStats(q,s.correct,true)}progress.currentId=id;progress.currentFile=PAGE_FILE;progress.answers[id]=s;saveProgress();updateOneQuestion(id)}
function submitFill(id){const q=questionMap[id];if(!q||isReadOnly()||progress.mode==="exam")return;const fields=[...document.querySelectorAll(`input[data-qid="${id}"][data-blank]`)];const vals=fields.map(n=>n.value.slice(0,20));if(!vals.some(v=>v.trim())){alert("请先填写答案。");return}const s={blanks:vals,selectedKeys:[],answered:true,locked:true};const correctAnswers=Array.isArray(q.blanks)?q.blanks:[];s.correct=correctAnswers.length===vals.length&&correctAnswers.every((v,i)=>normalizeText(v)===normalizeText(vals[i]));progress.answers[id]=s;recordStats(q,s.correct,true);saveProgress();updateOneQuestion(id)}
function exitToHome(){checkpointTimer();progress.active=true;progress.timerRunning=false;progress.timerStartedAt=null;saveProgress();if(examSession&&progress.mode==="exam"){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession)}location.href="index.html"}
const ALL_META_MAP=Object.fromEntries(META.map(m=>[m.id,m]));
function submitExam(){if(!isExamOpen())return;if(!confirm("确定交卷吗？未作答的题目将按错误计入，本次考试将停止计时。"))return;const now=Date.now();progress.elapsedMs=getElapsed();progress.timerRunning=false;progress.timerStartedAt=null;examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession);const states={};const wrongIds=[];let total=0,correctCount=0;for(const m of META){const q=questionMap[m.id]||null;const answer=progress.answers[m.id]||{selectedKeys:[],blanks:[],answered:false,locked:false};const selected=Array.isArray(answer.selectedKeys)?answer.selectedKeys.slice():[];let hasAnswer=selected.length>0;if(m.type==="fill"){const blanks=Array.isArray(answer.blanks)?answer.blanks:[];hasAnswer=blanks.some(v=>String(v||"").trim()!=="")}
let correct=false;if(q){correct=hasAnswer&&answersMatch(q,answer)}else{const base=answer.correct;correct=hasAnswer&&base===true}
// This page includes only 50 questions, so exam submission must use source-independent answer snapshots captured at each page.
const snap=examSession.answerSnapshot&&examSession.answerSnapshot[m.id];if(snap){hasAnswer=!!snap.answered;correct=hasAnswer&&snap.correct===true;}
// The home page has no access to the page-specific current state; store all answers and their correctness in the shared progress object.
const allAnswer=progress.answers[m.id]||{};const answered=Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.length>0:(Array.isArray(allAnswer.blanks)&&allAnswer.blanks.some(v=>String(v||"").trim()!==""));
let finalCorrect=false;const ak=ANSWER_KEYS[m.id];if(answered&&ak){if(ak.type==="choice"||ak.type==="judgment")finalCorrect=allAnswer.selectedKeys?.length===1&&allAnswer.selectedKeys[0]===ak.answer;else if(ak.type==="multi"){const a=[...(allAnswer.selectedKeys||[])].sort(),b=[...(ak.answer||[])].sort();finalCorrect=a.length===b.length&&a.every((v,i)=>v===b[i])}else if(ak.type==="fill"){const norm=v=>String(v??"").normalize("NFKC").trim().toLowerCase();finalCorrect=(ak.blanks||[]).length===(allAnswer.blanks||[]).length&&(ak.blanks||[]).every((v,i)=>norm(v)==norm(allAnswer.blanks[i]))}}
states[m.id]={id:m.id,type:m.type,number:m.number,file:m.file,selectedKeys:Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.slice():[],blanks:Array.isArray(allAnswer.blanks)?allAnswer.blanks.slice():[],answered,correct:finalCorrect};total++;if(finalCorrect)correctCount++;else wrongIds.push(m.id);
if(answered)progress.stats[m.id]={answered:true,correct:finalCorrect,updatedAt:now};}
const result={schema:2,resultId:"result-"+now.toString(36),mode:"考试模式",testAt:now,elapsedMs:progress.elapsedMs,total,correct:correctCount,accuracy:total?correctCount/total:0,wrongIds,questionStates:states,questionOrders:examSession.questionOrders||{},optionOrders:examSession.optionOrders||{},pins:(progress.pins||[]).slice()};writeKey(STORAGE_KEYS.result,result);progress.active=false;progress.mode=null;progress.answers={};progress.pins=result.pins.slice();progress.currentFile=null;progress.currentId=null;progress.timerRunning=false;progress.timerStartedAt=null;progress.completed=true;saveProgress();removeKey(STORAGE_KEYS.exam);location.href="result.html"}
function renderAll(){currentOrder=idsForPage();renderMode();renderQuestionList();renderQuestionNavigation();renderPinList();renderTimer();updatePager()}
function init(){progress=readProgress();examSession=readKey(STORAGE_KEYS.exam);lastResult=readKey(STORAGE_KEYS.result);const marker=readKey(STORAGE_KEYS.marker);if(location.protocol==="file:"){showStorageWarning("当前通过 file:// 直接打开。浏览器可能隔离不同 HTML 文件的本地存储；若跨页进度无法共享，请改用同源静态站点，或通过首页导入/导出备份。")}
if(!safeStorage)showStorageWarning("浏览器本地存储不可用，进度可能无法保存。请检查浏览器权限后再开始。")
if(!progress.active){const stats=progress.stats||{};const route=routeByFile(PAGE_FILE);progress={...baseProgress(),active:true,mode:"practice",answers:{},stats,pins:[],currentFile:PAGE_FILE,currentId:route?.ids?.[0]||null,elapsedMs:0,timerRunning:true,timerStartedAt:Date.now(),wrongIds:[],createdAt:Date.now()};saveProgress()}
if(progress.mode==="exam"&&!examSession){showStorageWarning("没有读取到当前考试会话，已禁止自动开始或重新打乱。请返回首页并导入之前导出的进度，或在同源静态站点中重新进入考试。")}
if(progress.mode==="review")lastResult=readKey(STORAGE_KEYS.result);
if(progress.mode==="wrong"){const routes=activeRoutes();if(!routes.length){alert("暂无数据：没有可复习的错题。");location.href="index.html";return}if(!routes.some(r=>r.file===PAGE_FILE)){progress.currentFile=routes[0].file;progress.currentId=routes[0].ids.find(id=>(progress.wrongIds||[]).includes(id))||routes[0].ids[0];saveProgress();location.replace(progress.currentFile);return}}
if(progress.mode!=="wrong"&&progress.mode!=="exam"&&progress.mode!=="review"&&progress.mode!=="practice"){progress.mode="practice";progress.currentFile=PAGE_FILE;progress.currentId=PAGE_QUESTIONS[0]?.id||null;saveProgress()}
if(progress.currentFile!==PAGE_FILE){progress.currentFile=PAGE_FILE;if(!progress.currentId||!questionMap[progress.currentId])progress.currentId=idsForPage()[0]||null;saveProgress()}
const startAtPageTop=progress.openAtTop===true;if(startAtPageTop){progress.openAtTop=false;saveProgress()}const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(!startAtPageTop&&progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});else if(startAtPageTop)requestAnimationFrame(()=>window.scrollTo({top:0,behavior:"auto"}));if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
document.addEventListener("input",e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||!input.dataset.qid||input.dataset.blank===undefined||isReadOnly())return;const id=input.dataset.qid;const idx=Number(input.dataset.blank);const s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};s.blanks=s.blanks||[];s.blanks[idx]=input.value.slice(0,20);progress.currentId=id;progress.currentFile=PAGE_FILE;progress.answers[id]=s;});
function selfTestMapping(){const testOrder=["B","C","D","A"];const map={};testOrder.forEach((k,i)=>map[k]=String.fromCharCode(65+i));if(map.A!=="D")throw new Error("选项映射自测失败");const expected=["A","C"].map(k=>map[k]).sort().join(",");if(expected!=="B,D")throw new Error("多选题映射自测失败")}
try{selfTestMapping()}catch(e){showStorageWarning("答案映射检查未通过，已阻止继续作答。请返回首页重新进入考试。");}
init();
</script></body></html>
