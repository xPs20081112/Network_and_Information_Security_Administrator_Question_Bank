const TYPE_COUNTS={"choice":400,"judgment":100};
const RESULT_KEY='last_result_v2';
const $=id=>document.getElementById(id);
function readResult(){try{return JSON.parse(localStorage.getItem(RESULT_KEY)||'null')}catch(e){return null}}
function pct(c,t){return t?Math.min(100,Math.max(0,c/t*100)).toFixed(1)+'%':'暂无'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtElapsed(s){s=Math.max(0,Math.floor(Number(s)||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),v=s%60;return [h,m,v].map(n=>String(n).padStart(2,'0')).join(':')}
function fileForId(id){const [type,raw]=id.split(':');const n=Number(raw),start=Math.floor((n-1)/50)*50+1,end=Math.min(start+49,TYPE_COUNTS[type]||50);return `${type}_${start}-${end}.html`}
let currentResult=null;
function render(){const r=readResult();currentResult=r;
 if(!r||!r.items){$('summaryContent').innerHTML='<div class="no-result"><h2>暂无考试记录</h2><p>完成一次考试模式并交卷后，这里会显示最近一次测验详情。</p><a href="index.html">返回首页</a></div>';$('exportWrap').classList.add('hidden');$('numberGroups').innerHTML='<div class="no-result">暂无交卷记录</div>';$('numberCount').textContent='0 题';return;}
 $('exportWrap').classList.remove('hidden');
 const stats=r.perType||{};const rows=[['单选题','choice'],['判断题','judgment']].filter(([label,type])=>(stats[type]&&stats[type].total)||false).map(([label,type])=>`<div class="type-row"><strong>${label}</strong><span>答对 ${stats[type].correct||0} / ${stats[type].total||0} · 正确率 ${pct(stats[type].correct||0,stats[type].total||0)}</span></div>`).join('');
 $('summaryContent').innerHTML=`<div class="summary-head"><div><div class="summary-label">LATEST SUBMISSION · 最近一次考试</div><h2>本次测验</h2></div><span class="status-pill">考试模式</span></div><div class="result-kpis"><div class="kpi"><div class="kpi-label">测验用时</div><div class="kpi-value">${fmtElapsed(r.elapsedSec)}</div></div><div class="kpi"><div class="kpi-label">测试时间</div><div class="kpi-value">${esc(r.testTime||'未提供')}</div></div><div class="kpi"><div class="kpi-label">测验类型</div><div class="kpi-value">考试模式</div></div><div class="kpi"><div class="kpi-label">总体正确率</div><div class="kpi-value">${pct(r.correct||0,r.total||0)}</div><div class="stat-foot">答对 ${r.correct||0} / ${r.total||0} 题</div></div></div><div class="type-stats">${rows||'<div class="empty-note">暂无题型统计</div>'}</div>`;
 const groups=[['choice','单选题'],['judgment','判断题']];let html='';let total=0;
 for(const [type,label] of groups){const items=Object.entries(r.items).filter(([id])=>id.startsWith(type+':')).sort((a,b)=>Number(a[0].split(':')[1])-Number(b[0].split(':')[1]));if(!items.length)continue;total+=items.length;html+=`<section class="type-group"><h3>${label}<small>${items.length} 题</small></h3><div class="number-list">${items.map(([id,item])=>{const n=id.split(':')[1], cls=[item.correct?'correct':'wrong',item.pinned?'pinned':''].filter(Boolean).join(' '), href=`${fileForId(id)}?id=${encodeURIComponent(id)}#q-${id.replace(':','-')}`;return `<a class="num-chip ${cls}" href="${href}" title="${item.correct?'答对':'答错'}：查看解析">${n}</a>`}).join('')}</div></section>`}
 $('numberGroups').innerHTML=html||'<div class="no-result">暂无交卷记录</div>';$('numberCount').textContent=`${total} 题`;
}
function wrapLines(ctx,text,maxWidth){const chars=Array.from(String(text));const lines=[];let line='';for(const ch of chars){if(ctx.measureText(line+ch).width>maxWidth&&line){lines.push(line);line=ch}else line+=ch}if(line||!lines.length)lines.push(line);return lines}
function drawRounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function exportPng(){const r=currentResult;if(!r||!r.items){alert('暂无可导出的交卷记录。');return;}
 const W=1080,pad=62,inner=W-pad*2,canvas=document.createElement('canvas');let ctx=canvas.getContext('2d');const stats=r.perType||{};const lines=[];
 ctx.font='28px system-ui, sans-serif';lines.push({text:'本次测验',font:'bold 36px system-ui, sans-serif',color:'#2c2050',gap:52});
 const add=(label,value)=>lines.push({text:label+'：'+value,font:'24px system-ui, sans-serif',color:'#332651',gap:42});
 add('测验用时',fmtElapsed(r.elapsedSec));add('测试时间',r.testTime||'未提供');add('测验类型','考试模式');add('总体正确率',pct(r.correct||0,r.total||0)+`（答对 ${r.correct||0} / ${r.total||0} 题）`);
 lines.push({text:'题型统计',font:'bold 26px system-ui, sans-serif',color:'#4f3b88',gap:46});
 for(const [label,type] of [['单选题','choice'],['判断题','judgment']])if(stats[type]&&stats[type].total){add(label,`答对 ${stats[type].correct||0} / ${stats[type].total} · 正确率 ${pct(stats[type].correct||0,stats[type].total)}`)}
 let H=pad*2;for(const l of lines){ctx.font=l.font;const wrapped=wrapLines(ctx,l.text,inner);H+=Math.max(1,wrapped.length)*34+l.gap-28}H+=pad*2;
 canvas.width=W;canvas.height=H;ctx=canvas.getContext('2d');ctx.fillStyle='#f6f1ff';ctx.fillRect(0,0,W,H);drawRounded(ctx,18,18,W-36,H-36,28);ctx.fillStyle='#fcfaff';ctx.fill();let y=pad;
 for(const l of lines){ctx.font=l.font;ctx.fillStyle=l.color;const wrapped=wrapLines(ctx,l.text,inner);for(const line of wrapped){ctx.fillText(line,pad,y);y+=34}y+=l.gap-28}
 ctx.fillStyle='#8273a9';ctx.font='18px system-ui, sans-serif';ctx.fillText('网络与信息安全管理员 · 离线刷题',pad,H-pad/2);
 const a=document.createElement('a');const d=new Date(),stamp=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');a.download=`做题详情_${stamp}.png`;a.href=canvas.toDataURL('image/png');a.click();}
$('exportPng').addEventListener('click',exportPng);render();
</script></body></html>
