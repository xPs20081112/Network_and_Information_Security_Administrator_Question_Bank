const TYPE_ORDER=["choice","multi","judgment","fill"];
const TYPE_NAMES={choice:"选择题",multi:"多选题",judgment:"判断题",fill:"填空题"};
const $=id=>document.getElementById(id);
function parse(v){try{return v?JSON.parse(v):null}catch(e){return null}}
function getLast(){try{return parse(localStorage.getItem("last_result_v2"))}catch(e){return null}}
function getProgress(){try{return parse(localStorage.getItem("quiz_progress_v2"))||{stats:{}}}catch(e){return {stats:{}}}}
function writeProgress(p){try{localStorage.setItem("quiz_progress_v2",JSON.stringify(p));return true}catch(e){alert("无法保存回看定位信息，请检查浏览器存储权限。");return false}}
function escDate(ms){const d=new Date(ms);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function fmtTime(ms){let s=Math.floor(Math.max(0,ms||0)/1000);const h=String(Math.floor(s/3600)).padStart(2,"0");s%=3600;return `${h}:${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function percent(n,d){if(!d)return "暂无";const v=Math.max(0,Math.min(100,Math.round(n/d*1000)/10));return (Number.isInteger(v)?String(v):v.toFixed(1))+"%"}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function render(){const result=getLast();if(!result){$("resultSummary").classList.add("hidden");$("resultEmpty").classList.remove("hidden");$("resultIndex").textContent="";return}$("resultSummary").classList.remove("hidden");$("resultEmpty").classList.add("hidden");$("elapsedMetric").textContent=fmtTime(result.elapsedMs);$("timeMetric").textContent=escDate(result.testAt);$("modeMetric").textContent=result.mode||"考试模式";const total=result.total||META.length;const correct=result.correct||0;$("accuracyMetric").textContent=percent(correct,total);$("scoreMeta").textContent=`答对 ${correct} / ${total} 题 · 未作答按错误计入`;const wrap=$("typeStats");wrap.textContent="";for(const type of TYPE_ORDER){const ms=META.filter(m=>m.type===type);if(!ms.length)continue;const states=result.questionStates||{};let c=0,answered=0;for(const m of ms){const s=states[m.id];if(s&&s.answered)answered++;if(s&&s.correct)c++}const card=el("section","type-stat");card.append(el("h3","",TYPE_NAMES[type]),el("div","big",percent(c,ms.length)),el("p","",`答对 ${c} / ${ms.length} 题`),el("p","",`已作答 ${answered} 题`));wrap.append(card)}
const idx=$("resultIndex");idx.textContent="";const states=result.questionStates||{};for(const type of TYPE_ORDER){const group=META.filter(m=>m.type===type);if(!group.length)continue;const section=el("section","index-section");section.append(el("h3","",TYPE_NAMES[type]));const grid=el("div","result-numbers");for(const m of group){const s=states[m.id]||{};const b=el("button","result-number "+(s.correct?"correct":"incorrect")+((result.pins||[]).includes(m.id)?" pinned":""),String(m.number));b.type="button";b.dataset.id=m.id;b.title=`${TYPE_NAMES[type]} 第${m.number}题 · ${s.correct?"答对": "答错"}`;grid.append(b)}section.append(grid);idx.append(section)}}
function gotoQuestion(id){const m=META.find(x=>x.id===id);if(!m)return;const result=getLast();if(!result){alert("暂无进度");return}let p=getProgress();p=Object.assign({schema:2,stats:{},pins:[]},p);p.active=true;p.mode="review";p.answers={};p.pins=(result.pins||[]).slice();p.currentFile=m.file;p.currentId=id;p.elapsedMs=result.elapsedMs||0;p.timerRunning=false;p.timerStartedAt=null;p.wrongIds=(result.wrongIds||[]).slice();p.completed=true;p.reviewResultId=result.resultId;writeProgress(p);location.href=m.file}
function drawWrapped(ctx,text,x,y,maxWidth,lineHeight){const str=String(text??"");let line="";for(const ch of str){if(ch==="\n"){ctx.fillText(line,x,y);y+=lineHeight;line="";continue}const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=ch}else line=test}if(line){ctx.fillText(line,x,y);y+=lineHeight}return y}
function exportPNG(){const r=getLast();if(!r){alert("暂无测验记录可导出。");return}const canvas=document.createElement("canvas");const ctx=canvas.getContext("2d");if(!ctx){alert("当前浏览器不支持 Canvas 导出。");return}const width=1100,pad=54,max=width-pad*2;const statTypes=TYPE_ORDER.filter(t=>META.some(m=>m.type===t));const height=540+statTypes.length*140;canvas.width=width;canvas.height=height;ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,width,height);ctx.fillStyle="#2A2145";ctx.font="700 38px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillText("做题详情",pad,72);ctx.font="500 18px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillStyle="#756F86";ctx.fillText("网络与信息安全管理员",pad,108);ctx.strokeStyle="#E5E1EF";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,132);ctx.lineTo(width-pad,132);ctx.stroke();let y=178;const metrics=[["测验用时",fmtTime(r.elapsedMs)],["测试时间",escDate(r.testAt)],["测验类型",r.mode||"考试模式"],["总体正确率",percent(r.correct||0,r.total||META.length)]];const colGap=22,colW=(max-colGap)/2,rowH=82;for(let i=0;i<metrics.length;i++){const col=i%2,row=Math.floor(i/2);const x=pad+col*(colW+colGap),yy=y+row*(rowH+14);ctx.fillStyle="#FBFAFE";ctx.strokeStyle="#E5E1EF";roundRect(ctx,x,yy,colW,rowH,13,true,true);ctx.fillStyle="#756F86";ctx.font="600 16px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillText(metrics[i][0],x+17,yy+27);ctx.fillStyle="#28223A";ctx.font="700 25px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillText(metrics[i][1],x+17,yy+60)}y+=2*(rowH+14)+36;ctx.fillStyle="#2A2145";ctx.font="700 24px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillText("题型统计",pad,y);y+=25;const states=r.questionStates||{};for(const type of statTypes){const group=META.filter(m=>m.type===type);let c=0,a=0;for(const m of group){const s=states[m.id];if(s?.correct)c++;if(s?.answered)a++}y+=18;ctx.fillStyle="#F8F6FD";ctx.strokeStyle="#E5E1EF";roundRect(ctx,pad,y,max,94,13,true,true);ctx.fillStyle="#55447F";ctx.font="700 19px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillText(TYPE_NAMES[type],pad+18,y+31);ctx.fillStyle="#28223A";ctx.font="700 27px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillText(percent(c,group.length),pad+18,y+67);ctx.fillStyle="#756F86";ctx.font="500 16px system-ui,-apple-system,'Microsoft YaHei',sans-serif";ctx.fillText(`答对 ${c} / ${group.length} 题 · 已作答 ${a} 题`,pad+210,y+59);y+=94}
function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke()}
const date=new Date(r.testAt);const stamp=`${date.getFullYear()}${String(date.getMonth()+1).padStart(2,"0")}${String(date.getDate()).padStart(2,"0")}_${String(date.getHours()).padStart(2,"0")}${String(date.getMinutes()).padStart(2,"0")}`;canvas.toBlob(blob=>{if(!blob){try{const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=`做题详情_${stamp}.png`;a.click()}catch(e){alert("图片导出失败。")};return}const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`做题详情_${stamp}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},"image/png")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b&&b.classList.contains("result-number")){gotoQuestion(b.dataset.id);return}const action=e.target.closest("[data-action]");if(action&&action.dataset.action==="export-png")exportPNG()});
render();
