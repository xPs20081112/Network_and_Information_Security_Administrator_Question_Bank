故障诊断可以使用多种工具，下列不属于诊断工具的是 (　　)","images":[],"options":{"A":"路由器诊断命令","B":"网络管理工具","C":"故障诊断工具","D":"测线仪"},"answer":"D","analysis":"测线仪主要用于检测网线连通性，不是路由器故障诊断工具；路由器诊断命令、网络管理工具、故障诊断工具都可用于诊断路由器故障","source":"路由器故障诊断课程","difficulty":"中等"},{"id":"choice-377","type":"choice","globalNumber":377,"stem":"以下对于协议分析仪的说法不正确的一项是 (　　)","images":[],"options":{"A":"协议分析仪是对应七层模型中的第七层设计的","B":"协议分析仪所具有的对数据包捕捉和解码能力使得它在解决复杂，罕见的问题时非常有效","C":"协议分析仪是一种复杂的测试工具，它要求操作人员具有较高的技术水平","D":"协议分析仪是一种监视数据通信系统中的数据流，检验数据交换是否正确地按照协议的规定进行的专用测试工具"},"answer":"A","analysis":"协议分析仪可针对网络协议栈各层设计，并非仅对应第七层；B、C、D 选项对协议分析仪功能和特点的描述正确","source":"网络测试技术课程","difficulty":"中等"},{"id":"choice-378","type":"choice","globalNumber":378,"stem":"以下 (　　) 协议不属于网络管理协议","images":[],"options":{"A":"SNMP","B":"CMIS/CMIP","C":"CMOT","D":"ISDN"},"answer":"D","analysis":"ISDN 是综合业务数字网，是一种通信网络标准，不属于网络管理协议；SNMP 是简单网络管理协议，CMIS/CMIP 是公共管理信息服务 / 公共管理信息协议，CMOT 是基于 TCP/IP 的 CMIS 服务和协议，都用于网络管理","source":"网络管理协议课程","difficulty":"中等"},{"id":"choice-379","type":"choice","globalNumber":379,"stem":"黑客入侵攻击的一般过程的正确顺序是 (　　)：①收集信息；②确定目标；③隐藏痕迹；④实施攻击","images":[],"options":{"A":"①②③④","B":"②①③④","C":"③④①②","D":"②④③①"},"answer":"B","analysis":"黑客通常先确定目标，再收集目标相关信息，然后实施攻击，最后隐藏痕迹，保证攻击过程的隐蔽性和持续性","source":"网络安全防御课程","difficulty":"中等"},{"id":"choice-380","type":"choice","globalNumber":380,"stem":"网络安全是在网络环境中对信息提供安全保护，下列不属于保护对象的是 (　　)","images":[],"options":{"A":"信息载体","B":"信息的处理、传输","C":"信息的存储、访问","D":"信息的涵义"},"answer":"D","analysis":"网络安全主要保护信息载体以及信息处理、传输、存储、访问等过程的安全，信息的涵义并非直接保护对象","source":"网络安全基础课程","difficulty":"中等"},{"id":"choice-381","type":"choice","globalNumber":381,"stem":"以下不属于木马入侵的常见方法是 (　　)","images":[],"options":{"A":"捆绑欺骗","B":"邮件冒名欺骗","C":"危险下载","D":"文件感染"},"answer":"D","analysis":"木马入侵常见方法有捆绑欺骗、邮件冒名欺骗、危险下载等。文件感染是病毒的一种感染方式，并非木马入侵的常见方法","source":"网络安全基础","difficulty":"中等"},{"id":"choice-382","type":"choice","globalNumber":382,"stem":"某软件在设计时，有三种用户访问模式，分别是仅管理员可访问、所有合法用户可访问和允许匿名访问采用这三种访问模式时，攻击面最高的是 (　　)","images":[],"options":{"A":"仅管理员可访问","B":"所有合法用户可访问","C":"允许匿名","D":"三种方式一样"},"answer":"C","analysis":"允许匿名访问意味着任何用户无需认证即可访问软件，相比仅管理员可访问和所有合法用户可访问模式，其攻击面最大，攻击者更容易尝试入侵","source":"网络安全基础","difficulty":"中等"},{"id":"choice-383","type":"choice","globalNumber":383,"stem":"计算机系统的鉴别不包括 (　　)","images":[],"options":{"A":"用户标识认证","B":"传输原发点的鉴别","C":"内容鉴别及特征检测","D":"版本鉴别"},"answer":"D","analysis":"计算机系统鉴别主要包括用户标识认证、传输原发点鉴别、内容鉴别及特征检测等。版本鉴别不属于计算机系统鉴别范畴","source":"网络安全基础","difficulty":"中等"},{"id":"choice-384","type":"choice","globalNumber":384,"stem":"以下不属于 DOS 攻击的是 (　　)","images":[],"options":{"A":"死亡之 PING","B":"SYN Flood 攻击","C":"Land 攻击","D":"勒索病毒攻击"},"answer":"D","analysis":"死亡之 PING、SYN Flood 攻击、Land 攻击都属于拒绝服务（DOS）攻击，通过消耗系统资源使服务瘫痪。勒索病毒攻击主要目的是加密文件勒索赎金，不属于 DOS 攻击","source":"网络安全基础","difficulty":"中等"},{"id":"choice-385","type":"choice","globalNumber":385,"stem":"使网络服务器中充斥着大量要求回复的信息，消耗带宽，导致网络或系统停止正常服务，这属于 (　　) 攻击","images":[],"options":{"A":"木马","B":"远程调用","C":"拒绝服务","D":"蠕虫"},"answer":"C","analysis":"拒绝服务攻击通过向目标服务器发送大量请求，消耗其资源，使网络或系统无法正常提供服务，符合题干描述","source":"网络安全基础","difficulty":"中等"},{"id":"choice-386","type":"choice","globalNumber":386,"stem":"在 PPDRR 安全模式中，(　　) 是属于安全事件发生后的补救措施","images":[],"options":{"A":"保护","B":"恢复","C":"响应","D":"检测"},"answer":"B","analysis":"PPDRR 安全模式包括保护、检测、响应、恢复等环节。恢复是在安全事件发生后，对系统进行修复和还原，属于补救措施","source":"网络安全基础","difficulty":"中等"},{"id":"choice-387","type":"choice","globalNumber":387,"stem":"通过 (　　) 建立完善的访问控制策略，及时发现网络遭受攻击情况并加以追踪和防范，避免对网络造成更大损失","images":[],"options":{"A":"动态站点监控","B":"实施存取控制","C":"安全管理检测","D":"完善服务器系统安全性能"},"answer":"A","analysis":"动态站点监控可以实时监测网站活动，建立访问控制策略并及时发现和处理攻击，减少损失。实施存取控制、安全管理检测、完善服务器系统安全性能虽也重要，但不符合 “及时发现攻击并追踪防范” 这一描述","source":"网络安全基础","difficulty":"中等"},{"id":"choice-388","type":"choice","globalNumber":388,"stem":"针对口令攻击，下面可有效抵御口令攻击的说法错误的是 (　　)","images":[],"options":{"A":"哈希加密算法要比非对称加密算法更安全","B":"使用 client 端验证码","C":"采用 server 端验证码","D":"使用隐藏 token"},"answer":"B","analysis":"哈希加密算法用于口令加密存储更安全；server 端验证码、隐藏 token 可增强口令安全性。而使用 client 端验证码存在安全风险，易被攻击者获取，不能有效抵御口令攻击","source":"网络安全基础","difficulty":"中等"},{"id":"choice-389","type":"choice","globalNumber":389,"stem":"下列哪个是自动化 SQL 注入工具 (　　)","images":[],"options":{"A":"nmap","B":"nessus","C":"msf","D":"sqlmap"},"answer":"D","analysis":"nmap 是网络扫描工具；nessus 是漏洞扫描工具；msf 是渗透测试框架；sqlmap 是专门用于自动化 SQL 注入检测和利用的工具","source":"网络安全基础","difficulty":"中等"},{"id":"choice-390","type":"choice","globalNumber":390,"stem":"数据冗余是指 (　　)","images":[],"options":{"A":"数据和数据之间没有联系","B":"数据有丢失","C":"数据量太大","D":"存在重复的数据"},"answer":"D","analysis":"数据冗余的定义就是存在重复的数据，会浪费存储空间，可能导致数据不一致等问题","source":"数据库基础","difficulty":"简单"},{"id":"choice-391","type":"choice","globalNumber":391,"stem":"Ghost 对系统进行备份时，可以选择分区备份和 (　　)","images":[],"options":{"A":"整盘备份","B":"增量备份","C":"自定义备份","D":"多区备份"},"answer":"A","analysis":"Ghost 可以对系统进行分区备份和整盘备份，用于系统数据的备份和恢复","source":"系统维护基础","difficulty":"简单"},{"id":"choice-392","type":"choice","globalNumber":392,"stem":"以下哪一个参数表示恢复点目标 (　　)","images":[],"options":{"A":"RPO","B":"RTO","C":"RYO","D":"RSO"},"answer":"A","analysis":"RPO（Recovery Point Objective）表示恢复点目标，指灾难发生后，系统和数据必须恢复到的时间点要求；RTO（Recovery Time Objective）表示恢复时间目标","source":"数据备份与恢复基础","difficulty":"中等"},{"id":"choice-393","type":"choice","globalNumber":393,"stem":"黑客在 windows 系统中利用命令提示符创建隐藏账号的命令是 (　　)","images":[],"options":{"A":"net user hack 123456 /add","B":"net user hack$ 123456 /add","C":"net user $hack 123456 /add","D":"net user hack123456 /add"},"answer":"B","analysis":"在 Windows 系统中，在用户名后加 \"\"可创建隐藏账号，netuserhack 123456 /add 是创建隐藏账号的命令","source":"网络安全基础","difficulty":"中等"},{"id":"choice-394","type":"choice","globalNumber":394,"stem":"关于文件型病毒，下面叙述正确的是 (　　)","images":[],"options":{"A":"感染磁盘的引导记录","B":"寄生在磁盘引导区或主引导区","C":"感染 COM 和 EXE 等可执行文件","D":"Flip 病毒属于文件型病毒"},"answer":"C","analysis":"文件型病毒主要感染 COM 和 EXE 等可执行文件；感染磁盘引导记录、寄生在磁盘引导区或主引导区的是引导型病毒；Flip 病毒是引导型病毒","source":"网络安全基础","difficulty":"中等"},{"id":"choice-395","type":"choice","globalNumber":395,"stem":"保障 UNIX/Linux 系统帐号安全最为关键的措施是 (　　)","images":[],"options":{"A":"文件 /etc/passwd 和 /etc/group 必须有写保护","B":"删除 /etc/passwd 和 /etc/gmp","C":"设置足够强度的帐号密码","D":"设置足够强度的帐号密码"},"answer":"A","analysis":"/etc/passwd 和 /etc/group 文件存储用户和组的重要信息，对其设置写保护可防止非法修改，保障账号安全。删除相关文件会导致系统异常；设置强密码重要，但不是最关键措施","source":"UNIX/Linux 系统安全","difficulty":"中等"},{"id":"choice-396","type":"choice","globalNumber":396,"stem":"恶意代码通过多种方式传播就形成了 (　　)","images":[],"options":{"A":"木马","B":"网络蠕虫","C":"移动代码","D":"复合型病毒"},"answer":"D","analysis":"复合型病毒是指恶意代码通过多种方式传播，兼具多种病毒特性，如同时具备文件感染和网络传播能力","source":"网络安全基础","difficulty":"中等"},{"id":"choice-397","type":"choice","globalNumber":397,"stem":"下面不属于恶意代码攻击技术的是 (　　)","images":[],"options":{"A":"进程注入技术","B":"超级管理技术","C":"端口反向连接技术","D":"自动生产技术"},"answer":"D","analysis":"进程注入技术、端口反向连接技术常用于恶意代码攻击。“超级管理技术” 表述不准确，可能指获取超级用户权限相关技术，也与恶意代码攻击有关。而 “自动生产技术” 不属于恶意代码攻击技术","source":"网络安全基础","difficulty":"中等"},{"id":"choice-398","type":"choice","globalNumber":398,"stem":"下列叙述中正确的是 (　　)","images":[],"options":{"A":"计算机病毒只感染可执行文件","B":"计算机病毒只感染文本文件","C":"计算机病毒只能通过软件复制的方式进行传播","D":"计算机病毒可以通过读写磁盘或网络等方式进行传播"},"answer":"D","analysis":"计算机病毒可感染多种类型文件，包括可执行文件、文本文件等；传播途径有读写磁盘、网络、移动存储设备等多种方式，并非仅通过软件复制传播","source":"网络安全基础","difficulty":"中等"},{"id":"choice-399","type":"choice","globalNumber":399,"stem":"病毒感染文件时，常常会有一些不同于正常程序的行为，利用病毒的特有行为和特性检测病毒的方法被称为 (　　)","images":[],"options":{"A":"行为检测法","B":"校验和法","C":"主动防御法","D":"特征行为法"},"answer":"A","analysis":"行为检测法就是利用病毒感染文件时的特有行为和特性来检测病毒；校验和法是通过计算文件校验和判断文件是否被修改；主动防御法是一种综合性的安全防护理念；“特征行为法” 表述不准确","source":"网络安全基础","difficulty":"中等"},{"id":"choice-400","type":"choice","globalNumber":400,"stem":"以下描述的现象中，不属于计算机病毒的是 (　　)","images":[],"options":{"A":"破坏计算机的程序或数据","B":"windows 的 “控制面板” 窗口中无 “本地连接” 图标","C":"使网络阻塞不可用","D":"使得 CPU 一直处于 100% 使用率"},"answer":"B","analysis":"计算机病毒可能破坏程序或数据、使网络阻塞、导致 CPU 使用率过高。“控制面板” 中无 “本地连接” 图标可能是网络设置问题、驱动问题等，不一定是由计算机病毒引起","source":"网络安全基础","difficulty":"中等"},{"id":"judgment-001","type":"judgment","globalNumber":1,"stem":"装机过程中不要连接电源线，严禁带电插拔硬件，以免烧坏芯片或部件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在装机过程中，带电插拔硬件容易产生瞬间电流，可能会超出芯片或部件的承受范围，从而烧坏它们，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-002","type":"judgment","globalNumber":2,"stem":"数据库在计算机系统中不是以文件方式存储的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"数据库在计算机系统中通常是以文件的形式存储在磁盘等存储设备上的，如常见的关系型数据库会有数据文件、日志文件等，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-003","type":"judgment","globalNumber":3,"stem":"IEEE802.11b 工作在 5GHz 频段。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"IEEE802.11b 工作在 2.4GHz 频段，而不是 5GHz 频段，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-004","type":"judgment","globalNumber":4,"stem":"《数据安全法》适用于在中华人民共和国境内外开展数据处理活动及其安全监管。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"《数据安全法》适用于在中华人民共和国境内开展的数据处理活动及其安全监管，在境外处理境内数据的活动，有条件地适用本法，并非境内外所有活动都适用，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-005","type":"judgment","globalNumber":5,"stem":"任何组织或者个人经批准可以窃取他人加密保护的信息或者非法侵入他人的密码保障系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"窃取他人加密保护的信息或非法侵入他人密码保障系统属于违法行为，即使经过批准也不允许，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-006","type":"judgment","globalNumber":6,"stem":"OSI 参考模型的每一层都负责完成某些特定的通信任务，并只与紧邻的上层和下层进行数据的交换。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI 参考模型分层的目的就是让每一层专注于特定功能，各层之间主要与紧邻的上下层进行数据交互，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-007","type":"judgment","globalNumber":7,"stem":"双绞线既可以传输模拟信号，又可以传输数字信号。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"双绞线通过不同的编码方式可以传输模拟信号，如传统电话线路；也可以通过特定的数字编码传输数字信号，如以太网中的双绞线，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-008","type":"judgment","globalNumber":8,"stem":"光纤是一种可以传输电信号的网络传输介质。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"光纤是通过光信号来传输数据的，它不传输电信号，利用光在光纤中的全反射原理进行信息传输，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-009","type":"judgment","globalNumber":9,"stem":"操作系统在计算机系统中处于处理机和用户之间的位置。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"操作系统作为系统软件，管理计算机硬件资源，为用户提供操作界面，处于处理机和用户之间，起到承上启下的作用，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-010","type":"judgment","globalNumber":10,"stem":"UNIX 操作系统的文件系统是分级树型结构。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"UNIX 操作系统的文件系统采用分级树型结构，以根目录 “/” 为起点，方便文件的组织和管理，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-011","type":"judgment","globalNumber":11,"stem":"通常所说的 “病毒” 是指特制的具有破坏性的程序。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"计算机病毒是人为编制的、具有自我复制能力并能对计算机系统造成破坏的程序，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-012","type":"judgment","globalNumber":12,"stem":"一旦计算机染上恶意代码，就立即格式化磁盘。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"计算机染上恶意代码后，格式化磁盘是一种极端的处理方式，可能会导致重要数据丢失。通常应先尝试使用杀毒软件进行查杀等其他方式解决，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-013","type":"judgment","globalNumber":13,"stem":"恶意代码会造成计算机硬件，软件和数据的损坏。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"恶意代码具有多种危害，可破坏软件系统、篡改或删除数据，在某些情况下还可能影响硬件正常运行，如导致硬件过热等，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-014","type":"judgment","globalNumber":14,"stem":"木马程序的最大危害在于它对破坏软硬件系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"木马程序主要特点是隐藏自身，窃取用户信息，而不是直接破坏软硬件系统，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-015","type":"judgment","globalNumber":15,"stem":"防病毒的错误警告是对系统产生的问题进行报警。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"防病毒的错误警告可能是误报，并不一定是系统真的产生了问题，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-016","type":"judgment","globalNumber":16,"stem":"WWW 服务只能使用 TCP 端口 80。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"WWW 服务默认使用 TCP 端口 80，但也可以使用其他端口，通过配置服务器可以更改端口号，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-017","type":"judgment","globalNumber":17,"stem":"如果要使用电子邮件发送邮件时，收件人必须要有自己的邮政编码。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"使用电子邮件发送邮件时，不需要收件人的邮政编码，只需要正确的电子邮箱地址即可，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-018","type":"judgment","globalNumber":18,"stem":"静态的 IP 地址和 DHCP 服务器提供给 DHCP 客户端的永久租用的 IP 地址是一种方法。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"静态 IP 地址是手动配置且固定不变的；DHCP 服务器分配的 IP 地址是动态的，有租约期限，并非永久租用，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-019","type":"judgment","globalNumber":19,"stem":"DHCP 服务器分配 IP 地址的最大租期的时间可以是无限的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在实际配置中，DHCP 服务器分配 IP 地址的租期可根据需求设置，理论上最大租期时间可以设置为无限，但实际中很少这样设置，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-020","type":"judgment","globalNumber":20,"stem":"进行 LanFree 备份时，所有数据流将不通过局域网，不占用网络资源。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"LanFree 备份通过 SAN（存储区域网络）等技术实现数据备份，数据直接在存储设备之间传输，不经过局域网，避免占用局域网带宽等网络资源，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-021","type":"judgment","globalNumber":21,"stem":"计算机网络是计算机技术与通信技术结合的产物。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"计算机网络利用通信技术实现计算机之间的数据传输，同时依靠计算机技术对数据进行处理和管理，是两者结合的成果，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-022","type":"judgment","globalNumber":22,"stem":"TCP/IP 体系结构中，将计算机网络划分为应用层、传输层、网际层、网络接口层等 4 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"TCP/IP 体系结构从功能上分为这四个层次，各层分工协作实现网络通信，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-023","type":"judgment","globalNumber":23,"stem":"HDLC 协议是 OSI/RM 的数据链路层的协议。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"HDLC（高级数据链路控制）协议属于 OSI/RM（开放系统互连参考模型）的数据链路层协议，用于在数据链路层进行数据传输控制，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-024","type":"judgment","globalNumber":24,"stem":"SMTP 和 POP3 协议可以实现主机间电子邮件的发送和接收功能。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"SMTP（简单邮件传输协议）用于邮件的发送，POP3（邮局协议版本 3）用于邮件的接收，两者协同实现主机间电子邮件的收发，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-025","type":"judgment","globalNumber":25,"stem":"当网管员想要测试两台主机之间的网络是否连通时可以使用 ping 命令。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"ping 命令通过发送 ICMP（网际控制报文协议）回显请求报文来测试两台主机之间的网络连通性，是常用的网络测试工具，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-026","type":"judgment","globalNumber":26,"stem":"DNS 是域名服务器，它的功能是将 IP 地址翻译为域名。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"DNS 的主要功能是将域名解析为 IP 地址，方便用户通过域名访问网络资源，而不是将 IP 地址翻译为域名，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-027","type":"judgment","globalNumber":27,"stem":"OSI 参考模型是对发生在网络设备间的信息传输过程的一种理论化描述，并没有定义具体各层协议。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI 参考模型只是提供了一个概念性框架，描述了网络通信的层次结构和各层功能，没有定义具体的协议，具体协议由不同的标准组织和厂商制定，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-028","type":"judgment","globalNumber":28,"stem":"光纤的最大优点是不容易受电磁或无线电频率干扰，所以传输速率较高。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"光纤通过光信号传输数据，不受电磁或无线电频率干扰，能保证信号稳定传输，从而可以实现较高的传输速率，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-029","type":"judgment","globalNumber":29,"stem":"RIP 路由协议的工作原理是通过路由器将自己知道的路由信息，每隔 60s 广播给它的邻居，从而计算最佳路径。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"RIP 路由协议是通过路由器将自己知道的路由信息，每隔 30s 广播给它的邻居，然后根据跳数计算最佳路径，不是 60s，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-030","type":"judgment","globalNumber":30,"stem":"在覆盖范围方面，802.11n 采用智能天线技术，通过多组独立天线组成的天线阵列，可以动态调整波束，保证让 WLAN 用户接收到稳定的信号，并可以减少其它信号的干扰。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"802.11n 利用智能天线技术，通过天线阵列动态调整波束，提高信号覆盖范围和稳定性，减少干扰，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-031","type":"judgment","globalNumber":31,"stem":"Kali 是 Windows 系列的桌面级操作系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"Kali 是基于 Linux 的操作系统，主要用于渗透测试、安全评估等，不是 Windows 系列，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-032","type":"judgment","globalNumber":32,"stem":"混合型病毒，也称综合型、复合型病毒，同时具备引导型和文件型病毒的特征，即这种病毒既可以感染磁盘引导扇区，又可以感染可执行文件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"混合型病毒结合了引导型和文件型病毒的特点，能同时感染磁盘引导扇区和可执行文件，传播和破坏能力更强，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-033","type":"judgment","globalNumber":33,"stem":"卡巴斯基是杀毒软件的一种。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"卡巴斯基是知名的杀毒软件品牌，用于检测和清除计算机病毒、恶意软件等，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-034","type":"judgment","globalNumber":34,"stem":"工具软件提供一种工具以方便用户进行软件开发或者帮助解决一些应用中的普通问题。病毒防治软件是常见的工具软件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"工具软件能辅助用户完成特定任务，病毒防治软件帮助用户解决计算机安全问题，属于工具软件，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-035","type":"judgment","globalNumber":35,"stem":"在 Windows 资源管理器地址栏内，可以用ftp://ftp.abc.com的方式访问 FTP 服务器。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在 Windows 系统中，通过在资源管理器地址栏输入 FTP 服务器地址（格式为 ftp:// 服务器地址）可以访问 FTP 服务器，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-036","type":"judgment","globalNumber":36,"stem":"在 Linux 系统中可以使用 smbpasswd 命令管理 samba 用户账户，但是 smbpasswd 命令不能实现禁用 samba 用户账号。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"在 Linux 系统中，smbpasswd 命令不仅可以管理 samba 用户账户，还能通过特定参数实现禁用 samba 用户账号，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-037","type":"judgment","globalNumber":37,"stem":"如果要在一个由多网段组成的网络中使用 DHCP，可以多个网段使用同一个 DHCP 服务器。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"通过在 DHCP 服务器上进行合理配置，如设置不同的作用域，可以为多个网段分配 IP 地址，实现多个网段使用同一个 DHCP 服务器，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-038","type":"judgment","globalNumber":38,"stem":"为了确保安全，需要限制对 DNS 服务器进行域名递归查询的服务器或主机。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"限制对 DNS 服务器进行域名递归查询的服务器或主机，可以防止 DNS 缓存污染、拒绝服务攻击等安全问题，提高 DNS 服务器的安全性，所以该说法正确。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-039","type":"judgment","globalNumber":39,"stem":"当对共享文件夹进行复制或移动的操作时，复制或移动后的文件夹仍然是共享文件夹。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"对共享文件夹进行复制操作后，复制的文件夹默认不再是共享状态；移动到同一分区内共享属性可能保留，移动到不同分区一般也不再是共享文件夹，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-040","type":"judgment","globalNumber":40,"stem":"杀毒软件的功能与防火墙功能是一样的，两者只选择一个安装就可以。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"杀毒软件主要用于检测和清除病毒、恶意软件；防火墙主要用于控制网络访问，防止外部非法访问和内部非法外联，两者功能不同，不能只选其一，所以该说法错误。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-041","type":"judgment","globalNumber":41,"stem":"职业素养是纯实践层面的技能素养。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"职业素养包含多个方面，不仅有实践技能素养，还涵盖职业道德、职业意识、职业行为习惯等，并非单纯局限于实践层面。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-042","type":"judgment","globalNumber":42,"stem":"2001 年以前，中国没有一台机器能入围 TOP500，而到了 2010 年，“天河一号” 便横空出世，登上世界超算之巅。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在 2001 年前，中国确实没有计算机入围 TOP500，2010 年 “天河一号” 超级计算机问世，并在当时成为世界上运算速度最快的超级计算机，登上世界超算之巅。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-043","type":"judgment","globalNumber":43,"stem":"现代 OS 具有并发性和共享性，是由单道程序的引入而导致的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"现代操作系统的并发性和共享性是多道程序引入的结果。单道程序一次仅能执行一个程序，无法实现并发和共享；多道程序环境下，多个程序可同时驻留内存，实现资源共享和并发执行。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-044","type":"judgment","globalNumber":44,"stem":"计算机网络是计算机技术与通信技术结合的产物。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"计算机网络是通过通信线路和通信设备将地理位置不同的、功能独立的多个计算机系统连接起来，以功能完善的网络软件实现网络中资源共享和信息传递的系统，是计算机技术与通信技术融合的成果。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-045","type":"judgment","globalNumber":45,"stem":"开放系统互连参考模型（OSI/RM）将整个网络的功能划分成 7 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI/RM 从下到上依次为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层，共 7 个层次，用于规范网络通信功能。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-046","type":"judgment","globalNumber":46,"stem":"TCP/IP 体系结构中，将计算机网络划分为应用层、传输层、网际层、网络接口层等 4 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"TCP/IP 体系结构是当前应用最广泛的网络体系结构，包含应用层（负责应用程序接口）、传输层（提供端到端的可靠或不可靠传输）、网际层（处理网络层数据包的路由和转发）、网络接口层（负责与物理网络的交互）。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-047","type":"judgment","globalNumber":47,"stem":"利用 FTP 协议可以实现对主机的地址分配和配置工作。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"FTP（文件传输协议）主要用于在网络中进行文件的传输，如上传和下载；而主机地址分配和配置工作通常由 DHCP（动态主机配置协议）完成。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-048","type":"judgment","globalNumber":48,"stem":"路由器可以在网络层上实现多个网络之间的互连。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"路由器工作在网络层，它根据网络层的 IP 地址信息进行数据包的转发，能够连接不同的网络，实现网络之间的通信和数据交换。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-049","type":"judgment","globalNumber":49,"stem":"《网络安全法》的第一条讲的是国家网络安全战略。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"《网络安全法》第一条规定：“为了保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展，制定本法。” 并非阐述国家网络安全战略。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-050","type":"judgment","globalNumber":50,"stem":"在企业内部进行 IP 地址空间的规划时，用的都是私有地址空间。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"企业内部为节省公网 IP 地址资源、提高网络安全性和管理便利性，通常使用私有地址空间（如 10.0.0.0 - 10.255.255.255、172.16.0.0 - 172.31.255.255、192.168.0.0 - 192.168.255.255 等）进行 IP 地址规划。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-051","type":"judgment","globalNumber":51,"stem":"设置了交换机端口安全时，违反规则后的处理策略不包括 shutdown。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"交换机端口安全设置中，当违反端口安全规则（如连接的 MAC 地址数量超过限制等）时，常见的处理策略包括 shutdown（关闭端口）、restrict（限制连接并记录违规信息）、protect（丢弃违规流量但不关闭端口）等。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-052","type":"judgment","globalNumber":52,"stem":"拥塞就是要传送的用户数量超出了网络处理能力，导致网络服务性能下降的现象。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"网络拥塞是指在某段时间，若对网络中某一资源的需求超过了该资源所能提供的可用部分，网络性能就要变坏，即网络服务性能下降，常见表现如延迟增加、吞吐量降低等。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-053","type":"judgment","globalNumber":53,"stem":"RIP 是距离矢量路由协议的一种，使用跳数作为路径选择的依据。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"RIP（路由信息协议）属于距离矢量路由协议，它以跳数作为衡量路由好坏的标准，选择跳数最少的路径作为最佳路由。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-054","type":"judgment","globalNumber":54,"stem":"无线控制器 + 瘦 AP 的系统有非常强大的集中管理功能，所有的关于无线网络的配置都可以通过配置无线控制器统一完成。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在无线控制器 + 瘦 AP 的网络架构中，无线控制器负责对多个瘦 AP 进行集中管理和配置，包括无线网络的 SSID 设置、加密方式、信道选择等功能，瘦 AP 本身功能相对简单，主要负责无线信号的收发。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-055","type":"judgment","globalNumber":55,"stem":"入侵检测系统完全可以替换所有的防火墙来使用。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"入侵检测系统（IDS）和防火墙功能不同，不能相互完全替代。防火墙主要是基于访问控制策略对网络流量进行过滤，防止外部非法访问内部网络；入侵检测系统则侧重于对网络活动进行实时监测，发现入侵行为并报警，但它无法像防火墙那样阻止未经授权的访问。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-056","type":"judgment","globalNumber":56,"stem":"单击第一项，按住 Ctrl 键，然后再单击最后一个要选定的项，即可以选中多个连续的文件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"按住 Ctrl 键单击是用于选中多个不连续的文件；若要选中多个连续的文件，应单击第一项，然后按住 Shift 键，再单击最后一个要选定的项。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-057","type":"judgment","globalNumber":57,"stem":"Linux 系统管理员的权限和普通用户的权限相同。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"Linux 系统中，系统管理员（root 用户）拥有最高权限，可以对系统进行全面的管理和配置，如安装软件、修改系统文件等；普通用户权限受限，只能在自己的用户目录及被授权的范围内进行操作。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-058","type":"judgment","globalNumber":58,"stem":"Windows 10 中，进程是资源分配和处理机调度的基本单位。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"在 Windows 10 中，线程是处理机调度的基本单位，进程是资源分配的基本单位。线程比进程更轻量级，多个线程可以共享进程的资源，提高程序执行效率。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-059","type":"judgment","globalNumber":59,"stem":"为了保证计算机信息安全，通常使用口令，以使计算机只允许用户在输入正确的保密信息时进入系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"口令是一种简单有效的身份验证方式，用户输入正确的口令才能访问计算机系统，防止未经授权的访问，保障计算机信息安全。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-060","type":"judgment","globalNumber":60,"stem":"防火墙对内部网起到了很好的保护作用，并且它是坚不可摧的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"防火墙虽然能有效保护内部网络免受外部非法访问和攻击，但并非坚不可摧。黑客可以通过各种手段绕过防火墙的检测，如利用防火墙未检测到的协议漏洞、进行社会工程学攻击等。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-061","type":"judgment","globalNumber":61,"stem":"职业道德对从事医务工作的人们有重要意义，医生的道德比知识和技能更为可贵。医生除了应有高度的知识修养和技能培训外，还应该具有明确、坚定、正确的信念。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在医疗行业，职业道德至关重要。医生面对患者的生命健康，良好的职业道德能确保其正确运用知识和技能，全心全意为患者服务，所以医生不仅要有专业知识和技能，更要有正确的信念和高尚的道德。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-062","type":"judgment","globalNumber":62,"stem":"遵纪守法是爱岗敬业的思想指导，爱岗敬业是遵纪守法在职业生涯中个人能力素质的客观反映。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"遵纪守法为爱岗敬业提供了行为准则和规范，引导从业者在合法合规的框架内工作；爱岗敬业则体现了从业者在遵守法律法规的基础上，通过个人的工作态度和能力素质，积极履行工作职责，是遵纪守法在工作中的具体体现。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-063","type":"judgment","globalNumber":63,"stem":"诚实守信的具体要求是忠诚所属组织、维护组织信誉不保守组织秘密。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"诚实守信要求忠诚所属组织、维护组织信誉，但同时也要保守组织秘密。泄露组织秘密违背了诚实守信原则，会损害组织利益。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-064","type":"judgment","globalNumber":64,"stem":"装机过程中不要连接电源线，严禁带电插拔硬件，以免烧坏芯片或部件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在计算机装机过程中，带电插拔硬件可能会产生瞬间的电流冲击，极易损坏芯片或部件，所以装机时应先断开电源线，避免带电操作。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-065","type":"judgment","globalNumber":65,"stem":"遵循网络体系结构标准建成的网络被称为第三代网络。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"第一代网络以面向终端的计算机通信网为代表；第二代网络是基于分组交换技术的计算机网络；第三代网络则是遵循网络体系结构标准（如 OSI/RM、TCP/IP 等）建成的网络，实现了不同厂商设备的互联互通。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-066","type":"judgment","globalNumber":66,"stem":"开放系统互连参考模型（OSI/RM）将整个网络的功能划分成 7 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI/RM 从下到上依次为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层，共 7 个层次，用于规范网络通信功能。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-067","type":"judgment","globalNumber":67,"stem":"模块化交换机可以灵活扩展额外的端口模块，增加端口数量。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"模块化交换机的优势在于其具有可扩展性，通过添加不同类型和数量的端口模块，可以根据实际需求灵活增加端口数量，满足不同网络规模的需求。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-068","type":"judgment","globalNumber":68,"stem":"主机配置的 IP 地址与其他主机冲突时仍然可以正常上网。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"当主机配置的 IP 地址与其他主机冲突时，网络中的设备无法准确识别该主机，会导致网络通信异常，该主机不能正常上网，需要重新配置唯一的 IP 地址。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-069","type":"judgment","globalNumber":69,"stem":"根据《中华人民共和国民法典》的规定，因国际货物买卖合同和技术进出口合同争议提起诉讼或者申请仲裁的时效期间为两年。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"根据《中华人民共和国民法典》规定，因国际货物买卖合同和技术进出口合同争议提起诉讼或者申请仲裁的时效期间为四年，并非两年。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-070","type":"judgment","globalNumber":70,"stem":"《数据安全法》适用于在中华人民共和国境内外开展数据处理活动及其安全监管。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"《数据安全法》适用于在中华人民共和国境内开展的数据处理活动及其安全监管。在境外开展数据处理活动，损害中华人民共和国国家安全、公共利益或者公民、组织合法权益的，依法追究法律责任，但主要适用范围还是境内。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-071","type":"judgment","globalNumber":71,"stem":"与 OSI 参考模型一样，TCP/IP 模型也采用层次化结构，每一层负责不同的通信功能。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"TCP/IP 模型和 OSI 参考模型都是层次化的网络体系结构，TCP/IP 模型包含应用层、传输层、网际层、网络接口层，各层分工明确，负责不同的通信功能，共同实现网络通信。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-072","type":"judgment","globalNumber":72,"stem":"无线传播一般通过的路径不包括视距。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"无线传播路径包括视距传播、非视距传播等。视距传播是指在发射天线和接收天线之间没有阻挡的情况下，电磁波直接从发射端传播到接收端，是无线传播的常见路径之一。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-073","type":"judgment","globalNumber":73,"stem":"无线 AP 其性能的好坏以及位置的摆放，直接影响着无线网络传输信号的强弱。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"无线 AP（无线接入点）是无线网络的关键设备，其性能（如发射功率、灵敏度等）以及位置摆放（如是否存在遮挡、安装高度等）会对无线网络信号的覆盖范围和强度产生直接影响，进而影响网络传输质量。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-074","type":"judgment","globalNumber":74,"stem":"配置了操作系统的计算机是一台比原来的物理计算机功能更强大的计算机，这样的计算机只是一台逻辑上的计算机，称为虚拟计算机。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"操作系统为计算机提供了资源管理、任务调度等功能，使得计算机在逻辑上具备更强大的功能。从用户角度看，使用配置了操作系统的计算机如同使用一台功能增强的逻辑计算机，即虚拟计算机。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-075","type":"judgment","globalNumber":75,"stem":"操作系统在计算机系统中处于处理机和用户之间的位置。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"操作系统作为计算机系统的核心软件，一方面管理计算机硬件资源（包括处理机），为上层软件和用户提供服务；另一方面，用户通过操作系统提供的接口（如命令行、图形界面等）使用计算机，所以操作系统处于处理机和用户之间。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-076","type":"judgment","globalNumber":76,"stem":"UNIX 操作系统的文件系统是分级树型结构。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"UNIX 操作系统的文件系统采用分级树型结构，以根目录 “/” 为起点，下面可以有多个子目录和文件，子目录下又可以继续包含子目录和文件，这种结构便于文件的组织和管理。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-077","type":"judgment","globalNumber":77,"stem":"感染性是计算机病毒造成的最显著的后果。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"计算机病毒造成的最显著后果是破坏性，它可以破坏计算机中的数据、程序，影响计算机系统的正常运行；感染性是计算机病毒的特性之一，指病毒能够自我复制并传播到其他程序或计算机上。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-078","type":"judgment","globalNumber":78,"stem":"计算机病毒和生物病毒一样，可以感染人。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"计算机病毒是一种能够自我复制、传播并破坏计算机系统的程序代码，它只对计算机系统起作用，不会感染人类；生物病毒是一类能够在生物体内寄生、繁殖并引发疾病的微生物，二者本质不同。","source":"暂未明确","difficulty":"较低"},{"id":"judgment-079","type":"judgment","globalNumber":79,"stem":"Web 应用安全的核心问题在于 Web 服务器存在漏洞。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"Web 应用安全的核心问题是多方面的，不仅仅是 Web 服务器存在漏洞，还包括应用程序代码漏洞（如 SQL 注入、跨站脚本攻击等）、用户认证和授权机制不完善、数据传输安全等问题。","source":"暂未明确","difficulty":"中等"},{"id":"judgment-080","type" function encodeSnapshot(snapshot) {
  try {
    const bytes = new TextEncoder().encode(JSON.stringify(snapshot));
    let binary = '';
    for (let i=0;i<bytes.length;i+=0x8000) binary += String.fromCharCode(...bytes.subarray(i, i+0x8000));
    return btoa(binary);
  } catch (_) { return ''; }
}
function decodeSnapshot(value) {
  if (!value) return null;
  try {
    const binary = atob(value);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const obj = JSON.parse(new TextDecoder().decode(bytes));
    if (!obj || typeof obj !== 'object') return null;
    return obj;
  } catch (_) { return null; }
}

  const qs=ids.map(id=>BY_ID[id]).filter(Boolean).sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type)||a.globalNumber-b.globalNumber);
  ['desktopPinned','mobilePinned'].forEach(id=>{const root=document.getElementById(id); if(root){root.replaceChildren(createNumberGroups(qs,'jump'));}});
}
function renderNumberLists() {
  const qs=activePageQuestions(PAGE_KEY);
  ['desktopQuestionNumbers','mobileQuestionNumbers'].forEach(id=>{const root=document.getElementById(id); if(root) root.replaceChildren(createNumberGroups(qs,'jump'));});
}
function updateCurrentHighlight() {
  document.querySelectorAll('.question-card').forEach(card=>card.classList.toggle('is-current',card.dataset.questionId===progress.currentId));
}
function renderSidebar() {
  renderPinnedLists(); renderNumberLists(); updateCurrentHighlight();
  updateTimerText();
  const lbl=modeLabel(progress && progress.mode);
  document.querySelectorAll('.timer-mode').forEach(n=>n.textContent=lbl);
  const navPages=visiblePages();
  const at=navPages.findIndex(p=>p.key===PAGE_KEY);
  const prevDisabled=at<=0; const nextDisabled=at<0||at>=navPages.length-1;
  document.querySelectorAll('[data-nav="prev"]').forEach(b=>b.disabled=prevDisabled);
  document.querySelectorAll('[data-nav="next"]').forEach(b=>b.disabled=nextDisabled);
  const mid=document.getElementById('desktopPageSummary');
  if(mid){const p=PAGE_BY_KEY[PAGE_KEY]; mid.textContent=p?`${p.start}–${p.end} / ${TYPE_COUNT[p.type]} 题`:'错题';}
  const mobileMid=document.getElementById('mobilePageSummary');
  if(mobileMid){const p=PAGE_BY_KEY[PAGE_KEY]; mobileMid.textContent=p?`${p.start}–${p.end} / ${TYPE_COUNT[p.type]} 题`:'错题';}
  document.querySelectorAll('.mode-only-exam').forEach(b=>b.hidden=!(progress&&progress.mode==='exam'&&!progress.submitted));
  const mobileDock=document.querySelector('.mobile-dock');if(mobileDock)mobileDock.classList.toggle('exam-mode',!!(progress&&progress.mode==='exam'&&!progress.submitted));
  const panel=document.getElementById('mobilePanel');
  if(panel){const btn=document.getElementById('toggleMobilePanel'); if(btn)btn.textContent=panel.hidden?'展开扩展栏':'收起扩展栏';}
}
function renderQuizPage() {
  if (!progress) {
    progress={version:2,mode:'practice',answers:{},pinned:[],elapsedMs:0,runningSince:null,paused:true,submitted:false,pageKey:PAGE_KEY,currentId:null,activeIds:null,examSession:null,updatedAt:Date.now()};
  }
  progress.pageKey=PAGE_KEY;
  const paramFocus=new URLSearchParams(location.search).get('focus');
  let qs=activePageQuestions(PAGE_KEY);
  if (!progress.currentId || !qs.some(q=>q.id===progress.currentId)) progress.currentId=(paramFocus&&qs.some(q=>q.id===paramFocus)?paramFocus:(qs[0]&&qs[0].id))||null;
  if(paramFocus&&qs.some(q=>q.id===paramFocus)) progress.currentId=paramFocus;
  setText('quizTitle',newPageShellForType((PAGE_BY_KEY[PAGE_KEY]||{}).type||'choice',(PAGE_BY_KEY[PAGE_KEY]||{}).start||1,(PAGE_BY_KEY[PAGE_KEY]||{}).end||50));
  setText('modeText',modeLabel(progress.mode));
  const root=document.getElementById('questions');
  if(root){root.replaceChildren(); qs.forEach(q=>root.append(createQuestionCard(q)));}
  const empty=document.getElementById('emptyState');
  if(empty){empty.hidden=qs.length>0; empty.textContent=progress.mode==='wrong'?'此分页没有上一次考试的错题。':'本分页暂无题目。';}
  renderSidebar();
  if(progress.submitted){document.querySelectorAll('.mode-status').forEach(n=>n.textContent='本次考试已交卷，题目只读。');}
  persistContext(true, false);
  updateUrlSnapshot();
  if (progress.runningSince && !progress.paused && !progress.submitted) {
    if(timerHandle) clearInterval(timerHandle);
    timerHandle=setInterval(updateTimerText,1000);
  }
  if(progress.currentId){setTimeout(()=>{const el=document.getElementById('q-'+progress.currentId); if(el && paramFocus) el.scrollIntoView({block:'start',behavior:'auto'});},35);}
}
function jumpToQuestion(id) {
  const q=BY_ID[id]; if(!q) return;
  if(progress && progress.mode==='wrong' && !(progress.activeIds||[]).includes(id)){alert('该题不属于上一次考试错题。');return;}
  const target=pageForId(id);
  if(target && target.key===PAGE_KEY && document.getElementById('q-'+id)) {
    progress.currentId=id; persistContext(true,true); updateCurrentHighlight(); renderSidebar();
    document.getElementById('q-'+id).scrollIntoView({block:'start',behavior:'auto'}); return;
  }
  progress.currentId=id; progress.pageKey=target.key; persistContext(true,false); goTo(`${target.key}.html`,id);
}
function navigatePage(delta) {
  const arr=visiblePages(); const idx=arr.findIndex(p=>p.key===PAGE_KEY); const next=arr[idx+delta]; if(!next)return;
  const qs=activePageQuestions(next.key); const id=qs[0] ? qs[0].id : next.ids[0];
  progress.pageKey=next.key; progress.currentId=id; persistContext(true,false); goTo(`${next.key}.html`,id);
}
function persistChangedState(syncUrl=true) { persistContext(true,syncUrl); renderSidebar(); }
function updateQuestionOnly(id) {
  const q=BY_ID[id]; if(!q)return;
  const old=document.getElementById('q-'+id); if(!old)return;
  const fresh=createQuestionCard(q); old.replaceWith(fresh);
  updateCurrentHighlight();
}
function performChoice(id,value) {
  if(!progress || progress.submitted)return;
  const q=BY_ID[id]; if(!q)return;
  const rec=progress.answers[id] || {value:null,answered:false,checked:false,correct:null,locked:false};
  if(progress.mode!=='exam' && rec.locked)return;
  rec.value=value; rec.answered=true; rec.updatedAt=Date.now();
  if(progress.mode==='exam') {rec.checked=false;rec.correct=null;rec.locked=false;}
  else {rec.checked=true;rec.correct=answerCorrect(q,value);rec.locked=true;}
  progress.answers[id]=rec; progress.currentId=id;
  persistContext(true,true); updateQuestionOnly(id); renderSidebar();
}
function performFillInput(input) {
  if(!progress || progress.submitted)return;
  const id=input.dataset.id; const q=BY_ID[id]; if(!q)return;
  const old=progress.answers[id] || {value:[],answered:false,checked:false,correct:null,locked:false};
  const value=Array.isArray(old.value)?old.value.slice():[]; value[Number(input.dataset.index)]=input.value.slice(0,20);
  old.value=value; old.answered=value.some(v=>String(v||'').trim()!==''); old.checked=false; old.correct=null; old.locked=false; progress.answers[id]=old;
}
function submitFill(id) {
  const q=BY_ID[id]; if(!q || !progress || progress.submitted)return;
  const inputs=Array.from(document.querySelectorAll(`input[data-action="fill-input"][data-id="${CSS.escape(id)}"]`));
  const value=inputs.map(i=>i.value.slice(0,20));
  const correct=answerCorrect(q,value);
  progress.answers[id]={value,answered:value.some(v=>String(v||'').trim()!==''),checked:true,correct,locked:true,updatedAt:Date.now()};
  persistContext(true,true); updateQuestionOnly(id); renderSidebar();
}
function togglePin(id) {
  if(!progress)return;
  const set=new Set(progress.pinned||[]);
  if(set.has(id))set.delete(id);else set.add(id);
  progress.pinned=Array.from(set); progress.currentId=id;
  persistContext(true,true); updateQuestionOnly(id); renderSidebar();
}
function gradeExamAndSubmit() {
  if(!progress || progress.mode!=='exam' || progress.submitted)return;
  if(!confirm('确认交卷？交卷后将统一判题，未作答题目按错误计入，且不能再修改答案。'))return;
  const elapsed=currentElapsedMs(); progress.elapsedMs=elapsed; progress.runningSince=null; progress.paused=true; progress.submitted=true;
  const resultItems=[];
  for(const id of (progress.examSession && progress.examSession.questionIds || BANK.map(q=>q.id))) {
    const q=BY_ID[id]; if(!q)continue;
    let rec=progress.answers[id];
    if(!rec) rec={value:null,answered:false,checked:true,correct:false,locked:true};
    else {rec.answered=rec.value!==null && rec.value!==undefined && !(typeof rec.value==='string' && rec.value==='') && !(Array.isArray(rec.value) && !rec.value.some(x=>String(x||'').trim()!=='')); rec.correct=rec.answered && answerCorrect(q,rec.value); rec.checked=true; rec.locked=true;}
    progress.answers[id]=rec;
    resultItems.push({id,answer:rec.value,answered:!!rec.answered,correct:rec.correct===true,pinned:(progress.pinned||[]).includes(id)});
  }
  const stats={}; for(const type of TYPE_ORDER){const ids=resultItems.filter(r=>BY_ID[r.id].type===type);if(ids.length)stats[type]={total:ids.length,correct:ids.filter(r=>r.correct).length,rate:pct(ids.filter(r=>r.correct).length,ids.length)};}
  const nCorrect=resultItems.filter(r=>r.correct).length;
  lastResult={schema:'last_result_v2',testedAt:Date.now(),durationMs:elapsed,mode:'考试模式',total:resultItems.length,correctCount:nCorrect,overallRate:pct(nCorrect,resultItems.length),typeStats:stats,results:resultItems,pinned:(progress.pinned||[]).slice(),examSessionId:progress.examSession&&progress.examSession.id||null};
  progress.updatedAt=Date.now();
  persistContext(true,false); goTo('result.html');
}
function exitAndSave() {
  if(!progress){location.href='index.html';return;}
  if(running()) pauseTimer();
  else if(progress.runningSince && !progress.submitted) pauseTimer();
  progress.paused=true; progress.runningSince=null; progress.updatedAt=Date.now();
  persistContext(true,false); goTo('index.html');
}
function resultStatsData() {
  if(!lastResult)return [];
  return TYPE_ORDER.filter(t=>lastResult.typeStats && lastResult.typeStats[t]).map(t=>({type:t,...lastResult.typeStats[t]}));
}
function renderResultPage() {
  const root=document.getElementById('resultSummary');
  const list=document.getElementById('resultQuestionGroups');
  if(!validResult(lastResult)) {
    if(root){root.replaceChildren();const e=document.createElement('div');e.className='empty-result';e.textContent='暂无考试记录。请先从首页进入考试模式并交卷。';root.append(e);}
    if(list){list.replaceChildren();const e=document.createElement('div');e.className='empty-result';e.textContent='暂无数据';list.append(e);}
    const b=document.getElementById('exportImage'); if(b)b.disabled=true;
    return;
  }
  const exportButton=document.getElementById('exportImage'); if(exportButton)exportButton.disabled=false;
  if(root){
    root.replaceChildren();
    const fields=document.createElement('div');fields.className='summary-fields';
    const data=[['测验用时',formatDuration(lastResult.durationMs)],['测试时间',formatLocalMinute(lastResult.testedAt)],['测验类型',lastResult.mode||'考试模式'],['总体正确率',lastResult.overallRate||pct(lastResult.correctCount,lastResult.total)]];
    data.forEach(([label,value],i)=>{
      const box=document.createElement('div');box.className='summary-field'+(i===3?' wide':'');
      const l=document.createElement('div');l.className='summary-field-label';l.textContent=label;
      const v=document.createElement('div');v.className='summary-field-value'+(i===3?' result-rate':'');v.textContent=value;
      box.append(l,v);fields.append(box);
    });
    const statHeading=document.createElement('h3');statHeading.textContent='各题型统计';root.append(fields,statHeading);
    const types=document.createElement('div');types.className='type-results';
    resultStatsData().forEach(x=>{
      const card=document.createElement('div');card.className='type-result';
      const label=document.createElement('div');label.className='stat-label';label.textContent=questionTypeLabel(x.type);
      const value=document.createElement('div');value.className='stat-num';value.textContent=x.rate||pct(x.correct,x.total);
      const note=document.createElement('div');note.className='small muted';note.textContent=`答对 ${x.correct} / ${x.total} 题`;
      card.append(label,value,note);types.append(card);
    });root.append(types);
  }
  if(list){
    list.replaceChildren();
    const grouped={};
    for(const r of lastResult.results){const q=BY_ID[r.id];if(q)(grouped[q.type] ||= []).push({q,r});}
    TYPE_ORDER.forEach(type=>{
      const arr=grouped[type];if(!arr||!arr.length)return;
      const section=document.createElement('div');section.className='result-type';
      const label=document.createElement('div');label.className='group-label';label.textContent=questionTypeLabel(type);section.append(label);
      const numbers=document.createElement('div');numbers.className='result-numbers';
      arr.sort((a,b)=>a.q.globalNumber-b.q.globalNumber).forEach(({q,r})=>{
        const b=document.createElement('button');b.type='button';b.className='result-number '+(r.correct?'correct':'incorrect')+(((lastResult.pinned||[]).includes(q.id)||r.pinned)?' pinned':'');b.textContent=String(q.globalNumber);b.dataset.action='result-jump';b.dataset.id=q.id;b.title=`${questionTypeLabel(q.type)} 第${q.globalNumber}题`;
        numbers.append(b);
      });section.append(numbers);list.append(section);
    });
  }
  setText('resultRecordCount',`共 ${lastResult.total} 题 · 答对 ${lastResult.correctCount} 题`);
}
function jumpFromResult(id) {
  if(!BY_ID[id] || !progress || !progress.submitted){alert('当前浏览器没有可用的已交卷题目状态，请先从首页导入同一份进度 JSON。');return;}
  progress.currentId=id;progress.pageKey=freshPageKeyForId(id);progress.runningSince=null;progress.paused=true;progress.submitted=true;progress.updatedAt=Date.now();
  persistContext(true,false);goTo(`${progress.pageKey}.html`,id);
}
function exportSummaryImage() {
  if(!validResult(lastResult)){alert('暂无可导出的考试详情。');return;}
  const canvas=document.createElement('canvas');canvas.width=1100;canvas.height=620;
  const ctx=canvas.getContext('2d');if(!ctx){alert('当前浏览器无法生成图片。');return;}
  const pad=64;ctx.fillStyle='#F7F6FB';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#FFFFFF';roundRect(ctx,28,28,canvas.width-56,canvas.height-56,22);ctx.fill();ctx.strokeStyle='#E7E3F0';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#30274A';ctx.font='bold 34px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText('做题详情 · 本次测验',pad,94);
  ctx.fillStyle='#766D8E';ctx.font='18px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText('网络与信息安全管理员',pad,128);
  let y=184;
  const rows=[['测验用时',formatDuration(lastResult.durationMs)],['测试时间',formatLocalMinute(lastResult.testedAt)],['测验类型',lastResult.mode||'考试模式'],['总体正确率',lastResult.overallRate||pct(lastResult.correctCount,lastResult.total)]];
  rows.forEach(([k,v],i)=>{
    const col=i%2, r=Math.floor(i/2), x=pad+col*480, yy=y+r*76;
    ctx.fillStyle='#FBFAFE';roundRect(ctx,x,yy,430,58,10);ctx.fill();ctx.strokeStyle='#E7E3F0';ctx.stroke();
    ctx.fillStyle='#766D8E';ctx.font='15px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText(k,x+16,yy+22);
    ctx.fillStyle=k==='总体正确率'?'#4D368F':'#30274A';ctx.font='bold 21px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText(String(v),x+16,yy+46);
  });
  y=360;ctx.fillStyle='#30274A';ctx.font='bold 21px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText('各题型统计',pad,y);
  const types=resultStatsData();
  types.forEach((t,i)=>{
    const x=pad+i*245, yy=386;
    ctx.fillStyle='#F5F1FF';roundRect(ctx,x,yy,218,112,12);ctx.fill();ctx.strokeStyle='#D9CCFF';ctx.stroke();
    ctx.fillStyle='#5B4983';ctx.font='bold 16px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText(questionTypeLabel(t.type),x+16,yy+29);
    ctx.fillStyle='#342554';ctx.font='bold 24px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText(String(t.rate||pct(t.correct,t.total)),x+16,yy+63);
    ctx.fillStyle='#766D8E';ctx.font='14px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText(`答对 ${t.correct} / ${t.total} 题`,x+16,yy+89);
  });
  ctx.fillStyle='#8A829B';ctx.font='13px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText(`共 ${lastResult.total} 题 · 答对 ${lastResult.correctCount} 题`,pad,548);
  const done=(blob)=>{if(!blob){downloadCanvasDataUrl(canvas);return;}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`做题详情_${formatLocalFileStamp(lastResult.testedAt)}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);};
  if(canvas.toBlob)canvas.toBlob(done,'image/png');else downloadCanvasDataUrl(canvas);
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function downloadCanvasDataUrl(canvas){try{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`做题详情_${formatLocalFileStamp(lastResult.testedAt)}.png`;document.body.append(a);a.click();a.remove();}catch(_){alert('图片导出失败，请使用较新的浏览器重试。');}}

function onDocumentClick(event) {
  const actionEl=event.target.closest('[data-action]');
  if(actionEl){
    const action=actionEl.dataset.action, id=actionEl.dataset.id;
    if(action==='choose'){event.preventDefault();performChoice(id,actionEl.dataset.value);return;}
    if(action==='pin'){event.preventDefault();togglePin(id);return;}
    if(action==='jump'){event.preventDefault();jumpToQuestion(id);return;}
    if(action==='submit-fill'){event.preventDefault();submitFill(id);return;}
    if(action==='exit'){event.preventDefault();exitAndSave();return;}
    if(action==='submit-exam'){event.preventDefault();gradeExamAndSubmit();return;}
    if(action==='result-jump'){event.preventDefault();jumpFromResult(id);return;}
  }
  const nav=event.target.closest('[data-nav]');
  if(nav){event.preventDefault();navigatePage(nav.dataset.nav==='prev'?-1:1);return;}
  const act=event.target.closest('[data-home-action]');
  if(act){
    event.preventDefault();const a=act.dataset.homeAction;
    if(a==='practice')startMode('practice');else if(a==='exam')startMode('exam');else if(a==='wrong')startMode('wrong');else if(a==='continue')continueQuiz();else if(a==='detail')lastDetail();else if(a==='export')exportProgressModal();else if(a==='import')importProgressModal();else if(a==='clear')clearProgress();else if(a==='supplement')confirmSupplement();else if(a==='close-modal')closeProgressModal();else if(a==='copy')copyProgressText();else if(a==='download')downloadProgressText();else if(a==='import-submit')importProgressText();else if(a==='export-image')exportSummaryImage();else if(a==='back-home')goTo('index.html');
  }
  if(event.target.id==='toggleMobilePanel'){
    const panel=document.getElementById('mobilePanel');if(panel){panel.hidden=!panel.hidden;event.target.textContent=panel.hidden?'展开扩展栏':'收起扩展栏';}
  }
}
function onDocumentInput(event) {
  const input=event.target.closest('input[data-action="fill-input"]');if(input)performFillInput(input);
}
function onDocumentChange(event) {
  const input=event.target.closest('input[data-action="fill-input"]');if(input){performFillInput(input);persistContext(true,true);}
}
function onDocumentKey(event) { if(event.key==='Escape'){const m=document.getElementById('progressModal');if(m&&!m.hidden)closeProgressModal();} }
function onPageHide() {
  if(progress && running()) {
    progress.elapsedMs=currentElapsedMs();progress.runningSince=Date.now();progress.updatedAt=Date.now();
    persistContext(false,false);
  } else if(progress) persistContext(false,false);
}
function startUp() {
  loadContext();
  rebaseRunningTimer();
  if(VIEW_KIND==='home') renderHome();
  if(VIEW_KIND==='quiz') renderQuizPage();
  if(VIEW_KIND==='result') renderResultPage();
  document.addEventListener('click',onDocumentClick);
  document.addEventListener('input',onDocumentInput);
  document.addEventListener('change',onDocumentChange);
  document.addEventListener('keydown',onDocumentKey);
  window.addEventListener('pagehide',onPageHide);
}
document.addEventListener('DOMContentLoaded',startUp);
</script>
