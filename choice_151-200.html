e","globalNumber":7,"stem":"下列关于操作系统的描述，正确的是 (　　)","images":[],"options":{"A":"操作系统是一种最重要的应用软件","B":"操作系统提供的人机交互接口其它软件无法使用","C":"一台计算机可以安装多个操作系统","D":"操作系统中只有程序没有数据"},"answer":"C","analysis":"操作系统是系统软件，不是应用软件；其提供的人机交互接口其他软件可以使用；操作系统中既有程序也有数据，A、B、D 选项错误","source":"操作系统基础课程","difficulty":"中等"},{"id":"choice-008","type":"choice","globalNumber":8,"stem":"云计算技术中最为关键的支撑技术之一就是 (　　)","images":[],"options":{"A":"物联网技术","B":"大数据技术","C":"虚拟化技术","D":"5G 通信技术"},"answer":"C","analysis":"虚拟化技术可实现资源的虚拟划分和灵活调配，是云计算的关键支撑技术。物联网技术侧重于物物相连；大数据技术用于数据处理；5G 通信技术提供高速通信，均不是云计算最关键的支撑技术","source":"云计算技术基础课程","difficulty":"中等"},{"id":"choice-009","type":"choice","globalNumber":9,"stem":"在开放系统互连参考模型（OSI/RM）中，处于最低层的是 (　　)","images":[],"options":{"A":"应用层","B":"传输层","C":"数据链路层","D":"物理层"},"answer":"D","analysis":"OSI/RM 模型从低到高依次为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层，物理层处于最低层","source":"计算机网络基础课程","difficulty":"中等"},{"id":"choice-010","type":"choice","globalNumber":10,"stem":"TCP/IP 协议体系结构中，IP 层对应 OSI 模型的 (　　) 层","images":[],"options":{"A":"网络层","B":"会话层","C":"数据链路层","D":"传输层"},"answer":"A","analysis":"TCP/IP 协议体系结构的 IP 层负责网络层功能，与 OSI 模型的网络层相对应，B、C、D 选项错误","source":"计算机网络协议课程","difficulty":"中等"},{"id":"choice-011","type":"choice","globalNumber":11,"stem":"网络层位于通信子网的 (　　) 层","images":[],"options":{"A":"最高","B":"中间","C":"最低","D":"不属于通信子网"},"answer":"A","analysis":"通信子网包括物理层、数据链路层和网络层，网络层在通信子网中处于最高层，B、C、D 选项错误","source":"计算机网络基础课程","difficulty":"中等"},{"id":"choice-012","type":"choice","globalNumber":12,"stem":"目前最常用的超五类非屏蔽双绞线由 (　　) 根线芯组成","images":[],"options":{"A":"4","B":"6","C":"8","D":"10"},"answer":"C","analysis":"目前最常用的超五类非屏蔽双绞线由 8 根线芯组成，这是常见网络布线知识，A、B、D 选项错误","source":"计算机网络布线课程","difficulty":"简单"},{"id":"choice-013","type":"choice","globalNumber":13,"stem":"小李是公司网管员，他想检查本机的路由表信息，可以执行 (　　) 实现","images":[],"options":{"A":"netstat -a","B":"netstat -n","C":"netstat -e","D":"netstat -r"},"answer":"D","analysis":"netstat -r 命令用于显示路由表信息，netstat -a 用于显示所有连接和侦听端口；netstat -n 以数字形式显示地址和端口号；netstat -e 用于显示以太网统计信息，A、B、C 选项错误","source":"计算机网络管理课程","difficulty":"中等"},{"id":"choice-014","type":"choice","globalNumber":14,"stem":"下列选择中不属于数据库中的故障是 (　　)","images":[],"options":{"A":"计算机电源故障","B":"系统故障","C":"介质故障","D":"计算机病毒"},"answer":"A","analysis":"计算机电源故障属于硬件故障，并非数据库特有的故障类型。系统故障、介质故障、计算机病毒都可能导致数据库出现问题，B、C、D 选项属于数据库故障","source":"数据库原理与应用课程","difficulty":"中等"},{"id":"choice-015","type":"choice","globalNumber":15,"stem":"合同解除针对的标的是 (　　)","images":[],"options":{"A":"无效合同","B":"有效合同","C":"可撤销合同","D":"效力待定合同"},"answer":"B","analysis":"合同解除是针对有效合同而言，使其提前终止法律效力。无效合同自始无效，无需解除；可撤销合同在撤销前有效，撤销后自始无效；效力待定合同需经追认等才能确定效力，A、C、D 选项错误","source":"合同法基础课程","difficulty":"中等"},{"id":"choice-016","type":"choice","globalNumber":16,"stem":"WWW 客户与 WWW 服务器之间的信息传输使用的协议为 (　　)","images":[],"options":{"A":"HTML","B":"HTTP","C":"SMTP","D":"IMAP"},"answer":"B","analysis":"HTTP 是超文本传输协议，用于 WWW 客户与 WWW 服务器之间传输信息。HTML 是超文本标记语言，用于描述网页结构；SMTP 用于邮件发送；IMAP 用于邮件接收，A、C、D 选项错误","source":"计算机网络应用课程","difficulty":"中等"},{"id":"choice-017","type":"choice","globalNumber":17,"stem":"在 TCP/IP 模型中网络接口层规定了 OSI 模型的 (　　)","images":[],"options":{"A":"物理和数据链路层","B":"数据链路和网络层","C":"物理层","D":"表示层"},"answer":"A","analysis":"TCP/IP 模型的网络接口层对应 OSI 模型的物理层和数据链路层，负责处理物理介质上的信号传输和数据帧的封装、解封装，B、C、D 选项错误","source":"计算机网络协议课程","difficulty":"中等"},{"id":"choice-018","type":"choice","globalNumber":18,"stem":"在以下几种传输媒体中，哪种传输速率最高 (　　)","images":[],"options":{"A":"双绞线","B":"同轴电缆","C":"光纤","D":"通信卫星"},"answer":"C","analysis":"光纤利用光信号传输数据，具有带宽大、传输速率高、抗干扰能力强等优点，相比双绞线、同轴电缆和通信卫星，传输速率最高，A、B、D 选项错误","source":"计算机网络传输介质课程","difficulty":"中等"},{"id":"choice-019","type":"choice","globalNumber":19,"stem":"哪种 IPv4 地址让主机能够将信息发送给一组主机 (　　)","images":[],"options":{"A":"单播地址","B":"组播地址","C":"主机地址","D":"网络地址"},"answer":"B","analysis":"组播地址用于将信息发送给一组主机，单播地址用于一对一通信；主机地址和网络地址是 IP 地址的组成部分，并非用于向一组主机发送信息，A、C、D 选项错误","source":"计算机网络 IP 地址课程","difficulty":"中等"},{"id":"choice-020","type":"choice","globalNumber":20,"stem":"IPv6 地址的长度是 (　　)","images":[],"options":{"A":"32 位","B":"64 位","C":"128 位","D":"256 位"},"answer":"C","analysis":"IPv6 地址长度为 128 位，相比 IPv4 的 32 位地址空间大大扩展，A、B、D 选项错误","source":"计算机网络 IP 地址课程","difficulty":"中等"},{"id":"choice-021","type":"choice","globalNumber":21,"stem":"下列选项中，在路由器上查看版本及引导信息的命令是 (　　)","images":[],"options":{"A":"router#show version","B":"router#show ip router","C":"router#show interface","D":"router#show run"},"answer":"A","analysis":"在路由器命令中，“router#show version” 用于查看版本及引导信息；“router#show ip router” 用于查看 IP 路由表；“router#show interface” 用于查看接口信息；“router#show run” 用于查看当前运行配置，所以 A 正确","source":"网络设备配置基础","difficulty":"易"},{"id":"choice-022","type":"choice","globalNumber":22,"stem":"下面两个标准之间是兼容的是 (　　)","images":[],"options":{"A":"802.11 和 802.11a","B":"802.11a 和 802.11b","C":"802.11a 和 802.11g","D":"802.11a 和 802.11n"},"answer":"D","analysis":"802.11n 向下兼容 802.11a、802.11b、802.11g 等标准，而 802.11a 与 802.11b、802.11g 工作频段不同，不兼容；802.11 和 802.11a 也不兼容，所以 D 正确","source":"无线网络技术基础","difficulty":"中"},{"id":"choice-023","type":"choice","globalNumber":23,"stem":"引导扇区病毒感染计算机上的哪一项信息 (　　)","images":[],"options":{"A":"DATA","B":"MBR","C":"E-Mail","D":"Word"},"answer":"B","analysis":"引导扇区病毒主要感染计算机的主引导记录（MBR），DATA 是数据，E-Mail 是电子邮件，Word 是文档格式，均不是引导扇区病毒感染的主要对象，所以 B 正确","source":"计算机病毒原理","difficulty":"易"},{"id":"choice-024","type":"choice","globalNumber":24,"stem":"目前使用的防病毒软件的作用是 (　　)","images":[],"options":{"A":"清除已感染的任何恶意代码","B":"查出已知名的恶意代码，清除部分恶意代码","C":"清除任何已感染的文件","D":"查出并清除任何恶意代码"},"answer":"B","analysis":"目前的防病毒软件能查出已知名的恶意代码，并清除部分恶意代码，但无法清除已感染的任何恶意代码和任何已感染的文件，也不能查出并清除所有恶意代码，所以 B 正确","source":"计算机安全防护技术","difficulty":"易"},{"id":"choice-025","type":"choice","globalNumber":25,"stem":"防病毒产品可以实施在网络中的 (　　) 三个层次中","images":[],"options":{"A":"网关、服务器、桌面","B":"互联网、内部网、桌面","C":"防火墙、代理服务器、邮件处理服务器","D":"网关、桌面、无线设备"},"answer":"A","analysis":"防病毒产品可部署在网关、服务器、桌面三个层次，实现网络不同层面的防护；互联网、内部网不是具体的部署层次；防火墙、代理服务器、邮件处理服务器只是网络设备，不是完整的部署层次；无线设备表述不全面，所以 A 正确","source":"网络安全防护体系","difficulty":"中"},{"id":"choice-026","type":"choice","globalNumber":26,"stem":"以下各种加密算法中属于对称加密算法的是 (　　)","images":[],"options":{"A":"Caesar 替代法","B":"DES 加密算法","C":"Vigenere 算法","D":"Diffie - Hellman 加密算法"},"answer":"B","analysis":"DES 加密算法是典型的对称加密算法；Caesar 替代法、Vigenere 算法是古典加密算法，不属于对称加密算法的典型代表；Diffie - Hellman 加密算法是一种非对称加密算法，所以 B 正确","source":"加密技术基础","difficulty":"中"},{"id":"choice-027","type":"choice","globalNumber":27,"stem":"FTP 代表的是 (　　)","images":[],"options":{"A":"电子邮件","B":"远程登陆","C":"文件传输","D":"网络会议"},"answer":"C","analysis":"FTP 是 File Transfer Protocol 的缩写，代表文件传输；电子邮件常用协议是 SMTP、POP3 等；远程登陆常用协议是 Telnet；网络会议有多种软件和协议，所以 C 正确","source":"网络协议基础","difficulty":"易"},{"id":"choice-028","type":"choice","globalNumber":28,"stem":"Linux 系统下 vsftpd 服务器设置将所有本地用户都锁定在主目录中的方法是 (　　)","images":[],"options":{"A":"修改 vsftpd 主配置文件，修改 chroot_list_enable=NO，chroot_local_user=Yes，重启服务","B":"修改 vsftpd 主配置文件，修改 chroot - list - enable=NO，chroot_local_user=Yes，重启服务","C":"修改 vsftpd 主配置文件，修改 chroot_list_enable=YES，chroot_local_user=NO，重启服务","D":"修改 vsftpd 主配置文件，修改 chroot - list - enable=YES，chroot_local_user=NO，重启服务"},"answer":"A","analysis":"在 Linux 系统的 vsftpd 服务器配置中，设置 chroot_list_enable=NO，chroot_local_user=Yes 可将所有本地用户锁定在主目录，重启服务使配置生效，B 选项中 chroot - list - enable 书写错误，C、D 选项配置错误，所以 A 正确","source":"Linux 服务器配置","difficulty":"中"},{"id":"choice-029","type":"choice","globalNumber":29,"stem":"Windows 服务器中文件系统使用的都是 (　　)","images":[],"options":{"A":"强制访问控制","B":"自主访问控制","C":"基于角色的访问控制","D":"基于防火墙的控制"},"answer":"C","analysis":"Windows 服务器文件系统主要使用基于角色的访问控制，通过为不同角色分配权限来控制访问；强制访问控制和自主访问控制不是 Windows 服务器文件系统的主要访问控制方式；基于防火墙的控制主要针对网络流量，而非文件系统访问，所以 C 正确","source":"Windows 服务器管理","difficulty":"中"},{"id":"choice-030","type":"choice","globalNumber":30,"stem":"某公司使用 Linux 系统搭建了 samba 文件服务器，账号为 zhang3 的员工出差期间，为了避免该账号被其它员工冒用，需要临时将其禁用，可以使用以下 (　　) 命令","images":[],"options":{"A":"smbpasswd -a zhang3","B":"smbpasswd -d zhang3","C":"smbpasswd -e zhang3","D":"smbpasswd -x zhang3"},"answer":"B","analysis":"在 samba 文件服务器中，“smbpasswd -d zhang3” 用于禁用用户 zhang3；“smbpasswd -a zhang3” 用于添加用户；“smbpasswd -e zhang3” 用于启用用户；“smbpasswd -x zhang3” 用于删除用户，所以 B 正确","source":"Linux 服务器配置","difficulty":"中"},{"id":"choice-031","type":"choice","globalNumber":31,"stem":"DHCP 服务器的主要功能是：动态分配 (　　)","images":[],"options":{"A":"主机名","B":"IP","C":"账户","D":"密码"},"answer":"B","analysis":"DHCP 服务器的主要功能是动态分配 IP 地址，为网络中的设备自动提供 IP 配置信息；主机名、账户、密码不是 DHCP 服务器分配的主要内容，所以 B 正确","source":"网络服务配置（DHCP）","difficulty":"易"},{"id":"choice-032","type":"choice","globalNumber":32,"stem":"下面各类端口对报文处理正确的是 (　　)","images":[],"options":{"A":"Access 端口可以接收和发生多个 VLAN 的报文","B":"Trunk 端口可以接收和发生多个 VLAN 的报文","C":"Hybrid 端口只可以接收和发送一个 VLAN 的报文","D":"Trunk 端口可以接收和发送多个不打 VLAN 标签的报文"},"answer":"B","analysis":"Access 端口只能属于一个 VLAN，接收和发送该 VLAN 的报文；Trunk 端口可以接收和发送多个 VLAN 的报文，且默认情况下会给不同 VLAN 的报文打标签；Hybrid 端口可以灵活配置接收和发送多个 VLAN 的报文；Trunk 端口接收和发送的报文通常都带有 VLAN 标签，所以 B 正确","source":"网络交换技术","difficulty":"中"},{"id":"choice-033","type":"choice","globalNumber":33,"stem":"下面对根端口和指定端口描述错误的是 (　　)","images":[],"options":{"A":"根端口是用来向根网桥发送数据的端口","B":"根端口在非根网桥上，而不是在根网桥上","C":"指定端口只在根网桥上，而不在非根网桥上","D":"指定端口是在每个 LAN 中距离根网桥最近的端口"},"answer":"C","analysis":"根端口在非根网桥上，用于向根网桥发送数据；指定端口不仅在根网桥上存在，在非根网桥上也存在，它是每个 LAN 中距离根网桥最近的端口，负责转发数据，所以 C 描述错误","source":"生成树协议（STP）","difficulty":"中"},{"id":"choice-034","type":"choice","globalNumber":34,"stem":"思科交换机上要把生成树模式设置为 mstp 的命令是 (　　)","images":[],"options":{"A":"Switch(config)#spanning - tree mode mst","B":"Switch#spanning - tree mode mst","C":"Switch(config)#spanning - tree mst enable","D":"Switch#spanning - tree mst enable"},"answer":"A","analysis":"在思科交换机上，进入配置模式（Switch (config)#）后，使用 “spanning - tree mode mst” 命令可将生成树模式设置为 mstp；B 选项未在配置模式下；C、D 选项命令格式错误，所以 A 正确","source":"思科交换机配置（生成树协议）","difficulty":"中"},{"id":"choice-035","type":"choice","globalNumber":35,"stem":"思科交换机中可以通过 privilege 命令为特权模式配置 (　　) 个层次的命令级别","images":[],"options":{"A":"3","B":"5","C":"16","D":"1024"},"answer":"C","analysis":"思科交换机中，使用 privilege 命令可以为特权模式配置 16 个层次的命令级别，所以 C 正确","source":"思科交换机配置（权限管理）","difficulty":"中"},{"id":"choice-036","type":"choice","globalNumber":36,"stem":"思科交换机上执行命令 “Router#dir” 默认显示的是 (　　)","images":[],"options":{"A":"flash 闪存设备的文件系统","B":"nvram 设备的文件系统","C":"network 网络文件系统","D":"opaque 本地产生的虚拟文件系统"},"answer":"A","analysis":"在思科交换机上执行 “Router#dir” 命令，默认显示的是 flash 闪存设备的文件系统；nvram 设备主要存储启动配置文件等；network 网络文件系统和 opaque 本地产生的虚拟文件系统不是 “dir” 命令默认显示的内容，所以 A 正确","source":"思科交换机配置（文件管理）","difficulty":"易"},{"id":"choice-037","type":"choice","globalNumber":37,"stem":"在配置用户名 + 密码（明文密码）组合登录认证的情况下，至少要配置一个本地用户并设置密码用来通过 SSH 远程登录设备，思科路由器配置本地用户的命令是 (　　)","images":[],"options":{"A":"Router(config)#username abc secret 123456","B":"Router(config)#username abc password 123456","C":"Router#username abc secret 123456","D":"Router#username abc password 123456"},"answer":"B","analysis":"在思科路由器配置本地用户时，若设置明文密码，使用 “Router (config)#username abc password 123456” 命令；“Router (config)#username abc secret 123456” 是设置加密密码；C、D 选项未在配置模式下，所以 B 正确","source":"思科路由器配置（用户认证）","difficulty":"中"},{"id":"choice-038","type":"choice","globalNumber":38,"stem":"思科路由器中可以通过 privilege 命令为特权模式配置 (　　) 个层次的命令级别","images":[],"options":{"A":"8","B":"16","C":"32","D":"64"},"answer":"B","analysis":"同第 35 题，思科路由器中，privilege 命令可为特权模式配置 16 个层次的命令级别，所以 B 正确","source":"思科路由器配置（权限管理）","difficulty":"中"},{"id":"choice-039","type":"choice","globalNumber":39,"stem":"思科路由器上把设备当前运行的配置文件更改保存到启动配置文件中的命令是 (　　)","images":[],"options":{"A":"Router#copy running - config startup - config","B":"Router#cp running - config startup - config","C":"Router#write running - config startup - config","D":"Router#save running - config startup - config"},"answer":"A","analysis":"在思科路由器上，使用 “Router#copy running - config startup - config” 命令可将当前运行配置保存到启动配置文件；“cp” 是 Linux 系统的复制命令，在思科路由器中不适用；“write” 和 “save” 在思科路由器保存配置的场景下命令格式错误，所以 A 正确","source":"思科路由器配置（配置管理）","difficulty":"中"},{"id":"choice-040","type":"choice","globalNumber":40,"stem":"小张的计算机使用 Windows7 操作系统，他常登陆的用户名为 zhang, 小张给他个人文件夹设置了权限为只有 zhang 这个用户有权访问这个目录，管理员在某次维护中无意将 zhang 这个用户删除了，随后又重新建了一个用户名为 zhang，小张使用 zhang 这个用户登陆系统后，发现无法访问他原来的个人文件夹，原因是 (　　)","images":[],"options":{"A":"任何一个新建用户都需要经过授权才能访问系统中的文件","B":"windows 不认为新建立的用户 zhang 与原来的用户 zhang 是同一个用户，因此无权访问","C":"用户被删除后，该用户创建的文件夹也会自动删除，新建用户找不到原来用户的文件夹，因此无法访问","D":"新建的用户 zhang 会继承原来用户的权限，之所以无权访问时因为文件夹经过了加密"},"answer":"B","analysis":"在 Windows 系统中，用户账号有唯一的安全标识符（SID），删除并重新创建同名用户后，新用户的 SID 与原用户不同，Windows 不认为是同一个用户，所以新用户无权访问原用户设置权限的文件夹；A 选项新建用户并非都需重新授权访问所有文件；C 选项用户被删除，其文件夹不会自动删除；D 选项新建用户不会继承原用户权限，所以 B 正确","source":"Windows 操作系统管理","difficulty":"中"},{"id":"choice-041","type":"choice","globalNumber":41,"stem":"账号锁定策略中对超过一定次数的错误登录账号进行锁定是为了对抗 (　　) 攻击。","images":[],"options":{"A":"分布式拒绝服务攻击 (DDoS)","B":"病毒传染","C":"口令暴力破解","D":"缓冲区溢出攻击"},"answer":"C","analysis":"口令暴力破解通常通过不断尝试错误密码来获取访问权限，账号锁定策略可有效对抗此类攻击。当错误登录次数达到一定阈值锁定账号，使攻击者难以持续尝试。而分布式拒绝服务攻击（DDoS）主要通过大量请求使服务器瘫痪；病毒传染是恶意程序传播；缓冲区溢出攻击利用程序漏洞，均与账号锁定策略无关","source":"信息安全基础","difficulty":"易"},{"id":"choice-042","type":"choice","globalNumber":42,"stem":"Windows 系统补丁更新设置，下列说法正确的是 (　　)。","images":[],"options":{"A":"只能设置系统自动更新","B":"可以设置为检查更新，但我不能选择是否安装更新","C":"下载更新，但是让我选择下载和更新","D":"只能更新系统补丁，不能接收其他 Microsoft 产品的更新"},"answer":"C","analysis":"Windows 系统补丁更新设置有多种方式，并非只能自动更新，也不是不能选择是否安装更新。用户可以设置为下载更新后自行选择是否安装，且不仅能更新系统补丁，也能接收其他 Microsoft 产品的更新","source":"Windows 操作系统应用","difficulty":"中"},{"id":"choice-043","type":"choice","globalNumber":43,"stem":"假如你已经把编译好的新内核复制到 /boot 目录，如果你想让系统启动时缺省使用新内核而旧的内核依然有效，你需要在 /etc/lilo.conf 文件中添加 (　　) 选项。","images":[],"options":{"A":"boot=","B":"image=","C":"install=","D":"map="},"answer":"B","analysis":"在 /etc/lilo.conf 文件中，“image=” 选项用于指定内核映像文件路径，通过设置该选项指向新内核，可使系统启动时默认使用新内核，同时旧内核依然保留有效。“boot=” 用于指定引导设备；“install=” 用于指定安装引导扇区的文件；“map=” 用于指定映射文件，均不符合题意","source":"Linux 系统管理","difficulty":"中"},{"id":"choice-044","type":"choice","globalNumber":44,"stem":"root 用户的 UID 和 GID 为 (　　)。","images":[],"options":{"A":"2 和 0","B":"0 和 0","C":"1 和 0","D":"500 和 500"},"answer":"B","analysis":"在 Linux 系统中，root 用户是系统管理员，其用户 ID（UID）和组 ID（GID）均为 0，这是系统默认的设定，用于区分不同用户和用户组的权限等属性","source":"Linux 系统基础","difficulty":"易"},{"id":"choice-045","type":"choice","globalNumber":45,"stem":"在删除组时报错：cannot remove the primary group of user ‘aming’，是因为 (　　)。","images":[],"options":{"A":"组不存在","B":"组内有用户","C":"系统错误，不用处理","D":"命令参数出错"},"answer":"B","analysis":"当尝试删除一个用户的主组时，如果组内还有用户存在，系统会阻止删除操作并提示该错误。组不存在会有其他报错提示；这不是系统错误也并非命令参数出错","source":"Linux 用户与组管理","difficulty":"中"},{"id":"choice-046","type":"choice","globalNumber":46,"stem":"在 Linux 中，当 root 口令丢失后，应该 (　　)。","images":[],"options":{"A":"使用软盘启动直接进入系统","B":"使用光盘启动直接进入系统","C":"进入单用户模式后修改 root 口令","D":"重新安装系统"},"answer":"C","analysis":"在 Linux 系统中，若 root 口令丢失，进入单用户模式可以绕过正常的用户认证机制，方便修改 root 口令。使用软盘或光盘启动直接进入系统无法修改口令；重新安装系统过于繁琐，且会丢失数据","source":"Linux 系统安全","difficulty":"中"},{"id":"choice-047","type":"choice","globalNumber":47,"stem":"一般说来，Red Hat Linux 内核的源程序可以在 (　　) 目录下找到。","images":[],"options":{"A":"/usr/local","B":"/usr/src","C":"/lib","D":"/usr/share"},"answer":"B","analysis":"在 Red Hat Linux 系统中，内核的源程序通常存放在 /usr/src 目录下。/usr/local 一般用于存放本地安装的软件；/lib 是存放系统库文件的目录；/usr/share 用于存放共享数据，如文档、图标等","source":"Linux 系统基础","difficulty":"易"},{"id":"choice-048","type":"choice","globalNumber":48,"stem":"为了修改文件 test 的许可模式，使其文件属主具有读、写和运行的权限，组和其他用户可以读和运行，可以采用的方法 (　　)。","images":[],"options":{"A":"chmod 755 test","B":"chmod 700 test","C":"chmod ux+rwx test","D":"chmod g-w test"},"answer":"A","analysis":"在 Linux 中，chmod 命令用于修改文件权限。权限数字 7 表示读（4）、写（2）、执行（1）权限都有，5 表示读（4）和执行（1）权限。755 表示文件属主有读、写、执行权限，组和其他用户有读和执行权限。700 表示文件属主有读、写、执行权限，组和其他用户无任何权限；chmod ux+rwx test 语法错误；chmod g-w test 只是去掉组用户的写权限，不符合要求","source":"Linux 文件权限管理","difficulty":"中"},{"id":"choice-049","type":"choice","globalNumber":49,"stem":"SQL Server 支持两种身份验证模式，即 Windows 身份验证模式和混合模式。SQL Server 的混全模式是指：当网络用户尝试接到 SQL Server 数据库时 (　　)。","images":[],"options":{"A":"Windows 获取用户输入的用户和密码，并提交给 SQL Serve 进行身份验证，并决定用户的数据库访权限","B":"SQL Serve 根据用户输入的用户和密码，并提交给 Windows 进行身份验证，并决定用户的数据库访权限","C":"SQL Serve 根据已在 Windows 网络中登录的用户的网络安全属性，对用户进行身份验证，并决定用户的数据库访权限","D":"登录到本地 Windows 的用户均可无限制访问 SQL Serve 数据库"},"answer":"C","analysis":"在 SQL Server 的混合模式下，SQL Server 既可以使用 Windows 身份验证（根据已在 Windows 网络中登录的用户的网络安全属性进行验证），也可以使用 SQL Server 自身的身份验证（用户输入用户名和密码）。A 选项描述错误，不是 Windows 提交给 SQL Server 验证；B 选项也错误，不是 SQL Server 提交给 Windows 验证；D 选项登录到本地 Windows 的用户并非无限制访问，需要权限设置","source":"SQL Server 数据库管理","difficulty":"中"},{"id":"choice-050","type":"choice","globalNumber":50,"stem":"域名解析的两种主要方式为 (　　)。","images":[],"options":{"A":"直接解析和间接解析","B":"直接解析和递归解析","C":"间接解析和反复解析","D":"反复解析和递归解析"},"answer":"D","analysis":"域名解析的两种主要方式是反复解析和递归解析。递归解析是指域名服务器接到查询请求后，会代替客户端向其他域名服务器进行查询，直到得到最终结果返回给客户端；反复解析是指客户端每次向不同的域名服务器发送查询请求，直到获得结果。不存在直接解析和间接解析这种说法","source":"计算机网络基础","difficulty":"中"},{"id":"choice-051","type":"choice","globalNumber":51,"stem":"域名备案流程最简单方便的是 (　　)。","images":[],"options":{"A":"通过微软官网备案","B":"通过谷歌官网备案","C":"通过购买服务器空间运营商备案","D":"通过国家工业和信息化部 ICP 域名信息备案网站进行自主备案"},"answer":"C","analysis":"在国内，通过购买服务器空间运营商备案是相对简单方便的方式。运营商会协助用户完成备案流程，提供相关指导和支持。微软和谷歌官网不提供国内域名备案服务；通过国家工业和信息化部 ICP 域名信息备案网站自主备案相对繁琐，需要用户自己处理较多事项","source":"域名管理与备案","difficulty":"易"},{"id":"choice-052","type":"choice","globalNumber":52,"stem":"在下列备份介质，采用螺旋扫描方式读写的是 (　　)。","images":[],"options":{"A":"盒式带","B":"1/4 英寸磁带","C":"数字声频带","D":"数字线形带"},"answer":"C","analysis":"数字声频带（Digital Audio Tape，DAT）通常采用螺旋扫描方式读写数据。盒式带、1/4 英寸磁带、数字线形带一般不采用这种方式","source":"数据备份与恢复","difficulty":"难"},{"id":"choice-053","type":"choice","globalNumber":53,"stem":"下列关于数据备份方法的描述中错误的是 (　　)。","images":[],"options":{"A":"增量备份比完全备份使用的空间少","B":"差异备份比增量备份恢复的速度慢","C":"差异备份比完全备份的备份速度快","D":"恢复时完全备份使用的副本最少"},"answer":"B","analysis":"增量备份只备份自上次备份（完全备份或增量备份）以来更改的数据，所以比完全备份使用空间少；差异备份备份自上次完全备份以来更改的数据，恢复时只需使用最近一次完全备份和最近一次差异备份副本，而增量备份恢复时可能需要多个增量备份副本，所以差异备份恢复速度比增量备份快；差异备份因为只备份部分数据，所以比完全备份备份速度快；完全备份恢复时只需使用该完全备份副本，使用副本最少","source":"数据备份与恢复","difficulty":"中"},{"id":"choice-054","type":"choice","globalNumber":54,"stem":"电子公告服务提供者应当记录在电子公告服务系统中发布的信息内容及其发布时间，互联网地址或者域名。记录备份应当保存 (　　) 天。","images":[],"options":{"A":"90","B":"60","C":"30","D":"10"},"answer":"B","analysis":"根据相关规定，电子公告服务提供者记录备份应当保存 60 天，以满足监管和追溯等需求","source":"网络服务管理法规","difficulty":"易"},{"id":"choice-055","type":"choice","globalNumber":55,"stem":"电子邮件客户端通常需要用 (　　) 协议来发送邮件。","images":[],"options":{"A":"仅 SMTP","B":"仅 POP","C":"SMTP 和 POP","D":"FTP"},"answer":"A","analysis":"SMTP（简单邮件传输协议）用于发送邮件，负责将邮件从客户端发送到邮件服务器，以及在邮件服务器之间传输邮件。POP（邮局协议）用于接收邮件，从邮件服务器下载邮件到客户端。FTP（文件传输协议）用于文件传输，与邮件发送无关","source":"电子邮件服务与协议","difficulty":"易"},{"id":"choice-056","type":"choice","globalNumber":56,"stem":"根据国际标准化组织（ISO）的定义，网络管理有五大功能，其中不包括 (　　)。","images":[],"options":{"A":"故障管理","B":"配置管理","C":"操作管理","D":"性能管理"},"answer":"C","analysis":"国际标准化组织（ISO）定义的网络管理五大功能包括故障管理（检测和处理网络故障）、配置管理（管理网络设备的配置）、性能管理（监控和优化网络性能）、安全管理（保障网络安全）、计费管理（统计网络资源使用情况进行计费），不包括操作管理","source":"网络管理基础","difficulty":"易"},{"id":"choice-057","type":"choice","globalNumber":57,"stem":"以下哪个是测试网线的工具 (　　)。","images":[],"options":{"A":"数字电压表","B":"网络测试仪","C":"时域反射仪","D":"电缆检测其"},"answer":"B","analysis":"网络测试仪专门用于测试网线的连通性、线序、长度等参数。数字电压表用于测量电压；时域反射仪主要用于检测电缆中的故障位置；“电缆检测其” 表述不准确，不是常见测试工具","source":"网络布线与测试","difficulty":"易"},{"id":"choice-058","type":"choice","globalNumber":58,"stem":"查看系统开放端口的命令是 (　　)。","images":[],"options":{"A":"nslookup","B":"netstat -an","C":"net use","D":"net share"},"answer":"B","analysis":"netstat -an 命令可以用于查看系统当前开放的端口以及端口对应的连接状态等信息。nslookup 用于域名解析；net use 用于管理网络连接；net share 用于管理共享资源","source":"网络命令与工具","difficulty":"易"},{"id":"choice-059","type":"choice","globalNumber":59,"stem":"在故障排除过程中，有效地选择故障诊断工具，能够起到事半功倍的作用。故障诊断工具不包括以下哪项 (　　)。","images":[],"options":{"A":"硬件诊断工具","B":"软件诊断工具","C":"入侵防御系统","D":"各种测试命令"},"answer":"C","analysis":"硬件诊断工具可检测硬件故障，软件诊断工具可辅助检测软件问题，各种测试命令能帮助排查网络等问题。入侵防御系统主要用于防范网络攻击，并非故障诊断工具","source":"网络故障排除","difficulty":"易"},{"id":"choice-060","type":"choice","globalNumber":60,"stem":"下列哪个不属于常见的 XSS 攻击手段和目的 (　　)。","images":[],"options":{"A":"盗用 cookie，获取敏感信息","B":"利用可被攻击的域受到其他域信任的特定，以受信任来源身份请求一些平时不允许的操作","C":"利用 iframe 以用户的身份执行一些管理动作","D":"注入 payload 读取服务器上的文件"},"answer":"D","analysis":"XSS（跨站脚本攻击）常见手段包括盗用 cookie 获取敏感信息、利用域信任关系执行未授权操作、利用 iframe 以用户身份执行管理动作等。注入 payload 读取服务器上的文件属于文件注入攻击，不属于 XSS 攻击","source":"网络安全攻击与防范","difficulty":"中"},{"id":"choice-061","type":"choice","globalNumber":61,"stem":"当用户通过域名访问某一合法网站时，打开的却是一个不健康的网站，发生该现象的原因可能是 (　　)","images":[],"options":{"A":"ARP 欺骗","B":"DHCP 欺骗","C":"TCP SYN 攻击","D":"DNS 缓存中毒"},"answer":"D","analysis":"DNS 缓存中毒会篡改域名解析结果，导致用户访问合法域名时被导向其他非法或不健康网站；ARP 欺骗主要针对局域网内的地址解析；DHCP 欺骗干扰动态 IP 分配；TCP SYN 攻击主要影响 TCP 连接建立，与域名访问异常无关","source":"网络安全基础","difficulty":"中等"},{"id":"choice-062","type":"choice","globalNumber":62,"stem":"威胁的组成部分不包括 (　　)","images":[],"options":{"A":"目标","B":"信息","C":"代理","D":"事件"},"answer":"B","analysis":"威胁通常由目标、代理（攻击者）、事件等组成，信息不属于威胁的基本组成部分","source":"网络安全概念","difficulty":"简单"},{"id":"choice-063","type":"choice","globalNumber":63,"stem":"从攻击方式区分攻击类型，可分为被动攻击和主动攻击，主动攻击不可能被 (　　)","images":[],"options":{"A":"诊断","B":"检测","C":"阻止","D":"预防"},"answer":"C","analysis":"主动攻击发生时，攻击行为已经在实施，难以实时阻止。但可以通过技术手段进行诊断、检测和在攻击前预防","source":"网络安全基础","difficulty":"中等"},{"id":"choice-064","type":"choice","globalNumber":64,"stem":"分布式拒绝服务（Distributed Denial of Service, DDoS）攻击指借助于客户／服务器技术，将多个计算机联合起来作为攻击平台，对一个或多个目标发动 DDoS 攻击，从而成倍地提高拒绝服务攻击的威力，一般来说，DDoS 攻击的主要目的是破坏目标系统的 (　　)","images":[],"options":{"A":"保密性","B":"完整性","C":"可用性","D":"真实性"},"answer":"C","analysis":"DDoS 攻击通过大量请求使目标系统资源耗尽，无法正常提供服务，破坏的是系统的可用性","source":"网络安全基础","difficulty":"中等"},{"id":"choice-065","type":"choice","globalNumber":65,"stem":"在网络攻击活动中，Tribal Flood Network（TFN）是 (　　) 类的攻击程序","images":[],"options":{"A":"字典攻击","B":"网络监听","C":"病毒程序","D":"拒绝服务"},"answer":"D","analysis":"TFN 是典型的拒绝服务攻击程序，通过大量流量使目标系统瘫痪","source":"网络安全基础","difficulty":"中等"},{"id":"choice-066","type":"choice","globalNumber":66,"stem":"在计算机系统安全事件处置过程中，首要目的是查缺补漏，发现网络安全管理中存在的问题和漏洞，以下计算机系统安全事件的有 (　　)","images":[],"options":{"A":"硬件故障","B":"操作系统漏洞","C":"人为的失误","D":"路由器被攻击"},"answer":"B","analysis":"操作系统漏洞直接影响系统安全，是网络安全管理中需要重点关注和解决的问题。硬件故障、人为失误和路由器被攻击不属于以查缺补漏为首要目的的计算机系统安全事件范畴","source":"网络安全 线越多，接入速度就越快","B":"无线家用宽带路由器的无线信号穿越了钢筋混凝土墙后信号强度将会大幅度衰减","C":"无线家用宽带路由器是典型的胖 AP","D":"无线家用宽带路由器带有 DHCP 服务功能"},"answer":"A","analysis":"无线家用宽带路由器天线数量多不代表接入速度就快，速度还受多种因素影响；信号穿越钢筋混凝土墙会大幅衰减，它是胖 AP 且有 DHCP 服务功能。课程 ID 未给，考查无线网络设备知识，难度中等","source":"无","difficulty":"中等"},{"id":"choice-099","type":"choice","globalNumber":99,"stem":"对无线控制器描述错误的是 (　　)。","images":[],"options":{"A":"无线控制器是用来集中化控制无线 AP 的一种网络设备","B":"无线控制器有高度的可扩展性，一般的无线控制器都可以处理多个 AP","C":"通过无线控制器可以了解无线网络上所有 AP 的工作状态","D":"无线控制器管理的一般都是胖 AP"},"answer":"D","analysis":"无线控制器管理的一般是瘦 AP，不是胖 AP；它可集中控制 AP、有扩展性、能了解 AP 工作状态。课程 ID 未知，考查无线网络设备知识，难度中等","source":"无","difficulty":"中等"},{"id":"choice-100","type":"choice","globalNumber":100,"stem":"下面关于防火墙描述错误的是 (　　)。","images":[],"options":{"A":"防火墙是一个由计算机硬件和软件组成的系统，部署于网络边界，同时对进出网络边界的数据进行保护，防止恶意入侵、恶意代码的传播等，保障内部网络数据的安全","B":"防火墙可以限制非法用户进入内部网络","C":"利用防火墙对内部网络的划分，可实现网络中网段的隔离，保护一个网段不受来自网络内部其它网段的攻击","D":"包过滤防火墙能阻止所有的网络攻击行为"},"answer":"D","analysis":"包过滤防火墙不能阻止所有网络攻击行为，它有一定局限性；其他选项对防火墙的描述正确。课程 ID 未提及，考查网络安全设备知识，难度中等","source":"无","difficulty":"中等"},{"id":"choice-101","type":"choice","globalNumber":101,"stem":"分时操作系统的特点是 (　　)","images":[],"options":{"A":"交互性、同时性 (多路性)、独立性、及时性","B":"可靠性、交互性、动态性、及时性","C":"可靠性、交互性、独立性、及时性","D":"交互性、同时性 (多路性)、独立性、动态性"},"answer":"A","analysis":"分时操作系统支持多个用户同时使用计算机，具有交互性、同时性（多路性）、独立性和及时性的特点。交互性允许用户与系统进行交互操作；同时性（多路性）指多个用户可同时使用计算机；独立性保证每个用户的操作相互独立；及时性确保系统能及时响应用户请求。","source":"操作系统基础","difficulty":"易"},{"id":"choice-102","type":"choice","globalNumber":102,"stem":"存放系统账户的文件是 (　　)","images":[],"options":{"A":"passwd","B":"shadow","C":"gshadow","D":"group"},"answer":"A","analysis":"在 Linux 系统中，/etc/passwd 文件存放系统账户的基本信息，如用户名、用户 ID、组 ID 等。shadow 文件存放用户密码的加密信息；gshadow 文件用于存放组密码等相关信息；group 文件用于存放组的相关信息。","source":"Linux 系统管理基础","difficulty":"易"},{"id":"choice-103","type":"choice","globalNumber":103,"stem":"通过存取控制机制来防止由 (　　) 所造成的文件不安全性","images":[],"options":{"A":"人为因素","B":"自然因素","C":"系统因素","D":"硬件因素"},"answer":"A","analysis":"存取控制机制主要用于限制用户对文件的访问权限，防止因人为的非法访问、误操作等因素造成文件不安全性。自然因素（如自然灾害）、系统因素（如系统故障）和硬件因素（如硬件损坏）通常不是存取控制机制能防范的。","source":"计算机安全基础","difficulty":"易"},{"id":"choice-104","type":"choice","globalNumber":104,"stem":"设置 iptables 防火墙策略，默认禁止与本地进程进行通信，以下语法正确的是 (　　)","images":[],"options":{"A":"iptables -t filter -I INPUT ACCEPT","B":"iptables -t filter -A INPUT ACCEPT","C":"iptables -P INPUT DROP","D":"iptables -t nat -A INPUT ACCEPT"},"answer":"C","analysis":"iptables -P INPUT DROP 命令用于设置 INPUT 链的默认策略为 DROP，即默认禁止所有进入本地的数据包，从而禁止与本地进程进行通信。A 选项中 -I INPUT ACCEPT 是在 INPUT 链插入允许规则；B 选项 -A INPUT ACCEPT 是在 INPUT 链追加允许规则；D 选项 -t nat 表示使用 nat 表，不符合要求。","source":"Linux 网络配置与安全","difficulty":"中"},{"id":"choice-105","type":"choice","globalNumber":105,"stem":"哪一项不是特洛伊木马所窃取的信息 (　　)","images":[],"options":{"A":"计算机名字","B":"硬件信息","C":"即时通信 APP 的账户与密码","D":"系统文件"},"answer":"D","analysis":"特洛伊木马主要用于窃取用户的敏感信息，如计算机名字、硬件信息、即时通信 APP 的账户与密码等，以达到非法目的。它一般不会窃取系统文件来直接获取利益，系统文件的获取对攻击者的直接价值相对较小。","source":"网络安全基础","difficulty":"易"},{"id":"choice-106","type":"choice","globalNumber":106,"stem":"(　　) 是恶意代码的表现手段。任何恶意代码传播到了新的软硬件系统后，都会对系统产生不同程度的影响","images":[],"options":{"A":"目的性","B":"破坏性","C":"传播性","D":"隐蔽性"},"answer":"B","analysis":"恶意代码传播到新系统后对系统产生影响，这体现了其破坏性。目的性是恶意代码编写的意图；传播性是恶意代码扩散的能力；隐蔽性是恶意代码隐藏自身的特性，都不符合 “对系统产生影响” 这一表现手段的描述。","source":"网络安全基础","difficulty":"易"},{"id":"choice-107","type":"choice","globalNumber":107,"stem":"以下不属于 GPG 加密算法特点的是 (　　)","images":[],"options":{"A":"计算量大","B":"处理速度慢","C":"适合加密长数据","D":"使用两个密码"},"answer":"C","analysis":"GPG 加密算法采用非对称加密，计算量大、处理速度慢，使用公钥和私钥两个密码。由于其处理速度慢的特点，并不适合加密长数据，更适合加密少量关键数据（如密钥等）。","source":"加密技术基础","difficulty":"中"},{"id":"choice-108","type":"choice","globalNumber":108,"stem":"当 Web 服务器访问人数超过了设计访问人数上限，将可能出现的 HTTP 状态码是 (　　)","images":[],"options":{"A":"200 OK 请求成功，请求所希望的响应头或数据体将随此响应返回","B":"503 Service Unavailable 由于临时的服务器维护或者过载，服务器当前无法处理请求","C":"403 Forbidden 服务器已经理解请求，但是拒绝执行它","D":"302 Move temporarily 请求的资源现在临时从不同的 URI 响应请求"},"answer":"B","analysis":"当 Web 服务器访问人数超过上限导致过载时，会返回 503 Service Unavailable 状态码，表示服务器当前无法处理请求。200 OK 表示请求成功；403 Forbidden 表示服务器拒绝执行请求；302 Move temporarily 表示资源临时重定向。","source":"Web 服务器配置与管理","difficulty":"易"},{"id":"choice-109","type":"choice","globalNumber":109,"stem":"以下文件中，不属于 vsftpd 的配置文件的是 (　　)","images":[],"options":{"A":"/etc/vsftpd/vsftp.conf","B":"/etc/vsftpd/vsftpd.conf","C":"/etc/vsftpd/ftpusers","D":"/etc/vsftpd/user_list"},"answer":"A","analysis":"vsftpd 的配置文件常见的有 /etc/vsftpd/vsftpd.conf（主配置文件）、/etc/vsftpd/ftpusers（用于限制不能登录 FTP 的用户）、/etc/vsftpd/user_list（可用于控制用户登录 FTP 的权限）。A 选项中文件名错误，应为 /etc/vsftpd/vsftpd.conf。","source":"FTP 服务器配置与管理","difficulty":"易"},{"id":"choice-110","type":"choice","globalNumber":110,"stem":"samba 服务的默认安全模式等级是 (　　)","images":[],"options":{"A":"user","B":"share","C":"server","D":"ads"},"answer":"A","analysis":"samba 服务有多种安全模式，默认的安全模式等级是 user。在 user 模式下，用户访问 samba 共享资源时需要提供用户名和密码进行身份验证。","source":"Samba 服务器配置与管理","difficulty":"易"},{"id":"choice-111","type":"choice","globalNumber":111,"stem":"域名系统 DNS 的作用是 (　　)","images":[],"options":{"A":"存放主机域名","B":"存放 IP 地址","C":"存放邮件地址","D":"将域名转换成 IP 地址"},"answer":"D","analysis":"域名系统 DNS 的主要功能是将人们易于记忆的域名转换为计算机能够识别的 IP 地址，实现网络中主机的访问定位。它并不主要用于存放主机域名、IP 地址或邮件地址。","source":"域名系统与 DNS 配置","difficulty":"易"},{"id":"choice-112","type":"choice","globalNumber":112,"stem":"有一台名称为 server1 的 DHCP 服务器和一台名称为 server2 的应用程序服务器。这两台服务器运行 Windows Server 2008 R2。DHCP 服务器包含一个作用域。您需要确保 Server2 上总是收到相同的 IP 地址，Server2 上也必须从 server1 上接收到 DNS 设置和 WINS 设置，应该 (　　)","images":[],"options":{"A":"创建一个多播范围","B":"在 DHCP 作用域上创建一个 DHCP 保留","C":"给 server2 分配一个静态 IP 地址","D":"创建一个在 DHCP 范围之外的区域"},"answer":"B","analysis":"在 DHCP 作用域上创建 DHCP 保留，可以为指定的设备（如 Server2）分配固定的 IP 地址，同时该设备还能从 DHCP 服务器获取 DNS 设置和 WINS 设置。创建多播范围用于多播通信；给 server2 分配静态 IP 地址无法从 DHCP 服务器获取 DNS 和 WINS 设置；创建在 DHCP 范围之外的区域与需求无关。","source":"DHCP 服务器配置与管理","difficulty":"中"},{"id":"choice-113","type":"choice","globalNumber":113,"stem":"当需要 VLAN 跨交换机时，交换机与交换机之间连接的端口应该设置为 (　　) 端口","images":[],"options":{"A":"Access 端口","B":"Trunk 端口","C":"Hybrid 端口","D":"Console 口"},"answer":"B","analysis":"Trunk 端口用于在交换机之间传输多个 VLAN 的数据帧，当需要 VLAN 跨交换机时，通常将交换机之间的连接端口设置为 Trunk 端口。Access 端口只能属于一个 VLAN；Hybrid 端口也可用于多 VLAN 通信，但默认情况下主要用于连接终端设备；Console 口用于交换机的配置管理，不用于 VLAN 跨交换机通信。","source":"VLAN 配置与管理","difficulty":"易"},{"id":"choice-114","type":"choice","globalNumber":114,"stem":"下面说法错误的是 (　　)","images":[],"options":{"A":"VLAN 是不受物理区域和交换机限制的逻辑网络，它构成一个广播域","B":"VLAN 能解决局域网内由广播过多所带来的宽带利用率下降、安全性低等问题","C":"VLAN 的主要作用是缩小广播域，控制广播风暴","D":"所有主机和交换机都能识别带有 VLAN 标签的数据帧"},"answer":"D","analysis":"并非所有主机和交换机都能识别带有 VLAN 标签的数据帧，一些老旧设备可能不支持 VLAN 功能，无法识别 VLAN 标签。A、B、C 选项关于 VLAN 的描述均正确，VLAN 是逻辑网络，可缩小广播域，解决广播带来的问题。","source":"VLAN 配置与管理","difficulty":"易"},{"id":"choice-115","type":"choice","globalNumber":115,"stem":"生成树协议推举根网桥说法正确的是 (　　)","images":[],"options":{"A":"生成树协议推举网桥优先级数值最大的为根网桥","B":"生成树协议推举网桥 MAC 地址最小的为根网桥","C":"当网桥优先级相同时，生成树协议推举 MAC 地址最小的为根网桥","D":"当网桥优先级相同时，生成树协议推举 MAC 地址最大的为根网桥"},"answer":"C","analysis":"生成树协议首先比较网桥优先级，优先级数值越小越优先成为根网桥；当网桥优先级相同时，比较 MAC 地址，MAC 地址最小的成为根网桥。A 选项中优先级数值最大错误；B 选项缺少网桥优先级相同的前提；D 选项 MAC 地址最大错误。","source":"生成树协议与网络冗余","difficulty":"中"},{"id":"choice-116","type":"choice","globalNumber":116,"stem":"思科交换机上设置当前网桥为 VLAN 10 的根网桥的命令是 (　　)","images":[],"options":{"A":"Switch(config)#spanning-tree VLAN 10 root","B":"Switch(config)#spanning-tree VLAN 10 root primary","C":"Switch(config)#spanning-tree VLAN 10 root secondary","D":"Switch(config)#spanning-tree VLAN 10 root 0"},"answer":"B","analysis":"在思科交换机上，Switch (config)#spanning-tree VLAN 10 root primary 命令用于将当前网桥设置为 VLAN 10 的根网桥。A 选项命令不完整；C 选项 root secondary 用于设置为备份根网桥；D 选项命令格式错误。","source":"思科交换机配置","difficulty":"易"},{"id":"choice-117","type":"choice","globalNumber":117,"stem":"思科三层交换机上将物理端口转换成三层模式的命令是 (　　)","images":[],"options":{"A":"Switch(config-if)#router","B":"Switch(config-if)#no switchport","C":"Switch(config)#router","D":"Switch(config)#no switchport"},"answer":"B","analysis":"在思科三层交换机上，在接口配置模式下使用 Switch (config-if)#no switchport 命令可以将物理端口从二层交换模式转换成三层路由模式。A 选项 router 命令错误；C 选项不在接口配置模式下；D 选项同样不在接口配置模式下。","source":"思科三层交换机配置","difficulty":"易"},{"id":"choice-118","type":"choice","globalNumber":118,"stem":"设置用户进入交换机的特权视图的密码的命令是 (　　)","images":[],"options":{"A":"Switch(config)#password 123456","B":"Switch(config)#enable password 123456","C":"Switch#enable 123456","D":"Switch#enable password 123456"},"answer":"B","analysis":"在交换机全局配置模式下，使用 Switch (config)#enable password 123456 命令可以设置用户进入特权视图的密码。A 选项 password 命令错误；C 选项 enable 123456 命令格式错误；D 选项不在配置模式下。","source":"思科交换机配置","difficulty":"易"},{"id":"choice-119","type":"choice","globalNumber":119,"stem":"根据 SSH 的认证机制，必需要给本机配置一个域名才能生成密钥对进行加密。思科路由器上配置本机域名的命令是 (　　)","images":[],"options":{"A":"Router#ip domain name localname","B":"Router#ip domain-name localname","C":"Router(config)#ip domain name localname","D":"Router(config)#ip domain-name localname"},"answer":"D","analysis":"在思科路由器的全局配置模式下，使用 Router (config)#ip domain-name localname 命令配置本机域名。A、B 选项不在配置模式下；C 选项命令中 domain 和 name 之间不应有空格。","source":"思科路由器配置与安全","difficulty":"易"},{"id":"choice-120","type":"choice","globalNumber":120,"stem":"下面说法正确的是 (　　)","images":[],"options":{"A":"思科路由器可以通过 privilege 命令为特权模式配置 16 个（0 - 15）层次的命令级别，数字越大，安全级别越低","B":"思科路由器可以通过 privilege 命令为特权模式配置 16 个（0 - 15）层次的命令级别，数字越大，安全级别越高","C":"思科路由器 IOS 系统默认有三个级别：用户模式，管理员模式，特权模式","D":"思科路由器 IOS 系统默认有 16 个级别，分别用 0 - 15 的数字表示，每个级别都设定有不同的命令"},"answer":"B","analysis":"思科路由器可以通过 privilege 命令为特权模式配置 16 个（0 - 15）层次的命令级别，数字越大，安全级别越高，权限也越高。思科路由器 IOS 系统默认有用户模式和特权模式，并没有管理员模式，也不是默认有 16 个级别。","source":"思科路由器配置与安全","difficulty":"中"},{"id":"choice-121","type":"choice","globalNumber":121,"stem":"Windows Server 2008 R2 提供了很多管理工具，为了便于使用，它们具有统一的管理界面，这个界面称为 (　　)","images":[],"options":{"A":"微软管理控制台","B":"管理工具","C":"转发器","D":"域控制器"},"answer":"A","analysis":"微软管理控制台是 Windows Server 2008 R2 中用于统一管理工具的界面；管理工具是一个宽泛概念；转发器与管理界面无关；域控制器用于管理域，并非管理工具的统一界面","source":"操作系统基础","difficulty":"易"},{"id":"choice-122","type":"choice","globalNumber":122,"stem":"在域的活动目录数据库中，管理员可以为用户创建用户账户，这种用户账户只存在于域中，所以称为 (　　)", 路由器物理接口 IP 地址无法直接实现跨 VLAN 通信；access 模式用于连接终端设备，不能实现跨 VLAN 通信；trunk 模式用于交换机间链路，可允许多个 VLAN 数据通过，但单独设置不能直接实现跨 VLAN 主机通信，所以选 A","source":"网络技术相关课程 ID（假设）","difficulty":"较高"},{"id":"choice-169","type":"choice","globalNumber":169,"stem":"以下不属于主机逻辑故障的是？","images":[],"options":{"A":"主机网络地址设置不当","B":"网卡与其他设备冲突","C":"网卡驱动程序不当","D":"网卡松动"},"answer":"D","analysis":"主机网络地址设置不当、网卡与其他设备冲突、网卡驱动程序不当属于逻辑故障；网卡松动是硬件连接问题，属于物理故障，所以选 D","source":"计算机网络故障排查相关课程 ID（假设）","difficulty":"中等"},{"id":"choice-170","type":"choice","globalNumber":170,"stem":"合同的权利义务终止后，当事人根据交易习惯，履行通知、协助、保密等义务，其依据是？","images":[],"options":{"A":"诚实信用原则","B":"自愿原则","C":"公平原则","D":"平等原则"},"answer":"A","analysis":"合同权利义务终止后履行通知等义务依据的是诚实信用原则；自愿原则强调当事人自主意愿；公平原则注重利益平衡；平等原则强调主体地位平等，B、C、D 均不符合，所以选 A","source":"合同法相关课程 ID（假设）","difficulty":"较低"},{"id":"choice-171","type":"choice","globalNumber":171,"stem":"国家保护个人、组织与数据有关的权益，鼓励数据依法合理有效利用，保障数据依法有序自由流动，促进以为关键要素的数字经济发展？","images":[],"options":{"A":"信息","B":"数据","C":"技术","D":"创新"},"answer":"B","analysis":"数据是数字经济发展的关键要素，信息、技术、创新虽也重要，但不是核心关键，所以选 B","source":"数字经济相关课程 ID（假设）","difficulty":"较低"},{"id":"choice-172","type":"choice","globalNumber":172,"stem":"TCP/IP 模型由下到上依次是？","images":[],"options":{"A":"网络接口层、运输层、网络层、应用层","B":"网络接口层、网络层、运输层、应用层","C":"运输层、网络接口层、网络层、应用层","D":"应用层、运输层网络、网络层、接口层"},"answer":"B","analysis":"TCP/IP 模型从下到上依次为网络接口层、网络层、运输层、应用层，A、C、D 顺序错误，所以选 B","source":"计算机网络协议相关课程 ID（假设）","difficulty":"较低"},{"id":"choice-173","type":"choice","globalNumber":173,"stem":"目前使用最广泛的 IGP 协议是？","images":[],"options":{"A":"RIP","B":"BGP","C":"OSPF","D":"IS - IS"},"answer":"C","analysis":"OSPF 协议具有收敛速度快、支持大型网络等优点，是目前使用最广泛的 IGP 协议；RIP 收敛慢，不适合大型网络；BGP 是外部网关协议；IS - IS 使用不如 OSPF 广泛，所以选 C","source":"网络路由协议相关课程 ID（假设）","difficulty":"中等"},{"id":"choice-174","type":"choice","globalNumber":174,"stem":"下面两个标准之间是兼容的是？","images":[],"options":{"A":"802.11 和 802.11a","B":"802.11a 和 802.11b","C":"802.11a 和 802.11g","D":"802.11a 和 802.11n"},"answer":"D","analysis":"802.11n 向下兼容 802.11a 等标准；802.11a 与 802.11、802.11b、802.11g 在频段、调制方式等方面存在差异，不兼容，所以选 D","source":"无线网络标准相关课程 ID（假设）","difficulty":"中等"},{"id":"choice-175","type":"choice","globalNumber":175,"stem":"下面对无线 AP 描述错误的是？","images":[],"options":{"A":"无线 AP 又称无线接入点","B":"无线 AP 可以分为胖 AP 和瘦 AP","C":"胖 AP 只负责无线客户端的接入","D":"瘦 AP 通常需要和无线控制器同时使用"},"answer":"C","analysis":"胖 AP 不仅负责无线客户端接入，还具备独立的配置管理等功能；A、B、D 关于无线 AP 的描述正确，所以选 C","source":"无线网络设备相关课程 ID（假设）","difficulty":"中等"},{"id":"choice-176","type":"choice","globalNumber":176,"stem":"在以下认证方式中，最常用的认证方式是？","images":[],"options":{"A":"基于摘要算法认证","B":"基于数据库认证","C":"基于 PKI 认证","D":"基于账户名／口令认证"},"answer":"D","analysis":"基于账户名 / 口令认证简单易操作，是最常用的认证方式；基于摘要算法认证、基于数据库认证、基于 PKI 认证相对复杂，应用场景有一定局限性，所以选 D","source":"网络安全认证相关课程 ID（假设）","difficulty":"较低"},{"id":"choice-177","type":"choice","globalNumber":177,"stem":"一个文件的绝对路径名总是以什么打头？","images":[],"options":{"A":"磁盘名","B":"文件名","C":"字符串","D":"分隔符"},"answer":"D","analysis":"文件的绝对路径名以分隔符（如在 Linux 系统中是 “/”，在 Windows 系统中类似 “\\” ）打头，A、B、C 错误，所以选 D","source":"操作系统文件管理相关课程 ID（假设）","difficulty":"较低"},{"id":"choice-178","type":"choice","globalNumber":178,"stem":"病毒扫描软件由什么组成？","images":[],"options":{"A":"仅由病毒代码库","B":"仅由利用代码库进行扫描的扫描程序","C":"代码库和扫描程序","D":"一般代码文件"},"answer":"C","analysis":"病毒扫描软件包含病毒代码库用于识别病毒，以及扫描程序利用代码库进行检测，A、B 选项不全面；一般代码文件不是病毒扫描软件的组成部分，所以选 C","source":"计算机病毒防治相关课程 ID（假设）","difficulty":"较低"},{"id":"choice-179","type":"choice","globalNumber":179,"stem":"恶意代码是一种对计算机系统具有破坏性的？","images":[],"options":{"A":"高级语言编译程序","B":"汇编语言程序","C":"计算机程序或代码片段","D":"操作系统"},"answer":"C","analysis":"恶意代码是具有破坏性的计算机程序或代码片段，高级语言编译程序、汇编语言程序、操作系统都不是恶意代码的定义，所以选 C","source":"网络安全基础相关课程 ID（假设）","difficulty":"较低"},{"id":"choice-180","type":"choice","globalNumber":180,"stem":"木马程序的最大危害在于它对？","images":[],"options":{"A":"记录键盘信息","B":"窃取用户信息","C":"破坏软硬件系统","D":"阻塞网络"},"answer":"B","analysis":"木马程序主要目的是窃取用户信息，记录键盘信息是窃取信息的一种手段；木马程序通常不以破坏软硬件系统、阻塞网络为主要危害，所以选 B","source":"网络安全防范相关课程 ID（假设）","difficulty":"中等"},{"id":"choice-181","type":"choice","globalNumber":181,"stem":"安装 Web 服务器程序后，在地址栏输入 (　　)，不可以访问站点默认文档。","images":[],"options":{"A":"在局域网中输入服务器所在计算机的名称","B":"在局域网中直接输入服务器的 IP 地址","C":"在服务器上，直接输入http://127.0.0.1","D":"直接输入计算机 MAC 地址"},"answer":"D","analysis":"MAC 地址用于在局域网中标识设备的物理地址，不能用于访问 Web 站点默认文档；而通过服务器计算机名称、IP 地址（包括局域网内和本地回环地址 127.0.0.1）都可访问，A、B、C 选项错误，D 选项正确","source":"网络服务器配置基础","difficulty":"易"},{"id":"choice-182","type":"choice","globalNumber":182,"stem":"当 Web 服务器访问人数超过了设计访问人数上限，将可能出现的 HTTP 状态码是 (　　)。","images":[],"options":{"A":"2000K 请求成功，请求所希望的响应头或数据体将随此响应返回","B":"503Service Unavailable 由于临时的服务器维护或者过载，服务器当前无法处理请求","C":"403Forbidden 服务器已经理解请求，但是拒绝执行它","D":"302Move temporarily 请求的资源现在临时从不同的 URI 响应请求"},"answer":"B","analysis":"200 表示请求成功；403 表示服务器拒绝执行请求；302 表示资源临时转移；503 表示服务器因维护或过载无法处理请求，符合访问人数超上限的情况，A、C、D 选项错误，B 选项正确","source":"Web 服务器管理与维护","difficulty":"中"},{"id":"choice-183","type":"choice","globalNumber":183,"stem":"从信息安全角度看，以下选项中相对适合作为自己的邮箱密码的是 (　　)。","images":[],"options":{"A":"12345678","B":"password","C":"p@22W0rd!#","D":"aaaaaaaa"},"answer":"C","analysis":"A 选项 “12345678”、B 选项 “password” 和 D 选项 “aaaaaaaa” 都是简单常见的字符串，容易被破解；C 选项 “p@22W0rd!#” 包含字母、数字和特殊字符，复杂度高，安全性强","source":"信息安全基础","difficulty":"易"},{"id":"choice-184","type":"choice","globalNumber":184,"stem":"FTP 常用于数据上传，其中在进行数据上传时需进行身份验证，如果以匿名者方式登陆其输入用户名是 (　　)。","images":[],"options":{"A":"Anonymous","B":"Anonymouse","C":"GUEST","D":"USER"},"answer":"A","analysis":"匿名登录 FTP 时，常用的用户名是 “Anonymous”；B 选项拼写错误；C 选项 “GUEST” 和 D 选项 “USER” 并非匿名登录的用户名，B、C、D 选项错误，A 选项正确","source":"FTP 服务配置与应用","difficulty":"易"},{"id":"choice-185","type":"choice","globalNumber":185,"stem":"如果客户机同时得到多台 DHCP 服务器的 IP 地址，它将 (　　)。","images":[],"options":{"A":"随机选择","B":"选择最先得到的","C":"选择网络号较小的","D":"选择网络号较大的"},"answer":"B","analysis":"DHCP 客户机在接收到多台服务器的 IP 地址时，通常会选择最先收到的 IP 地址进行使用，A、C、D 选项错误，B 选项正确","source":"DHCP 服务原理与配置","difficulty":"中"},{"id":"choice-186","type":"choice","globalNumber":186,"stem":"DHCP 的作用是 (　　)。","images":[],"options":{"A":"它将 NetBIOS 名称解析成 IP 地址","B":"它将专用 IP 地址转换成公共地址","C":"它将 IP 地址解析成 MAC 地址","D":"它自动将 IP 地址分配给客户计算机"},"answer":"D","analysis":"A 选项是 WINS 的功能；B 选项是 NAT 的功能；C 选项是 ARP 的功能；DHCP 用于自动为客户计算机分配 IP 地址，A、B、C 选项错误，D 选项正确","source":"DHCP 服务原理与配置","difficulty":"易"},{"id":"choice-187","type":"choice","globalNumber":187,"stem":"某部门有越来越多的用户抱怨 DHCP 服务器自动分配的 IP 地址。因此，希望使用 Networking?Monitor 来监视 DHCP 的客户和该 DHCP 服务器之间的通讯。感兴趣的能信包是 DHCP 客户的请求和服务器的拒绝信号。为了寻找排除故障的办法，应该监视的 DHCP 消息是 (　　)。","images":[],"options":{"A":"DHCPDISCOVER 和 DHCPREQUEST","B":"DHCPREQUEST 和 DHCPNACK","C":"DHCPACK 和 DHCPNACK","D":"DHCPREQUEST 和 DHCPOFFER"},"answer":"B","analysis":"DHCPREQUEST 是客户机请求 IP 地址的消息，DHCPNACK 是服务器拒绝分配 IP 地址的消息，符合监视客户请求和服务器拒绝信号的需求；A 选项中 DHCPDISCOVER 是客户机寻找 DHCP 服务器的消息；C 选项中 DHCPACK 是服务器确认分配 IP 地址的消息；D 选项中 DHCPOFFER 是服务器提供 IP 地址的消息，A、C、D 选项错误，B 选项正确","source":"DHCP 服务故障排查","difficulty":"难"},{"id":"choice-188","type":"choice","globalNumber":188,"stem":"域名和 IP 地址之间的关系是 (　　)。","images":[],"options":{"A":"一一对应","B":"一个域名对应多个 IP 地址","C":"一个 IP 地址对应多个域名","D":"域名与 IP 地址没有关系"},"answer":"A","analysis":"虽然在实际应用中存在一个域名对应多个 IP 地址（负载均衡等场景）和一个 IP 地址对应多个域名（虚拟主机等场景）的情况，但从基础概念来说，域名和 IP 地址是一一对应的关系，通过 DNS 系统进行解析，B、C、D 选项错误，A 选项正确","source":"域名系统（DNS）原理","difficulty":"中"},{"id":"choice-189","type":"choice","globalNumber":189,"stem":"网络中有一台名为 Server1 运行 Windows Server 2008 R2 的 DNS 服务器。你要确保客户端计算机可以将 Ipv6 地址解析成 FQDN，应该创建 (　　) 类型的资源记录。","images":[],"options":{"A":"别名记录（CNAME）","B":"主机记录（A）","C":"主机记录（AAAA）","D":"指针记录（PTR）"},"answer":"D","analysis":"指针记录（PTR）用于将 IP 地址解析为域名（反向解析），可实现将 IPv6 地址解析成 FQDN（完全限定域名）；A 选项别名记录（CNAME）用于为域名创建别名；B 选项主机记录（A）用于将域名解析为 IPv4 地址；C 选项主机记录（AAAA）用于将域名解析为 IPv6 地址，A、B、C 选项错误，D 选项正确","source":"DNS 服务器配置与管理","difficulty":"中"},{"id":"choice-190","type":"choice","globalNumber":190,"stem":"对应用软件来说，隐藏自己的版本信息可以降低操守攻击的危险，对 bind 9 系统来说，可以通过下面的 (　　) 配置实现此目的。","images":[],"options":{"A":"banner “aaa”","B":"version “bbb”","C":"flag “ccc”","D":"bind 不支持此功能"},"answer":"B","analysis":"在 bind 9 系统中，通过设置 “version “字符串”” 可隐藏版本信息，“字符串” 可自定义；A 选项 “banner” 不是用于隐藏版本信息的配置；C 选项 “flag” 与隐藏版本信息无关；D 选项说法错误，bind 9 支持此功能，A、C、D 选项错误，B 选项正确","source":"bind 9 系统安全配置","difficulty":"难"},{"id":"choice-191","type":"choice","globalNumber":191,"stem":"不是网络安全威胁的有 (　　)。","images":[],"options":{"A":"网络监听","B":"拒绝服务攻击","C":"漏洞攻击","D":"拆开主机机箱"},"answer":"D","analysis":"网络监听会窃取网络数据；拒绝服务攻击会使网络服务瘫痪；漏洞攻击会利用系统漏洞入侵；而拆开主机机箱属于物理操作，不属于网络安全威胁范畴，A、B、C 选项错误，D 选项正确","source":"网络安全基础","difficulty":"易"},{"id":"choice-192","type":"choice","globalNumber":192,"stem":"思科交换机进入特权视图（或系统视图）的命令是 (　　)。","images":[],"options":{"A":"Switch\u003esystem","B":"Switch#system","C":"Switch\u003eenable","D":"Switch#enable"},"answer":"C","analysis":"在思科交换机中，从用户视图进入特权视图的命令是 “Switch\u003eenable”；A、B 选项命令错误；D 选项 “Switch#enable” 是在特权视图下重新进入特权视图（一般无需这样操作），A、B、D 选项错误，C 选项正确","source":"思科交换机基础配置","difficulty":"易"},{"id":"choice-193","type":"choice","globalNumber":193,"stem":"思科交换机上创建 VLAN 1 的虚拟接口的命令是 (　　)。","images":[],"options":{"A":"Switch#interface VLAN 1","B":"Switch#VLAN 1","C":"Switch(config)#interface VLAN 1","D":"Switch(config)#VLAN 1"},"answer":"C","analysis":"在思科交换机上，创建 VLAN 虚拟接口需进入全局配置模式（“Switch (config)#”），然后使用 “interface VLAN 1” 命令；A 选项在特权模式下，命令位置错误；B 选项 “Switch#VLAN 1” 用于创建 VLAN 1，但不是创建虚拟接口；D 选项 “Switch (config)#VLAN 1” 用于创建 VLAN 1，A、B、D 选项错误，C 选项正确","source":"思科交换机 VLAN 配置","difficulty":"中"},{"id":"choice-194","type":"choice","globalNumber":194,"stem":"思科交换机上，对 trunk 端口描述正确的是 (　　)。","images":[],"options":{"A":"trunk 端口默认允许所有 VLAN 通过","B":"trunk 端口默认只允许 VLAN 1 通过","C":"trunk 端口默认拒绝所有 VLAN 通过","D":"trunk 端口默认只拒绝 VLAN 1 通过"},"answer":"A","analysis":"思科交换机的 trunk 端口默认允许所有 VLAN 通过，用于实现不同 VLAN 间数据在交换机间的传输；B、C、D 选项描述错误，A 选项正确","source":"思科交换机 VLAN 间通信配置","difficulty":"中"},{"id":"choice-195","type":"choice","globalNumber":195,"stem":"(　　) 端口拥有从非根网桥到根网桥的最低路径开销。","images":[],"options":{"A":"根端口","B":"指定端口","C":"阻塞端口","D":"非根非指定端口"},"answer":"A","analysis":"根端口是指在非根网桥中，到根网桥路径开销最小的端口；指定端口用于转发数据，其路径开销不一定最小；阻塞端口处于阻塞状态，不转发数据；非根非指定端口是不满足根端口和指定端口条件的端口，B、C、D 选项错误，A 选项正确","source":"生成树协议（STP）原理","difficulty":"中"},{"id":"choice-196","type":"choice","globalNumber":196,"stem":"交换机配置了特权视图的密码为 123456，下面命令可以删除特权视图密码的是 (　　)。","images":[],"options":{"A":"Switch(config)#enable password","B":"Switch(config)#enable password 123456","C":"Switch(config)#no enable password 123456","D":"Switch(config)#no enable password"},"answer":"D","analysis":"在思科交换机配置中，“no enable password” 命令可删除特权视图密码；A 选项 “Switch (config)#enable password” 命令格式不完整，无法删除密码；B 选项是设置密码为 123456，不是删除密码；C 选项 “no enable password 123456” 命令错误，应该直接使用 “no enable password”，A、B、C 选项错误，D 选项正确","source":"思科交换机安全配置","difficulty":"中"},{"id":"choice-197","type":"choice","globalNumber":197,"stem":"思科交换机上删除闪存中的文件或目录的命令是 (　　)。","images":[],"options":{"A":"rd","B":"md","C":"cd","D":"delete"},"answer":"D","analysis":"在思科交换机上，“delete” 命令用于删除闪存中的文件或目录；A 选项 “rd” 是 Windows 系统删除目录的命令；B 选项 “md” 用于创建目录；C 选项 “cd” 用于切换目录，A、B、C 选项错误，D 选项正确","source":"思科交换机文件管理","difficulty":"易"},{"id":"choice-198","type":"choice","globalNumber":198,"stem":"配置 vty 账号的为简单密码验证的命令是 (　　)。","images":[],"options":{"A":"Router(config-line)#login local","B":"Router(config-line)#no login","C":"Router(config-line)#login","D":"Router(config-line)#no login local"},"answer":"C","analysis":"“Router (config-line)#login” 命令用于配置 vty 线路进行简单密码验证；A 选项 “Router (config-line)#login local” 用于配置基于本地用户数据库进行验证；B 选项 “Router (config-line)#no login” 表示关闭登录验证；D 选项 “Router (config-line)#no login local” 表示关闭基于本地用户数据库的登录验证，A、B、D 选项错误，C 选项正确","source":"路由器安全配置","difficulty":"中"},{"id":"choice-199","type":"choice","globalNumber":199,"stem":"在 Windows 系统中不能删除的用户是 (　　)。","images":[],"options":{"A":"test","B":"Power user","C":"GUEST","D":"Administrator"},"answer":"D","analysis":"Administrator 是 Windows 系统的管理员用户，承担系统管理的关键职责，不能被删除；test 是普通自定义用户，可以删除；Power user 和 GUEST 是系统内置的非管理员用户，也可以删除，A、B、C 选项错误，D 选项正确","source":"Windows 系统用户管理","difficulty":"易"},{"id":"choice-200","type":"choice","globalNumber":200,"stem":"在 “本地用户和组” 中建立一个新用户 student，系统默认该用户属于 (　　)。","images":[],"options":{"A":"administrators","B":"Power Users","C":"Guests","D":"Users"},"answer":"D","analysis":"在 Windows 系统 “本地用户和组” 中新建用户时，默认属于 Users 组；administrators 组是管理员组；Power Users 组有部分管理权限；Guests 组是来宾组，权限受限，A、B、C 选项错误，D 选项正确","source":"Windows 系统用户管理","difficulty":"易"},{"id":"choice-201","type":"choice","globalNumber":201,"stem":"以下关于 NTFS 权限作用原则的描述中，不正确的是 (　　)","images":[],"options":{"A":"具有累加性","B":"拒绝权限优先于其他权限","C":"文件权限优先于文件夹权限","D":"不需要设置权限"},"answer":"D","analysis":"NTFS 权限具有累加性，拒绝权限优先于其他权限，文件权限优先于文件夹权限，权限设置是保障系统安全的重要手段，所以 “不需要设置权限” 的说法错误。","source":"操作系统安全基础相关课程 ID","difficulty":"易"},{"id":"choice-202","type":"choice","globalNumber":202,"stem":"账号锁定策略中对超过一定次数的错误登录账号进行锁定是为了对抗 (　　) 攻击","images":[],"options":{"A":"分布式拒绝服务攻击 (DDoS)","B":"病毒传染","C":"口令暴力破解","D":"缓冲区溢出攻击"},"answer":"C","analysis":"口令暴力破解是通过不断尝试密码来获取访问权限，账号锁定策略可以有效阻止这种攻击，而分布式拒绝服务攻击、病毒传染、缓冲区溢出攻击与账号错误登录锁定机制无关。","source":"网络安全策略课程 ID","difficulty":"易"},{"id":"choice-203","type":"choice","globalNumber":203,"stem":"如果现在要 Linux 操作系统中新增一个用户叫 china，则应用的指令命令是 (　　)","images":[],"options":{"A":"adduser china","B":"useradd china","C":"mkdir china","D":"vi china"},"answer":"B","analysis":"在 Linux 系统中，useradd 命令用于添加用户，adduser 是 Debian 系 Linux 中的等效命令，在一般常见的 Linux 发行版（如 Red Hat、CentOS 等）中使用 useradd，mkdir 用于创建目录，vi 用于编辑文件。","source":"Linux 系统管理课程 ID","difficulty":"易"},{"id":"choice-204","type":"choice","globalNumber":204,"stem":"某文件的组外成员的权限为只读；所有者有全部权限；组内的权限为读与写，则该文件的权限为 (　　)","images":[],"options":{"A":"467","B":"674","C":"476","D":"764"},"answer":"D","analysis":"在 Linux 文件权限表示中，所有者权限用数字表示为：读（4）、写（2）、执行（1），全部权限为 4 + 2 + 1 = 7；组权限：读（4）、写（2），为 4 + 2 = 6；组外成员权限：只读（4），所以文件权限为 764。","source":"Linux 文件权限管理课程 ID","difficulty":"中"},{"id":"choice-205","type":"choice","globalNumber":205,"stem":"以下哪个命令可以删除一个非空子目录 /tmp (　　)","images":[],"options":{"A":"del /tmp/*","B":"rm –rf /tmp","C":"rm –Ra /tmp/*","D":"rm –rf /tmp/*"},"answer":"B","analysis":"在 Linux 系统中，rm -rf 命令用于递归强制删除目录及其内容，可删除非空子目录。del 是 Windows 系统下的删除命令，rm -Ra 命令格式错误，rm -rf /tmp/中 “/” 多余。","source":"Linux 文件与目录管理课程 ID","difficulty":"易"},{"id":"choice-206","type":"choice","globalNumber":206,"stem":"一般说来，Red Hat Linux 内核的源程序可以在 (　　) 目录下找到","images":[],"options":{"A":"/usr/local","B":"/usr/src","C":"/lib","D":"/usr/share"},"answer":"B","analysis":"在 Red Hat Linux 系统中，内核源程序通常存放在 /usr/src 目录下，/usr/local 用于存放本地安装的软件，/lib 是存放系统库文件的目录，/usr/share 存放共享数据。","source":"Linux 系统结构课程 ID","difficulty":"易"},{"id":"choice-207","type":"choice","globalNumber":207,"stem":"为了修改文件 test 的许可模式，使其文件属主具有读、写和运行的权限，组和其他用户可以读和运行，可以采用的方法 (　　)","images":[],"options":{"A":"chmod 755 test","B":"chmod 700 test","C":"chmod ux+rwx test","D":"chmod g-w test"},"answer":"A","analysis":"chmod 命令用于修改文件权限，755 表示文件属主有读（4）、写（2）、运行（1）权限（4 + 2 + 1 = 7），组和其他用户有读（4）、运行（1）权限（4 + 1 = 5）。chmod 700 表示文件属主有全部权限，组和其他用户无任何权限；chmod ux+rwx test 命令格式错误；chmod g-w 是去除组用户的写权限。","source":"Linux 文件权限设置课程 ID","difficulty":"中"},{"id":"choice-208","type":"choice","globalNumber":208,"stem":"SQL Server 支持两种身份验证模式，即 Windows 身份验证模式和混合模式。SQL Server 的混全模式是指：当网络用户尝试接到 SQL Server 数据库时 (　　)","images":[],"options":{"A":"Windows 获取用户输入的用户和密码，并提交给 SQL Serve 进行身份验证，并决定用户的数据库访权限","B":"SQL Serve 根据用户输入的用户和密码，并提交给 Windows 进行身份验证，并决定用户的数据库访权限","C":"SQL Serve 根据已在 Windows 网络中登录的用户的网络安全属性，对用户进行身份验证，并决定用户的数据库访权限","D":"登录到本地 Windows 的用户均可无限制访问 SQL Serve 数据库"},"answer":"C","analysis":"在混合模式下，SQL Server 既可以使用 Windows 身份验证（根据已登录 Windows 用户的网络安全属性验证），也可以使用 SQL Server 身份验证（根据用户输入的用户名和密码验证），A、B 描述错误，D 中 “无限制访问” 错误。","source":"SQL Server 数据库安全课程 ID","difficulty":"中"},{"id":"choice-209","type":"choice","globalNumber":209,"stem":"下列叙述不属于完全备份机制特点描述的是 (　　)","images":[],"options":{"A":"每次备份的数据量较大","B":"每次备份所需的时间也就较大","C":"不能进行得太频繁","D":"需要存储空间小"},"answer":"D","analysis":"完全备份是对整个数据集合进行备份，每次备份的数据量较大，所需时间长，由于数据量大，不能过于频繁进行备份，且需要大量存储空间，“需要存储空间小” 不属于其特点。","source":"数据备份策略课程 ID","difficulty":"易"},{"id":"choice-210","type":"choice","globalNumber":210,"stem":"当选择一个异地备份的站点的时候，最重要的是 (　　)","images":[],"options":{"A":"和数据中心物理隔离从而不会遭受相同的风险","B":"给同样程度的保护像在数据中心一样","C":"外包到可信任的第三方","D":"准备监视能力"},"answer":"A","analysis":"选择异地备份站点时，确保和数据中心物理隔离，避免遭受相同风险（如自然灾害等）是首要考虑因素，B、C、D 虽然也重要，但不是最重要的。","source":"数据备份与恢复课程 ID","difficulty":"易"},{"id":"choice-211","type":"choice","globalNumber":211,"stem":"差异备份、增量备份、完全备份三种备份策略的恢复速度由慢到快依次为 (　　)","images":[],"options":{"A":"增量备份、差异备份、完全备份","B":"差异备份、增量备份、完全备份","C":"完全备份、差异备份、增量备份","D":"完全备份、增量备份、差异备份"},"answer":"A","analysis":"增量备份只备份自上次备份（完全备份或增量备份）以来更改的数据，恢复时需要按备份顺序依次还原多个增量备份，恢复速度最慢；差异备份备份自上次完全备份以来更改的数据，恢复时只需还原完全备份和最新的差异备份；完全备份恢复时只需还原一次备份数据，所以恢复速度由慢到快是增量备份、差异备份、完全备份。","source":"数据备份策略课程 ID","difficulty":"中"},{"id":"choice-212","type":"choice","globalNumber":212,"stem":"以下哪类存储系统有自己的文件系统 (　　)","images":[],"options":{"A":"DAS","B":"NAS","C":"SAN","D":"LAN"},"answer":"B","analysis":"NAS（网络附属存储）是一种专门的文件存储设备，有自己独立的文件系统，可通过网络提供文件共享服务；DAS（直接附加存储）通常依赖主机操作系统管理文件系统；SAN（存储区域网络）主要提供块级存储服务，本身没有独立文件系统；LAN 是局域网，是一种网络类型，不是存储系统。","source":"存储技术基础课程 ID","difficulty":"易"},{"id":"choice-213","type":"choice","globalNumber":213,"stem":"电子公告服务提供者应当记录在电子公告服务系统中发布的信息内容及其发布时间，互联网地址或者域名。记录备份应当保存 (　　) 天","images":[],"options":{"A":"90","B":"60","C":"30","D":"10"},"answer":"B","analysis":"根据相关规定，电子公告服务提供者记录备份应保存 60 天，这是网络信息管理的要求。","source":"网络信息管理法规课程 ID","difficulty":"易"},{"id":"choice-214","type":"choice","globalNumber":214,"stem":"Backup 命令的功能是用于完成 UNIX/Linux 文件的备份，对于 FTP 服务器来说，下面说法不正确的是 (　　)","images":[],"options":{"A":"Backup E-C 命令用于进行完整备份","B":"Backup-p 命令用于进行增量备份","C":"Backup-f 命令备份由 file 指定的文件","D":"Backup-d 命令当备份设备为磁带时使用此选项"},"answer":"D","analysis":"在 UNIX/Linux 系统中，Backup 命令并没有 Backup -d 命令用于当备份设备为磁带时的选项，A、B、C 对 Backup 命令功能描述正确。","source":"UNIX/Linux 系统备份课程 ID","difficulty":"中"},{"id":"choice-215","type":"choice","globalNumber":215,"stem":"Oracle 通过修改用户密码策略可提高密码强度，密码策略参数中下列描述错误的是 (　　)","images":[],"options":{"A":"PASSWORD_MAX 登录超过有效次数锁定时间","B":"FAILED_LOGIN_ATTEMPTS 最大错误登录次数","C":"PASSWORD_GRACE_TIME 密码失效后锁定时间","D":"PASSWORD_LIFE_TIME 口令有效时间"},"answer":"A","analysis":"PASSWORD_MAX 不是登录超过有效次数锁定时间，在 Oracle 密码策略中，FAILED_LOGIN_ATTEMPTS 表示最大错误登录次数，PASSWORD_GRACE_TIME 表示密码失效后锁定时间，PASSWORD_LIFE_TIME 表示口令有效时间。","source":"Oracle 数据库安全课程 ID","difficulty":"中"},{"id":"choice-216","type":"choice","globalNumber":216,"stem":"以下命令 (　　) 主要用于确定网络的连通性，对于确定网络是否正确连接，和网络连接状况的","images":[],"options":{"A":"ipconfig","B":"ping","C":"netstat","D":"tracert"},"answer":"B","analysis":"ping 命令通过向目标主机发送 ICMP 回声请求数据包，来测试网络的连通性；ipconfig 用于查看本地网络配置信息；netstat 用于查看网络连接、路由表等网络状态信息；tracert 用于跟踪数据包在网络中的路由路径。","source":"网络命令使用课程 ID","difficulty":"易"},{"id":"choice-217","type":"choice","globalNumber":217,"stem":"(　　) 是指为防止系统故障或其他安全事件导致数据丢失，而将数据从应用主机的硬盘或阵列复制、存储到其他存储介质","images":[],"options":{"A":"数据分类","B":"数据备份","C":"数据加密","D":"网络日志"},"answer":"B","analysis":"数据备份的定义就是为防止数据丢失，将数据从应用主机的存储设备复制到其他存储介质；数据分类是对数据进行分类管理，数据加密是对数据进行加密保护，网络日志是记录网络活动的文件。","source":"数据备份技术课程 ID","difficulty":"易"},{"id":"choice-218","type":"choice","globalNumber":218,"stem":"黑客搭线窃听属于 (　　) 风险","images":[],"options":{"A":"信息存储安全","B":"信息传输安全","C":"信息访问安全","D":"信息使用安全"},"answer":"B","analysis":"黑客搭线窃听是在数据传输过程中获取信息，属于信息传输安全风险；信息存储安全关注数据存储时的安全性，信息访问安全涉及对数据访问的控制，信息使用安全侧重于数据使用过程中的安全。","source":"网络安全风险分类课程 ID","difficulty":"易"},{"id":"choice-219","type":"choice","globalNumber":219,"stem":"网络后门的功能是 (　　)","images":[],"options":{"A":"防止管理员密码丢失","B":"保持对目标主机长期控制","C":"为定期维护主机","D":"为了防止主机被非法入侵"},"answer":"B","analysis":"网络后门是黑客为了保持对目标主机长期控制而在目标主机上开设的非法通道，不是防止管理员密码丢失、定期维护主机或防止主机被非法入侵的手段。","source":"网络安全攻击与防范课程 ID","difficulty":"易"},{"id":"choice-220","type":"choice","globalNumber":220,"stem":"当用户通过域名访问某一合法网站时，打开的却是一个不健康的网站，发生该现象的原因可能是 (　　)","images":[],"options":{"A":"ARP 欺骗","B":"DHCP 欺骗","C":"TCP SYN 攻击","D":"DNS 缓存中毒"},"answer":"D","analysis":"DNS 缓存中毒会导致域名解析错误，使合法域名被解析到错误的 IP 地址，从而用户访问合法域名时打开不健康网站；ARP 欺骗主要影响局域网内的地址解析，DHCP 欺骗干扰动态 IP 地址分配，TCP SYN 攻击是一种拒绝服务攻击方式。","source":"网络安全攻击类型课程 ID","difficulty":"中"},{"id":"choice-221","type":"choice","globalNumber":221,"stem":"新一代病毒木马融合了很多新技术，下来不属于这些新技术的是 (　　)","images":[],"options":{"A":"进程注入","B":"注册表隐藏","C":"漏洞扫描","D":"破坏性"},"answer":"D","analysis":"进程注入、注册表隐藏、漏洞扫描都属于病毒木马融合的新技术，而破坏性是病毒木马的特性，并非新技术，所以选 D","source":"网络安全基础课程","difficulty":"易"},{"id":"choice-222","type":"choice","globalNumber":222,"stem":"在网络攻击活动中，Tribal Flood Network（TFN）是 (　　) 类的攻击程序","images":[],"options":{"A":"字典攻击","B":"网络监听","C":"病毒程序","D":"拒绝服务"},"answer":"D","analysis":"Tribal Flood Network（TFN）是典型的拒绝服务攻击程序，通过大量请求使目标服务器资源耗尽，无法正常提供服务，所以选 D","source":"网络安全攻击类型课程","difficulty":"易"},{"id":"choice-223","type":"choice","globalNumber":223,"stem":"(　　) 措施不属于有效对抗拒绝服务攻击的","images":[],"options":{"A":"带宽限制","B":"增强服务器的性能","C":"提高管理员的能力","D":"只允许必要的通信"},"answer":"C","analysis":"带宽限制可控制流量，增强服务器性能能提升应对能力，只允许必要通信能减少不必要请求，而提高管理员能力对直接对抗拒绝服务攻击作用不大，所以选 C","source":"网络安全防御技术课程","difficulty":"中"},{"id":"choice-224","type":"choice","globalNumber":224,"stem":"(　　) 是用于确定所声明的身份的有效性","images":[],"options":{"A":"访问控制","B":"身份鉴别","C":"数据保密","D":"防止否认"},"answer":"B","analysis":"身份鉴别是验证声明身份有效性的过程，访问控制是控制对资源的访问，数据保密是保护数据不被泄露，防止否认是防止用户否认操作，所以选 B","source":"信息安全认证课程","difficulty":"易"},{"id":"choice-225","type":"choice","globalNumber":225,"stem":"某商贸公司信息安全管理员考虑到信息系统对业务影响越来越重要，计划编制本单位信息安全应急响应预案，在向主管领导写报告时，他列举了编制信息安全应急响应预案的好处和重要性，在他罗列的四条理由中，其中不适合作为理由的一条是 (　　)","images":[],"options":{"A":"应急预案是明确关键业务系统信息安全应急响应指挥体系和工作机制的重要方式","B":"应急预案是提高应对网络和信息系统突发事件能力，减少突发事件造成的损失和危害，保障信息系统运行平稳，安全、有序、高效的手段","C":"编制应急预案是国家网络安全对所有单位的强制要求，因此必须建设","D":"应急预案是保障单位业务系统信息安全的重要措施"},"answer":"D","analysis":"A、B、C 选项分别从应急体系、应对能力、国家要求方面说明了编制预案的好处，而 D 选项表述过于笼统，相比之下不适合作为主要理由，所以选 D","source":"信息安全应急管理课程","difficulty":"中"},{"id":"choice-226","type":"choice","globalNumber":226,"stem":"计算机系统中最重要的安全隐患是 (　　)","images":[],"options":{"A":"配置审查","B":"临时账户管理","C":"数据安全迁移","D":"程序安装"},"answer":"A","analysis":"配置审查如果不严谨，可能导致系统存在安全漏洞，是计算机系统中较为关键的安全隐患。临时账户管理、数据安全迁移、程序安装虽然也可能带来安全问题，但不是最重要的隐患，所以选 A","source":"计算机系统安全课程","difficulty":"中"},{"id":"choice-227","type":"choice","globalNumber":227,"stem":"以下方法中，不适用于检测计算机病毒的是 (　　)","images":[],"options":{"A":"特征代码法","B":"校验 HASH 值","C":"加密","D":"动态调试"},"answer":"C","analysis":"特征代码法通过比对病毒特征来检测，校验 HASH 值可检查文件完整性判断是否被篡改，动态调试可跟踪程序运行发现异常，而加密是对数据进行保护的手段，不能直接检测病毒，所以选 C","source":"计算机病毒检测技术课程","difficulty":"易"},{"id":"choice-228","type":"choice","globalNumber":228,"stem":"通过采取适度防护，加强 (　　) 落实对安全事件的响应。建立对威胁的防护来保障系统的安全","images":[],"options":{"A":"信息系统","B":"信息安全保障","C":"检测工作","D":"威胁"},"answer":"C","analysis":"加强检测工作能够及时发现安全事件和威胁，进而落实响应和防护措施保障系统安全。信息系统、信息安全保障是整体范畴，威胁是需要防范的对象，所以选 C","source":"信息安全防护策略课程","difficulty":"易"},{"id":"choice-229","type":"choice","globalNumber":229,"stem":"口令之所以能被攻击，下面说法正确的是 (　　)","images":[],"options":{"A":"没有进行加密传输","B":"加密算法太简单","C":"口令太简单","D":"口令输入次数没有限制"},"answer":"D","analysis":"口令输入次数没有限制，攻击者就可通过多次尝试进行暴力破解。没有加密传输、加密算法简单、口令简单也可能导致口令被攻击，但相比之下，口令输入次数无限制是更直接的攻击原因，所以选 D","source":"口令安全课程","difficulty":"中"},{"id":"choice-230","type":"choice","globalNumber":230,"stem":"下面最有可能作为万能密码使用的是 (　　)","images":[],"options":{"A":"用户名输入：admin’ or 1=1#","B":"口令输入：password’ or 1=1#","C":"用户名输入：admin’ or 1=1 limit 1#","D":"口令输入：admin’ or 1=1 limit 1#"},"answer":"C","analysis":"在 SQL 注入中，“admin’ or 1=1 limit 1#” 这种输入方式可能利用数据库漏洞，使查询语句永远为真，从而达到类似万能密码的效果，所以选 C","source":"SQL 注入攻击防范课程","difficulty":"中"},{"id":"choice-231","type":"choice","globalNumber":231,"stem":"在 SQL 注入中，以下注入方式消耗时间最长的是 (　　)","images":[],"options":{"A":"联合注入","B":"报错注入","C":"时间盲注","D":"宽字节注入"},"answer":"C","analysis":"联合注入、报错注入可直接获取数据，宽字节注入利用编码漏洞注入数据，而时间盲注通过判断数据库响应时间来获取数据，需要多次尝试，消耗时间最长，所以选 C","source":"SQL 注入技术课程","difficulty":"难"},{"id":"choice-232","type":"choice","globalNumber":232,"stem":"口令破解的最好方法是 (　　)","images":[],"options":{"A":"暴力破解","B":"组合破解","C":"字典攻击","D":"生日攻击"},"answer":"B","analysis":"暴力破解是穷举所有可能，效率低；字典攻击依赖字典库，局限性大；生日攻击主要针对哈希函数。组合破解结合多种方式，综合利用不同破解方法的优势，相比之下是最好的方法，所以选 B","source":"口令破解技术课程","difficulty":"中"},{"id":"choice-233","type":"choice","globalNumber":233,"stem":"常规端口扫描和半开式扫描的区别是 (　　)","images":[],"options":{"A":"没什么区别","B":"没有完成三次握手，缺少 ACK 过程","C":"半开式采用 UDP 方式扫描","D":"扫描准确性不一样"},"answer":"B","analysis":"常规端口扫描完成三次握手，半开式扫描只完成 SYN 阶段，不完成 ACK 过程，以此来隐藏扫描行为，所以选 B","source":"端口扫描技术课程","difficulty":"易"},{"id":"choice-234","type":"choice","globalNumber":234,"stem":"不经常访问的数据被驻留在较低成本的存储器中，所体现出的分级存储的优点为 (　　)","images":[],"options":{"A":"减少总体存储成本","B":"性能优化","C":"改善数据可用性","D":"数据迁移对应用透明"},"answer":"A","analysis":"将不常访问数据存于低成本存储器，充分利用存储资源，降低了整体存储成本，所以选 A","source":"存储技术课程","difficulty":"易"},{"id":"choice-235","type":"choice","globalNumber":235,"stem":"分级存储是根据数据的 (　　)、容量、性能等指标，将数据采取不同的存储方式分别存储在不同性能的存储设备上","images":[],"options":{"A":"重要性","B":"访问频率","C":"保留时间","D":"重要性、访问频率、保留时间"},"answer":"D","analysis":"分级存储综合考虑数据的重要性、访问频率、保留时间以及容量、性能等多方面因素，合理分配存储方式，所以选 D","source":"存储管理课程","difficulty":"中"},{"id":"choice-236","type":"choice","globalNumber":236,"stem":"RAID1 中数据冗余是通过什么技术实现的 (　　)","images":[],"options":{"A":"OX","B":"海明码校验","C":"P＋Q 双校验","D":"镜像"},"answer":"D","analysis":"RAID1 通过镜像技术，将数据同时存储在两个或多个磁盘上，实现数据冗余，保障数据安全性，所以选 D","source":"RAID 技术课程","difficulty":"易"},{"id":"choice-237","type":"choice","globalNumber":237,"stem":"系统初次备份应该选择 (　　)","images":[],"options":{"A":"整盘备份","B":"增量备份","C":"自定义备份","D":"文件备份"},"answer":"A","analysis":"系统初次备份选择整盘备份可以完整备份系统所有数据，为后续的恢复提供全面的数据基础。增量备份基于已有备份，自定义备份和文件备份可能不全面，所以选 A","source":"数据备份与恢复课程","difficulty":"易"},{"id":"choice-238","type":"choice","globalNumber":238,"stem":"随机进程名称是恶意代码迷惑管理员和系统安全检查人员的技术手段之一，以下对于随机进程名技术，描述正确的是 (　　)","images":[],"options":{"A":"随机进程名技术虽然每次进程都是随机的，但是只要找到了进程名称，就找到了恶意代码程序本身","B":"恶意代码生成随机进程名称的目的是使进程名称不固定，因为杀毒软件是按照进程名称进行病毒进程查杀","C":"恶意代码使用随机进程名是通过生成特定格式的进程名称，使进程管理器中看不到恶意代码的进程","D":"随机进程名技术每次启动时随机生成恶意代码进程名称，通过不固定的进程名称使自己不容易被发现真实的恶意代码程序名称"},"answer":"D","analysis":"随机进程名技术通过每次启动时随机生成进程名，避免被轻易识别出恶意代码程序，A 选项找到进程名不一定找到程序本身，B 选项杀毒软件并非单纯按进程名查杀，C 选项进程管理器中还是能看到进程，所以选 D","source":"恶意代码分析课程","difficulty":"中"},{"id":"choice-239","type":"choice","globalNumber":239,"stem":"某个 U 盘已染有病毒，为防止该病毒传染计算机，正确的措施是 (　　)","images":[],"options":{"A":"删除该 U 盘上的所有程序","B":"给该 U 盘加上写保护","C":"对 U 盘进行格式化","D":"将该 U 盘放一段时间后再使用"},"answer":"C","analysis":"删除所有程序可能无法彻底清除病毒，加写保护不能清除病毒，放一段时间病毒依然存在。格式化可以彻底清除 U 盘中的数据和病毒，所以选 C","source":"计算机病毒防范课程","difficulty":"易"},{"id":"choice-240","type":"choice","globalNumber":240,"stem":"对用户账号和通讯群组名称、昵称、简介、备注、标识，信息发布、转发、评论和通讯群组等服务功能中违法有害信息的防范处置和有关记录保存措施，正确的做法是 (　　)","images":[],"options":{"A":"通过网络转发给其他人","B":"截图等方式留存相关记录","C":"不理会，不转发","D":"告诉他人一起观看"},"answer":"B","analysis":"A 选项转发有害信息违法，C 选项不理会不利于监管，D 选项一起观看有害信息同样不可取。截图留存记录有助于后续对违法有害信息的调查和处理，所以选 B","source":"网络信息安全法律法规课程","difficulty":"易"},{"id":"choice-241","type":"choice","globalNumber":241,"stem":"() 是约定俗成的大家共同遵循的行为准则。","images":[],"options":{"A":"社会公德","B":"社会责任","C":"社会文化","D":"社会价值"},"answer":"A","analysis":"社会公德是全体公民在社会交往和公共生活中应该遵循的行为准则，具有约定俗成、共同遵循的特点；社会责任侧重于个体或组织对社会应承担的责任；社会文化是社会的精神财富和物质财富总和；社会价值强调事物对社会的积极意义。所以选 A。","source":"无","difficulty":"易"},{"id":"choice-242","type":"choice","globalNumber":242,"stem":"对于学生来说，职业素养培养最大的意义是 ()。","images":[],"options":{"A":"有利于个人成长","B":"提高就业竞争力","C":"提高学习能力","D":"提高身体素质"},"answer":"B","analysis":"在学生面临就业的情况下，提高就业竞争力对学生未来发展影响最大。虽然职业素养培养有利于个人成长、学习能力提升，但相比之下，就业竞争力与学生职业发展直接相关；职业素养培养与提高身体素质关系不大。所以选 B。","source":"无","difficulty":"易"},{"id":"choice-243","type":"choice","globalNumber":243,"stem":"字长是 CPU 的主要技术性能指标之一，它表示的是 ()。","images":[],"options":{"A":"CPU 能表示的最大的有效数字位数","B":"CPU 能表示的十进制整数的位数","C":"CPU 的计算结果的有效数字长度","D":"CPU 一次能处理二进制数据的位数"},"answer":"D","analysis":"字长指 CPU 一次能处理二进制数据的位数，它决定了计算机的运算精度和处理能力。A、B、C 选项对字长的定义不准确。所以选 D。","source":"无","difficulty":"中"},{"id":"choice-244","type":"choice","globalNumber":244,"stem":"下列各项中两个软件均属于系统软件的是 ()。","images":[],"options":{"A":"WPS 和 UNIX","B":"MIS 和 WPS","C":"MIS 和 UNIX","D":"DOS 和 UNIX"},"answer":"D","analysis":"系统软件是管理和控制计算机硬件与软件资源的软件，DOS、UNIX 是常见的操作系统，属于系统软件；WPS 是办公软件，MIS（管理信息系统）是应用软件。所以选 D。","source":"无","difficulty":"中"},{"id":"choice-245","type":"choice","globalNumber":245,"stem":"以下关于关联的叙述正确的是 ()。","images":[],"options":{"A":"可在两个表的不同数据类型的字段间创建关联","B":"可在两个表的不同数据类型的同名字段间创建关联","C":"可在两个表的相同数据类型的不同名称的字段间创建关联","D":"在创建关联时选择了级联更新相关的字段，则外键表中的字段值变化时，可自动修改主键表中的关联字段"},"answer":"C","analysis":"创建关联时，字段需具有相同数据类型，但字段名可以不同；不同数据类型字段间不能创建关联；级联更新是主键表字段值变化时，外键表关联字段自动更新，而不是外键表字段值变化影响主键表。所以选 C。","source":"无","difficulty":"中"},{"id":"choice-246","type":"choice","globalNumber":246,"stem":"TCP/IP 体系结构中，将计算机网络划分为 () 个层次。","images":[],"options":{"A":"4","B":"5","C":"6","D":"7"},"answer":"A","analysis":"TCP/IP 体系结构将计算机网络划分为网络接口层、网际层、传输层和应用层 4 个层次。所以选 A。","source":"无","difficulty":"易"},{"id":"choice-247","type":"choice","globalNumber":247,"stem":"单模光纤的传输方向是 ()。","images":[],"options":{"A":"散射","B":"衍射","C":"沿光纤直径方向","D":"全反射"},"answer":"C","analysis":"单模光纤只允许一束光沿光纤直径方向传播，散射、衍射不是单模光纤主要传输方式，全反射是光纤传输的原理，但这里强调的是单模光纤传输方向是沿光纤直径方向。所以选 C。","source":"无","difficulty":"中"},{"id":"choice-248","type":"choice","globalNumber":248,"stem":"路由器是互连网络的重要设备之一，它工作在 OSI 的 ()。","images":[],"options":{"A":"数据链路层","B":"网络层","C":"传输层","D":"会话层"},"answer":"B","analysis":"路由器主要功能是根据 IP 地址进行网络层的数据包转发，工作在 OSI 的网络层。数据链路层设备如交换机；传输层主要负责端到端的通信；会话层负责建立、管理和终止会话。所以选 B。","source":"无","difficulty":"中"},{"id":"choice-249","type":"choice","globalNumber":249,"stem":"无线网卡使用 () 技术，把数据流编码后放到 RF 信号上。","images":[],"options":{"A":"加密","B":"解码","C":"调制","D":"解调"},"answer":"C","analysis":"调制是把数字信号转换为模拟信号加载到射频（RF）信号上的过程；加密是对数据进行保密处理；解码是将编码数据还原；解调是把模拟信号转换为数字信号。所以选 C。","source":"无","difficulty":"中"},{"id":"choice-250","type":"choice","globalNumber":250,"stem":"《网络安全法》的第一条讲的是 ()。","images":[],"options":{"A":"法律调整范围","B":"立法目的","C":"国家网络安全战略","D":"国家维护网络安全的主要任务"},"answer":"B","analysis":"《网络安全法》第一条明确阐述了立法目的，即保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展。所以选 B。","source":"无","difficulty":"易"},{"id":"choice-251","type":"choice","globalNumber":251,"stem":"WWW 客户与 WWW 服务器之间的信息传输使用的协议为 ()。","images":[],"options":{"A":"HTML","B":"HTTP","C":"SMTP","D":"IMAP"},"answer":"B","analysis":"HTTP（超文本传输协议）用于 WWW 客户与 WWW 服务器之间传输超文本数据；HTML 是超文本标记语言，用于描述网页内容；SMTP 用于发送电子邮件；IMAP 用于接收电子邮件。所以选 B。","source":"无","difficulty":"易"},{"id":"choice-252","type":"choice","globalNumber":252,"stem":"双绞线由两根具有绝缘保护层的铜导线按一定密度互相绞在一起组成，这样可 ()。","images":[],"options":{"A":"降低信号干扰程度","B":"降低成本","C":"提高传输速度","D":"没有任何作用"},"answer":"A","analysis":"双绞线两根铜导线绞合在一起可以降低信号之间的电磁干扰，提高传输质量；绞合的目的不是降低成本和提高传输速度，且并非没有作用。所以选 A。","source":"无","difficulty":"易"},{"id":"choice-253","type":"choice","globalNumber":253,"stem":"光纤通信系统是以 () 的通信方式。","images":[],"options":{"A":"光波为载体、光导纤维为传输介质","B":"光导纤维为载体、光波为传输介质","C":"光波为载体、光接收机为传输介质","D":"光接收机为载体、光导纤维为传输介质"},"answer":"A","analysis":"光纤通信系统利用光波作为载体，通过光导纤维传输光信号进行通信。光接收机用于接收光信号，不是传输介质；光导纤维是传输介质，不是载体。所以选 A。","source":"无","difficulty":"易"},{"id":"choice-254","type":"choice","globalNumber":254,"stem":"交换机是基于 () 地址来实现数据转发的。","images":[],"options":{"A":"IP 地址","B":"MAC 地址","C":"居住地址","D":"电脑地址"},"answer":"B","analysis":"交换机根据 MAC（介质访问控制）地址进行数据帧的转发，IP 地址用于网络层寻址；居住地址和电脑地址与交换机数据转发无关。所以选 B。","source":"无","difficulty":"易"},{"id":"choice-255","type":"choice","globalNumber":255,"stem":"下列选项中，在路由器上查看版本及引导信息的命令是 ()。","images":[],"options":{"A":"router#show version","B":"router#show ip router","C":"router#show interface","D":"router#show run"},"answer":"A","analysis":"在路由器命令行中，router#show version 用于查看路由器的版本及引导信息；router#show ip router 用于查看路由表信息；router#show interface 用于查看接口状态信息；router#show run 用于查看当前运行配置。所以选 A。","source":"无","difficulty":"中"},{"id":"choice-256","type":"choice","globalNumber":256,"stem":"路由器启动时访问不同类型存储器的先后顺序是 ()。","images":[],"options":{"A":"ROM-\u003eFLASH-\u003eNVRAM","B":"FLASH-\u003eROM-\u003eNVRAM","C":"ROM-\u003eNVRAM-\u003eFLASH","D":"FLASH-\u003eNVRAM-\u003eROM"},"answer":"A","analysis":"路由器启动时，首先从 ROM（只读存储器）中读取引导程序，然后加载 FLASH（闪存）中的操作系统，最后读取 NVRAM（非易失性随机存取存储器）中的配置文件。所以选 A。","source":"无","difficulty":"中"},{"id":"choice-257","type":"choice","globalNumber":257,"stem":"使用链路状态算法的路由协议是 ()。","images":[],"options":{"A":"RIP","B":"BGP","C":"OSPF","D":"PPP"},"answer":"C","analysis":"OSPF（开放最短路径优先）协议使用链路状态算法计算路由；RIP 使用距离向量算法；BGP 是边界网关协议，用于不同自治系统间的路由选择；PPP 是数据链路层协议，不是路由协议。所以选 C。","source":"无","difficulty":"中"},{"id":"choice-258","type":"choice","globalNumber":25 rce":"未提及","difficulty":"中等"},{"id":"choice-284","type":"choice","globalNumber":284,"stem":"通过系统指令 systeminfo 不可以查看 (　　)。","images":[],"options":{"A":"系统已打补丁信息","B":"网卡信息","C":"主机名","D":"NDS 服务器地址"},"answer":"D","analysis":"systeminfo 可查看系统已打补丁信息、网卡信息、主机名等，但无法查看 NDS 服务器地址，所以选 D。","source":"未提及","difficulty":"基础"},{"id":"choice-285","type":"choice","globalNumber":285,"stem":"SELinux 是一种基于 (　　) 类型模型的强制访问控制（MAC）安全系统。","images":[],"options":{"A":"文件","B":"文件夹","C":"域","D":"链"},"answer":"C","analysis":"SELinux 是基于域类型模型的强制访问控制安全系统，所以选 C。","source":"未提及","difficulty":"基础"},{"id":"choice-286","type":"choice","globalNumber":286,"stem":"root 用户的 UID 和 GID 为 (　　)。","images":[],"options":{"A":"2 和 0","B":"0 和 0","C":"1 和 0","D":"500 和 500"},"answer":"B","analysis":"在 Linux 系统中，root 用户的 UID 和 GID 均为 0，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-287","type":"choice","globalNumber":287,"stem":"Linux 要给所有的人读取权限，用数字表示 (　　)。","images":[],"options":{"A":"441","B":"444","C":"222","D":"111"},"answer":"B","analysis":"在 Linux 权限数字表示中，4 表示读取权限，给所有人读取权限用 444 表示，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-288","type":"choice","globalNumber":288,"stem":"在数据库安全性控制中，授权的数据对象 (　　)，授权子系统就越灵活。","images":[],"options":{"A":"粒度越小","B":"约束越细致","C":"范围越大","D":"约束范围大"},"answer":"A","analysis":"在数据库安全性控制中，授权数据对象粒度越小，授权子系统越能精准控制权限，也就越灵活，所以选 A。","source":"未提及","difficulty":"中等"},{"id":"choice-289","type":"choice","globalNumber":289,"stem":"1996 年 6 月国务院成立中国互联网络信息中心负责我国的域名管理，以下有关我国域名体系的说法错误的是 (　　)。","images":[],"options":{"A":"最高级为 CN","B":"COM 属于二级域名的行政区域名","C":"COM 的含义为商业公司","D":"CN 即为 “中国” 的代码","E":"GOV 的含义为政府组织"},"answer":"B","analysis":"COM 属于二级域名中的类别域名，并非行政区域名，我国域名体系中最高级为 CN ，代表中国，COM 代表商业公司，GOV 代表政府组织，所以 B 错误。","source":"未提及","difficulty":"基础"},{"id":"choice-290","type":"choice","globalNumber":290,"stem":"首次网站备案适用于的情况是 (　　)。","images":[],"options":{"A":"网站主办者首次提交网站备案申请或网站主办者以前取得的备案号被注销后，重新提交备案申请","B":"域名在别的接入商备案过，需要变更接入商或域名在别的接入商备案过，需要增加电信接入商","C":"原备案主体在其他接入商备案过，需要新增加备案或主体已备案过，要在此主体下新增网站","D":"在工信部备案通过后需要修改个别备案信息"},"answer":"A","analysis":"首次网站备案指网站主办者首次提交申请或原备案号被注销后重新提交，B 是变更接入商备案，C 是新增备案，D 是修改备案信息，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-291","type":"choice","globalNumber":291,"stem":"网络管理是对网络设备及应用加以规划、监控和管理，并进行跟踪、记录、分析网络的异常情况，使网络管理人员能及时处理问题，网络管理具备以下几大功能：配置管理、(　　)、性能管理、安全管理和计费管理等。","images":[],"options":{"A":"故障管理","B":"日常备份管理","C":"升级管理","D":"发送邮件"},"answer":"A","analysis":"网络管理的基本功能包括配置管理、故障管理、性能管理、安全管理和计费管理，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-292","type":"choice","globalNumber":292,"stem":"常用的数据备份方式包括完全备份、增量备份和差异备份，3 种方式在数据存储的空间利用率方面由多到少的顺序为 (　　)。","images":[],"options":{"A":"完全备份、增量备份、差异备份","B":"完全备份、差异备份、增量备份","C":"增量备份、差异备份、完全备份","D":"差异备份、增量备份、完全备份"},"answer":"C","analysis":"增量备份只备份上次备份后新增或修改的数据，差异备份备份上次完全备份后变化的数据，完全备份备份全部数据，所以空间利用率由多到少是增量备份、差异备份、完全备份，选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-293","type":"choice","globalNumber":293,"stem":"以下关于灾难恢复和数据备份的理解，说法相对正确的是 (　　)。","images":[],"options":{"A":"增量备份是备份从上次完全备份后更新的全部数据文件","B":"依据具备的灾难恢复资源程度的不同，灾难恢复能力分为 7 个等级","C":"数据备份按数据类型划分为系统数据备份和用户数据备份","D":"如果系统在一段时间内没有出现问题，就可以不用再进行容灾演练了"},"answer":"C","analysis":"增量备份是备份上次备份（完全或增量）后更新的数据，不是上次完全备份后全部更新数据，A 错误；灾难恢复能力分 6 个等级，B 错误；容灾演练需定期进行，D 错误；数据备份按数据类型可分为系统数据备份和用户数据备份，C 正确 。","source":"未提及","difficulty":"中等"},{"id":"choice-294","type":"choice","globalNumber":294,"stem":"在以下选项中，不是 IP SAN 的特点是 (　　)。","images":[],"options":{"A":"设备整合，多台服务器可以通过存储网络同时访问后端存储系统，不必为每台服务器单独购买存储设备，降低存储设备异构化程度，减轻维护工作量，降低维护费用","B":"数据集中，不同应用和服务器的数据实现了物理上的集中，空间调整和数据复制等工作可以在一台设备上完成，大大提高了存储资源利用率","C":"兼容性好，FC 协议经过长期发展，已经形成大规模产品化，而且厂商之间均遵循统一的标准，以使目前 FC SAN 成为了主流的存储架构","D":"高扩展性，存储网络架构使得服务器可以方便的接入现有 SAN 环境，较好的适应应用变化的需求"},"answer":"C","analysis":"C 选项描述的是 FC SAN 的特点，不是 IP SAN 的特点，IP SAN 具有设备整合、数据集中、高扩展性等特点，所以选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-295","type":"choice","globalNumber":295,"stem":"SNMP 的中文含义是 (　　)。","images":[],"options":{"A":"简单网络管理协议","B":"简单邮件传送协议","C":"简单公用管理信息协议","D":"简单文件传输协议"},"answer":"A","analysis":"SNMP 的中文含义是简单网络管理协议，简单邮件传送协议是 SMTP，简单文件传输协议是 TFTP，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-296","type":"choice","globalNumber":296,"stem":"以下哪些属于系统的物理故障 (　　)。","images":[],"options":{"A":"硬件故障与软件故障","B":"计算机病毒","C":"人为的失误","D":"网络故障和设备环境故障"},"answer":"A","analysis":"系统物理故障包括硬件故障与软件故障，计算机病毒属于软件问题但不是物理故障，人为失误不属于物理故障范畴，网络故障和设备环境故障不全面，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-297","type":"choice","globalNumber":297,"stem":"以下哪个是测试网线的工具 (　　)。","images":[],"options":{"A":"数字电压表","B":"网络测试仪","C":"时域反射仪","D":"电缆检测其"},"answer":"B","analysis":"网络测试仪可用于测试网线，数字电压表用于测量电压，时域反射仪主要用于检测电缆故障位置等，D 选项表述不规范，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-298","type":"choice","globalNumber":298,"stem":"查看系统开放端口的命令是 (　　)。","images":[],"options":{"A":"nslookup","B":"netstat -an","C":"net use","D":"net share"},"answer":"B","analysis":"netstat -an 命令可用于查看系统开放端口，nslookup 用于域名查询，net use 用于连接网络资源等，net share 用于管理共享资源，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-299","type":"choice","globalNumber":299,"stem":"网络故障按照结构化故障排除的方法，依次处理的顺序是 (　　)。①分析信息；②测试假设；③消除原因；④收集信息；⑤提出假设。","images":[],"options":{"A":"①②③④⑤","B":"④⑤②①③","C":"⑤④①②③","D":"④①⑤②③"},"answer":"D","analysis":"网络故障结构化排除方法依次是收集信息、分析信息、提出假设、测试假设、消除原因，所以选 D。","source":"未提及","difficulty":"中等"},{"id":"choice-300","type":"choice","globalNumber":300,"stem":"由非预期的、不正常的程序结束所造成的故障是 (　　)。","images":[],"options":{"A":"系统故障","B":"网络故障","C":"事务故障","D":"介质故障"},"answer":"C","analysis":"事务故障通常由非预期的、不正常的程序结束造成，系统故障涉及系统层面更广泛问题，网络故障主要是网络连接等问题，介质故障与存储介质相关，所以选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-301","type":"choice","globalNumber":301,"stem":"黑客端口扫描最基本的方法是 (　　)","images":[],"options":{"A":"TCP ACK 扫描","B":"TCP FIN 扫描","C":"TCP connect () 扫描","D":"FTP 反弹扫描"},"answer":"C","analysis":"TCP connect () 扫描是通过调用系统的 connect 函数来尝试连接目标端口，若连接成功则说明端口开放，这种方式简单直接，是最基本的端口扫描方法。而 TCP ACK 扫描主要用于判断端口是否被过滤；TCP FIN 扫描用于在特定情况下检测端口状态；FTP 反弹扫描则利用 FTP 服务器进行间接扫描，相对复杂，不是最基本的方法","source":"网络安全基础","difficulty":"易"},{"id":"choice-302","type":"choice","globalNumber":302,"stem":"下列哪个不属于常见的 XSS 攻击手段和目的 (　　)","images":[],"options":{"A":"盗用 cookie，获取敏感信息","B":"利用可被攻击的域受到其他域信任的特定，以受信任来源身份请求一些平时不允许的操作","C":"利用 iframe 以用户的身份执行一些管理动作","D":"注入 payload 读取服务器上的文件"},"answer":"D","analysis":"XSS 攻击主要是针对用户端的攻击，通过在网页中注入恶意脚本，实现盗用 cookie 获取敏感信息、利用信任关系进行非法操作、利用 iframe 执行管理动作等。而注入 payload 读取服务器上的文件通常属于文件注入漏洞利用，不属于常见的 XSS 攻击范畴","source":"网络安全漏洞原理与防范","difficulty":"中"},{"id":"choice-303","type":"choice","globalNumber":303,"stem":"网络攻击的发展趋势是 (　　)","images":[],"options":{"A":"黑客攻击","B":"病毒攻击","C":"木马攻击","D":"黑客技术与网络病毒日益融合"},"answer":"D","analysis":"随着技术发展，黑客技术与网络病毒不再孤立存在，二者相互融合，形成更具威胁的攻击方式。黑客攻击、病毒攻击、木马攻击是传统的攻击形式，并非当前的发展趋势","source":"网络安全发展趋势研究","difficulty":"易"},{"id":"choice-304","type":"choice","globalNumber":304,"stem":"不可否认的安全目标对发生的专门行为提供保证，它不包括 (　　)","images":[],"options":{"A":"源发的不可否认","B":"提交的不可否认","C":"传递的不可否认","D":"时间的不可否认"},"answer":"D","analysis":"不可否认性安全目标主要包括源发的不可否认（保证信息发送者不能否认发送过信息）、提交的不可否认（保证信息提交者不能否认提交过信息）、传递的不可否认（保证信息在传递过程中的不可否认性），时间的不可否认不属于不可否认安全目标的范畴","source":"信息安全基础理论","difficulty":"易"},{"id":"choice-305","type":"choice","globalNumber":305,"stem":"在网络安全中，中断指攻击者破坏网络系统的资源，使之变成无效的或者无用的，这是对 (　　)","images":[],"options":{"A":"可用性的攻击","B":"保密性的攻击","C":"完整性的攻击","D":"可控性的攻击"},"answer":"A","analysis":"可用性是指网络系统资源可被授权实体访问并按要求使用的特性。中断攻击破坏资源使其不可用，是对可用性的攻击。保密性侧重于信息不被泄露；完整性强调信息不被篡改；可控性指对信息的传播及内容具有控制能力","source":"网络安全概念与攻击类型","difficulty":"易"},{"id":"choice-306","type":"choice","globalNumber":306,"stem":"恶意代码是指为达到恶意目的而专门设计的程序或代码。以下恶意代码中，属于脚本病毒的是 (　　)","images":[],"options":{"A":"Worm.Sasser.f","B":"Trojan.Huigezi.a","C":"Harm.formatC.f","D":"Script.Redlof"},"answer":"D","analysis":"脚本病毒通常以脚本语言编写，如 JavaScript、VBScript 等。Script.Redlof 从命名可判断属于脚本病毒。Worm.Sasser.f 是蠕虫病毒；Trojan.Huigezi.a 是木马病毒；Harm.formatC.f 是一种破坏性程序，不属于脚本病毒","source":"恶意代码分析与防范","difficulty":"中"},{"id":"choice-307","type":"choice","globalNumber":307,"stem":"下列针对口令攻击的说法不正确的是 (　　)","images":[],"options":{"A":"口令要有规律的定期更换","B":"口令要没有规律的定期更换","C":"口令不建议使用连续或相同的字母或数字","D":"口令不建议使用生日日期"},"answer":"A","analysis":"有规律的定期更换口令容易被攻击者根据规律猜测出口令，应无规律地定期更换。使用连续或相同字母数字、生日日期作为口令安全性较低，容易被破解","source":"口令安全策略与攻击防范","difficulty":"易"},{"id":"choice-308","type":"choice","globalNumber":308,"stem":"在口令攻击中，与 SQL 注入攻击原理相同的是 (　　)","images":[],"options":{"A":"口令枚举法","B":"万能密码","C":"撞库","D":"验证码"},"answer":"B","analysis":"SQL 注入攻击是通过在输入字段中注入恶意 SQL 语句来绕过认证或获取数据。万能密码也是利用程序对用户输入验证的漏洞，通过特殊构造的字符串来绕过口令验证，二者原理相似。口令枚举法是逐个尝试可能的口令；撞库是利用已泄露的账号密码在其他系统尝试登录；验证码是用于防止自动化攻击，与 SQL 注入原理不同","source":"网络安全攻击技术与防范","difficulty":"中"},{"id":"choice-309","type":"choice","globalNumber":309,"stem":"端口扫描检测工具发现被端口扫描攻击后，正确的处理方法是 (　　)","images":[],"options":{"A":"添加路由器设备","B":"在计算机上安装杀毒软件","C":"部署入侵检测系统","D":"增加值班人员"},"answer":"C","analysis":"部署入侵检测系统可以实时监测网络活动，发现端口扫描等异常行为并及时报警和采取相应措施。添加路由器设备不能直接应对端口扫描攻击；安装杀毒软件主要针对病毒等恶意软件，对端口扫描攻击防护有限；增加值班人员不能有效及时地检测和处理端口扫描攻击","source":"网络安全防护技术与策略","difficulty":"中"},{"id":"choice-310","type":"choice","globalNumber":310,"stem":"目前不用于数据存储的存储设备主要有 (　　)","images":[],"options":{"A":"磁盘（包括磁盘阵列）","B":"磁带（包括磁带机和磁带库）","C":"光盘","D":"内存"},"answer":"D","analysis":"内存主要用于计算机运行时临时存储数据和程序指令，断电后数据丢失，不适合长期稳定存储数据。磁盘、磁带、光盘都可用于数据的长期存储","source":"数据存储技术基础","difficulty":"易"},{"id":"choice-311","type":"choice","globalNumber":311,"stem":"在存储资源统一管理的前提下，应按照一下哪个顺序实现数据的自动分级存储 (　　)","images":[],"options":{"A":"近线、在线、归档、离线","B":"在线、近线、离线、归档","C":"在线、离线、近线、归档","D":"近线、离线、归档、在线"},"answer":"B","analysis":"在线存储的数据可随时快速访问，用于频繁使用的数据；近线存储性能次之，用于访问频率稍低的数据；离线存储数据访问不便，用于长期保存但很少访问的数据；归档存储用于法规遵从性等长期保存需求的数据。按照数据访问频率和使用场景，合理顺序是在线、近线、离线、归档","source":"数据存储管理与优化","difficulty":"中"},{"id":"choice-312","type":"choice","globalNumber":312,"stem":"数据销毁的方法最正确的是 (　　)","images":[],"options":{"A":"覆写法","B":"消磁法","C":"捣碎法 / 剪碎法","D":"覆写法、消磁法、捣碎法 / 剪碎法"},"answer":"D","analysis":"覆写法是用新数据覆盖原有数据；消磁法用于磁性存储介质，破坏其数据记录；捣碎法 / 剪碎法物理破坏存储介质。多种方法结合能更彻底地销毁数据，单一方法可能存在数据残留风险","source":"数据安全与销毁技术","difficulty":"易"},{"id":"choice-313","type":"choice","globalNumber":313,"stem":"数据冗余可能导致的问题有 (　　)","images":[],"options":{"A":"数据访问速度变慢","B":"数据更易丢失","C":"浪费存储空间，难以修改","D":"容易造成业务系统不稳定"},"answer":"C","analysis":"数据冗余意味着相同数据多次存储，会浪费存储空间。并且当需要修改数据时，由于存在多个副本，修改操作复杂且容易出现不一致的情况。数据冗余一般不会直接导致数据访问速度变慢、更易丢失或业务系统不稳定","source":"数据库原理与数据管理","difficulty":"易"},{"id":"choice-314","type":"choice","globalNumber":314,"stem":"在用安装了 Windows 操作系统的电脑时，一般建议电脑中重要的资料最好不要保存在 C 盘中，下列观点最合理的是 (　　)","images":[],"options":{"A":"这种说法没有根据","B":"文件存储在 C 盘容易被系统文件覆盖","C":"C 盘是默认系统盘，不能存储其他文件","D":"C 盘最容易遭到木马病毒的攻击，而且重装系统时会删除 C 盘上的所有文件，如果备份不及时会造成严重影响"},"answer":"D","analysis":"C 盘作为系统盘，是木马病毒攻击的常见目标。同时，重装系统时通常会格式化 C 盘，导致数据丢失。文件存储在 C 盘不一定会被系统文件覆盖；C 盘可以存储其他文件","source":"Windows 系统安全与数据存储","difficulty":"易"},{"id":"choice-315","type":"choice","globalNumber":315,"stem":"为节约存储空间，在经历初次备份后应选择 (　　)","images":[],"options":{"A":"整盘备份","B":"增量备份","C":"自定义备份","D":"文件备份"},"answer":"B","analysis":"增量备份只备份自上次备份（包括完全备份和增量备份）以来发生变化的数据，相比整盘备份，大大减少了存储空间占用。自定义备份和文件备份没有突出节约存储空间的优势","source":"数据备份与恢复技术","difficulty":"易"},{"id":"choice-316","type":"choice","globalNumber":316,"stem":"以下关于 Windows 操作系统身份标识与鉴别，说法不正确的是 (　　)","images":[],"options":{"A":"Windows 操作系统远程登录经历了 SMB 鉴别机制、LM 鉴别机制、NTLM 鉴别机制、Kerberos 鉴别体系等阶段","B":"完整的安全标识符 (SID）包括用户和组的安全描述，48 比特的身份特权、修订版本和可变的验证值","C":"本地安全授权机构 (LSA) 生成用户账户在该系统内唯一的安全标识符 (SID)","D":"用户对鉴别信息的操作，如更改密码等都通过一个以 Administrator 权限运行的服务 “Security-AccountsManager” 来实现"},"answer":"D","analysis":"用户对鉴别信息的操作，如更改密码等是通过 “Winlogon” 进程和 “Security-AccountsManager”（SAM）数据库协同完成，并非仅通过以 Administrator 权限运行的 “Security-AccountsManager” 服务来实现。A、B、C 选项描述均正确","source":"Windows 系统安全机制","difficulty":"中"},{"id":"choice-317","type":"choice","globalNumber":317,"stem":"用 vi 打开一个文件，用字母 “new” 来代替字母 “old” 的命令是 (　　)","images":[],"options":{"A":":r/old/new","B":":s/old/new","C":":%s/old/new/g","D":":s/old/new/g"},"answer":"C","analysis":"在 vi 编辑器中，:% s/old/new/g 命令表示在整个文件中全局替换，将所有的 “old” 替换为 “new”。:r 命令用于读取文件内容；:s/old/new 只替换每行中首次出现的 “old”；:s/old/new/g 只在当前行进行全局替换","source":"Linux 文本编辑器使用","difficulty":"中"},{"id":"choice-318","type":"choice","globalNumber":318,"stem":"恶意代码指没有作用却会带来危险的代码，下列不属于恶意代码的是 (　　)","images":[],"options":{"A":"病毒程序","B":"广告程序","C":"间谍程序","D":"应用程序"},"answer":"D","analysis":"应用程序是为满足用户某种需求而开发的具有特定功能的程序，正常情况下不会带来恶意危害。病毒程序、广告程序（部分恶意广告程序会侵犯用户隐私等）、间谍程序都属于恶意代码范畴","source":"恶意代码识别与防范","difficulty":"易"},{"id":"choice-319","type":"choice","globalNumber":319,"stem":"下面关于计算机木马说法错误的是 (　　)","images":[],"options":{"A":"Word 文档也会感染木马","B":"尽量不要点击来历不明的网站链接","C":"杀毒软件对防木马病毒具有重要作用","D":"只要不访问互联网，就能避免感染木马"},"answer":"D","analysis":"即使不访问互联网，计算机仍可能通过移动存储设备等途径感染木马。Word 文档可通过宏病毒等方式感染木马；来历不明的网站链接可能隐藏木马下载链接；杀毒软件能检测和清除木马病毒","source":"计算机木马防范知识","difficulty":"易"},{"id":"choice-320","type":"choice","globalNumber":320,"stem":"以下不属于杀毒软件的是 (　　)","images":[],"options":{"A":"McAfee VirusScan","B":"Norton AntiVirus","C":"Kapersky","D":"WannaCry"},"answer":"D","analysis":"McAfee VirusScan、Norton AntiVirus、Kapersky 都是常见的杀毒软件。WannaCry 是一种勒索病毒，会对计算机数据进行加密勒索，并非杀毒软件","source":"杀毒软件识别与使用","difficulty":"易"},{"id":"choice-321","type":"choice","globalNumber":321,"stem":"对于学生来说，职业素养培养最大的意义是 (　　)","images":[],"options":{"A":"有利于个人成长","B":"提高就业竞争力","C":"提高学习能力","D":"提高身体素质"},"answer":"B","analysis":"职业素养的提升能让学生在就业市场中更具优势，相比个人成长、学习能力提升等，提高就业竞争力更直接体现其最大意义，所以选 B","source":"职业素养教育基础课程相关 ID","difficulty":"易"},{"id":"choice-322","type":"choice","globalNumber":322,"stem":"字长是 CPU 的主要性能指标之一，它表示 (　　)","images":[],"options":{"A":"CPU 最大的有效数字位数","B":"CPU 最长的十进制整数的位数","C":"CPU 一次能处理二进制数据的位数","D":"CPU 计算结果的有效数字长度"},"answer":"C","analysis":"字长指的就是 CPU 一次能处理二进制数据的位数，用来衡量 CPU 性能，所以 C 正确","source":"计算机组成原理相关 ID","difficulty":"易"},{"id":"choice-323","type":"choice","globalNumber":323,"stem":"操作系统的发展过程是 (　　)","images":[],"options":{"A":"原始操作系统，管理程序，操作系统","B":"原始操作系统，操作系统，管理程序","C":"管理程序，原始操作系统，操作系统","D":"管理程序，操作系统，原始操作系统"},"answer":"C","analysis":"操作系统的发展是从早期简单的管理程序，到出现原始操作系统，再逐步发展为功能完善的现代操作系统，C 选项顺序正确","source":"操作系统概论相关 ID","difficulty":"易"},{"id":"choice-324","type":"choice","globalNumber":324,"stem":"云计算技术中最为关键的支撑技术之一就是 (　　)","images":[],"options":{"A":"物联网技术","B":"大数据技术","C":"虚拟化技术","D":"5G 通信技术"},"answer":"C","analysis":"虚拟化技术能实现资源的灵活分配和高效利用，是云计算的关键支撑技术，所以 C 正确","source":"云计算技术基础相关 ID","difficulty":"易"},{"id":"choice-325","type":"choice","globalNumber":325,"stem":"网络层位于通信子网的 (　　) 层","images":[],"options":{"A":"最高","B":"中间","C":"最低","D":"不属于通信子网"},"answer":"A","analysis":"通信子网包含物理层、数据链路层和网络层，网络层处于最高层，负责将数据从源端传输到目的端，所以 A 正确","source":"计算机网络原理相关 ID","difficulty":"易"},{"id":"choice-326","type":"choice","globalNumber":326,"stem":"单模光纤的传输方向是 (　　)","images":[],"options":{"A":"散射","B":"衍射","C":"沿光纤直径方向","D":"全反射"},"answer":"C","analysis":"单模光纤只允许一束光沿光纤直径方向传播，相比多模光纤，其传输性能更好、距离更远，所以 C 正确","source":"光纤通信技术相关 ID","difficulty":"易"},{"id":"choice-327","type":"choice","globalNumber":327,"stem":"以下哪项不是存放在路由器的随机存取存储器（RAM）中的 (　　)","images":[],"options":{"A":"启动配置文件","B":"运行配置文件","C":"IP 路由表","D":"ARP 缓存"},"answer":"A","analysis":"启动配置文件存储在非易失性存储器（NVRAM）中，运行配置文件、IP 路由表、ARP 缓存等存于 RAM，断电后 RAM 中数据丢失，所以 A 正确","source":"网络设备配置与管理相关 ID","difficulty":"易"},{"id":"choice-328","type":"choice","globalNumber":328,"stem":"当 AP 中配置 SSID 加密类型为 WEP 加密（密码为 12345），MAC 层认证方式为 open - system，而客户端输入的密码为 54321 会出现以下哪种现象 (　　)","images":[],"options":{"A":"客户端可以成功连接 AP，但无法正常通信","B":"客户端可以成功连接 AP，也可以正常通信，但数据报文为明文传输","C":"客户端会提示密码错误，要求重新输入","D":"客户端无法成功连接 AP"},"answer":"A","analysis":"open - system 认证方式下，客户端可先连接 AP，但由于密码错误，加密数据无法正常解密，导致无法正常通信，所以 A 正确","source":"无线网络技术相关 ID","difficulty":"中"},{"id":"choice-329","type":"choice","globalNumber":329,"stem":"下列选择中不属于数据库中的故障是 (　　)","images":[],"options":{"A":"计算机电源故障","B":"系统故障","C":"介质故障","D":"计算机病毒"},"answer":"A","analysis":"计算机电源故障是硬件层面的一般性故障，不属于数据库特有的故障类型；系统故障、介质故障、计算机病毒都可能影响数据库正常运行，所以 A 正确","source":"数据库原理相关 ID","difficulty":"易"},{"id":"choice-330","type":"choice","globalNumber":330,"stem":"合伙期限届满，合伙人继续执行合伙事务，其他合伙人没有提出异议的，原合伙合同继续有效，但是合伙期限为 (　　)","images":[],"options":{"A":"定期","B":"永久","C":"60 年","D":"不定期"},"answer":"D","analysis":"根据法律规定，合伙期限届满后合伙人继续执行合伙事务且无异议，合伙合同继续有效但变为不定期，所以 D 正确",
