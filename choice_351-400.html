:"choice_351-400.html"},{"id":"choice-355","type":"choice","number":355,"globalNumber":355,"stem":"要在思科交换机上显示可用的文件系统，可以使用 (　　) 命令","images":[],"options":{"A":"Router#show file","B":"Router#show file systems","C":"Router#show systems","D":"Router#show systems file"},"answer":"B","analysis":"show file systems 是显示思科交换机可用文件系统的正确命令，A、C、D 命令错误","source":"思科交换机操作命令","difficulty":"简单","file":"choice_351-400.html"},{"id":"choice-356","type":"choice","number":356,"globalNumber":356,"stem":"思科路由器上配置远程登录认证方式为本地用户 + 密码验证的命令是 (　　)","images":[],"options":{"A":"Router(config-line)#login","B":"Router(config-line)#login local","C":"Router(config)#login","D":"Router(config)#login local"},"answer":"B","analysis":"在配置线路模式下，login local 命令用于配置远程登录使用本地用户和密码验证，A、C、D 命令使用位置或错误","source":"思科路由器配置","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-357","type":"choice","number":357,"globalNumber":357,"stem":"思科路由器中可以通过 privilege 命令为特权模式配置 (　　) 个层次的命令级别","images":[],"options":{"A":"8","B":"16","C":"32","D":"64"},"answer":"B","analysis":"思科路由器中 privilege 命令可配置 16 个层次的命令级别","source":"思科路由器高级配置","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-358","type":"choice","number":358,"globalNumber":358,"stem":"思科路由器上把设备当前运行的配置文件更改保存到启动配置文件中的命令是 (　　)","images":[],"options":{"A":"Router#copy running-config startup-config","B":"Router#cp running-config startup-config","C":"Router#write running-config startup-config","D":"Router#save running-config startup-config"},"answer":"A","analysis":"copy running-config startup-config 是思科路由器保存运行配置到启动配置的正确命令，B、C、D 命令错误","source":"思科路由器操作命令","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-359","type":"choice","number":359,"globalNumber":359,"stem":"以下不是导致地址解析协议 (ARP) 欺骗的根源是 (　　)","images":[],"options":{"A":"ARP 协议是一个无状态的协议","B":"为提高效率，ARP 信息在系统中会缓存","C":"ARP 缓存是动态的，可被改写","D":"ARP 协议是用于寻址的一个重要协议"},"answer":"D","analysis":"ARP 协议用于寻址不是导致 ARP 欺骗的根源，A、B、C 选项的无状态、缓存及可改写特性是欺骗根源","source":"ARP 协议原理与安全","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-360","type":"choice","number":360,"globalNumber":360,"stem":"操作系统用于管理计算机资源，控制整个系统运行，是计算机软件的基础，操作系统安全是计算、网络及信息系统安全的基础，一般操作系统都提供了相应的安全配置接口，小王新买了一台计算机，开机后首先对带的 Windows 操作系统进行配置，他的主要操作有：（1）关闭不必要的服务和端口；（2）在 “本地安全策略” 中配置账号策略、本地策略、公钥策略和 IP 安全策略：（3）备份敏感文件，禁止建立空连接，下栽最新补丁：（4）关闭审核策略，开启口令策略，开启口令策略，开启账户策略，这些操作中错误的是 (　　)","images":[],"options":{"A":"操作（1），应该关闭不必要的服务和所有端口","B":"操作（2），在 “本地安全策略” 中不应该配置公钥策略，而应该配置私钥策略","C":"操作（3），备份敏感文件会导致这些文件遭到窃取的几率增加","D":"操作（4），应该开启审核策略"},"answer":"D","analysis":"审核策略可记录系统活动，关闭不利于安全管理，A 关闭所有端口不合理但不是本题错误点；B 公钥策略可配置；C 备份文件是合理安全措施","source":"Windows 操作系统安全配置","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-361","type":"choice","number":361,"globalNumber":361,"stem":"应对操作系统安全漏洞的基本方法不包括下面的 (　　)","images":[],"options":{"A":"对默认安装进行必要的调整","B":"给所有用户设置严格的口令","C":"及时安装最新的安全补丁","D":"更换到另一种操作系统"},"answer":"D","analysis":"更换操作系统不是应对安全漏洞的基本方法，A 选项调整默认安装可减少安全风险，B 选项强口令能增强用户认证安全性，C 选项安装补丁可修复已知漏洞","source":"操作系统安全课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-362","type":"choice","number":362,"globalNumber":362,"stem":"下面不属于过滤器模式的命令是 (　　)","images":[],"options":{"A":"ls","B":"cat","C":"grep","D":"tr"},"answer":"B","analysis":"cat 命令主要用于查看文件内容或连接文件，不属于过滤器模式；ls 用于列出目录内容，grep 用于文本搜索过滤，tr 用于字符转换和删除，都有过滤功能","source":"Linux 命令课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-363","type":"choice","number":363,"globalNumber":363,"stem":"Linux 分区类型默认的是 (　　)","images":[],"options":{"A":"vfat","B":"ext2","C":"swap","D":"DOS"},"answer":"B","analysis":"Linux 系统默认分区类型是 ext2，vfat 是 Windows 常用的文件系统，swap 是交换分区，DOS 是早期操作系统，不是 Linux 默认分区类型","source":"Linux 系统管理课程","difficulty":"基础","file":"choice_351-400.html"},{"id":"choice-364","type":"choice","number":364,"globalNumber":364,"stem":"Linux 系统中不能用来显示文件内容的命令有 (　　)","images":[],"options":{"A":"tac","B":"more","C":"head","D":"type"},"answer":"D","analysis":"type 是 Windows 系统用于显示文件类型或查看命令类型的命令，在 Linux 中不用于显示文件内容；tac 反向显示文件内容，more 分页显示，head 显示文件头部内容","source":"Linux 命令课程","difficulty":"基础","file":"choice_351-400.html"},{"id":"choice-365","type":"choice","number":365,"globalNumber":365,"stem":"下列各项中不属于 SQL Server 数据库恢复模型的是 (　　)","images":[],"options":{"A":"FULL","B":"BULK_LOGGED","C":"MOUNT","D":"SIMPLE"},"answer":"C","analysis":"MOUNT 不是 SQL Server 数据库恢复模型，FULL 是完整恢复模型，BULK_LOGGED 是大容量日志恢复模型，SIMPLE 是简单恢复模型","source":"SQL Server 数据库管理课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-366","type":"choice","number":366,"globalNumber":366,"stem":"某购物网站开发项目经过需求分析进入系统设计阶段，为了保证用户账户的安全，项目开发人员决定用户登录时除了用户名口令认证方式外，还加入基于数字证书的身份认证功能，同时用户口令使用 SMA-1 算法加密后存放在后台数据库中，请问以上安全设计遵循的是哪项安全设计原则 (　　)","images":[],"options":{"A":"最小特权原则","B":"职责分离原则","C":"纵深防御原则","D":"最少共享机制原则"},"answer":"C","analysis":"通过多种认证方式和口令加密，构建多层安全防护，符合纵深防御原则；最小特权原则强调用户权限最小化，职责分离原则关注功能职责划分，最少共享机制原则注重减少信息共享","source":"网络安全设计课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-367","type":"choice","number":367,"globalNumber":367,"stem":"(　　) 采用汉明码作盘错校验，采用按位交叉存取，运用于大数据的读写。磁盘驱动器组中的第一个、第二个、第四个…… 第 2n 个磁盘驱动器是专门的校验盘，用于校验和纠错，对大数据量的输入输出有很高的性能","images":[],"options":{"A":"RAID2","B":"RAID3","C":"RAID4","D":"RAID5"},"answer":"A","analysis":"RAID2 采用汉明码校验和按位交叉存取，适用于大数据读写；RAID3 用奇偶校验码、按字节交叉存取，RAID4 和 RAID5 校验方式与存取方式与 RAID2 不同","source":"存储技术课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-368","type":"choice","number":368,"globalNumber":368,"stem":"RAID 技术可以提高读写性能，下面选项中无法提高读写性能的是 (　　)","images":[],"options":{"A":"RAID0","B":"RAID1","C":"RAID3","D":"RAID5"},"answer":"B","analysis":"RAID1 主要用于数据镜像备份，以提高数据安全性，不能显著提高读写性能；RAID0 通过条带化提高读写速度，RAID3 和 RAID5 利用校验和并行存储提升读写性能","source":"存储技术课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-369","type":"choice","number":369,"globalNumber":369,"stem":"在主机域名中，顶级域名可以代表国家。代表 “中国” 的顶级域名是 (　　)","images":[],"options":{"A":"CHINA","B":"ZHONGGUO","C":"CN","D":"ZG"},"answer":"C","analysis":"在域名系统中，“CN” 是代表中国的顶级域名，CHINA、ZHONGGUO、ZG 都不是标准的国家顶级域名","source":"域名系统课程","difficulty":"基础","file":"choice_351-400.html"},{"id":"choice-370","type":"choice","number":370,"globalNumber":370,"stem":"以下关于 DNS 服务器的叙述中，错误的是 (　　)","images":[],"options":{"A":"用户只能使用本网段内 DNS 服务器进行域名解析","B":"主域名服务器负责维护这个区域的所有域名信息","C":"辅助域名服务器作为主域名服务器的备份服务器提供域名解析服务","D":"转发域名服务器负责非本地域名的查询"},"answer":"A","analysis":"用户并非只能使用本网段内 DNS 服务器，可配置其他可用的 DNS 服务器进行域名解析；B、C、D 选项关于不同类型 DNS 服务器功能的描述正确","source":"DNS 服务器配置课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-371","type":"choice","number":371,"globalNumber":371,"stem":"新增接入适用于的情况是 (　　)","images":[],"options":{"A":"网站主办者首次提交网站备案申请或网站主办者以前取得的备案号被注销后，重新提交备案申请","B":"域名在别的接入商备案过，需要变更接入商或域名在别的接入商备案过，需要增加电信接入商","C":"原备案主体在其他接入商备案过，需要新增加备案或主体已备案过，要在此主体下新增网站","D":"在工信部备案通过后需要修改个别备案信息"},"answer":"B","analysis":"A 选项是首次备案情况，C 选项是新增备案情况，D 选项是备案信息变更情况，B 选项符合新增接入定义","source":"网站备案课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-372","type":"choice","number":372,"globalNumber":372,"stem":"一个备案服务号可以备案 (　　) 个域名","images":[],"options":{"A":"1 个","B":"2 个","C":"3 个","D":"1 个及 1 个以上"},"answer":"D","analysis":"通常一个备案服务号可备案 1 个及以上域名，具体数量可能因备案规则和接入商规定有所不同","source":"网站备案课程","difficulty":"基础","file":"choice_351-400.html"},{"id":"choice-373","type":"choice","number":373,"globalNumber":373,"stem":"对于网络安全性的需求，网络操作系统一般采用四级安全保密机制，即注册安全，用户信任者权限，对信任者权限屏蔽与 (　　)","images":[],"options":{"A":"磁盘镜像","B":"UPS 监控","C":"目录与文件属性","D":"文件备份"},"answer":"C","analysis":"目录与文件属性设置可控制用户对文件和目录的访问权限，是网络操作系统四级安全保密机制之一；磁盘镜像、UPS 监控、文件备份主要用于数据存储和系统运行保障，不属于该安全机制","source":"网络操作系统安全课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-374","type":"choice","number":374,"globalNumber":374,"stem":"在现行的存储技术中哪两种磁带采用了螺旋扫描读写方式 (　　)","images":[],"options":{"A":"面向工作组级数据备份的 4mm、面向部门级网络数据网络备份的 8mm 磁带","B":"面向工作组级数据备份的 4mm、面向部门级网络数据网络备份的 6mm 磁带","C":"面向工作组级数据备份的 6mm、面向部门级网络数据网络备份的 8mm 磁带","D":"面向工作组级数据备份的 8mm、面向部门级网络数据网络备份的 8mm 磁带"},"answer":"A","analysis":"在存储技术中，面向工作组级数据备份的 4mm 和面向部门级网络数据备份的 8mm 磁带采用螺旋扫描读写方式，6mm 磁带一般不采用这种方式","source":"存储技术课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-375","type":"choice","number":375,"globalNumber":375,"stem":"对于 FTP 服务器来说，下列选项中不是 UNIX/Linux 系统中用来进行文件系统备份和恢复的命令是 (　　)","images":[],"options":{"A":"tar","B":"cpio","C":"umask","D":"backup"},"answer":"C","analysis":"umask 用于设置文件和目录的默认权限掩码，不是文件系统备份和恢复命令；tar 和 cpio 可用于打包和备份文件，backup 是早期 UNIX 系统中的备份命令","source":"UNIX/Linux 系统管理课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-376","type":"choice","number":376,"globalNumber":376,"stem":"路由器故障诊断可以使用多种工具，下列不属于诊断工具的是 (　　)","images":[],"options":{"A":"路由器诊断命令","B":"网络管理工具","C":"故障诊断工具","D":"测线仪"},"answer":"D","analysis":"测线仪主要用于检测网线连通性，不是路由器故障诊断工具；路由器诊断命令、网络管理工具、故障诊断工具都可用于诊断路由器故障","source":"路由器故障诊断课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-377","type":"choice","number":377,"globalNumber":377,"stem":"以下对于协议分析仪的说法不正确的一项是 (　　)","images":[],"options":{"A":"协议分析仪是对应七层模型中的第七层设计的","B":"协议分析仪所具有的对数据包捕捉和解码能力使得它在解决复杂，罕见的问题时非常有效","C":"协议分析仪是一种复杂的测试工具，它要求操作人员具有较高的技术水平","D":"协议分析仪是一种监视数据通信系统中的数据流，检验数据交换是否正确地按照协议的规定进行的专用测试工具"},"answer":"A","analysis":"协议分析仪可针对网络协议栈各层设计，并非仅对应第七层；B、C、D 选项对协议分析仪功能和特点的描述正确","source":"网络测试技术课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-378","type":"choice","number":378,"globalNumber":378,"stem":"以下 (　　) 协议不属于网络管理协议","images":[],"options":{"A":"SNMP","B":"CMIS/CMIP","C":"CMOT","D":"ISDN"},"answer":"D","analysis":"ISDN 是综合业务数字网，是一种通信网络标准，不属于网络管理协议；SNMP 是简单网络管理协议，CMIS/CMIP 是公共管理信息服务 / 公共管理信息协议，CMOT 是基于 TCP/IP 的 CMIS 服务和协议，都用于网络管理","source":"网络管理协议课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-379","type":"choice","number":379,"globalNumber":379,"stem":"黑客入侵攻击的一般过程的正确顺序是 (　　)：①收集信息；②确定目标；③隐藏痕迹；④实施攻击","images":[],"options":{"A":"①②③④","B":"②①③④","C":"③④①②","D":"②④③①"},"answer":"B","analysis":"黑客通常先确定目标，再收集目标相关信息，然后实施攻击，最后隐藏痕迹，保证攻击过程的隐蔽性和持续性","source":"网络安全防御课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-380","type":"choice","number":380,"globalNumber":380,"stem":"网络安全是在网络环境中对信息提供安全保护，下列不属于保护对象的是 (　　)","images":[],"options":{"A":"信息载体","B":"信息的处理、传输","C":"信息的存储、访问","D":"信息的涵义"},"answer":"D","analysis":"网络安全主要保护信息载体以及信息处理、传输、存储、访问等过程的安全，信息的涵义并非直接保护对象","source":"网络安全基础课程","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-381","type":"choice","number":381,"globalNumber":381,"stem":"以下不属于木马入侵的常见方法是 (　　)","images":[],"options":{"A":"捆绑欺骗","B":"邮件冒名欺骗","C":"危险下载","D":"文件感染"},"answer":"D","analysis":"木马入侵常见方法有捆绑欺骗、邮件冒名欺骗、危险下载等。文件感染是病毒的一种感染方式，并非木马入侵的常见方法","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-382","type":"choice","number":382,"globalNumber":382,"stem":"某软件在设计时，有三种用户访问模式，分别是仅管理员可访问、所有合法用户可访问和允许匿名访问采用这三种访问模式时，攻击面最高的是 (　　)","images":[],"options":{"A":"仅管理员可访问","B":"所有合法用户可访问","C":"允许匿名","D":"三种方式一样"},"answer":"C","analysis":"允许匿名访问意味着任何用户无需认证即可访问软件，相比仅管理员可访问和所有合法用户可访问模式，其攻击面最大，攻击者更容易尝试入侵","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-383","type":"choice","number":383,"globalNumber":383,"stem":"计算机系统的鉴别不包括 (　　)","images":[],"options":{"A":"用户标识认证","B":"传输原发点的鉴别","C":"内容鉴别及特征检测","D":"版本鉴别"},"answer":"D","analysis":"计算机系统鉴别主要包括用户标识认证、传输原发点鉴别、内容鉴别及特征检测等。版本鉴别不属于计算机系统鉴别范畴","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-384","type":"choice","number":384,"globalNumber":384,"stem":"以下不属于 DOS 攻击的是 (　　)","images":[],"options":{"A":"死亡之 PING","B":"SYN Flood 攻击","C":"Land 攻击","D":"勒索病毒攻击"},"answer":"D","analysis":"死亡之 PING、SYN Flood 攻击、Land 攻击都属于拒绝服务（DOS）攻击，通过消耗系统资源使服务瘫痪。勒索病毒攻击主要目的是加密文件勒索赎金，不属于 DOS 攻击","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-385","type":"choice","number":385,"globalNumber":385,"stem":"使网络服务器中充斥着大量要求回复的信息，消耗带宽，导致网络或系统停止正常服务，这属于 (　　) 攻击","images":[],"options":{"A":"木马","B":"远程调用","C":"拒绝服务","D":"蠕虫"},"answer":"C","analysis":"拒绝服务攻击通过向目标服务器发送大量请求，消耗其资源，使网络或系统无法正常提供服务，符合题干描述","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-386","type":"choice","number":386,"globalNumber":386,"stem":"在 PPDRR 安全模式中，(　　) 是属于安全事件发生后的补救措施","images":[],"options":{"A":"保护","B":"恢复","C":"响应","D":"检测"},"answer":"B","analysis":"PPDRR 安全模式包括保护、检测、响应、恢复等环节。恢复是在安全事件发生后，对系统进行修复和还原，属于补救措施","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-387","type":"choice","number":387,"globalNumber":387,"stem":"通过 (　　) 建立完善的访问控制策略，及时发现网络遭受攻击情况并加以追踪和防范，避免对网络造成更大损失","images":[],"options":{"A":"动态站点监控","B":"实施存取控制","C":"安全管理检测","D":"完善服务器系统安全性能"},"answer":"A","analysis":"动态站点监控可以实时监测网站活动，建立访问控制策略并及时发现和处理攻击，减少损失。实施存取控制、安全管理检测、完善服务器系统安全性能虽也重要，但不符合 “及时发现攻击并追踪防范” 这一描述","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-388","type":"choice","number":388,"globalNumber":388,"stem":"针对口令攻击，下面可有效抵御口令攻击的说法错误的是 (　　)","images":[],"options":{"A":"哈希加密算法要比非对称加密算法更安全","B":"使用 client 端验证码","C":"采用 server 端验证码","D":"使用隐藏 token"},"answer":"B","analysis":"哈希加密算法用于口令加密存储更安全；server 端验证码、隐藏 token 可增强口令安全性。而使用 client 端验证码存在安全风险，易被攻击者获取，不能有效抵御口令攻击","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-389","type":"choice","number":389,"globalNumber":389,"stem":"下列哪个是自动化 SQL 注入工具 (　　)","images":[],"options":{"A":"nmap","B":"nessus","C":"msf","D":"sqlmap"},"answer":"D","analysis":"nmap 是网络扫描工具；nessus 是漏洞扫描工具；msf 是渗透测试框架；sqlmap 是专门用于自动化 SQL 注入检测和利用的工具","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-390","type":"choice","number":390,"globalNumber":390,"stem":"数据冗余是指 (　　)","images":[],"options":{"A":"数据和数据之间没有联系","B":"数据有丢失","C":"数据量太大","D":"存在重复的数据"},"answer":"D","analysis":"数据冗余的定义就是存在重复的数据，会浪费存储空间，可能导致数据不一致等问题","source":"数据库基础","difficulty":"简单","file":"choice_351-400.html"},{"id":"choice-391","type":"choice","number":391,"globalNumber":391,"stem":"Ghost 对系统进行备份时，可以选择分区备份和 (　　)","images":[],"options":{"A":"整盘备份","B":"增量备份","C":"自定义备份","D":"多区备份"},"answer":"A","analysis":"Ghost 可以对系统进行分区备份和整盘备份，用于系统数据的备份和恢复","source":"系统维护基础","difficulty":"简单","file":"choice_351-400.html"},{"id":"choice-392","type":"choice","number":392,"globalNumber":392,"stem":"以下哪一个参数表示恢复点目标 (　　)","images":[],"options":{"A":"RPO","B":"RTO","C":"RYO","D":"RSO"},"answer":"A","analysis":"RPO（Recovery Point Objective）表示恢复点目标，指灾难发生后，系统和数据必须恢复到的时间点要求；RTO（Recovery Time Objective）表示恢复时间目标","source":"数据备份与恢复基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-393","type":"choice","number":393,"globalNumber":393,"stem":"黑客在 windows 系统中利用命令提示符创建隐藏账号的命令是 (　　)","images":[],"options":{"A":"net user hack 123456 /add","B":"net user hack$ 123456 /add","C":"net user $hack 123456 /add","D":"net user hack123456 /add"},"answer":"B","analysis":"在 Windows 系统中，在用户名后加 \"\"可创建隐藏账号，netuserhack 123456 /add 是创建隐藏账号的命令","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-394","type":"choice","number":394,"globalNumber":394,"stem":"关于文件型病毒，下面叙述正确的是 (　　)","images":[],"options":{"A":"感染磁盘的引导记录","B":"寄生在磁盘引导区或主引导区","C":"感染 COM 和 EXE 等可执行文件","D":"Flip 病毒属于文件型病毒"},"answer":"C","analysis":"文件型病毒主要感染 COM 和 EXE 等可执行文件；感染磁盘引导记录、寄生在磁盘引导区或主引导区的是引导型病毒；Flip 病毒是引导型病毒","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-395","type":"choice","number":395,"globalNumber":395,"stem":"保障 UNIX/Linux 系统帐号安全最为关键的措施是 (　　)","images":[],"options":{"A":"文件 /etc/passwd 和 /etc/group 必须有写保护","B":"删除 /etc/passwd 和 /etc/gmp","C":"设置足够强度的帐号密码","D":"设置足够强度的帐号密码"},"answer":"A","analysis":"/etc/passwd 和 /etc/group 文件存储用户和组的重要信息，对其设置写保护可防止非法修改，保障账号安全。删除相关文件会导致系统异常；设置强密码重要，但不是最关键措施","source":"UNIX/Linux 系统安全","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-396","type":"choice","number":396,"globalNumber":396,"stem":"恶意代码通过多种方式传播就形成了 (　　)","images":[],"options":{"A":"木马","B":"网络蠕虫","C":"移动代码","D":"复合型病毒"},"answer":"D","analysis":"复合型病毒是指恶意代码通过多种方式传播，兼具多种病毒特性，如同时具备文件感染和网络传播能力","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-397","type":"choice","number":397,"globalNumber":397,"stem":"下面不属于恶意代码攻击技术的是 (　　)","images":[],"options":{"A":"进程注入技术","B":"超级管理技术","C":"端口反向连接技术","D":"自动生产技术"},"answer":"D","analysis":"进程注入技术、端口反向连接技术常用于恶意代码攻击。“超级管理技术” 表述不准确，可能指获取超级用户权限相关技术，也与恶意代码攻击有关。而 “自动生产技术” 不属于恶意代码攻击技术","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-398","type":"choice","number":398,"globalNumber":398,"stem":"下列叙述中正确的是 (　　)","images":[],"options":{"A":"计算机病毒只感染可执行文件","B":"计算机病毒只感染文本文件","C":"计算机病毒只能通过软件复制的方式进行传播","D":"计算机病毒可以通过读写磁盘或网络等方式进行传播"},"answer":"D","analysis":"计算机病毒可感染多种类型文件，包括可执行文件、文本文件等；传播途径有读写磁盘、网络、移动存储设备等多种方式，并非仅通过软件复制传播","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-399","type":"choice","number":399,"globalNumber":399,"stem":"病毒感染文件时，常常会有一些不同于正常程序的行为，利用病毒的特有行为和特性检测病毒的方法被称为 (　　)","images":[],"options":{"A":"行为检测法","B":"校验和法","C":"主动防御法","D":"特征行为法"},"answer":"A","analysis":"行为检测法就是利用病毒感染文件时的特有行为和特性来检测病毒；校验和法是通过计算文件校验和判断文件是否被修改；主动防御法是一种综合性的安全防护理念；“特征行为法” 表述不准确","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"},{"id":"choice-400","type":"choice","number":400,"globalNumber":400,"stem":"以下描述的现象中，不属于计算机病毒的是 (　　)","images":[],"options":{"A":"破坏计算机的程序或数据","B":"windows 的 “控制面板” 窗口中无 “本地连接” 图标","C":"使网络阻塞不可用","D":"使得 CPU 一直处于 100% 使用率"},"answer":"B","analysis":"计算机病毒可能破坏程序或数据、使网络阻塞、导致 CPU 使用率过高。“控制面板” 中无 “本地连接” 图标可能是网络设置问题、驱动问题等，不一定是由计算机病毒引起","source":"网络安全基础","difficulty":"中等","file":"choice_351-400.html"}];

function renderPinList(){const wrap=$("pinList");wrap.textContent="";const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(!pins.length){wrap.append(element("div","side-muted","暂无图钉题目"));return}const known=pins.map(findMeta).filter(Boolean);const groupOrder=["choice","multi","judgment","fill"];for(const type of groupOrder){const items=known.filter(m=>m.type===type);if(!items.length)continue;wrap.append(element("div","side-section-title",typeName(type)));const row=element("div","pin-list");for(const m of items){const b=element("button","pin-chip",String(m.number));b.type="button";b.dataset.action="goto-meta";b.dataset.qid=m.id;b.title=typeName(m.type)+" 第"+m.number+"题";row.append(b)}wrap.append(row)}}

function updatePager(){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);for(const b of document.querySelectorAll('[data-action="prev"],[data-action="next"]')){const isPrev=b.dataset.action==="prev";b.disabled=idx<0||(isPrev?idx===0:idx>=routes.length-1)}const submitVisible=isExamOpen();document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.classList.toggle("hidden",!submitVisible));document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.disabled=!submitVisible)}
function renderMode(){const n=$("modeLabel");if(n)n.textContent=statusText();const s=$("pageInfo");if(s){const r=routeByFile(PAGE_FILE);s.textContent=r?`${typeName(r.type)} · ${r.start}–${r.end} 题`:"刷题"}const top=$("quizMainTitle");if(top)top.textContent=statusText();}
function scrollToQuestion(id){const card=$("q-"+id);if(!card)return;progress.currentId=id;progress.currentFile=PAGE_FILE;saveProgress();document.querySelectorAll(".question-card.is-current").forEach(n=>n.classList.remove("is-current"));card.classList.add("is-current");renderQuestionNavigation();const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}
function gotoQuestion(id){const m=findMeta(id);if(!m)return;if(m.file!==PAGE_FILE){progress.currentFile=m.file;progress.currentId=id;saveProgress();location.href=m.file;return}if(!questionMap[id])return;scrollToQuestion(id)}
function switchPage(delta){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);const target=routes[idx+delta];if(!target)return;const ids=target.ids.filter(id=>progress.mode!=="wrong"||(progress.wrongIds||[]).includes(id));let ordered=ids;if(progress.mode==="exam"&&examSession&&examSession.questionOrders[target.file])ordered=examSession.questionOrders[target.file].filter(id=>ids.includes(id));if(progress.mode==="review"&&lastResult&&lastResult.questionOrders&&lastResult.questionOrders[target.file])ordered=lastResult.questionOrders[target.file].filter(id=>ids.includes(id));progress.currentFile=target.file;progress.currentId=ordered[0]||ids[0]||null;saveProgress();location.href=target.file}
function togglePin(id){if(isReadOnly()||!id)return;const pins=new Set(progress.pins||[]);if(pins.has(id))pins.delete(id);else pins.add(id);progress.pins=[...pins];saveProgress();updateOneQuestion(id)}
function recordStats(q,correct,answered){if(!answered)return;progress.stats=progress.stats||{};progress.stats[q.id]={answered:true,correct:Boolean(correct),updatedAt:Date.now()}}
function answerQuestion(id,key){const q=questionMap[id];if(!q||isReadOnly())return;if(progress.mode==="wrong"&&!(progress.wrongIds||[]).includes(id))return;let s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};if(progress.mode==="exam"){
if(!isExamOpen())return;if(q.type==="multi"){const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set]}else s.selectedKeys=[key];s.answered=s.selectedKeys.length>0;s.locked=false;s.correct=null;progress.answers[id]=s;saveProgress();updateOneQuestion(id);return}
if(s.locked)return;if(q.type==="multi"){
const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set];const correct=new Set(correctKeys(q));const wrong=s.selectedKeys.some(k=>!correct.has(k));const complete=[...correct].every(k=>set.has(k))&&set.size===correct.size;if(wrong||complete){s.answered=true;s.locked=true;s.correct=!wrong&&complete;recordStats(q,s.correct,true)}else{s.answered=false;s.correct=null;s.locked=false}
}else{s.selectedKeys=[key];s.answered=true;s.locked=true;s.correct=answersMatch(q,s);recordStats(q,s.correct,true)}progress.answers[id]=s;saveProgress();updateOneQuestion(id)}
function submitFill(id){const q=questionMap[id];if(!q||isReadOnly()||progress.mode==="exam")return;const fields=[...document.querySelectorAll(`input[data-qid="${id}"][data-blank]`)];const vals=fields.map(n=>n.value.slice(0,20));if(!vals.some(v=>v.trim())){alert("请先填写答案。");return}const s={blanks:vals,selectedKeys:[],answered:true,locked:true};const correctAnswers=Array.isArray(q.blanks)?q.blanks:[];s.correct=correctAnswers.length===vals.length&&correctAnswers.every((v,i)=>normalizeText(v)===normalizeText(vals[i]));progress.answers[id]=s;recordStats(q,s.correct,true);saveProgress();updateOneQuestion(id)}
function exitToHome(){checkpointTimer();progress.active=true;progress.timerRunning=false;progress.timerStartedAt=null;saveProgress();if(examSession&&progress.mode==="exam"){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession)}location.href="index.html"}
const ALL_META_MAP=Object.fromEntries(META.map(m=>[m.id,m]));
function submitExam(){if(!isExamOpen())return;if(!confirm("确定交卷吗？未作答的题目将按错误计入，本次考试将停止计时。"))return;const now=Date.now();progress.elapsedMs=getElapsed();progress.timerRunning=false;progress.timerStartedAt=null;examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession);const states={};const wrongIds=[];let total=0,correctCount=0;for(const m of META){const q=questionMap[m.id]||null;const answer=progress.answers[m.id]||{selectedKeys:[],blanks:[],answered:false,locked:false};const selected=Array.isArray(answer.selectedKeys)?answer.selectedKeys.slice():[];let hasAnswer=selected.length>0;if(m.type==="fill"){const blanks=Array.isArray(answer.blanks)?answer.blanks:[];hasAnswer=blanks.some(v=>String(v||"").trim()!=="")}
let correct=false;if(q){correct=hasAnswer&&answersMatch(q,answer)}else{const base=answer.correct;correct=hasAnswer&&base===true}
// This page includes only 50 questions, so exam submission must use source-independent answer snapshots captured at each page.
const snap=examSession.answerSnapshot&&examSession.answerSnapshot[m.id];if(snap){hasAnswer=!!snap.answered;correct=hasAnswer&&snap.correct===true;}
// The home page has no access to the page-specific current state; store all answers and their correctness in the shared progress object.
const allAnswer=progress.answers[m.id]||{};const answered=Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.length>0:(Array.isArray(allAnswer.blanks)&&allAnswer.blanks.some(v=>String(v||"").trim()!==""));
let finalCorrect=false;const ak=ANSWER_KEYS[m.id];if(answered&&ak){if(ak.type==="choice"||ak.type==="judgment")finalCorrect=allAnswer.selectedKeys?.length===1&&allAnswer.selectedKeys[0]===ak.answer;else if(ak.type==="multi"){const a=[...(allAnswer.selectedKeys||[])].sort(),b=[...(ak.answer||[])].sort();finalCorrect=a.length===b.length&&a.every((v,i)=>v===b[i])}else if(ak.type==="fill"){const norm=v=>String(v??"").normalize("NFKC").trim().toLowerCase();finalCorrect=(ak.blanks||[]).length===(allAnswer.blanks||[]).length&&(ak.blanks||[]).every((v,i)=>norm(v)==norm(allAnswer.blanks[i]))}}
states[m.id]={id:m.id,type:m.type,number:m.number,file:m.file,selectedKeys:Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.slice():[],blanks:Array.isArray(allAnswer.blanks)?allAnswer.blanks.slice():[],answered,correct:finalCorrect};total++;if(finalCorrect)correctCount++;else wrongIds.push(m.id);
if(answered)progress.stats[m.id]={answered:true,correct:finalCorrect,updatedAt:now};}
const result={schema:2,resultId:"result-"+now.toString(36),mode:"考试模式",testAt:now,elapsedMs:progress.elapsedMs,total,correct:correctCount,accuracy:total?correctCount/total:0,wrongIds,questionStates:states,questionOrders:examSession.questionOrders||{},optionOrders:examSession.optionOrders||{},pins:(progress.pins||[]).slice()};writeKey(STORAGE_KEYS.result,result);progress.active=false;progress.mode=null;progress.answers={};progress.pins=result.pins.slice();progress.currentFile=null;progress.currentId=null;progress.timerRunning=false;progress.timerStartedAt=null;progress.completed=true;saveProgress();removeKey(STORAGE_KEYS.exam);location.href="result.html"}
function renderAll(){currentOrder=idsForPage();renderMode();renderQuestionList();renderQuestionNavigation();renderPinList();renderTimer();updatePager()}
function init(){progress=readProgress();examSession=readKey(STORAGE_KEYS.exam);lastResult=readKey(STORAGE_KEYS.result);const marker=readKey(STORAGE_KEYS.marker);if(location.protocol==="file:"){showStorageWarning("当前通过 file:// 直接打开。浏览器可能隔离不同 HTML 文件的本地存储；若跨页进度无法共享，请改用同源静态站点，或通过首页导入/导出备份。")}
if(!safeStorage)showStorageWarning("浏览器本地存储不可用，进度可能无法保存。请检查浏览器权限后再开始。")
if(!progress.active){const stats=progress.stats||{};const route=routeByFile(PAGE_FILE);progress={...baseProgress(),active:true,mode:"practice",answers:{},stats,pins:[],currentFile:PAGE_FILE,currentId:route?.ids?.[0]||null,elapsedMs:0,timerRunning:true,timerStartedAt:Date.now(),wrongIds:[],createdAt:Date.now()};saveProgress()}
if(progress.mode==="exam"&&!examSession){showStorageWarning("没有读取到当前考试会话，已禁止自动开始或重新打乱。请返回首页并导入之前导出的进度，或在同源静态站点中重新进入考试。")}
if(progress.mode==="review")lastResult=readKey(STORAGE_KEYS.result);
if(progress.mode==="wrong"){const routes=activeRoutes();if(!routes.length){alert("暂无数据：没有可复习的错题。");location.href="index.html";return}if(!routes.some(r=>r.file===PAGE_FILE)){progress.currentFile=routes[0].file;progress.currentId=routes[0].ids.find(id=>(progress.wrongIds||[]).includes(id))||routes[0].ids[0];saveProgress();location.replace(progress.currentFile);return}}
if(progress.mode!=="wrong"&&progress.mode!=="exam"&&progress.mode!=="review"&&progress.mode!=="practice"){progress.mode="practice";progress.currentFile=PAGE_FILE;progress.currentId=PAGE_QUESTIONS[0]?.id||null;saveProgress()}
if(progress.currentFile!==PAGE_FILE){progress.currentFile=PAGE_FILE;if(!progress.currentId||!questionMap[progress.currentId])progress.currentId=idsForPage()[0]||null;saveProgress()}
const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
document.addEventListener("input",e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||!input.dataset.qid||input.dataset.blank===undefined||isReadOnly())return;const id=input.dataset.qid;const idx=Number(input.dataset.blank);const s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};s.blanks=s.blanks||[];s.blanks[idx]=input.value.slice(0,20);progress.answers[id]=s;});
function selfTestMapping(){const testOrder=["B","C","D","A"];const map={};testOrder.forEach((k,i)=>map[k]=String.fromCharCode(65+i));if(map.A!=="D")throw new Error("选项映射自测失败");const expected=["A","C"].map(k=>map[k]).sort().join(",");if(expected!=="B,D")throw new Error("多选题映射自测失败")}
try{selfTestMapping()}catch(e){showStorageWarning("答案映射检查未通过，已阻止继续作答。请返回首页重新进入考试。");}
init();
</script></body></html>
