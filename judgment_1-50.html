*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#F7F6FB;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7560BD;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.42}a{color:var(--primary-dark)}.hidden{display:none!important}.muted{color:var(--muted)}.eyebrow{font-size:.78rem;letter-spacing:.09em;color:var(--primary-dark);font-weight:750}.brand-title{margin:.2rem 0 .35rem;font-size:clamp(1.7rem,3vw,2.45rem);line-height:1.25;letter-spacing:-.035em}.btn{border:1px solid var(--line);border-radius:12px;padding:.72rem 1rem;min-height:44px;background:#fff;color:var(--ink);font-weight:650;transition:background-color .15s,border-color .15s,transform .15s}.btn:hover:not(:disabled){border-color:#B6A4F3;background:#FBF9FF}.btn-primary{background:var(--primary);border-color:var(--primary);color:#2A2145}.btn-primary:hover:not(:disabled){background:#B6A4F4;border-color:#B6A4F4}.btn-quiet{background:#F2EFF9;border-color:#E8E2F6}.btn-danger{color:#9B2330;border-color:#F0CDCF;background:#FFF8F8}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;background:var(--primary-light);color:#59458F;padding:.28rem .65rem;font-size:.8rem;font-weight:700}.storage-warning{margin:12px 0;padding:11px 13px;border:1px solid #EBD7A4;background:#FFF9E9;border-radius:12px;color:#6F5310;font-size:.88rem}.status-good{color:var(--good-ink)}.status-bad{color:var(--bad-ink)}

rong{border-color:#F0B7BB;background:var(--bad);color:#8B1E28}.option.is-wrong .option-label{background:#FFC9CD;color:#8B1E28}.option:disabled{opacity:1;cursor:default}.option:disabled:not(.is-correct):not(.is-wrong){color:var(--ink)}.analysis-block{margin-top:16px;padding:15px 16px;background:#F8F7FC;border:1px solid #E8E4F2;border-left:4px solid #A895E8;border-radius:12px;font-size:.92rem}.analysis-block h4{margin:0 0 8px;font-size:.95rem}.analysis-line{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.analysis-line strong{color:#55447F}.image-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.question-image{max-width:min(100%,360px);max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}.fill-inputs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}.fill-field{display:grid;gap:5px;min-width:min(100%,190px);flex:1}.fill-field input{width:100%;border:1px solid #D8D3E5;border-radius:10px;padding:11px 12px;min-height:44px}.fill-field input.is-correct{border-color:#82C99C;background:#EAF8EF}.fill-field input.is-wrong{border-color:#E99BA1;background:#FFF0F0}.fill-submit{margin-top:4px}.sidebar{position:fixed;z-index:20;top:18px;right:18px;bottom:18px;width:318px;padding:15px;background:#fff;border:1px solid #E2DDEA;border-radius:20px;box-shadow:0 8px 32px rgba(35,25,65,.11);display:flex;flex-direction:column;gap:13px;min-height:0}.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 10px;border-bottom:1px solid var(--line)}.timer-label{font-size:.78rem;color:var(--muted);font-weight:700}.timer-value{font-size:1.32rem;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.25}.side-toggle{border:1px solid var(--line);border-radius:10px;background:#FBFAFE;padding:7px 10px;color:var(--primary-dark);font-size:.82rem;font-weight:750}.sidebar-details{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding:0 2px 8px}.side-section-title{font-size:.86rem;font-weight:850;margin:0 0 8px}.sidebar.collapsed .sidebar-details{display:none}.number-button.is-selected{background:#F2EDFF;border-color:#C3B3FF;color:#59458F}.side-question-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.number-button{min-width:0;min-height:34px;padding:3px;border:1px solid #E5E1EC;border-radius:9px;background:white;color:#4E495D;font-weight:700;font-size:.83rem;font-variant-numeric:tabular-nums}.number-button.is-correct{background:var(--good);border-color:#B2DCC1;color:var(--good-ink)}.number-button.is-wrong{background:var(--bad);border-color:#F0B5B9;color:var(--bad-ink)}.number-button.is-current{box-shadow:inset 0 0 0 2px #9F8AE9;background:#F5F0FF}.number-button.is-pinned{border:2px solid #E1AD1F}.pin-list{display:flex;flex-wrap:wrap;gap:7px}.pin-chip{min-width:42px;padding:5px 8px;border:2px solid #E1AD1F;border-radius:9px;background:var(--pin-soft);font-weight:800;color:#6C5110}.side-muted{color:var(--muted);font-size:.84rem}.sidebar-footer{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px;background:#fff}.pager-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-exit{width:100%}.mode-label{font-size:.77rem;color:var(--muted);font-weight:700}.mobile-only{display:none}.storage-warning{margin:8px 0 0}.empty-questions{padding:30px;text-align:center;border:1px dashed #D6D0E3;border-radius:16px;color:var(--muted);background:#fff}.blank-marker{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;color:#6A559D;font-weight:850}.quiz-bottom-spacer{height:25px}

<script>
const PAGE_FILE = "judgment_1-50.html";
const PAGE_QUESTIONS = [{"id":"judgment-001","type":"judgment","number":1,"globalNumber":401,"stem":"装机过程中不要连接电源线，严禁带电插拔硬件，以免烧坏芯片或部件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在装机过程中，带电插拔硬件容易产生瞬间电流，可能会超出芯片或部件的承受范围，从而烧坏它们，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-002","type":"judgment","number":2,"globalNumber":402,"stem":"数据库在计算机系统中不是以文件方式存储的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"数据库在计算机系统中通常是以文件的形式存储在磁盘等存储设备上的，如常见的关系型数据库会有数据文件、日志文件等，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-003","type":"judgment","number":3,"globalNumber":403,"stem":"IEEE802.11b 工作在 5GHz 频段。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"IEEE802.11b 工作在 2.4GHz 频段，而不是 5GHz 频段，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-004","type":"judgment","number":4,"globalNumber":404,"stem":"《数据安全法》适用于在中华人民共和国境内外开展数据处理活动及其安全监管。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"《数据安全法》适用于在中华人民共和国境内开展的数据处理活动及其安全监管，在境外处理境内数据的活动，有条件地适用本法，并非境内外所有活动都适用，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-005","type":"judgment","number":5,"globalNumber":405,"stem":"任何组织或者个人经批准可以窃取他人加密保护的信息或者非法侵入他人的密码保障系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"窃取他人加密保护的信息或非法侵入他人密码保障系统属于违法行为，即使经过批准也不允许，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-006","type":"judgment","number":6,"globalNumber":406,"stem":"OSI 参考模型的每一层都负责完成某些特定的通信任务，并只与紧邻的上层和下层进行数据的交换。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI 参考模型分层的目的就是让每一层专注于特定功能，各层之间主要与紧邻的上下层进行数据交互，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-007","type":"judgment","number":7,"globalNumber":407,"stem":"双绞线既可以传输模拟信号，又可以传输数字信号。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"双绞线通过不同的编码方式可以传输模拟信号，如传统电话线路；也可以通过特定的数字编码传输数字信号，如以太网中的双绞线，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-008","type":"judgment","number":8,"globalNumber":408,"stem":"光纤是一种可以传输电信号的网络传输介质。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"光纤是通过光信号来传输数据的，它不传输电信号，利用光在光纤中的全反射原理进行信息传输，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-009","type":"judgment","number":9,"globalNumber":409,"stem":"操作系统在计算机系统中处于处理机和用户之间的位置。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"操作系统作为系统软件，管理计算机硬件资源，为用户提供操作界面，处于处理机和用户之间，起到承上启下的作用，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-010","type":"judgment","number":10,"globalNumber":410,"stem":"UNIX 操作系统的文件系统是分级树型结构。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"UNIX 操作系统的文件系统采用分级树型结构，以根目录 “/” 为起点，方便文件的组织和管理，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-011","type":"judgment","number":11,"globalNumber":411,"stem":"通常所说的 “病毒” 是指特制的具有破坏性的程序。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"计算机病毒是人为编制的、具有自我复制能力并能对计算机系统造成破坏的程序，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-012","type":"judgment","number":12,"globalNumber":412,"stem":"一旦计算机染上恶意代码，就立即格式化磁盘。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"计算机染上恶意代码后，格式化磁盘是一种极端的处理方式，可能会导致重要数据丢失。通常应先尝试使用杀毒软件进行查杀等其他方式解决，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-013","type":"judgment","number":13,"globalNumber":413,"stem":"恶意代码会造成计算机硬件，软件和数据的损坏。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"恶意代码具有多种危害，可破坏软件系统、篡改或删除数据，在某些情况下还可能影响硬件正常运行，如导致硬件过热等，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-014","type":"judgment","number":14,"globalNumber":414,"stem":"木马程序的最大危害在于它对破坏软硬件系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"木马程序主要特点是隐藏自身，窃取用户信息，而不是直接破坏软硬件系统，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-015","type":"judgment","number":15,"globalNumber":415,"stem":"防病毒的错误警告是对系统产生的问题进行报警。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"防病毒的错误警告可能是误报，并不一定是系统真的产生了问题，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-016","type":"judgment","number":16,"globalNumber":416,"stem":"WWW 服务只能使用 TCP 端口 80。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"WWW 服务默认使用 TCP 端口 80，但也可以使用其他端口，通过配置服务器可以更改端口号，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-017","type":"judgment","number":17,"globalNumber":417,"stem":"如果要使用电子邮件发送邮件时，收件人必须要有自己的邮政编码。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"使用电子邮件发送邮件时，不需要收件人的邮政编码，只需要正确的电子邮箱地址即可，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-018","type":"judgment","number":18,"globalNumber":418,"stem":"静态的 IP 地址和 DHCP 服务器提供给 DHCP 客户端的永久租用的 IP 地址是一种方法。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"静态 IP 地址是手动配置且固定不变的；DHCP 服务器分配的 IP 地址是动态的，有租约期限，并非永久租用，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-019","type":"judgment","number":19,"globalNumber":419,"stem":"DHCP 服务器分配 IP 地址的最大租期的时间可以是无限的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在实际配置中，DHCP 服务器分配 IP 地址的租期可根据需求设置，理论上最大租期时间可以设置为无限，但实际中很少这样设置，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-020","type":"judgment","number":20,"globalNumber":420,"stem":"进行 LanFree 备份时，所有数据流将不通过局域网，不占用网络资源。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"LanFree 备份通过 SAN（存储区域网络）等技术实现数据备份，数据直接在存储设备之间传输，不经过局域网，避免占用局域网带宽等网络资源，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-021","type":"judgment","number":21,"globalNumber":421,"stem":"计算机网络是计算机技术与通信技术结合的产物。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"计算机网络利用通信技术实现计算机之间的数据传输，同时依靠计算机技术对数据进行处理和管理，是两者结合的成果，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-022","type":"judgment","number":22,"globalNumber":422,"stem":"TCP/IP 体系结构中，将计算机网络划分为应用层、传输层、网际层、网络接口层等 4 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"TCP/IP 体系结构从功能上分为这四个层次，各层分工协作实现网络通信，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-023","type":"judgment","number":23,"globalNumber":423,"stem":"HDLC 协议是 OSI/RM 的数据链路层的协议。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"HDLC（高级数据链路控制）协议属于 OSI/RM（开放系统互连参考模型）的数据链路层协议，用于在数据链路层进行数据传输控制，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-024","type":"judgment","number":24,"globalNumber":424,"stem":"SMTP 和 POP3 协议可以实现主机间电子邮件的发送和接收功能。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"SMTP（简单邮件传输协议）用于邮件的发送，POP3（邮局协议版本 3）用于邮件的接收，两者协同实现主机间电子邮件的收发，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-025","type":"judgment","number":25,"globalNumber":425,"stem":"当网管员想要测试两台主机之间的网络是否连通时可以使用 ping 命令。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"ping 命令通过发送 ICMP（网际控制报文协议）回显请求报文来测试两台主机之间的网络连通性，是常用的网络测试工具，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-026","type":"judgment","number":26,"globalNumber":426,"stem":"DNS 是域名服务器，它的功能是将 IP 地址翻译为域名。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"DNS 的主要功能是将域名解析为 IP 地址，方便用户通过域名访问网络资源，而不是将 IP 地址翻译为域名，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-027","type":"judgment","number":27,"globalNumber":427,"stem":"OSI 参考模型是对发生在网络设备间的信息传输过程的一种理论化描述，并没有定义具体各层协议。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI 参考模型只是提供了一个概念性框架，描述了网络通信的层次结构和各层功能，没有定义具体的协议，具体协议由不同的标准组织和厂商制定，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-028","type":"judgment","number":28,"globalNumber":428,"stem":"光纤的最大优点是不容易受电磁或无线电频率干扰，所以传输速率较高。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"光纤通过光信号传输数据，不受电磁或无线电频率干扰，能保证信号稳定传输，从而可以实现较高的传输速率，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-029","type":"judgment","number":29,"globalNumber":429,"stem":"RIP 路由协议的工作原理是通过路由器将自己知道的路由信息，每隔 60s 广播给它的邻居，从而计算最佳路径。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"RIP 路由协议是通过路由器将自己知道的路由信息，每隔 30s 广播给它的邻居，然后根据跳数计算最佳路径，不是 60s，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-030","type":"judgment","number":30,"globalNumber":430,"stem":"在覆盖范围方面，802.11n 采用智能天线技术，通过多组独立天线组成的天线阵列，可以动态调整波束，保证让 WLAN 用户接收到稳定的信号，并可以减少其它信号的干扰。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"802.11n 利用智能天线技术，通过天线阵列动态调整波束，提高信号覆盖范围和稳定性，减少干扰，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-031","type":"judgment","number":31,"globalNumber":431,"stem":"Kali 是 Windows 系列的桌面级操作系统。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"Kali 是基于 Linux 的操作系统，主要用于渗透测试、安全评估等，不是 Windows 系列，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-032","type":"judgment","number":32,"globalNumber":432,"stem":"混合型病毒，也称综合型、复合型病毒，同时具备引导型和文件型病毒的特征，即这种病毒既可以感染磁盘引导扇区，又可以感染可执行文件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"混合型病毒结合了引导型和文件型病毒的特点，能同时感染磁盘引导扇区和可执行文件，传播和破坏能力更强，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-033","type":"judgment","number":33,"globalNumber":433,"stem":"卡巴斯基是杀毒软件的一种。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"卡巴斯基是知名的杀毒软件品牌，用于检测和清除计算机病毒、恶意软件等，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-034","type":"judgment","number":34,"globalNumber":434,"stem":"工具软件提供一种工具以方便用户进行软件开发或者帮助解决一些应用中的普通问题。病毒防治软件是常见的工具软件。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"工具软件能辅助用户完成特定任务，病毒防治软件帮助用户解决计算机安全问题，属于工具软件，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-035","type":"judgment","number":35,"globalNumber":435,"stem":"在 Windows 资源管理器地址栏内，可以用ftp://ftp.abc.com的方式访问 FTP 服务器。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在 Windows 系统中，通过在资源管理器地址栏输入 FTP 服务器地址（格式为 ftp:// 服务器地址）可以访问 FTP 服务器，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-036","type":"judgment","number":36,"globalNumber":436,"stem":"在 Linux 系统中可以使用 smbpasswd 命令管理 samba 用户账户，但是 smbpasswd 命令不能实现禁用 samba 用户账号。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"在 Linux 系统中，smbpasswd 命令不仅可以管理 samba 用户账户，还能通过特定参数实现禁用 samba 用户账号，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-037","type":"judgment","number":37,"globalNumber":437,"stem":"如果要在一个由多网段组成的网络中使用 DHCP，可以多个网段使用同一个 DHCP 服务器。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"通过在 DHCP 服务器上进行合理配置，如设置不同的作用域，可以为多个网段分配 IP 地址，实现多个网段使用同一个 DHCP 服务器，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-038","type":"judgment","number":38,"globalNumber":438,"stem":"为了确保安全，需要限制对 DNS 服务器进行域名递归查询的服务器或主机。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"限制对 DNS 服务器进行域名递归查询的服务器或主机，可以防止 DNS 缓存污染、拒绝服务攻击等安全问题，提高 DNS 服务器的安全性，所以该说法正确。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-039","type":"judgment","number":39,"globalNumber":439,"stem":"当对共享文件夹进行复制或移动的操作时，复制或移动后的文件夹仍然是共享文件夹。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"对共享文件夹进行复制操作后，复制的文件夹默认不再是共享状态；移动到同一分区内共享属性可能保留，移动到不同分区一般也不再是共享文件夹，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-040","type":"judgment","number":40,"globalNumber":440,"stem":"杀毒软件的功能与防火墙功能是一样的，两者只选择一个安装就可以。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"杀毒软件主要用于检测和清除病毒、恶意软件；防火墙主要用于控制网络访问，防止外部非法访问和内部非法外联，两者功能不同，不能只选其一，所以该说法错误。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-041","type":"judgment","number":41,"globalNumber":441,"stem":"职业素养是纯实践层面的技能素养。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"职业素养包含多个方面，不仅有实践技能素养，还涵盖职业道德、职业意识、职业行为习惯等，并非单纯局限于实践层面。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-042","type":"judgment","number":42,"globalNumber":442,"stem":"2001 年以前，中国没有一台机器能入围 TOP500，而到了 2010 年，“天河一号” 便横空出世，登上世界超算之巅。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"在 2001 年前，中国确实没有计算机入围 TOP500，2010 年 “天河一号” 超级计算机问世，并在当时成为世界上运算速度最快的超级计算机，登上世界超算之巅。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-043","type":"judgment","number":43,"globalNumber":443,"stem":"现代 OS 具有并发性和共享性，是由单道程序的引入而导致的。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"现代操作系统的并发性和共享性是多道程序引入的结果。单道程序一次仅能执行一个程序，无法实现并发和共享；多道程序环境下，多个程序可同时驻留内存，实现资源共享和并发执行。","source":"未提供","difficulty":"中等","file":"judgment_1-50.html"},{"id":"judgment-044","type":"judgment","number":44,"globalNumber":444,"stem":"计算机网络是计算机技术与通信技术结合的产物。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"计算机网络是通过通信线路和通信设备将地理位置不同的、功能独立的多个计算机系统连接起来，以功能完善的网络软件实现网络中资源共享和信息传递的系统，是计算机技术与通信技术融合的成果。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-045","type":"judgment","number":45,"globalNumber":445,"stem":"开放系统互连参考模型（OSI/RM）将整个网络的功能划分成 7 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"OSI/RM 从下到上依次为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层，共 7 个层次，用于规范网络通信功能。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-046","type":"judgment","number":46,"globalNumber":446,"stem":"TCP/IP 体系结构中，将计算机网络划分为应用层、传输层、网际层、网络接口层等 4 个层次。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"TCP/IP 体系结构是当前应用最广泛的网络体系结构，包含应用层（负责应用程序接口）、传输层（提供端到端的可靠或不可靠传输）、网际层（处理网络层数据包的路由和转发）、网络接口层（负责与物理网络的交互）。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-047","type":"judgment","number":47,"globalNumber":447,"stem":"利用 FTP 协议可以实现对主机的地址分配和配置工作。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"FTP（文件传输协议）主要用于在网络中进行文件的传输，如上传和下载；而主机地址分配和配置工作通常由 DHCP（动态主机配置协议）完成。","source":"未提供","difficulty":"中等","file":"judgment_1-50.html"},{"id":"judgment-048","type":"judgment","number":48,"globalNumber":448,"stem":"路由器可以在网络层上实现多个网络之间的互连。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"路由器工作在网络层，它根据网络层的 IP 地址信息进行数据包的转发，能够连接不同的网络，实现网络之间的通信和数据交换。","source":"未提供","difficulty":"较低","file":"judgment_1-50.html"},{"id":"judgment-049","type":"judgment","number":49,"globalNumber":449,"stem":"《网络安全法》的第一条讲的是国家网络安全战略。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"错误","analysis":"《网络安全法》第一条规定：“为了保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展，制定本法。” 并非阐述国家网络安全战略。","source":"未提供","difficulty":"中等","file":"judgment_1-50.html"},{"id":"judgment-050","type":"judgment","number":50,"globalNumber":450,"stem":"在企业内部进行 IP 地址空间的规划时，用的都是私有地址空间。","images":[],"options":{"正确":"正确","错误":"错误"},"answer":"正确","analysis":"企业内部为节省公网 IP 地址资源、提高网络安全性和管理便利性，通常使用私有地址空间（如 10.0.0.0 - 10.255.255.255、172.16.0.0 - 172.31.255.255、192.168.0.0 - 192.168.255.255 等）进行 IP 地址规划。","source":"未提供","difficulty":"中等","file":"judgment_1-50.html"}];

if(progress.mode==="review")lastResult=readKey(STORAGE_KEYS.result);
if(progress.mode==="wrong"){const routes=activeRoutes();if(!routes.length){alert("暂无数据：没有可复习的错题。");location.href="index.html";return}if(!routes.some(r=>r.file===PAGE_FILE)){progress.currentFile=routes[0].file;progress.currentId=routes[0].ids.find(id=>(progress.wrongIds||[]).includes(id))||routes[0].ids[0];saveProgress();location.replace(progress.currentFile);return}}

const startAtPageTop=progress.openAtTop===true;if(startAtPageTop){progress.openAtTop=false;saveProgress()}const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(!startAtPageTop&&progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});else if(startAtPageTop)requestAnimationFrame(()=>window.scrollTo({top:0,behavior:"auto"}));if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
