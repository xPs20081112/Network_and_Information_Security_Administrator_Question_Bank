section-title{font-size:.86rem;font-weight:850;margin:0 0 8px}.sidebar.collapsed .sidebar-details{display:none}.number-button.is-selected{background:#F2EDFF;border-color:#C3B3FF;color:#59458F}.side-question-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.number-button{min-width:0;min-height:34px;padding:3px;border:1px solid #E5E1EC;border-radius:9px;background:white;color:#4E495D;font-weight:700;font-size:.83rem;font-variant-numeric:tabular-nums}.number-button.is-correct{background:var(--good);border-color:#B2DCC1;color:var(--good-ink)}.number-button.is-wrong{background:var(--bad);border-color:#F0B5B9;color:var(--bad-ink)}.number-button.is-current{box-shadow:inset 0 0 0 2px #9F8AE9;background:#F5F0FF}.number-button.is-pinned{border:2px solid #E1AD1F}.pin-list{display:flex;flex-wrap:wrap;gap:7px}.pin-chip{min-width:42px;padding:5px 8px;border:2px solid #E1AD1F;border-radius:9px;background:var(--pin-soft);font-weight:800;color:#6C5110}.side-muted{color:var(--muted);font-size:.84rem}.sidebar-footer{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px;background:#fff}.pager-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-exit{width:100%}.mode-label{font-size:.77rem;color:var(--muted);font-weight:700}.mobile-only{display:none}.storage-warning{margin:8px 0 0}.empty-questions{padding:30px;text-align:center;border:1px dashed #D6D0E3;border-radius:16px;color:var(--muted);background:#fff}.blank-marker{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;color:#6A559D;font-weight:850}.quiz-bottom-spacer{height:25px}

<script>
const PAGE_FILE = "choice_201-250.html";
const PAGE_QUESTIONS = [{"id":"choice-201","type":"choice","number":201,"globalNumber":201,"stem":"以下关于 NTFS 权限作用原则的描述中，不正确的是 (　　)","images":[],"options":{"A":"具有累加性","B":"拒绝权限优先于其他权限","C":"文件权限优先于文件夹权限","D":"不需要设置权限"},"answer":"D","analysis":"NTFS 权限具有累加性，拒绝权限优先于其他权限，文件权限优先于文件夹权限，权限设置是保障系统安全的重要手段，所以 “不需要设置权限” 的说法错误。","source":"操作系统安全基础相关课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-202","type":"choice","number":202,"globalNumber":202,"stem":"账号锁定策略中对超过一定次数的错误登录账号进行锁定是为了对抗 (　　) 攻击","images":[],"options":{"A":"分布式拒绝服务攻击 (DDoS)","B":"病毒传染","C":"口令暴力破解","D":"缓冲区溢出攻击"},"answer":"C","analysis":"口令暴力破解是通过不断尝试密码来获取访问权限，账号锁定策略可以有效阻止这种攻击，而分布式拒绝服务攻击、病毒传染、缓冲区溢出攻击与账号错误登录锁定机制无关。","source":"网络安全策略课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-203","type":"choice","number":203,"globalNumber":203,"stem":"如果现在要 Linux 操作系统中新增一个用户叫 china，则应用的指令命令是 (　　)","images":[],"options":{"A":"adduser china","B":"useradd china","C":"mkdir china","D":"vi china"},"answer":"B","analysis":"在 Linux 系统中，useradd 命令用于添加用户，adduser 是 Debian 系 Linux 中的等效命令，在一般常见的 Linux 发行版（如 Red Hat、CentOS 等）中使用 useradd，mkdir 用于创建目录，vi 用于编辑文件。","source":"Linux 系统管理课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-204","type":"choice","number":204,"globalNumber":204,"stem":"某文件的组外成员的权限为只读；所有者有全部权限；组内的权限为读与写，则该文件的权限为 (　　)","images":[],"options":{"A":"467","B":"674","C":"476","D":"764"},"answer":"D","analysis":"在 Linux 文件权限表示中，所有者权限用数字表示为：读（4）、写（2）、执行（1），全部权限为 4 + 2 + 1 = 7；组权限：读（4）、写（2），为 4 + 2 = 6；组外成员权限：只读（4），所以文件权限为 764。","source":"Linux 文件权限管理课程 ID","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-205","type":"choice","number":205,"globalNumber":205,"stem":"以下哪个命令可以删除一个非空子目录 /tmp (　　)","images":[],"options":{"A":"del /tmp/*","B":"rm –rf /tmp","C":"rm –Ra /tmp/*","D":"rm –rf /tmp/*"},"answer":"B","analysis":"在 Linux 系统中，rm -rf 命令用于递归强制删除目录及其内容，可删除非空子目录。del 是 Windows 系统下的删除命令，rm -Ra 命令格式错误，rm -rf /tmp/中 “/” 多余。","source":"Linux 文件与目录管理课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-206","type":"choice","number":206,"globalNumber":206,"stem":"一般说来，Red Hat Linux 内核的源程序可以在 (　　) 目录下找到","images":[],"options":{"A":"/usr/local","B":"/usr/src","C":"/lib","D":"/usr/share"},"answer":"B","analysis":"在 Red Hat Linux 系统中，内核源程序通常存放在 /usr/src 目录下，/usr/local 用于存放本地安装的软件，/lib 是存放系统库文件的目录，/usr/share 存放共享数据。","source":"Linux 系统结构课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-207","type":"choice","number":207,"globalNumber":207,"stem":"为了修改文件 test 的许可模式，使其文件属主具有读、写和运行的权限，组和其他用户可以读和运行，可以采用的方法 (　　)","images":[],"options":{"A":"chmod 755 test","B":"chmod 700 test","C":"chmod ux+rwx test","D":"chmod g-w test"},"answer":"A","analysis":"chmod 命令用于修改文件权限，755 表示文件属主有读（4）、写（2）、运行（1）权限（4 + 2 + 1 = 7），组和其他用户有读（4）、运行（1）权限（4 + 1 = 5）。chmod 700 表示文件属主有全部权限，组和其他用户无任何权限；chmod ux+rwx test 命令格式错误；chmod g-w 是去除组用户的写权限。","source":"Linux 文件权限设置课程 ID","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-208","type":"choice","number":208,"globalNumber":208,"stem":"SQL Server 支持两种身份验证模式，即 Windows 身份验证模式和混合模式。SQL Server 的混全模式是指：当网络用户尝试接到 SQL Server 数据库时 (　　)","images":[],"options":{"A":"Windows 获取用户输入的用户和密码，并提交给 SQL Serve 进行身份验证，并决定用户的数据库访权限","B":"SQL Serve 根据用户输入的用户和密码，并提交给 Windows 进行身份验证，并决定用户的数据库访权限","C":"SQL Serve 根据已在 Windows 网络中登录的用户的网络安全属性，对用户进行身份验证，并决定用户的数据库访权限","D":"登录到本地 Windows 的用户均可无限制访问 SQL Serve 数据库"},"answer":"C","analysis":"在混合模式下，SQL Server 既可以使用 Windows 身份验证（根据已登录 Windows 用户的网络安全属性验证），也可以使用 SQL Server 身份验证（根据用户输入的用户名和密码验证），A、B 描述错误，D 中 “无限制访问” 错误。","source":"SQL Server 数据库安全课程 ID","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-209","type":"choice","number":209,"globalNumber":209,"stem":"下列叙述不属于完全备份机制特点描述的是 (　　)","images":[],"options":{"A":"每次备份的数据量较大","B":"每次备份所需的时间也就较大","C":"不能进行得太频繁","D":"需要存储空间小"},"answer":"D","analysis":"完全备份是对整个数据集合进行备份，每次备份的数据量较大，所需时间长，由于数据量大，不能过于频繁进行备份，且需要大量存储空间，“需要存储空间小” 不属于其特点。","source":"数据备份策略课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-210","type":"choice","number":210,"globalNumber":210,"stem":"当选择一个异地备份的站点的时候，最重要的是 (　　)","images":[],"options":{"A":"和数据中心物理隔离从而不会遭受相同的风险","B":"给同样程度的保护像在数据中心一样","C":"外包到可信任的第三方","D":"准备监视能力"},"answer":"A","analysis":"选择异地备份站点时，确保和数据中心物理隔离，避免遭受相同风险（如自然灾害等）是首要考虑因素，B、C、D 虽然也重要，但不是最重要的。","source":"数据备份与恢复课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-211","type":"choice","number":211,"globalNumber":211,"stem":"差异备份、增量备份、完全备份三种备份策略的恢复速度由慢到快依次为 (　　)","images":[],"options":{"A":"增量备份、差异备份、完全备份","B":"差异备份、增量备份、完全备份","C":"完全备份、差异备份、增量备份","D":"完全备份、增量备份、差异备份"},"answer":"A","analysis":"增量备份只备份自上次备份（完全备份或增量备份）以来更改的数据，恢复时需要按备份顺序依次还原多个增量备份，恢复速度最慢；差异备份备份自上次完全备份以来更改的数据，恢复时只需还原完全备份和最新的差异备份；完全备份恢复时只需还原一次备份数据，所以恢复速度由慢到快是增量备份、差异备份、完全备份。","source":"数据备份策略课程 ID","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-212","type":"choice","number":212,"globalNumber":212,"stem":"以下哪类存储系统有自己的文件系统 (　　)","images":[],"options":{"A":"DAS","B":"NAS","C":"SAN","D":"LAN"},"answer":"B","analysis":"NAS（网络附属存储）是一种专门的文件存储设备，有自己独立的文件系统，可通过网络提供文件共享服务；DAS（直接附加存储）通常依赖主机操作系统管理文件系统；SAN（存储区域网络）主要提供块级存储服务，本身没有独立文件系统；LAN 是局域网，是一种网络类型，不是存储系统。","source":"存储技术基础课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-213","type":"choice","number":213,"globalNumber":213,"stem":"电子公告服务提供者应当记录在电子公告服务系统中发布的信息内容及其发布时间，互联网地址或者域名。记录备份应当保存 (　　) 天","images":[],"options":{"A":"90","B":"60","C":"30","D":"10"},"answer":"B","analysis":"根据相关规定，电子公告服务提供者记录备份应保存 60 天，这是网络信息管理的要求。","source":"网络信息管理法规课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-214","type":"choice","number":214,"globalNumber":214,"stem":"Backup 命令的功能是用于完成 UNIX/Linux 文件的备份，对于 FTP 服务器来说，下面说法不正确的是 (　　)","images":[],"options":{"A":"Backup E-C 命令用于进行完整备份","B":"Backup-p 命令用于进行增量备份","C":"Backup-f 命令备份由 file 指定的文件","D":"Backup-d 命令当备份设备为磁带时使用此选项"},"answer":"D","analysis":"在 UNIX/Linux 系统中，Backup 命令并没有 Backup -d 命令用于当备份设备为磁带时的选项，A、B、C 对 Backup 命令功能描述正确。","source":"UNIX/Linux 系统备份课程 ID","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-215","type":"choice","number":215,"globalNumber":215,"stem":"Oracle 通过修改用户密码策略可提高密码强度，密码策略参数中下列描述错误的是 (　　)","images":[],"options":{"A":"PASSWORD_MAX 登录超过有效次数锁定时间","B":"FAILED_LOGIN_ATTEMPTS 最大错误登录次数","C":"PASSWORD_GRACE_TIME 密码失效后锁定时间","D":"PASSWORD_LIFE_TIME 口令有效时间"},"answer":"A","analysis":"PASSWORD_MAX 不是登录超过有效次数锁定时间，在 Oracle 密码策略中，FAILED_LOGIN_ATTEMPTS 表示最大错误登录次数，PASSWORD_GRACE_TIME 表示密码失效后锁定时间，PASSWORD_LIFE_TIME 表示口令有效时间。","source":"Oracle 数据库安全课程 ID","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-216","type":"choice","number":216,"globalNumber":216,"stem":"以下命令 (　　) 主要用于确定网络的连通性，对于确定网络是否正确连接，和网络连接状况的","images":[],"options":{"A":"ipconfig","B":"ping","C":"netstat","D":"tracert"},"answer":"B","analysis":"ping 命令通过向目标主机发送 ICMP 回声请求数据包，来测试网络的连通性；ipconfig 用于查看本地网络配置信息；netstat 用于查看网络连接、路由表等网络状态信息；tracert 用于跟踪数据包在网络中的路由路径。","source":"网络命令使用课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-217","type":"choice","number":217,"globalNumber":217,"stem":"(　　) 是指为防止系统故障或其他安全事件导致数据丢失，而将数据从应用主机的硬盘或阵列复制、存储到其他存储介质","images":[],"options":{"A":"数据分类","B":"数据备份","C":"数据加密","D":"网络日志"},"answer":"B","analysis":"数据备份的定义就是为防止数据丢失，将数据从应用主机的存储设备复制到其他存储介质；数据分类是对数据进行分类管理，数据加密是对数据进行加密保护，网络日志是记录网络活动的文件。","source":"数据备份技术课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-218","type":"choice","number":218,"globalNumber":218,"stem":"黑客搭线窃听属于 (　　) 风险","images":[],"options":{"A":"信息存储安全","B":"信息传输安全","C":"信息访问安全","D":"信息使用安全"},"answer":"B","analysis":"黑客搭线窃听是在数据传输过程中获取信息，属于信息传输安全风险；信息存储安全关注数据存储时的安全性，信息访问安全涉及对数据访问的控制，信息使用安全侧重于数据使用过程中的安全。","source":"网络安全风险分类课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-219","type":"choice","number":219,"globalNumber":219,"stem":"网络后门的功能是 (　　)","images":[],"options":{"A":"防止管理员密码丢失","B":"保持对目标主机长期控制","C":"为定期维护主机","D":"为了防止主机被非法入侵"},"answer":"B","analysis":"网络后门是黑客为了保持对目标主机长期控制而在目标主机上开设的非法通道，不是防止管理员密码丢失、定期维护主机或防止主机被非法入侵的手段。","source":"网络安全攻击与防范课程 ID","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-220","type":"choice","number":220,"globalNumber":220,"stem":"当用户通过域名访问某一合法网站时，打开的却是一个不健康的网站，发生该现象的原因可能是 (　　)","images":[],"options":{"A":"ARP 欺骗","B":"DHCP 欺骗","C":"TCP SYN 攻击","D":"DNS 缓存中毒"},"answer":"D","analysis":"DNS 缓存中毒会导致域名解析错误，使合法域名被解析到错误的 IP 地址，从而用户访问合法域名时打开不健康网站；ARP 欺骗主要影响局域网内的地址解析，DHCP 欺骗干扰动态 IP 地址分配，TCP SYN 攻击是一种拒绝服务攻击方式。","source":"网络安全攻击类型课程 ID","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-221","type":"choice","number":221,"globalNumber":221,"stem":"新一代病毒木马融合了很多新技术，下来不属于这些新技术的是 (　　)","images":[],"options":{"A":"进程注入","B":"注册表隐藏","C":"漏洞扫描","D":"破坏性"},"answer":"D","analysis":"进程注入、注册表隐藏、漏洞扫描都属于病毒木马融合的新技术，而破坏性是病毒木马的特性，并非新技术，所以选 D","source":"网络安全基础课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-222","type":"choice","number":222,"globalNumber":222,"stem":"在网络攻击活动中，Tribal Flood Network（TFN）是 (　　) 类的攻击程序","images":[],"options":{"A":"字典攻击","B":"网络监听","C":"病毒程序","D":"拒绝服务"},"answer":"D","analysis":"Tribal Flood Network（TFN）是典型的拒绝服务攻击程序，通过大量请求使目标服务器资源耗尽，无法正常提供服务，所以选 D","source":"网络安全攻击类型课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-223","type":"choice","number":223,"globalNumber":223,"stem":"(　　) 措施不属于有效对抗拒绝服务攻击的","images":[],"options":{"A":"带宽限制","B":"增强服务器的性能","C":"提高管理员的能力","D":"只允许必要的通信"},"answer":"C","analysis":"带宽限制可控制流量，增强服务器性能能提升应对能力，只允许必要通信能减少不必要请求，而提高管理员能力对直接对抗拒绝服务攻击作用不大，所以选 C","source":"网络安全防御技术课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-224","type":"choice","number":224,"globalNumber":224,"stem":"(　　) 是用于确定所声明的身份的有效性","images":[],"options":{"A":"访问控制","B":"身份鉴别","C":"数据保密","D":"防止否认"},"answer":"B","analysis":"身份鉴别是验证声明身份有效性的过程，访问控制是控制对资源的访问，数据保密是保护数据不被泄露，防止否认是防止用户否认操作，所以选 B","source":"信息安全认证课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-225","type":"choice","number":225,"globalNumber":225,"stem":"某商贸公司信息安全管理员考虑到信息系统对业务影响越来越重要，计划编制本单位信息安全应急响应预案，在向主管领导写报告时，他列举了编制信息安全应急响应预案的好处和重要性，在他罗列的四条理由中，其中不适合作为理由的一条是 (　　)","images":[],"options":{"A":"应急预案是明确关键业务系统信息安全应急响应指挥体系和工作机制的重要方式","B":"应急预案是提高应对网络和信息系统突发事件能力，减少突发事件造成的损失和危害，保障信息系统运行平稳，安全、有序、高效的手段","C":"编制应急预案是国家网络安全对所有单位的强制要求，因此必须建设","D":"应急预案是保障单位业务系统信息安全的重要措施"},"answer":"D","analysis":"A、B、C 选项分别从应急体系、应对能力、国家要求方面说明了编制预案的好处，而 D 选项表述过于笼统，相比之下不适合作为主要理由，所以选 D","source":"信息安全应急管理课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-226","type":"choice","number":226,"globalNumber":226,"stem":"计算机系统中最重要的安全隐患是 (　　)","images":[],"options":{"A":"配置审查","B":"临时账户管理","C":"数据安全迁移","D":"程序安装"},"answer":"A","analysis":"配置审查如果不严谨，可能导致系统存在安全漏洞，是计算机系统中较为关键的安全隐患。临时账户管理、数据安全迁移、程序安装虽然也可能带来安全问题，但不是最重要的隐患，所以选 A","source":"计算机系统安全课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-227","type":"choice","number":227,"globalNumber":227,"stem":"以下方法中，不适用于检测计算机病毒的是 (　　)","images":[],"options":{"A":"特征代码法","B":"校验 HASH 值","C":"加密","D":"动态调试"},"answer":"C","analysis":"特征代码法通过比对病毒特征来检测，校验 HASH 值可检查文件完整性判断是否被篡改，动态调试可跟踪程序运行发现异常，而加密是对数据进行保护的手段，不能直接检测病毒，所以选 C","source":"计算机病毒检测技术课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-228","type":"choice","number":228,"globalNumber":228,"stem":"通过采取适度防护，加强 (　　) 落实对安全事件的响应。建立对威胁的防护来保障系统的安全","images":[],"options":{"A":"信息系统","B":"信息安全保障","C":"检测工作","D":"威胁"},"answer":"C","analysis":"加强检测工作能够及时发现安全事件和威胁，进而落实响应和防护措施保障系统安全。信息系统、信息安全保障是整体范畴，威胁是需要防范的对象，所以选 C","source":"信息安全防护策略课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-229","type":"choice","number":229,"globalNumber":229,"stem":"口令之所以能被攻击，下面说法正确的是 (　　)","images":[],"options":{"A":"没有进行加密传输","B":"加密算法太简单","C":"口令太简单","D":"口令输入次数没有限制"},"answer":"D","analysis":"口令输入次数没有限制，攻击者就可通过多次尝试进行暴力破解。没有加密传输、加密算法简单、口令简单也可能导致口令被攻击，但相比之下，口令输入次数无限制是更直接的攻击原因，所以选 D","source":"口令安全课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-230","type":"choice","number":230,"globalNumber":230,"stem":"下面最有可能作为万能密码使用的是 (　　)","images":[],"options":{"A":"用户名输入：admin’ or 1=1#","B":"口令输入：password’ or 1=1#","C":"用户名输入：admin’ or 1=1 limit 1#","D":"口令输入：admin’ or 1=1 limit 1#"},"answer":"C","analysis":"在 SQL 注入中，“admin’ or 1=1 limit 1#” 这种输入方式可能利用数据库漏洞，使查询语句永远为真，从而达到类似万能密码的效果，所以选 C","source":"SQL 注入攻击防范课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-231","type":"choice","number":231,"globalNumber":231,"stem":"在 SQL 注入中，以下注入方式消耗时间最长的是 (　　)","images":[],"options":{"A":"联合注入","B":"报错注入","C":"时间盲注","D":"宽字节注入"},"answer":"C","analysis":"联合注入、报错注入可直接获取数据，宽字节注入利用编码漏洞注入数据，而时间盲注通过判断数据库响应时间来获取数据，需要多次尝试，消耗时间最长，所以选 C","source":"SQL 注入技术课程","difficulty":"难","file":"choice_201-250.html"},{"id":"choice-232","type":"choice","number":232,"globalNumber":232,"stem":"口令破解的最好方法是 (　　)","images":[],"options":{"A":"暴力破解","B":"组合破解","C":"字典攻击","D":"生日攻击"},"answer":"B","analysis":"暴力破解是穷举所有可能，效率低；字典攻击依赖字典库，局限性大；生日攻击主要针对哈希函数。组合破解结合多种方式，综合利用不同破解方法的优势，相比之下是最好的方法，所以选 B","source":"口令破解技术课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-233","type":"choice","number":233,"globalNumber":233,"stem":"常规端口扫描和半开式扫描的区别是 (　　)","images":[],"options":{"A":"没什么区别","B":"没有完成三次握手，缺少 ACK 过程","C":"半开式采用 UDP 方式扫描","D":"扫描准确性不一样"},"answer":"B","analysis":"常规端口扫描完成三次握手，半开式扫描只完成 SYN 阶段，不完成 ACK 过程，以此来隐藏扫描行为，所以选 B","source":"端口扫描技术课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-234","type":"choice","number":234,"globalNumber":234,"stem":"不经常访问的数据被驻留在较低成本的存储器中，所体现出的分级存储的优点为 (　　)","images":[],"options":{"A":"减少总体存储成本","B":"性能优化","C":"改善数据可用性","D":"数据迁移对应用透明"},"answer":"A","analysis":"将不常访问数据存于低成本存储器，充分利用存储资源，降低了整体存储成本，所以选 A","source":"存储技术课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-235","type":"choice","number":235,"globalNumber":235,"stem":"分级存储是根据数据的 (　　)、容量、性能等指标，将数据采取不同的存储方式分别存储在不同性能的存储设备上","images":[],"options":{"A":"重要性","B":"访问频率","C":"保留时间","D":"重要性、访问频率、保留时间"},"answer":"D","analysis":"分级存储综合考虑数据的重要性、访问频率、保留时间以及容量、性能等多方面因素，合理分配存储方式，所以选 D","source":"存储管理课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-236","type":"choice","number":236,"globalNumber":236,"stem":"RAID1 中数据冗余是通过什么技术实现的 (　　)","images":[],"options":{"A":"OX","B":"海明码校验","C":"P＋Q 双校验","D":"镜像"},"answer":"D","analysis":"RAID1 通过镜像技术，将数据同时存储在两个或多个磁盘上，实现数据冗余，保障数据安全性，所以选 D","source":"RAID 技术课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-237","type":"choice","number":237,"globalNumber":237,"stem":"系统初次备份应该选择 (　　)","images":[],"options":{"A":"整盘备份","B":"增量备份","C":"自定义备份","D":"文件备份"},"answer":"A","analysis":"系统初次备份选择整盘备份可以完整备份系统所有数据，为后续的恢复提供全面的数据基础。增量备份基于已有备份，自定义备份和文件备份可能不全面，所以选 A","source":"数据备份与恢复课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-238","type":"choice","number":238,"globalNumber":238,"stem":"随机进程名称是恶意代码迷惑管理员和系统安全检查人员的技术手段之一，以下对于随机进程名技术，描述正确的是 (　　)","images":[],"options":{"A":"随机进程名技术虽然每次进程都是随机的，但是只要找到了进程名称，就找到了恶意代码程序本身","B":"恶意代码生成随机进程名称的目的是使进程名称不固定，因为杀毒软件是按照进程名称进行病毒进程查杀","C":"恶意代码使用随机进程名是通过生成特定格式的进程名称，使进程管理器中看不到恶意代码的进程","D":"随机进程名技术每次启动时随机生成恶意代码进程名称，通过不固定的进程名称使自己不容易被发现真实的恶意代码程序名称"},"answer":"D","analysis":"随机进程名技术通过每次启动时随机生成进程名，避免被轻易识别出恶意代码程序，A 选项找到进程名不一定找到程序本身，B 选项杀毒软件并非单纯按进程名查杀，C 选项进程管理器中还是能看到进程，所以选 D","source":"恶意代码分析课程","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-239","type":"choice","number":239,"globalNumber":239,"stem":"某个 U 盘已染有病毒，为防止该病毒传染计算机，正确的措施是 (　　)","images":[],"options":{"A":"删除该 U 盘上的所有程序","B":"给该 U 盘加上写保护","C":"对 U 盘进行格式化","D":"将该 U 盘放一段时间后再使用"},"answer":"C","analysis":"删除所有程序可能无法彻底清除病毒，加写保护不能清除病毒，放一段时间病毒依然存在。格式化可以彻底清除 U 盘中的数据和病毒，所以选 C","source":"计算机病毒防范课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-240","type":"choice","number":240,"globalNumber":240,"stem":"对用户账号和通讯群组名称、昵称、简介、备注、标识，信息发布、转发、评论和通讯群组等服务功能中违法有害信息的防范处置和有关记录保存措施，正确的做法是 (　　)","images":[],"options":{"A":"通过网络转发给其他人","B":"截图等方式留存相关记录","C":"不理会，不转发","D":"告诉他人一起观看"},"answer":"B","analysis":"A 选项转发有害信息违法，C 选项不理会不利于监管，D 选项一起观看有害信息同样不可取。截图留存记录有助于后续对违法有害信息的调查和处理，所以选 B","source":"网络信息安全法律法规课程","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-241","type":"choice","number":241,"globalNumber":241,"stem":"() 是约定俗成的大家共同遵循的行为准则。","images":[],"options":{"A":"社会公德","B":"社会责任","C":"社会文化","D":"社会价值"},"answer":"A","analysis":"社会公德是全体公民在社会交往和公共生活中应该遵循的行为准则，具有约定俗成、共同遵循的特点；社会责任侧重于个体或组织对社会应承担的责任；社会文化是社会的精神财富和物质财富总和；社会价值强调事物对社会的积极意义。所以选 A。","source":"未提供","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-242","type":"choice","number":242,"globalNumber":242,"stem":"对于学生来说，职业素养培养最大的意义是 ()。","images":[],"options":{"A":"有利于个人成长","B":"提高就业竞争力","C":"提高学习能力","D":"提高身体素质"},"answer":"B","analysis":"在学生面临就业的情况下，提高就业竞争力对学生未来发展影响最大。虽然职业素养培养有利于个人成长、学习能力提升，但相比之下，就业竞争力与学生职业发展直接相关；职业素养培养与提高身体素质关系不大。所以选 B。","source":"未提供","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-243","type":"choice","number":243,"globalNumber":243,"stem":"字长是 CPU 的主要技术性能指标之一，它表示的是 ()。","images":[],"options":{"A":"CPU 能表示的最大的有效数字位数","B":"CPU 能表示的十进制整数的位数","C":"CPU 的计算结果的有效数字长度","D":"CPU 一次能处理二进制数据的位数"},"answer":"D","analysis":"字长指 CPU 一次能处理二进制数据的位数，它决定了计算机的运算精度和处理能力。A、B、C 选项对字长的定义不准确。所以选 D。","source":"未提供","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-244","type":"choice","number":244,"globalNumber":244,"stem":"下列各项中两个软件均属于系统软件的是 ()。","images":[],"options":{"A":"WPS 和 UNIX","B":"MIS 和 WPS","C":"MIS 和 UNIX","D":"DOS 和 UNIX"},"answer":"D","analysis":"系统软件是管理和控制计算机硬件与软件资源的软件，DOS、UNIX 是常见的操作系统，属于系统软件；WPS 是办公软件，MIS（管理信息系统）是应用软件。所以选 D。","source":"未提供","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-245","type":"choice","number":245,"globalNumber":245,"stem":"以下关于关联的叙述正确的是 ()。","images":[],"options":{"A":"可在两个表的不同数据类型的字段间创建关联","B":"可在两个表的不同数据类型的同名字段间创建关联","C":"可在两个表的相同数据类型的不同名称的字段间创建关联","D":"在创建关联时选择了级联更新相关的字段，则外键表中的字段值变化时，可自动修改主键表中的关联字段"},"answer":"C","analysis":"创建关联时，字段需具有相同数据类型，但字段名可以不同；不同数据类型字段间不能创建关联；级联更新是主键表字段值变化时，外键表关联字段自动更新，而不是外键表字段值变化影响主键表。所以选 C。","source":"未提供","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-246","type":"choice","number":246,"globalNumber":246,"stem":"TCP/IP 体系结构中，将计算机网络划分为 () 个层次。","images":[],"options":{"A":"4","B":"5","C":"6","D":"7"},"answer":"A","analysis":"TCP/IP 体系结构将计算机网络划分为网络接口层、网际层、传输层和应用层 4 个层次。所以选 A。","source":"未提供","difficulty":"易","file":"choice_201-250.html"},{"id":"choice-247","type":"choice","number":247,"globalNumber":247,"stem":"单模光纤的传输方向是 ()。","images":[],"options":{"A":"散射","B":"衍射","C":"沿光纤直径方向","D":"全反射"},"answer":"C","analysis":"单模光纤只允许一束光沿光纤直径方向传播，散射、衍射不是单模光纤主要传输方式，全反射是光纤传输的原理，但这里强调的是单模光纤传输方向是沿光纤直径方向。所以选 C。","source":"未提供","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-248","type":"choice","number":248,"globalNumber":248,"stem":"路由器是互连网络的重要设备之一，它工作在 OSI 的 ()。","images":[],"options":{"A":"数据链路层","B":"网络层","C":"传输层","D":"会话层"},"answer":"B","analysis":"路由器主要功能是根据 IP 地址进行网络层的数据包转发，工作在 OSI 的网络层。数据链路层设备如交换机；传输层主要负责端到端的通信；会话层负责建立、管理和终止会话。所以选 B。","source":"未提供","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-249","type":"choice","number":249,"globalNumber":249,"stem":"无线网卡使用 () 技术，把数据流编码后放到 RF 信号上。","images":[],"options":{"A":"加密","B":"解码","C":"调制","D":"解调"},"answer":"C","analysis":"调制是把数字信号转换为模拟信号加载到射频（RF）信号上的过程；加密是对数据进行保密处理；解码是将编码数据还原；解调是把模拟信号转换为数字信号。所以选 C。","source":"未提供","difficulty":"中","file":"choice_201-250.html"},{"id":"choice-250","type":"choice","number":250,"globalNumber":250,"stem":"《网络安全法》的第一条讲的是 ()。","images":[],"options":{"A":"法律调整范围","B":"立法目的","C":"国家网络安全战略","D":"国家维护网络安全的主要任务"},"answer":"B","analysis":"《网络安全法》第一条明确阐述了立法目的，即保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展。所以选 B。","source":"未提供","difficulty":"易","file":"choice_201-250.html"}];

const STORAGE_KEYS={progress:"quiz_progress_v2",exam:"exam_session_v2",result:"last_result_v2",marker:"quiz_app_initialized_v2"};
const $=id=>document.getElementById(id);
const questionMap=Object.fromEntries(PAGE_QUESTIONS.map(q=>[q.id,q]));
let progress=null,examSession=null,lastResult=null,timerTick=null,safeStorage=true;
let currentOrder=[];
function parseJSON(v){try{return v?JSON.parse(v):null}catch(e){return null}}
function readKey(k){try{return parseJSON(localStorage.getItem(k))}catch(e){safeStorage=false;return null}}
function writeKey(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){safeStorage=false;showStorageWarning("浏览器未能保存状态。请不要清理此标签页数据，并从首页导出可恢复的进度。");return false}}
function removeKey(k){try{localStorage.removeItem(k)}catch(e){safeStorage=false}}
function baseProgress(){return {schema:2,active:false,mode:null,answers:{},stats:{},pins:[],currentFile:null,currentId:null,elapsedMs:0,timerRunning:false,timerStartedAt:null,wrongIds:[],completed:false}}
function readProgress(){const p=readKey(STORAGE_KEYS.progress);if(!p||typeof p!=="object")return baseProgress();p.answers=p.answers&&typeof p.answers==="object"?p.answers:{};p.stats=p.stats&&typeof p.stats==="object"?p.stats:{};p.pins=Array.isArray(p.pins)?p.pins:[];return Object.assign(baseProgress(),p)}
function saveProgress(){if(!progress)return false;return writeKey(STORAGE_KEYS.progress,progress)}
function getElapsed(){const base=Math.max(0,Number(progress?.elapsedMs)||0);if(progress?.timerRunning&&Number(progress.timerStartedAt))return base+Math.max(0,Date.now()-progress.timerStartedAt);return base}
function timerText(ms){let sec=Math.floor(Math.max(0,ms)/1000);const h=String(Math.floor(sec/3600)).padStart(2,"0");sec%=3600;const m=String(Math.floor(sec/60)).padStart(2,"0");const s=String(sec%60).padStart(2,"0");return `${h}:${m}:${s}`}
function renderTimer(){const n=$("timerValue");if(!n)return;n.textContent=timerText(getElapsed());const label=$("timerStatus");if(label)label.textContent=progress?.timerRunning?"计时中":"计时已暂停"}
function checkpointTimer(){if(!progress)return;if(progress.timerRunning){progress.elapsedMs=getElapsed();progress.timerStartedAt=Date.now()}saveProgress();if(progress.mode==="exam"&&examSession){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=progress.timerRunning;examSession.timerStartedAt=progress.timerStartedAt;writeKey(STORAGE_KEYS.exam,examSession)}}
function pauseTimer(){if(progress.timerRunning)progress.elapsedMs=getElapsed();progress.timerRunning=false;progress.timerStartedAt=null;if(examSession){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession)}saveProgress()}
function resumeTimer(){if(!progress.timerRunning){progress.timerRunning=true;progress.timerStartedAt=Date.now();if(examSession){examSession.timerRunning=true;examSession.timerStartedAt=progress.timerStartedAt;writeKey(STORAGE_KEYS.exam,examSession)}saveProgress()}}
function showStorageWarning(message){const w=$("storageWarning");if(w){w.textContent=message;w.classList.remove("hidden")}}
function typeName(type){return ({choice:"选择题",multi:"多选题",judgment:"判断题",fill:"填空题"})[type]||"题目"}
function statusText(){return ({practice:"做题模式",exam:"考试模式",wrong:"错题模式",review:"考试回看"})[progress.mode]||"刷题"}
function sortedUnique(a){return [...new Set(a||[])]}
function findMeta(id){return META.find(m=>m.id===id)}
function routeByFile(file){return ROUTES.find(r=>r.file===file)}

try{selfTestMapping()}catch(e){showStorageWarning("答案映射检查未通过，已阻止继续作答。请返回首页重新进入考试。");}
init();
</script></body></html>
