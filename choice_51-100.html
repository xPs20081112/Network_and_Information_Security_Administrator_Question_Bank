section-title{font-size:.86rem;font-weight:850;margin:0 0 8px}.sidebar.collapsed .sidebar-details{display:none}.number-button.is-selected{background:#F2EDFF;border-color:#C3B3FF;color:#59458F}.side-question-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.number-button{min-width:0;min-height:34px;padding:3px;border:1px solid #E5E1EC;border-radius:9px;background:white;color:#4E495D;font-weight:700;font-size:.83rem;font-variant-numeric:tabular-nums}.number-button.is-correct{background:var(--good);border-color:#B2DCC1;color:var(--good-ink)}.number-button.is-wrong{background:var(--bad);border-color:#F0B5B9;color:var(--bad-ink)}.number-button.is-current{box-shadow:inset 0 0 0 2px #9F8AE9;background:#F5F0FF}.number-button.is-pinned{border:2px solid #E1AD1F}.pin-list{display:flex;flex-wrap:wrap;gap:7px}.pin-chip{min-width:42px;padding:5px 8px;border:2px solid #E1AD1F;border-radius:9px;background:var(--pin-soft);font-weight:800;color:#6C5110}.side-muted{color:var(--muted);font-size:.84rem}.sidebar-footer{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px;background:#fff}.pager-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-exit{width:100%}.mode-label{font-size:.77rem;color:var(--muted);font-weight:700}.mobile-only{display:none}.storage-warning{margin:8px 0 0}.empty-questions{padding:30px;text-align:center;border:1px dashed #D6D0E3;border-radius:16px;color:var(--muted);background:#fff}.blank-marker{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;color:#6A559D;font-weight:850}.quiz-bottom-spacer{height:25px}

<script>
const PAGE_FILE = "choice_51-100.html";
const PAGE_QUESTIONS = [{"id":"choice-051","type":"choice","number":51,"globalNumber":51,"stem":"域名备案流程最简单方便的是 (　　)。","images":[],"options":{"A":"通过微软官网备案","B":"通过谷歌官网备案","C":"通过购买服务器空间运营商备案","D":"通过国家工业和信息化部 ICP 域名信息备案网站进行自主备案"},"answer":"C","analysis":"在国内，通过购买服务器空间运营商备案是相对简单方便的方式。运营商会协助用户完成备案流程，提供相关指导和支持。微软和谷歌官网不提供国内域名备案服务；通过国家工业和信息化部 ICP 域名信息备案网站自主备案相对繁琐，需要用户自己处理较多事项","source":"域名管理与备案","difficulty":"易","file":"choice_51-100.html"},{"id":"choice-052","type":"choice","number":52,"globalNumber":52,"stem":"在下列备份介质，采用螺旋扫描方式读写的是 (　　)。","images":[],"options":{"A":"盒式带","B":"1/4 英寸磁带","C":"数字声频带","D":"数字线形带"},"answer":"C","analysis":"数字声频带（Digital Audio Tape，DAT）通常采用螺旋扫描方式读写数据。盒式带、1/4 英寸磁带、数字线形带一般不采用这种方式","source":"数据备份与恢复","difficulty":"难","file":"choice_51-100.html"},{"id":"choice-053","type":"choice","number":53,"globalNumber":53,"stem":"下列关于数据备份方法的描述中错误的是 (　　)。","images":[],"options":{"A":"增量备份比完全备份使用的空间少","B":"差异备份比增量备份恢复的速度慢","C":"差异备份比完全备份的备份速度快","D":"恢复时完全备份使用的副本最少"},"answer":"B","analysis":"增量备份只备份自上次备份（完全备份或增量备份）以来更改的数据，所以比完全备份使用空间少；差异备份备份自上次完全备份以来更改的数据，恢复时只需使用最近一次完全备份和最近一次差异备份副本，而增量备份恢复时可能需要多个增量备份副本，所以差异备份恢复速度比增量备份快；差异备份因为只备份部分数据，所以比完全备份备份速度快；完全备份恢复时只需使用该完全备份副本，使用副本最少","source":"数据备份与恢复","difficulty":"中","file":"choice_51-100.html"},{"id":"choice-054","type":"choice","number":54,"globalNumber":54,"stem":"电子公告服务提供者应当记录在电子公告服务系统中发布的信息内容及其发布时间，互联网地址或者域名。记录备份应当保存 (　　) 天。","images":[],"options":{"A":"90","B":"60","C":"30","D":"10"},"answer":"B","analysis":"根据相关规定，电子公告服务提供者记录备份应当保存 60 天，以满足监管和追溯等需求","source":"网络服务管理法规","difficulty":"易","file":"choice_51-100.html"},{"id":"choice-055","type":"choice","number":55,"globalNumber":55,"stem":"电子邮件客户端通常需要用 (　　) 协议来发送邮件。","images":[],"options":{"A":"仅 SMTP","B":"仅 POP","C":"SMTP 和 POP","D":"FTP"},"answer":"A","analysis":"SMTP（简单邮件传输协议）用于发送邮件，负责将邮件从客户端发送到邮件服务器，以及在邮件服务器之间传输邮件。POP（邮局协议）用于接收邮件，从邮件服务器下载邮件到客户端。FTP（文件传输协议）用于文件传输，与邮件发送无关","source":"电子邮件服务与协议","difficulty":"易","file":"choice_51-100.html"},{"id":"choice-056","type":"choice","number":56,"globalNumber":56,"stem":"根据国际标准化组织（ISO）的定义，网络管理有五大功能，其中不包括 (　　)。","images":[],"options":{"A":"故障管理","B":"配置管理","C":"操作管理","D":"性能管理"},"answer":"C","analysis":"国际标准化组织（ISO）定义的网络管理五大功能包括故障管理（检测和处理网络故障）、配置管理（管理网络设备的配置）、性能管理（监控和优化网络性能）、安全管理（保障网络安全）、计费管理（统计网络资源使用情况进行计费），不包括操作管理","source":"网络管理基础","difficulty":"易","file":"choice_51-100.html"},{"id":"choice-057","type":"choice","number":57,"globalNumber":57,"stem":"以下哪个是测试网线的工具 (　　)。","images":[],"options":{"A":"数字电压表","B":"网络测试仪","C":"时域反射仪","D":"电缆检测其"},"answer":"B","analysis":"网络测试仪专门用于测试网线的连通性、线序、长度等参数。数字电压表用于测量电压；时域反射仪主要用于检测电缆中的故障位置；“电缆检测其” 表述不准确，不是常见测试工具","source":"网络布线与测试","difficulty":"易","file":"choice_51-100.html"},{"id":"choice-058","type":"choice","number":58,"globalNumber":58,"stem":"查看系统开放端口的命令是 (　　)。","images":[],"options":{"A":"nslookup","B":"netstat -an","C":"net use","D":"net share"},"answer":"B","analysis":"netstat -an 命令可以用于查看系统当前开放的端口以及端口对应的连接状态等信息。nslookup 用于域名解析；net use 用于管理网络连接；net share 用于管理共享资源","source":"网络命令与工具","difficulty":"易","file":"choice_51-100.html"},{"id":"choice-059","type":"choice","number":59,"globalNumber":59,"stem":"在故障排除过程中，有效地选择故障诊断工具，能够起到事半功倍的作用。故障诊断工具不包括以下哪项 (　　)。","images":[],"options":{"A":"硬件诊断工具","B":"软件诊断工具","C":"入侵防御系统","D":"各种测试命令"},"answer":"C","analysis":"硬件诊断工具可检测硬件故障，软件诊断工具可辅助检测软件问题，各种测试命令能帮助排查网络等问题。入侵防御系统主要用于防范网络攻击，并非故障诊断工具","source":"网络故障排除","difficulty":"易","file":"choice_51-100.html"},{"id":"choice-060","type":"choice","number":60,"globalNumber":60,"stem":"下列哪个不属于常见的 XSS 攻击手段和目的 (　　)。","images":[],"options":{"A":"盗用 cookie，获取敏感信息","B":"利用可被攻击的域受到其他域信任的特定，以受信任来源身份请求一些平时不允许的操作","C":"利用 iframe 以用户的身份执行一些管理动作","D":"注入 payload 读取服务器上的文件"},"answer":"D","analysis":"XSS（跨站脚本攻击）常见手段包括盗用 cookie 获取敏感信息、利用域信任关系执行未授权操作、利用 iframe 以用户身份执行管理动作等。注入 payload 读取服务器上的文件属于文件注入攻击，不属于 XSS 攻击","source":"网络安全攻击与防范","difficulty":"中","file":"choice_51-100.html"},{"id":"choice-061","type":"choice","number":61,"globalNumber":61,"stem":"当用户通过域名访问某一合法网站时，打开的却是一个不健康的网站，发生该现象 const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
document.addEventListener("input",e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||!input.dataset.qid||input.dataset.blank===undefined||isReadOnly())return;const id=input.dataset.qid;const idx=Number(input.dataset.blank);const s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};s.blanks=s.blanks||[];s.blanks[idx]=input.value.slice(0,20);progress.answers[id]=s;});
function selfTestMapping(){const testOrder=["B","C","D","A"];const map={};testOrder.forEach((k,i)=>map[k]=String.fromCharCode(65+i));if(map.A!=="D")throw new Error("选项映射自测失败");const expected=["A","C"].map(k=>map[k]).sort().join(",");if(expected!=="B,D")throw new Error("多选题映射自测失败")}
try{selfTestMapping()}catch(e){showStorageWarning("答案映射检查未通过，已阻止继续作答。请返回首页重新进入考试。");}
init();
