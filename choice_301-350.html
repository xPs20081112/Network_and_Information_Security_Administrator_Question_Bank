基础概念来说，域名和 IP 地址是一一对应的关系，通过 DNS 系统进行解析，B、C、D 选项错误，A 选项正确","source":"域名系统（DNS）原理","difficulty":"中"},{"id":"choice-189","type":"choice","globalNumber":189,"page":"choice_151-200.html","answer":"D","analysis":"指针记录（PTR）用于将 IP 地址解析为域名（反向解析），可实现将 IPv6 地址解析成 FQDN（完全限定域名）；A 选项别名记录（CNAME）用于为域名创建别名；B 选项主机记录（A）用于将域名解析为 IPv4 地址；C 选项主机记录（AAAA）用于将域名解析为 IPv6 地址，A、B、C 选项错误，D 选项正确","source":"DNS 服务器配置与管理","difficulty":"中"},{"id":"choice-190","type":"choice","globalNumber":190,"page":"choice_151-200.html","answer":"B","analysis":"在 bind 9 系统中，通过设置 “version “字符串”” 可隐藏版本信息，“字符串” 可自定义；A 选项 “banner” 不是用于隐藏版本信息的配置；C 选项 “flag” 与隐藏版本信息无关；D 选项说法错误，bind 9 支持此功能，A、C、D 选项错误，B 选项正确","source":"bind 9 系统安全配置","difficulty":"难"},{"id":"choice-191","type":"choice","globalNumber":191,"page":"choice_151-200.html","answer":"D","analysis":"网络监听会窃取网络数据；拒绝服务攻击会使网络服务瘫痪；漏洞攻击会利用系统漏洞入侵；而拆开主机机箱属于物理操作，不属于网络安全威胁范畴，A、B、C 选项错误，D 选项正确","source":"网络安全基础","difficulty":"易"},{"id":"choice-192","type":"choice","globalNumber":192,"page":"choice_151-200.html","answer":"C","analysis":"在思科交换机中，从用户视图进入特权视图的命令是 “Switch>enable”；A、B 选项命令错误；D 选项 “Switch#enable” 是在特权视图下重新进入特权视图（一般无需这样操作），A、B、D 选项错误，C 选项正确","source":"思科交换机基础配置","difficulty":"易"},{"id":"choice-193","type":"choice","globalNumber":193,"page":"choice_151-200.html","answer":"C","analysis":"在思科交换机上，创建 VLAN 虚拟接口需进入全局配置模式（“Switch (config)#”），然后使用 “interface VLAN 1” 命令；A 选项在特权模式下，命令位置错误；B 选项 “Switch#VLAN 1” 用于创建 VLAN 1，但不是创建虚拟接口；D 选项 “Switch (config)#VLAN 1” 用于创建 VLAN 1，A、B、D 选项错误，C 选项正确","source":"思科交换机 VLAN 配置","difficulty":"中"},{"id":"choice-194","type":"choice","globalNumber":194,"page":"choice_151-200.html","answer":"A","analysis":"思科交换机的 trunk 端口默认允许所有 VLAN 通过，用于实现不同 VLAN 间数据在交换机间的传输；B、C、D 选项描述错误，A 选项正确","source":"思科交换机 VLAN 间通信配置","difficulty":"中"},{"id":"choice-195","type":"choice","globalNumber":195,"page":"choice_151-200.html","answer":"A","analysis":"根端口是指在非根网桥中，到根网桥路径开销最小的端口；指定端口用于转发数据，其路径开销不一定最小；阻塞端口处于阻塞状态，不转发数据；非根非指定端口是不满足根端口和指定端口条件的端口，B、C、D 选项错误，A 选项正确","source":"生成树协议（STP）原理","difficulty":"中"},{"id":"choice-196","type":"choice","globalNumber":196,"page":"choice_151-200.html","answer":"D","analysis":"在思科交换机配置中，“no enable password” 命令可删除特权视图密码；A 选项 “Switch (config)#enable password” 命令格式不完整，无法删除密码；B 选项是设置密码为 123456，不是删除密码；C 选项 “no enable password 123456” 命令错误，应该直接使用 “no enable password”，A、B、C 选项错误，D 选项正确","source":"思科交换机安全配置","difficulty":"中"},{"id":"choice-197","type":"choice","globalNumber":197,"page":"choice_151-200.html","answer":"D","analysis":"在思科交换机上，“delete” 命令用于删除闪存中的文件或目录；A 选项 “rd” 是 Windows 系统删除目录的命令；B 选项 “md” 用于创建目录；C 选项 “cd” 用于切换目录，A、B、C 选项错误，D 选项正确","source":"思科交换机文件管理","difficulty":"易"},{"id":"choice-198","type":"choice","globalNumber":198,"page":"choice_151-200.html","answer":"C","analysis":"“Router (config-line)#login” 命令用于配置 vty 线路进行简单密码验证；A 选项 “Router (config-line)#login local” 用于配置基于本地用户数据库进行验证；B 选项 “Router (config-line)#no login” 表示关闭登录验证；D 选项 “Router (config-line)#no login local” 表示关闭基于本地用户数据库的登录验证，A、B、D 选项错误，C 选项正确","source":"路由器安全配置","difficulty":"中"},{"id":"choice-199","type":"choice","globalNumber":199,"page":"choice_151-200.html","answer":"D","analysis":"Administrator 是 Windows 系统的管理员用户，承担系统管理的关键职责，不能被删除；test 是普通自定义用户，可以删除；Power user 和 GUEST 是系统内置的非管理员用户，也可以删除，A、B、C 选项错误，D 选项正确","source":"Windows 系统用户管理","difficulty":"易"},{"id":"choice-200","type":"choice","globalNumber":200,"page":"choice_151-200.html","answer":"D","analysis":"在 Windows 系统 “本地用户和组” 中新建用户时，默认属于 Users 组；administrators 组是管理员组；Power Users 组有部分管理权限；Guests 组是来宾组，权限受限，A、B、C 选项错误，D 选项正确","source":"Windows 系统用户管理","difficulty":"易"},{"id":"choice-201","type":"choice","globalNumber":201,"page":"choice_201-250.html","answer":"D","analysis":"NTFS 权限具有累加性，拒绝权限优先于其他权限，文件权限优先于文件夹权限，权限设置是保障系统安全的重要手段，所以 “不需要设置权限” 的说法错误。","source":"操作系统安全基础相关课程 ID","difficulty":"易"},{"id":"choice-202","type":"choice","globalNumber":202,"page":"choice_201-250.html","answer":"C","analysis":"口令暴力破解是通过不断尝试密码来获取访问权限，账号锁定策略可以有效阻止这种攻击，而分布式拒绝服务攻击、病毒传染、缓冲区溢出攻击与账号错误登录锁定机制无关。","source":"网络安全策略课程 ID","difficulty":"易"},{"id":"choice-203","type":"choice","globalNumber":203,"page":"choice_201-250.html","answer":"B","analysis":"在 Linux 系统中，useradd 命令用于添加用户，adduser 是 Debian 系 Linux 中的等效命令，在一般常见的 Linux 发行版（如 Red Hat、CentOS 等）中使用 useradd，mkdir 用于创建目录，vi 用于编辑文件。","source":"Linux 系统管理课程 ID","difficulty":"易"},{"id":"choice-204","type":"choice","globalNumber":204,"page":"choice_201-250.html","answer":"D","analysis":"在 Linux 文件权限表示中，所有者权限用数字表示为：读（4）、写（2）、执行（1），全部权限为 4 + 2 + 1 = 7；组权限：读（4）、写（2），为 4 + 2 = 6；组外成员权限：只读（4），所以文件权限为 764。","source":"Linux 文件权限管理课程 ID","difficulty":"中"},{"id":"choice-205","type":"choice","globalNumber":205,"page":"choice_201-250.html","answer":"B","analysis":"在 Linux 系统中，rm -rf 命令用于递归强制删除目录及其内容，可删除非空子目录。del 是 Windows 系统下的删除命令，rm -Ra 命令格式错误，rm -rf /tmp/中 “/” 多余。","source":"Linux 文件与目录管理课程 ID","difficulty":"易"},{"id":"choice-206","type":"choice","globalNumber":206,"page":"choice_201-250.html","answer":"B","analysis":"在 Red Hat Linux 系统中，内核源程序通常存放在 /usr/src 目录下，/usr/local 用于存放本地安装的软件，/lib 是存放系统库文件的目录，/usr/share 存放共享数据。","source":"Linux 系统结构课程 ID","difficulty":"易"},{"id":"choice-207","type":"choice","globalNumber":207,"page":"choice_201-250.html","answer":"A","analysis":"chmod 命令用于修改文件权限，755 表示文件属主有读（4）、写（2）、运行（1）权限（4 + 2 + 1 = 7），组和其他用户有读（4）、运行（1）权限（4 + 1 = 5）。chmod 700 表示文件属主有全部权限，组和其他用户无任何权限；chmod ux+rwx test 命令格式错误；chmod g-w 是去除组用户的写权限。","source":"Linux 文件权限设置课程 ID","difficulty":"中"},{"id":"choice-208","type":"choice","globalNumber":208,"page":"choice_201-250.html","answer":"C","analysis":"在混合模式下，SQL Server 既可以使用 Windows 身份验证（根据已登录 Windows 用户的网络安全属性验证），也可以使用 SQL Server 身份验证（根据用户输入的用户名和密码验证），A、B 描述错误，D 中 “无限制访问” 错误。","source":"SQL Server 数据库安全课程 ID","difficulty":"中"},{"id":"choice-209","type":"choice","globalNumber":209,"page":"choice_201-250.html","answer":"D","analysis":"完全备份是对整个数据集合进行备份，每次备份的数据量较大，所需时间长，由于数据量大，不能过于频繁进行备份，且需要大量存储空间，“需要存储空间小” 不属于其特点。","source":"数据备份策略课程 ID","difficulty":"易"},{"id":"choice-210","type":"choice","globalNumber":210,"page":"choice_201-250.html","answer":"A","analysis":"选择异地备份站点时，确保和数据中心物理隔离，避免遭受相同风险（如自然灾害等）是首要考虑因素，B、C、D 虽然也重要，但不是最重要的。","source":"数据备份与恢复课程 ID","difficulty":"易"},{"id":"choice-211","type":"choice","globalNumber":211,"page":"choice_201-250.html","answer":"A","analysis":"增量备份只备份自上次备份（完全备份或增量备份）以来更改的数据，恢复时需要按备份顺序依次还原多个增量备份，恢复速度最慢；差异备份备份自上次完全备份以来更改的数据，恢复时只需还原完全备份和最新的差异备份；完全备份恢复时只需还原一次备份数据，所以恢复速度由慢到快是增量备份、差异备份、完全备份。","source":"数据备份策略课程 ID","difficulty":"中"},{"id":"choice-212","type":"choice","globalNumber":212,"page":"choice_201-250.html","answer":"B","analysis":"NAS（网络附属存储）是一种专门的文件存储设备，有自己独立的文件系统，可通过网络提供文件共享服务；DAS（直接附加存储）通常依赖主机操作系统管理文件系统；SAN（存储区域网络）主要提供块级存储服务，本身没有独立文件系统；LAN 是局域网，是一种网络类型，不是存储系统。","source":"存储技术基础课程 ID","difficulty":"易"},{"id":"choice-213","type":"choice","globalNumber":213,"page":"choice_201-250.html","answer":"B","analysis":"根据相关规定，电子公告服务提供者记录备份应保存 60 天，这是网络信息管理的要求。","source":"网络信息管理法规课程 ID","difficulty":"易"},{"id":"choice-214","type":"choice","globalNumber":214,"page":"choice_201-250.html","answer":"D","analysis":"在 UNIX/Linux 系统中，Backup 命令并没有 Backup -d 命令用于当备份设备为磁带时的选项，A、B、C 对 Backup 命令功能描述正确。","source":"UNIX/Linux 系统备份课程 ID","difficulty":"中"},{"id":"choice-215","type":"choice","globalNumber":215,"page":"choice_201-250.html","answer":"A","analysis":"PASSWORD_MAX 不是登录超过有效次数锁定时间，在 Oracle 密码策略中，FAILED_LOGIN_ATTEMPTS 表示最大错误登录次数，PASSWORD_GRACE_TIME 表示密码失效后锁定时间，PASSWORD_LIFE_TIME 表示口令有效时间。","source":"Oracle 数据库安全课程 ID","difficulty":"中"},{"id":"choice-216","type":"choice","globalNumber":216,"page":"choice_201-250.html","answer":"B","analysis":"ping 命令通过向目标主机发送 ICMP 回声请求数据包，来测试网络的连通性；ipconfig 用于查看本地网络配置信息；netstat 用于查看网络连接、路由表等网络状态信息；tracert 用于跟踪数据包在网络中的路由路径。","source":"网络命令使用课程 ID","difficulty":"易"},{"id":"choice-217","type":"choice","globalNumber":217,"page":"choice_201-250.html","answer":"B","analysis":"数据备份的定义就是为防止数据丢失，将数据从应用主机的存储设备复制到其他存储介质；数据分类是对数据进行分类管理，数据加密是对数据进行加密保护，网络日志是记录网络活动的文件。","source":"数据备份技术课程 ID","difficulty":"易"},{"id":"choice-218","type":"choice","globalNumber":218,"page":"choice_201-250.html","answer":"B","analysis":"黑客搭线窃听是在数据传输过程中获取信息，属于信息传输安全风险；信息存储安全关注数据存储时的安全性，信息访问安全涉及对数据访问的控制，信息使用安全侧重于数据使用过程中的安全。","source":"网络安全风险分类课程 ID","difficulty":"易"},{"id":"choice-219","type":"choice","globalNumber":219,"page":"choice_201-250.html","answer":"B","analysis":"网络后门是黑客为了保持对目标主机长期控制而在目标主机上开设的非法通道，不是防止管理员密码丢失、定期维护主机或防止主机被非法入侵的手段。","source":"网络安全攻击与防范课程 ID","difficulty":"易"},{"id":"choice-220","type":"choice","globalNumber":220,"page":"choice_201-250.html","answer":"D","analysis":"DNS 缓存中毒会导致域名解析错误，使合法域名被解析到错误的 IP 地址，从而用户访问合法域名时打开不健康网站；ARP 欺骗主要影响局域网内的地址解析，DHCP 欺骗干扰动态 IP 地址分配，TCP SYN 攻击是一种拒绝服务攻击方式。","source":"网络安全攻击类型课程 ID","difficulty":"中"},{"id":"choice-221","type":"choice","globalNumber":221,"page":"choice_201-250.html","answer":"D","analysis":"进程注入、注册表隐藏、漏洞扫描都属于病毒木马融合的新技术，而破坏性是病毒木马的特性，并非新技术，所以选 D","source":"网络安全基础课程","difficulty":"易"},{"id":"choice-222","type":"choice","globalNumber":222,"page":"choice_201-250.html","answer":"D","analysis":"Tribal Flood Network（TFN）是典型的拒绝服务攻击程序，通过大量请求使目标服务器资源耗尽，无法正常提供服务，所以选 D","source":"网络安全攻击类型课程","difficulty":"易"},{"id":"choice-223","type":"choice","globalNumber":223,"page":"choice_201-250.html","answer":"C","analysis":"带宽限制可控制流量，增强服务器性能能提升应对能力，只允许必要通信能减少不必要请求，而提高管理员能力对直接对抗拒绝服务攻击作用不大，所以选 C","source":"网络安全防御技术课程","difficulty":"中"},{"id":"choice-224","type":"choice","globalNumber":224,"page":"choice_201-250.html","answer":"B","analysis":"身份鉴别是验证声明身份有效性的过程，访问控制是控制对资源的访问，数据保密是保护数据不被泄露，防止否认是防止用户否认操作，所以选 B","source":"信息安全认证课程","difficulty":"易"},{"id":"choice-225","type":"choice","globalNumber":225,"page":"choice_201-250.html","answer":"D","analysis":"A、B、C 选项分别从应急体系、应对能力、国家要求方面说明了编制预案的好处，而 D 选项表述过于笼统，相比之下不适合作为主要理由，所以选 D","source":"信息安全应急管理课程","difficulty":"中"},{"id":"choice-226","type":"choice","globalNumber":226,"page":"choice_201-250.html","answer":"A","analysis":"配置审查如果不严谨，可能导致系统存在安全漏洞，是计算机系统中较为关键的安全隐患。临时账户管理、数据安全迁移、程序安装虽然也可能带来安全问题，但不是最重要的隐患，所以选 A","source":"计算机系统安全课程","difficulty":"中"},{"id":"choice-227","type":"choice","globalNumber":227,"page":"choice_201-250.html","answer":"C","analysis":"特征代码法通过比对病毒特征来检测，校验 HASH 值可检查文件完整性判断是否被篡改，动态调试可跟踪程序运行发现异常，而加密是对数据进行保护的手段，不能直接检测病毒，所以选 C","source":"计算机病毒检测技术课程","difficulty":"易"},{"id":"choice-228","type":"choice","globalNumber":228,"page":"choice_201-250.html","answer":"C","analysis":"加强检测工作能够及时发现安全事件和威胁，进而落实响应和防护措施保障系统安全。信息系统、信息安全保障是整体范畴，威胁是需要防范的对象，所以选 C","source":"信息安全防护策略课程","difficulty":"易"},{"id":"choice-229","type":"choice","globalNumber":229,"page":"choice_201-250.html","answer":"D","analysis":"口令输入次数没有限制，攻击者就可通过多次尝试进行暴力破解。没有加密传输、加密算法简单、口令简单也可能导致口令被攻击，但相比之下，口令输入次数无限制是更直接的攻击原因，所以选 D","source":"口令安全课程","difficulty":"中"},{"id":"choice-230","type":"choice","globalNumber":230,"page":"choice_201-250.html","answer":"C","analysis":"在 SQL 注入中，“admin’ or 1=1 limit 1#” 这种输入方式可能利用数据库漏洞，使查询语句永远为真，从而达到类似万能密码的效果，所以选 C","source":"SQL 注入攻击防范课程","difficulty":"中"},{"id":"choice-231","type":"choice","globalNumber":231,"page":"choice_201-250.html","answer":"C","analysis":"联合注入、报错注入可直接获取数据，宽字节注入利用编码漏洞注入数据，而时间盲注通过判断数据库响应时间来获取数据，需要多次尝试，消耗时间最长，所以选 C","source":"SQL 注入技术课程","difficulty":"难"},{"id":"choice-232","type":"choice","globalNumber":232,"page":"choice_201-250.html","answer":"B","analysis":"暴力破解是穷举所有可能，效率低；字典攻击依赖字典库，局限性大；生日攻击主要针对哈希函数。组合破解结合多种方式，综合利用不同破解方法的优势，相比之下是最好的方法，所以选 B","source":"口令破解技术课程","difficulty":"中"},{"id":"choice-233","type":"choice","globalNumber":233,"page":"choice_201-250.html","answer":"B","analysis":"常规端口扫描完成三次握手，半开式扫描只完成 SYN 阶段，不完成 ACK 过程，以此来隐藏扫描行为，所以选 B","source":"端口扫描技术课程","difficulty":"易"},{"id":"choice-234","type":"choice","globalNumber":234,"page":"choice_201-250.html","answer":"A","analysis":"将不常访问数据存于低成本存储器，充分利用存储资源，降低了整体存储成本，所以选 A","source":"存储技术课程","difficulty":"易"},{"id":"choice-235","type":"choice","globalNumber":235,"page":"choice_201-250.html","answer":"D","analysis":"分级存储综合考虑数据的重要性、访问频率、保留时间以及容量、性能等多方面因素，合理分配存储方式，所以选 D","source":"存储管理课程","difficulty":"中"},{"id":"choice-236","type":"choice","globalNumber":236,"page":"choice_201-250.html","answer":"D","analysis":"RAID1 通过镜像技术，将数据同时存储在两个或多个磁盘上，实现数据冗余，保障数据安全性，所以选 D","source":"RAID 技术课程","difficulty":"易"},{"id":"choice-237","type":"choice","globalNumber":237,"page":"choice_201-250.html","answer":"A","analysis":"系统初次备份选择整盘备份可以完整备份系统所有数据，为后续的恢复提供全面的数据基础。增量备份基于已有备份，自定义备份和文件备份可能不全面，所以选 A","source":"数据备份与恢复课程","difficulty":"易"},{"id":"choice-238","type":"choice","globalNumber":238,"page":"choice_201-250.html","answer":"D","analysis":"随机进程名技术通过每次启动时随机生成进程名，避免被轻易识别出恶意代码程序，A 选项找到进程名不一定找到程序本身，B 选项杀毒软件并非单纯按进程名查杀，C 选项进程管理器中还是能看到进程，所以选 D","source":"恶意代码分析课程","difficulty":"中"},{"id":"choice-239","type":"choice","globalNumber":239,"page":"choice_201-250.html","answer":"C","analysis":"删除所有程序可能无法彻底清除病毒，加写保护不能清除病毒，放一段时间病毒依然存在。格式化可以彻底清除 U 盘中的数据和病毒，所以选 C","source":"计算机病毒防范课程","difficulty":"易"},{"id":"choice-240","type":"choice","globalNumber":240,"page":"choice_201-250.html","answer":"B","analysis":"A 选项转发有害信息违法，C 选项不理会不利于监管，D 选项一起观看有害信息同样不可取。截图留存记录有助于后续对违法有害信息的调查和处理，所以选 B","source":"网络信息安全法律法规课程","difficulty":"易"},{"id":"choice-241","type":"choice","globalNumber":241,"page":"choice_201-250.html","answer":"A","analysis":"社会公德是全体公民在社会交往和公共生活中应该遵循的行为准则，具有约定俗成、共同遵循的特点；社会责任侧重于个体或组织对社会应承担的责任；社会文化是社会的精神财富和物质财富总和；社会价值强调事物对社会的积极意义。所以选 A。","source":"未提供","difficulty":"易"},{"id":"choice-242","type":"choice","globalNumber":242,"page":"choice_201-250.html","answer":"B","analysis":"在学生面临就业的情况下，提高就业竞争力对学生未来发展影响最大。虽然职业素养培养有利于个人成长、学习能力提升，但相比之下，就业竞争力与学生职业发展直接相关；职业素养培养与提高身体素质关系不大。所以选 B。","source":"未提供","difficulty":"易"},{"id":"choice-243","type":"choice","globalNumber":243,"page":"choice_201-250.html","answer":"D","analysis":"字长指 CPU 一次能处理二进制数据的位数，它决定了计算机的运算精度和处理能力。A、B、C 选项对字长的定义不准确。所以选 D。","source":"未提供","difficulty":"中"},{"id":"choice-244","type":"choice","globalNumber":244,"page":"choice_201-250.html","answer":"D","analysis":"系统软件是管理和控制计算机硬件与软件资源的软件，DOS、UNIX 是常见的操作系统，属于系统软件；WPS 是办公软件，MIS（管理信息系统）是应用软件。所以选 D。","source":"未提供","difficulty":"中"},{"id":"choice-245","type":"choice","globalNumber":245,"page":"choice_201-250.html","answer":"C","analysis":"创建关联时，字段需具有相同数据类型，但字段名可以不同；不同数据类型字段间不能创建关联；级联更新是主键表字段值变化时，外键表关联字段自动更新，而不是外键表字段值变化影响主键表。所以选 C。","source":"未提供","difficulty":"中"},{"id":"choice-246","type":"choice","globalNumber":246,"page":"choice_201-250.html","answer":"A","analysis":"TCP/IP 体系结构将计算机网络划分为网络接口层、网际层、传输层和应用层 4 个层次。所以选 A。","source":"未提供","difficulty":"易"},{"id":"choice-247","type":"choice","globalNumber":247,"page":"choice_201-250.html","answer":"C","analysis":"单模光纤只允许一束光沿光纤直径方向传播，散射、衍射不是单模光纤主要传输方式，全反射是光纤传输的原理，但这里强调的是单模光纤传输方向是沿光纤直径方向。所以选 C。","source":"未提供","difficulty":"中"},{"id":"choice-248","type":"choice","globalNumber":248,"page":"choice_201-250.html","answer":"B","analysis":"路由器主要功能是根据 IP 地址进行网络层的数据包转发，工作在 OSI 的网络层。数据链路层设备如交换机；传输层主要负责端到端的通信；会话层负责建立、管理和终止会话。所以选 B。","source":"未提供","difficulty":"中"},{"id":"choice-249","type":"choice","globalNumber":249,"page":"choice_201-250.html","answer":"C","analysis":"调制是把数字信号转换为模拟信号加载到射频（RF）信号上的过程；加密是对数据进行保密处理；解码是将编码数据还原；解调是把模拟信号转换为数字信号。所以选 C。","source":"未提供","difficulty":"中"},{"id":"choice-250","type":"choice","globalNumber":250,"page":"choice_201-250.html","answer":"B","analysis":"《网络安全法》第一条明确阐述了立法目的，即保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展。所以选 B。","source":"未提供","difficulty":"易"},{"id":"choice-251","type":"choice","globalNumber":251,"page":"choice_251-300.html","answer":"B","analysis":"HTTP（超文本传输协议）用于 WWW 客户与 WWW 服务器之间传输超文本数据；HTML 是超文本标记语言，用于描述网页内容；SMTP 用于发送电子邮件；IMAP 用于接收电子邮件。所以选 B。","source":"未提供","difficulty":"易"},{"id":"choice-252","type":"choice","globalNumber":252,"page":"choice_251-300.html","answer":"A","analysis":"双绞线两根铜导线绞合在一起可以降低信号之间的电磁干扰，提高传输质量；绞合的目的不是降低成本和提高传输速度，且并非没有作用。所以选 A。","source":"未提供","difficulty":"易"},{"id":"choice-253","type":"choice","globalNumber":253,"page":"choice_251-300.html","answer":"A","analysis":"光纤通信系统利用光波作为载体，通过光导纤维传输光信号进行通信。光接收机用于接收光信号，不是传输介质；光导纤维是传输介质，不是载体。所以选 A。","source":"未提供","difficulty":"易"},{"id":"choice-254","type":"choice","globalNumber":254,"page":"choice_251-300.html","answer":"B","analysis":"交换机根据 MAC（介质访问控制）地址进行数据帧的转发，IP 地址用于网络层寻址；居住地址和电脑地址与交换机数据转发无关。所以选 B。","source":"未提供","difficulty":"易"},{"id":"choice-255","type":"choice","globalNumber":255,"page":"choice_251-300.html","answer":"A","analysis":"在路由器命令行中，router#show version 用于查看路由器的版本及引导信息；router#show ip router 用于查看路由表信息；router#show interface 用于查看接口状态信息；router#show run 用于查看当前运行配置。所以选 A。","source":"未提供","difficulty":"中"},{"id":"choice-256","type":"choice","globalNumber":256,"page":"choice_251-300.html","answer":"A","analysis":"路由器启动时，首先从 ROM（只读存储器）中读取引导程序，然后加载 FLASH（闪存）中的操作系统，最后读取 NVRAM（非易失性随机存取存储器）中的配置文件。所以选 A。","source":"未提供","difficulty":"中"},{"id":"choice-257","type":"choice","globalNumber":257,"page":"choice_251-300.html","answer":"C","analysis":"OSPF（开放最短路径优先）协议使用链路状态算法计算路由；RIP 使用距离向量算法；BGP 是边界网关协议，用于不同自治系统间的路由选择；PPP 是数据链路层协议，不是路由协议。所以选 C。","source":"未提供","difficulty":"中"},{"id":"choice-258","type":"choice","globalNumber":258,"page":"choice_251-300.html","answer":"C","analysis":"外网存在大量未知和不可控因素，如恶意软件、网络攻击等，是操作系统安全的主要威胁来源；虽然内网也可能存在安全风险，但相对外网威胁较小；局域网范围较广，概念不准确。所以选 C。","source":"未提供","difficulty":"中"},{"id":"choice-259","type":"choice","globalNumber":259,"page":"choice_251-300.html","answer":"B","analysis":"存储保护既需要硬件提供存储保护机制，如内存管理单元（MMU），也需要软件进行存储访问的控制和管理，两者配合才能实现存储保护功能。所以选 B。","source":"未提供","difficulty":"中"},{"id":"choice-260","type":"choice","globalNumber":260,"page":"choice_251-300.html","answer":"A","analysis":"设定密码长度最小值、密码必须符合复杂性要求、强制密码历史都是常见的本地用户组密码安全策略，用于增强密码安全性；设定用户不能更改密码不属于通用的密码安全策略内容。所以选 A。","source":"未提供","difficulty":"中"},{"id":"choice-261","type":"choice","globalNumber":261,"page":"choice_251-300.html","answer":"A","analysis":"使用屏幕保护并设置返回时需口令，主要是防止他人在设备使用间隙未经授权访问，无法阻止暴力破解；账户锁定策略可限制暴力破解尝试次数；更改管理员用户名和设置安全口令都有助于防范暴力破解","source":"网络安全基础","difficulty":"易"},{"id":"choice-262","type":"choice","globalNumber":262,"page":"choice_251-300.html","answer":"D","analysis":"病毒库及时更新能让防病毒软件识别最新病毒，无论服务器、工作站还是通过病毒墙防护，及时更新病毒库是有效防范病毒的关键，其他选项单独实施效果有限","source":"网络安全基础","difficulty":"易"},{"id":"choice-263","type":"choice","globalNumber":263,"page":"choice_251-300.html","answer":"A","analysis":"该算法加密和解密使用同一密钥（5），符合对称加密技术特征；分组密码技术按固定长度分组加密，题干未体现；公钥加密使用公私钥对；单向函数密码技术具有不可逆性，均不符合","source":"密码学基础","difficulty":"中"},{"id":"choice-264","type":"choice","globalNumber":264,"page":"choice_251-300.html","answer":"A","analysis":"chroot_list_enable=NO 表示不启用例外列表，chroot_local_user=Yes 表示将本地用户锁定在主目录，B 选项 chroot-list-enable 书写错误，C、D 选项配置错误","source":"Linux 服务器配置","difficulty":"中"},{"id":"choice-265","type":"choice","globalNumber":265,"page":"choice_251-300.html","answer":"D","analysis":"TCPWrapper 主要用于监控和管理网络连接，不具备恢复受损文件及列出受损文件详情的功能，A、B、C 选项对其描述正确","source":"网络安全技术","difficulty":"中"},{"id":"choice-266","type":"choice","globalNumber":266,"page":"choice_251-300.html","answer":"A","analysis":"samba 服务默认安全模式为 user，用户需提供用户名和密码进行访问；share 模式无需用户名和密码；server 模式使用其他服务器进行用户验证；ads 模式用于与 Active Directory 集成","source":"Samba 服务器配置","difficulty":"易"},{"id":"choice-267","type":"choice","globalNumber":267,"page":"choice_251-300.html","answer":"B","analysis":"smbpasswd -a 用于添加用户；smbpasswd -d 用于禁用用户；smbpasswd -e 用于启用用户；smbpasswd -x 用于删除用户","source":"Linux 服务器配置","difficulty":"易"},{"id":"choice-268","type":"choice","globalNumber":268,"page":"choice_251-300.html","answer":"D","analysis":"DHCP 可自动分配 IP 地址，降低配置工作量，方便工作站变动时更新信息，增强系统安全性；而将域名转换为 IP 地址是 DNS 的功能","source":"DHCP 服务器配置","difficulty":"易"},{"id":"choice-269","type":"choice","globalNumber":269,"page":"choice_251-300.html","answer":"C","analysis":"10.0.0.255 是网络广播地址，不能用于分配，所以这样的两个 Scope 不能实现","source":"DHCP 服务器配置","difficulty":"中"},{"id":"choice-270","type":"choice","globalNumber":270,"page":"choice_251-300.html","answer":"B","analysis":"在 Windows Server 2008 域环境中，授权 DHCP 服务器需要森林管理员权限，域管理员权限不足；C 选项配置策略不是解决该问题的常规做法；D 选项 “所有管理员权限” 表述不准确","source":"Windows Server 配置","difficulty":"中"},{"id":"choice-271","type":"choice","globalNumber":271,"page":"choice_251-300.html","answer":"A","analysis":"Access 端口用于连接终端设备，只能属于一个 VLAN；Trunk 端口可承载多个 VLAN 数据","source":"交换机配置基础","difficulty":"易"},{"id":"choice-272","type":"choice","globalNumber":272,"page":"choice_251-300.html","answer":"C","analysis":"switchport trunk allowed VLAN remove 10 命令用于从 trunk 端口允许通过的 VLAN 列表中移除 VLAN 10；A 选项是添加 VLAN 10；B 选项允许所有 VLAN 通过；D 选项是允许除 10 之外的所有 VLAN 通过","source":"思科交换机配置","difficulty":"易"},{"id":"choice-273","type":"choice","globalNumber":273,"page":"choice_251-300.html","answer":"C","analysis":"login local 命令用于配置 vty 线路使用本地用户数据库进行验证；login 命令开启登录验证，但不是本地用户验证；no login 关闭登录验证；no login local 不存在该命令的标准用法","source":"思科设备配置基础","difficulty":"易"},{"id":"choice-274","type":"choice","globalNumber":274,"page":"choice_251-300.html","answer":"C","analysis":"SSH 远程登录可使用多种认证方式，不一定是本地用户名和密码；密文密码 show 查看时不会显示明文；同一类型密码多次配置，后配置的会覆盖前一个；通常不能同时配置明文和密文密码","source":"网络设备安全配置","difficulty":"中"},{"id":"choice-275","type":"choice","globalNumber":275,"page":"choice_251-300.html","answer":"A","analysis":"思科 IOS 系统默认的两个密码安全模式是级别 1 用户模式（基本权限）和级别 15 特权模式（最高权限）","source":"思科 IOS 系统基础","difficulty":"易"},{"id":"choice-276","type":"choice","globalNumber":276,"page":"choice_251-300.html","answer":"B","analysis":"在思科路由器接口配置模式（config-if）下，使用 ip address 命令配置 IP 地址和子网掩码，A 选项缺少子网掩码；C、D 选项配置模式错误","source":"思科路由器配置","difficulty":"易"},{"id":"choice-277","type":"choice","globalNumber":277,"page":"choice_251-300.html","answer":"B","analysis":"在特权 EXEC 模式（# 提示符）下，使用 configure 命令进入全局配置视图；A 选项在用户 EXEC 模式下使用错误；C 选项在全局配置视图下该命令无意义；D 选项 enable 是进入特权 EXEC 模式的命令","source":"思科路由器配置基础","difficulty":"易"},{"id":"choice-278","type":"choice","globalNumber":278,"page":"choice_251-300.html","answer":"B","analysis":"erase startup-config 命令用于删除思科路由器的启动配置文件（保存用户配置内容）；del 在思科设备中不是删除配置文件的标准命令；remove 也不是；write startup-config 是保存配置","source":"思科路由器配置","difficulty":"易"},{"id":"choice-279","type":"choice","globalNumber":279,"page":"choice_251-300.html","answer":"D","analysis":"在 “本地安全策略” 中配置各类策略属于制定安全策略；A、B、C 选项与题干描述的配置安全策略操作不符","source":"Windows 系统安全配置","difficulty":"易"},{"id":"choice-280","type":"choice","globalNumber":280,"page":"choice_251-300.html","answer":"D","analysis":"在工作组环境下，计算机的资源、用户账户和安全信息存储在本地安全账户管理器（SAM）数据库中；活动目录数据库用于域环境；防火墙用于网络安全防护；文件夹用于存储文件，不存储这些信息","source":"Windows 系统基础","difficulty":"易"},{"id":"choice-281","type":"choice","globalNumber":281,"page":"choice_251-300.html","answer":"C","analysis":"共享文件夹权限主要针对网络访问进行约束，在本地交互式访问时不受限，所以选 C。","source":"未提及","difficulty":"基础"},{"id":"choice-282","type":"choice","globalNumber":282,"page":"choice_251-300.html","answer":"B","analysis":"从作用范围角度，操作系统漏洞可分为本地漏洞等，A 是按触发方式分类，C、D 是从其他技术角度分类，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-283","type":"choice","globalNumber":283,"page":"choice_251-300.html","answer":"C","analysis":"边界服务服务器若补丁修复出现蓝屏或反复重启问题不能解决时，应积极寻找其他解决方案，而不是仅临时不更新，所以 C 错误。","source":"未提及","difficulty":"中等"},{"id":"choice-284","type":"choice","globalNumber":284,"page":"choice_251-300.html","answer":"D","analysis":"systeminfo 可查看系统已打补丁信息、网卡信息、主机名等，但无法查看 NDS 服务器地址，所以选 D。","source":"未提及","difficulty":"基础"},{"id":"choice-285","type":"choice","globalNumber":285,"page":"choice_251-300.html","answer":"C","analysis":"SELinux 是基于域类型模型的强制访问控制安全系统，所以选 C。","source":"未提及","difficulty":"基础"},{"id":"choice-286","type":"choice","globalNumber":286,"page":"choice_251-300.html","answer":"B","analysis":"在 Linux 系统中，root 用户的 UID 和 GID 均为 0，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-287","type":"choice","globalNumber":287,"page":"choice_251-300.html","answer":"B","analysis":"在 Linux 权限数字表示中，4 表示读取权限，给所有人读取权限用 444 表示，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-288","type":"choice","globalNumber":288,"page":"choice_251-300.html","answer":"A","analysis":"在数据库安全性控制中，授权数据对象粒度越小，授权子系统越能精准控制权限，也就越灵活，所以选 A。","source":"未提及","difficulty":"中等"},{"id":"choice-289","type":"choice","globalNumber":289,"page":"choice_251-300.html","answer":"B","analysis":"COM 属于二级域名中的类别域名，并非行政区域名，我国域名体系中最高级为 CN ，代表中国，COM 代表商业公司，GOV 代表政府组织，所以 B 错误。","source":"未提及","difficulty":"基础"},{"id":"choice-290","type":"choice","globalNumber":290,"page":"choice_251-300.html","answer":"A","analysis":"首次网站备案指网站主办者首次提交申请或原备案号被注销后重新提交，B 是变更接入商备案，C 是新增备案，D 是修改备案信息，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-291","type":"choice","globalNumber":291,"page":"choice_251-300.html","answer":"A","analysis":"网络管理的基本功能包括配置管理、故障管理、性能管理、安全管理和计费管理，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-292","type":"choice","globalNumber":292,"page":"choice_251-300.html","answer":"C","analysis":"增量备份只备份上次备份后新增或修改的数据，差异备份备份上次完全备份后变化的数据，完全备份备份全部数据，所以空间利用率由多到少是增量备份、差异备份、完全备份，选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-293","type":"choice","globalNumber":293,"page":"choice_251-300.html","answer":"C","analysis":"增量备份是备份上次备份（完全或增量）后更新的数据，不是上次完全备份后全部更新数据，A 错误；灾难恢复能力分 6 个等级，B 错误；容灾演练需定期进行，D 错误；数据备份按数据类型可分为系统数据备份和用户数据备份，C 正确 。","source":"未提及","difficulty":"中等"},{"id":"choice-294","type":"choice","globalNumber":294,"page":"choice_251-300.html","answer":"C","analysis":"C 选项描述的是 FC SAN 的特点，不是 IP SAN 的特点，IP SAN 具有设备整合、数据集中、高扩展性等特点，所以选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-295","type":"choice","globalNumber":295,"page":"choice_251-300.html","answer":"A","analysis":"SNMP 的中文含义是简单网络管理协议，简单邮件传送协议是 SMTP，简单文件传输协议是 TFTP，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-296","type":"choice","globalNumber":296,"page":"choice_251-300.html","answer":"A","analysis":"系统物理故障包括硬件故障与软件故障，计算机病毒属于软件问题但不是物理故障，人为失误不属于物理故障范畴，网络故障和设备环境故障不全面，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-297","type":"choice","globalNumber":297,"page":"choice_251-300.html","answer":"B","analysis":"网络测试仪可用于测试网线，数字电压表用于测量电压，时域反射仪主要用于检测电缆故障位置等，D 选项表述不规范，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-298","type":"choice","globalNumber":298,"page":"choice_251-300.html","answer":"B","analysis":"netstat -an 命令可用于查看系统开放端口，nslookup 用于域名查询，net use 用于连接网络资源等，net share 用于管理共享资源，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-299","type":"choice","globalNumber":299,"page":"choice_251-300.html","answer":"D","analysis":"网络故障结构化排除方法依次是收集信息、分析信息、提出假设、测试假设、消除原因，所以选 D。","source":"未提及","difficulty":"中等"},{"id":"choice-300","type":"choice","globalNumber":300,"page":"choice_251-300.html","answer":"C","analysis":"事务故障通常由非预期的、不正常的程序结束造成，系统故障涉及系统层面更广泛问题，网络故障主要是网络连接等问题，介质故障与存储介质相关，所以选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-301","type":"choice","globalNumber":301,"page":"choice_301-350.html","answer":"C","analysis":"TCP connect () 扫描是通过调用系统的 connect 函数来尝试连接目标端口，若连接成功则说明端口开放，这种方式简单直接，是最基本的端口扫描方法。而 TCP ACK 扫描主要用于判断端口是否被过滤；TCP FIN 扫描用于在特定情况下检测端口状态；FTP 反弹扫描则利用 FTP 服务器进行间接扫描，相对复杂，不是最基本的方法","source":"网络安全基础","difficulty":"易"},{"id":"choice-302","type":"choice","globalNumber":302,"page":"choice_301-350.html","answer":"D","analysis":"XSS 攻击主要是针对用户端的攻击，通过在网页中注入恶意脚本，实现盗用 cookie 获取敏感信息、利用信任关系进行非法操作、利用 iframe 执行管理动作等。而注入 payload 读取服务器上的文件通常属于文件注入漏洞利用，不属于常见的 XSS 攻击范畴","source":"网络安全漏洞原理与防范","difficulty":"中"},{"id":"choice-303","type":"choice","globalNumber":303,"page":"choice_301-350.html","answer":"D","analysis":"随着技术发展，黑客技术与网络病毒不再孤立存在，二者相互融合，形成更具威胁的攻击方式。黑客攻击、病毒攻击、木马攻击是传统的攻击形式，并非当前的发展趋势","source":"网络安全发展趋势研究","difficulty":"易"},{"id":"choice-304","type":"choice","globalNumber":304,"page":"choice_301-350.html","answer":"D","analysis":"不可否认性安全目标主要包括源发的不可否认（保证信息发送者不能否认发送过信息）、提交的不可否认（保证信息提交者不能否认提交过信息）、传递的不可否认（保证信息在传递过程中的不可否认性），时间的不可否认不属于不可否认安全目标的范畴","source":"信息安全基础理论","difficulty":"易"},{"id":"choice-305","type":"choice","globalNumber":305,"page":"choice_301-350.html","answer":"A","analysis":"可用性是指网络系统资源可被授权实体访问并按要求使用的特性。中断攻击破坏资源使其不可用，是对可用性的攻击。保密性侧重于信息不被泄露；完整性强调信息不被篡改；可控性指对信息的传播及内容具有控制能力","source":"网络安全概念与攻击类型","difficulty":"易"},{"id":"choice-306","type":"choice","globalNumber":306,"page":"choice_301-350.html","answer":"D","analysis":"脚本病毒通常以脚本语言编写，如 JavaScript、VBScript 等。Script.Redlof 从命名可判断属于脚本病毒。Worm.Sasser.f 是蠕虫病毒；Trojan.Huigezi.a 是木马病毒；Harm.formatC.f 是一种破坏性程序，不属于脚本病毒","source":"恶意代码分析与防范","difficulty":"中"},{"id":"choice-307","type":"choice","globalNumber":307,"page":"choice_301-350.html","answer":"A","analysis":"有规律的定期更换口令容易被攻击者根据规律猜测出口令，应无规律地定期更换。使用连续或相同字母数字、生日日期作为口令安全性较低，容易被破解","source":"口令安全策略与攻击防范","difficulty":"易"},{"id":"choice-308","type":"choice","globalNumber":308,"page":"choice_301-350.html","answer":"B","analysis":"SQL 注入攻击是通过在输入字段中注入恶意 SQL 语句来绕过认证或获取数据。万能密码也是利用程序对用户输入验证的漏洞，通过特殊构造的字符串来绕过口令验证，二者原理相似。口令枚举法是逐个尝试可能的口令；撞库是利用已泄露的账号密码在其他系统尝试登录；验证码是用于防止自动化攻击，与 SQL 注入原理不同","source":"网络安全攻击技术与防范","difficulty":"中"},{"id":"choice-309","type":"choice","globalNumber":309,"page":"choice_301-350.html","answer":"C","analysis":"部署入侵检测系统可以实时监测网络活动，发现端口扫描等异常行为并及时报警和采取相应措施。添加路由器设备不能直接应对端口扫描攻击；安装杀毒软件主要针对病毒等恶意软件，对端口扫描攻击防护有限；增加值班人员不能有效及时地检测和处理端口扫描攻击","source":"网络安全防护技术与策略","difficulty":"中"},{"id":"choice-310","type":"choice","globalNumber":310,"page":"choice_301-350.html","answer":"D","analysis":"内存主要用于计算机运行时临时存储数据和程序指令，断电后数据丢失，不适合长期稳定存储数据。磁盘、磁带、光盘都可用于数据的长期存储","source":"数据存储技术基础","difficulty":"易"},{"id":"choice-311","type":"choice","globalNumber":311,"page":"choice_301-350.html","answer":"B","analysis":"在线存储的数据可随时快速访问，用于频繁使用的数据；近线存储性能次之，用于访问频率稍低的数据；离线存储数据访问不便，用于长期保存但很少访问的数据；归档存储用于法规遵从性等长期保存需求的数据。按照数据访问频率和使用场景，合理顺序是在线、近线、离线、归档","source":"数据存储管理与优化","difficulty":"中"},{"id":"choice-312","type":"choice","globalNumber":312,"page":"choice_301-350.html","answer":"D","analysis":"覆写法是用新数据覆盖原有数据；消磁法用于磁性存储介质，破坏其数据记录；捣碎法 / 剪碎法物理破坏存储介质。多种方法结合能更彻底地销毁数据，单一方法可能存在数据残留风险","source":"数据安全与销毁技术","difficulty":"易"},{"id":"choice-313","type":"choice","globalNumber":313,"page":"choice_301-350.html","answer":"C","analysis":"数据冗余意味着相同数据多次存储，会浪费存储空间。并且当需要修改数据时，由于存在多个副本，修改操作复杂且容易出现不一致的情况。数据冗余一般不会直接导致数据访问速度变慢、更易丢失或业务系统不稳定","source":"数据库原理与数据管理","difficulty":"易"},{"id":"choice-314","type":"choice","globalNumber":314,"page":"choice_301-350.html","answer":"D","analysis":"C 盘作为系统盘，是木马病毒攻击的常见目标。同时，重装系统时通常会格式化 C 盘，导致数据丢失。文件存储在 C 盘不一定会被系统文件覆盖；C 盘可以存储其他文件","source":"Windows 系统安全与数据存储","difficulty":"易"},{"id":"choice-315","type":"choice","globalNumber":315,"page":"choice_301-350.html","answer":"B","analysis":"增量备份只备份自上次备份（包括完全备份和增量备份）以来发生变化的数据，相比整盘备份，大大减少了存储空间占用。自定义备份和文件备份没有突出节约存储空间的优势","source":"数据备份与恢复技术","difficulty":"易"},{"id":"choice-316","type":"choice","globalNumber":316,"page":"choice_301-350.html","answer":"D","analysis":"用户对鉴别信息的操作，如更改密码等是通过 “Winlogon” 进程和 “Security-AccountsManager”（SAM）数据库协同完成，并非仅通过以 Administrator 权限运行的 “Security-AccountsManager” 服务来实现。A、B、C 选项描述均正确","source":"Windows 系统安全机制","difficulty":"中"},{"id":"choice-317","type":"choice","globalNumber":317,"page":"choice_301-350.html","answer":"C","analysis":"在 vi 编辑器中，:% s/old/new/g 命令表示在整个文件中全局替换，将所有的 “old” 替换为 “new”。:r 命令用于读取文件内容；:s/old/new 只替换每行中首次出现的 “old”；:s/old/new/g 只在当前行进行全局替换","source":"Linux 文本编辑器使用","difficulty":"中"},{"id":"choice-318","type":"choice","globalNumber":318,"page":"choice_301-350.html","answer":"D","analysis":"应用程序是为满足用户某种需求而开发的具有特定功能的程序，正常情况下不会带来恶意危害。病毒程序、广告程序（部分恶意广告程序会侵犯用户隐私等）、间谍程序都属于恶意代码范畴","source":"恶意代码识别与防范","difficulty":"易"},{"id":"choice-319","type":"choice","globalNumber":319,"page":"choice_301-350.html","answer":"D","analysis":"即使不访问互联网，计算机仍可能通过移动存储设备等途径感染木马。Word 文档可通过宏病毒等方式感染木马；来历不明的网站链接可能隐藏木马下载链接；杀毒软件能检测和清除木马病毒","source":"计算机木马防范知识","difficulty":"易"},{"id":"choice-320","type":"choice","globalNumber":320,"page":"choice_301-350.html","answer":"D","analysis":"McAfee VirusScan、Norton AntiVirus、Kapersky 都是常见的杀毒软件。WannaCry 是一种勒索病毒，会对计算机数据进行加密勒索，并非杀毒软件","source":"杀毒软件识别与使用","difficulty":"易"},{"id":"choice-321","type":"choice","globalNumber":321,"page":"choice_301-350.html","answer":"B","analysis":"职业素养的提升能让学生在就业市场中更具优势，相比个人成长、学习能力提升等，提高就业竞争力更直接体现其最大意义，所以选 B","source":"职业素养教育基础课程相关 ID","difficulty":"易"},{"id":"choice-322","type":"choice","globalNumber":322,"page":"choice_301-350.html","answer":"C","analysis":"字长指的就是 CPU 一次能处理二进制数据的位数，用来衡量 CPU 性能，所以 C 正确","source":"计算机组成原理相关 ID","difficulty":"易"},{"id":"choice-323","type":"choice","globalNumber":323,"page":"choice_301-350.html","answer":"C","analysis":"操作系统的发展是从早期简单的管理程序，到出现原始操作系统，再逐步发展为功能完善的现代操作系统，C 选项顺序正确","source":"操作系统概论相关 ID","difficulty":"易"},{"id":"choice-324","type":"choice","globalNumber":324,"page":"choice_301-350.html","answer":"C","analysis":"虚拟化技术能实现资源的灵活分配和高效利用，是云计算的关键支撑技术，所以 C 正确","source":"云计算技术基础相关 ID","difficulty":"易"},{"id":"choice-325","type":"choice","globalNumber":325,"page":"choice_301-350.html","answer":"A","analysis":"通信子网包含物理层、数据链路层和网络层，网络层处于最高层，负责将数据从源端传输到目的端，所以 A 正确","source":"计算机网络原理相关 ID","difficulty":"易"},{"id":"choice-326","type":"choice","globalNumber":326,"page":"choice_301-350.html","answer":"C","analysis":"单模光纤只允许一束光沿光纤直径方向传播，相比多模光纤，其传输性能更好、距离更远，所以 C 正确","source":"光纤通信技术相关 ID","difficulty":"易"},{"id":"choice-327","type":"choice","globalNumber":327,"page":"choice_301-350.html","answer":"A","analysis":"启动配置文件存储在非易失性存储器（NVRAM）中，运行配置文件、IP 路由表、ARP 缓存等存于 RAM，断电后 RAM 中数据丢失，所以 A 正确","source":"网络设备配置与管理相关 ID","difficulty":"易"},{"id":"choice-328","type":"choice","globalNumber":328,"page":"choice_301-350.html","answer":"A","analysis":"open - system 认证方式下，客户端可先连接 AP，但由于密码错误，加密数据无法正常解密，导致无法正常通信，所以 A 正确","source":"无线网络技术相关 ID","difficulty":"中"},{"id":"choice-329","type":"choice","globalNumber":329,"page":"choice_301-350.html","answer":"A","analysis":"计算机电源故障是硬件层面的一般性故障，不属于数据库特有的故障类型；系统故障、介质故障、计算机病毒都可能影响数据库正常运行，所以 A 正确","source":"数据库原理相关 ID","difficulty":"易"},{"id":"choice-330","type":"choice","globalNumber":330,"page":"choice_301-350.html","answer":"D","analysis":"根据法律规定，合伙期限届满后合伙人继续执行合伙事务且无异议，合伙合同继续有效但变为不定期，所以 D 正确","source":"商法相关 ID","difficulty":"易"},{"id":"choice-331","type":"choice","globalNumber":331,"page":"choice_301-350.html","answer":"A","analysis":"开展数据处理活动需保障数据全流程的安全性，建立全流程数据安全管理制度是关键，所以 A 正确","source":"数据安全法律法规相关 ID","difficulty":"易"},{"id":"choice-332","type":"choice","globalNumber":332,"page":"choice_301-350.html","answer":"C","analysis":"核心密码、普通密码用于保护国家秘密信息等特定领域；公民、法人和其他组织可依法使用商用密码保护网络与信息安全，无民用密码说法，所以 C 正确","source":"密码学与信息安全相关 ID","difficulty":"易"},{"id":"choice-333","type":"choice","globalNumber":333,"page":"choice_301-350.html","answer":"A","analysis":"ICMP 协议用于在 IP 网络中传递差错和控制信息，使主机或路由器能报告差错和异常情况，TCP 用于可靠传输，IP 负责寻址和路由，HTTP 用于超文本传输，所以 A 正确","source":"计算机网络协议相关 ID","difficulty":"易"},{"id":"choice-334","type":"choice","globalNumber":334,"page":"choice_301-350.html","answer":"A","analysis":"TCP/IP 模型的网络接口层对应 OSI 模型的物理层和数据链路层，负责处理物理介质上的数据传输，所以 A 正确","source":"计算机网络体系结构相关 ID","difficulty":"易"},{"id":"choice-335","type":"choice","globalNumber":335,"page":"choice_301-350.html","answer":"C","analysis":"在以太网中，双绞线通常使用 RJ - 45 接口连接其他设备，RJ - 11 接口常用于电话连接，AUI 接口用于连接粗同轴电缆，BNC 接口用于连接细同轴电缆，所以 C 正确","source":"计算机网络布线相关 ID","difficulty":"易"},{"id":"choice-336","type":"choice","globalNumber":336,"page":"choice_301-350.html","answer":"C","analysis":"光纤利用光信号传输数据，具有带宽大、传输速率高、抗干扰能力强等优点，相比双绞线、同轴电缆和通信卫星，其传输速率最高，所以 C 正确","source":"通信传输技术相关 ID","difficulty":"易"},{"id":"choice-337","type":"choice","globalNumber":337,"page":"choice_301-350.html","answer":"C","analysis":"IPv4 地址分类中，A 类地址前 1 位为 0，B 类地址前 2 位为 10，C 类地址前 3 位为 110，D 类地址前 4 位为 1110，所以 C 正确","source":"网络地址规划与管理相关 ID","difficulty":"易"},{"id":"choice-338","type":"choice","globalNumber":338,"page":"choice_301-350.html","answer":"D","analysis":"IP 地址规划能优化路由表，提高路由器转发效率，对路由至关重要；分配时尽量分配连续空间方便管理，VLSM 技术可灵活划分子网，但不是必须采用，所以 D 错误","source":"网络地址规划与管理相关 ID","difficulty":"易"},{"id":"choice-339","type":"choice","globalNumber":339,"page":"choice_301-350.html","answer":"B","analysis":"静态路由的路由表项需要网络管理员手动配置；OSPF 路由、动态路由是路由器自动学习生成路由表项；直接路由是路由器直连网络的路由，无需手动配置，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易"},{"id":"choice-340","type":"choice","globalNumber":340,"page":"choice_301-350.html","answer":"B","analysis":"在缺省情况下，OSPF 协议的优先级高于 RIP 协议，所以路由表中会优先显示 OSPF 发现的到达同一网络的路径，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易"},{"id":"choice-341","type":"choice","globalNumber":341,"page":"choice_301-350.html","answer":"C","analysis":"操作系统是控制和管理计算机硬件与软件资源的程序，并非硬件和软件资源 1","type":"choice","globalNumber":361,"page":"choice_351-400.html","answer":"D","analysis":"更换操作系统不是应对安全漏洞的基本方法，A 选项调整默认安装可减少安全风险，B 选项强口令能增强用户认证安全性，C 选项安装补丁可修复已知漏洞","source":"操作系统安全课程","difficulty":"中等"},{"id":"choice-362","type":"choice","globalNumber":362,"page":"choice_351-400.html","answer":"B","analysis":"cat 命令主要用于查看文件内容或连接文件，不属于过滤器模式；ls 用于列出目录内容，grep 用于文本搜索过滤，tr 用于字符转换和删除，都有过滤功能","source":"Linux 命令课程","difficulty":"中等"},{"id":"choice-363","type":"choice","globalNumber":363,"page":"choice_351-400.html","answer":"B","analysis":"Linux 系统默认分区类型是 ext2，vfat 是 Windows 常用的文件系统，swap 是交换分区，DOS 是早期操作系统，不是 Linux 默认分区类型","source":"Linux 系统管理课程","difficulty":"基础"},{"id":"choice-364","type":"choice","globalNumber":364,"page":"choice_351-400.html","answer":"D","analysis":"type 是 Windows 系统用于显示文件类型或查看命令类型的命令，在 Linux 中不用于显示文件内容；tac 反向显示文件内容，more 分页显示，head 显示文件头部内容","source":"Linux 命令课程","difficulty":"基础"},{"id":"choice-365","type":"choice","globalNumber":365,"page":"choice_351-400.html","answer":"C","analysis":"MOUNT 不是 SQL Server 数据库恢复模型，FULL 是完整恢复模型，BULK_LOGGED 是大容量日志恢复模型，SIMPLE 是简单恢复模型","source":"SQL Server 数据库管理课程","difficulty":"中等"},{"id":"choice-366","type":"choice","globalNumber":366,"page":"choice_351-400.html","answer":"C","analysis":"通过多种认证方式和口令加密，构建多层安全防护，符合纵深防御原则；最小特权原则强调用户权限最小化，职责分离原则关注功能职责划分，最少共享机制原则注重减少信息共享","source":"网络安全设计课程","difficulty":"中等"},{"id":"choice-367","type":"choice","globalNumber":367,"page":"choice_351-400.html","answer":"A","analysis":"RAID2 采用汉明码校验和按位交叉存取，适用于大数据读写；RAID3 用奇偶校验码、按字节交叉存取，RAID4 和 RAID5 校验方式与存取方式与 RAID2 不同","source":"存储技术课程","difficulty":"中等"},{"id":"choice-368","type":"choice","globalNumber":368,"page":"choice_351-400.html","answer":"B","analysis":"RAID1 主要用于数据镜像备份，以提高数据安全性，不能显著提高读写性能；RAID0 通过条带化提高读写速度，RAID3 和 RAID5 利用校验和并行存储提升读写性能","source":"存储技术课程","difficulty":"中等"},{"id":"choice-369","type":"choice","globalNumber":369,"page":"choice_351-400.html","answer":"C","analysis":"在域名系统中，“CN” 是代表中国的顶级域名，CHINA、ZHONGGUO、ZG 都不是标准的国家顶级域名","source":"域名系统课程","difficulty":"基础"},{"id":"choice-370","type":"choice","globalNumber":370,"page":"choice_351-400.html","answer":"A","analysis":"用户并非只能使用本网段内 DNS 服务器，可配置其他可用的 DNS 服务器进行域名解析；B、C、D 选项关于不同类型 DNS 服务器功能的描述正确","source":"DNS 服务器配置课程","difficulty":"中等"},{"id":"choice-371","type":"choice","globalNumber":371,"page":"choice_351-400.html","answer":"B","analysis":"A 选项是首次备案情况，C 选项是新增备案情况，D 选项是备案信息变更情况，B 选项符合新增接入定义","source":"网站备案课程","difficulty":"中等"},{"id":"choice-372","type":"choice","globalNumber":372,"page":"choice_351-400.html","answer":"D","analysis":"通常一个备案服务号可备案 1 个及以上域名，具体数量可能因备案规则和接入商规定有所不同","source":"网站备案课程","difficulty":"基础"},{"id":"choice-373","type":"choice","globalNumber":373,"page":"choice_351-400.html","answer":"C","analysis":"目录与文件属性设置可控制用户对文件和目录的访问权限，是网络操作系统四级安全保密机制之一；磁盘镜像、UPS 监控、文件备份主要用于数据存储和系统运行保障，不属于该安全机制","source":"网络操作系统安全课程","difficulty":"中等"},{"id":"choice-374","type":"choice","globalNumber":374,"page":"choice_351-400.html","answer":"A","analysis":"在存储技术中，面向工作组级数据备份的 4mm 和面向部门级网络数据备份的 8mm 磁带采用螺旋扫描读写方式，6mm 磁带一般不采用这种方式","source":"存储技术课程","difficulty":"中等"},{"id":"choice-375","type":"choice","globalNumber":375,"page":"choice_351-400.html","answer":"C","analysis":"umask 用于设置文件和目录的默认权限掩码，不是文件系统备份和恢复命令；tar 和 cpio 可用于打包和备份文件，backup 是早期 UNIX 系统中的备份命令","source":"UNIX/Linux 系统管理课程","difficulty":"中等"},{"id":"choice-376","type":"choice","globalNumber":376,"page":"choice_351-400.html","answer":"D","analysis":"测线仪主要用于检测网线连通性，不是路由器故障诊断工具；路由器诊断命令、网络管理工具、故障诊断工具都可用于诊断路由器故障","source":"路由器故障诊断课程","difficulty":"中等"},{"id":"choice-377","type":"choice","globalNumber":377,"page":"choice_351-400.html","answer":"A","analysis":"协议分析仪可针对网络协议栈各层设计，并非仅对应第七层；B、C、D 选项对协议分析仪功能和特点的描述正确","source":"网络测试技术课程","difficulty":"中等"},{"id":"choice-378","type":"choice","globalNumber":378,"page":"choice_351-400.html","answer":"D","analysis":"ISDN 是综合业务数字网，是一种通信网络标准，不属于网络管理协议；SNMP 是简单网络管理协议，CMIS/CMIP 是公共管理信息服务 / 公共管理信息协议，CMOT 是基于 TCP/IP 的 CMIS 服务和协议，都用于网络管理","source":"网络管理协议课程","difficulty":"中等"},{"id":"choice-379","type":"choice","globalNumber":379,"page":"choice_351-400.html","answer":"B","analysis":"黑客通常先确定目标，再收集目标相关信息，然后实施攻击，最后隐藏痕迹，保证攻击过程的隐蔽性和持续性","source":"网络安全防御课程","difficulty":"中等"},{"id":"choice-380","type":"choice","globalNumber":380,"page":"choice_351-400.html","answer":"D","analysis":"网络安全主要保护信息载体以及信息处理、传输、存储、访问等过程的安全，信息的涵义并非直接保护对象","source":"网络安全基础课程","difficulty":"中等"},{"id":"choice-381","type":"choice","globalNumber":381,"page":"choice_351-400.html","answer":"D","analysis":"木马入侵常见方法有捆绑欺骗、邮件冒名欺骗、危险下载等。文件感染是病毒的一种感染方式，并非木马入侵的常见方法","source":"网络安全基础","difficulty":"中等"},{"id":"choice-382","type":"choice","globalNumber":382,"page":"choice_351-400.html","answer":"C","analysis":"允许匿名访问意味着任何用户无需认证即可访问软件，相比仅管理员可访问和所有合法用户可访问模式，其攻击面最大，攻击者更容易尝试入侵","source":"网络安全基础","difficulty":"中等"},{"id":"choice-383","type":"choice","globalNumber":383,"page":"choice_351-400.html","answer":"D","analysis":"计算机系统鉴别主要包括用户标识认证、传输原发点鉴别、内容鉴别及特征检测等。版本鉴别不属于计算机系统鉴别范畴","source":"网络安全基础","difficulty":"中等"},{"id":"choice-384","type":"choice","globalNumber":384,"page":"choice_351-400.html","answer":"D","analysis":"死亡之 PING、SYN Flood 攻击、Land 攻击都属于拒绝服务（DOS）攻击，通过消耗系统资源使服务瘫痪。勒索病毒攻击主要目的是加密文件勒索赎金，不属于 DOS 攻击","source":"网络安全基础","difficulty":"中等"},{"id":"choice-385","type":"choice","globalNumber":385,"page":"choice_351-400.html","answer":"C","analysis":"拒绝服务攻击通过向目标服务器发送大量请求，消耗其资源，使网络或系统无法正常提供服务，符合题干描述","source":"网络安全基础","difficulty":"中等"},{"id":"choice-386","type":"choice","globalNumber":386,"page":"choice_351-400.html","answer":"B","analysis":"PPDRR 安全模式包括保护、检测、响应、恢复等环节。恢复是在安全事件发生后，对系统进行修复和还原，属于补救措施","source":"网络安全基础","difficulty":"中等"},{"id":"choice-387","type":"choice","globalNumber":387,"page":"choice_351-400.html","answer":"A","analysis":"动态站点监控可以实时监测网站活动，建立访问控制策略并及时发现和处理攻击，减少损失。实施存取控制、安全管理检测、完善服务器系统安全性能虽也重要，但不符合 “及时发现攻击并追踪防范” 这一描述","source":"网络安全基础","difficulty":"中等"},{"id":"choice-388","type":"choice","globalNumber":388,"page":"choice_351-400.html","answer":"B","analysis":"哈希加密算法用于口令加密存储更安全；server 端验证码、隐藏 token 可增强口令安全性。而使用 client 端验证码存在安全风险，易被攻击者获取，不能有效抵御口令攻击","source":"网络安全基础","difficulty":"中等"},{"id":"choice-389","type":"choice","globalNumber":389,"page":"choice_351-400.html","answer":"D","analysis":"nmap 是网络扫描工具；nessus 是漏洞扫描工具；msf 是渗透测试框架；sqlmap 是专门用于自动化 SQL 注入检测和利用的工具","source":"网络安全基础","difficulty":"中等"},{"id":"choice-390","type":"choice","globalNumber":390,"page":"choice_351-400.html","answer":"D","analysis":"数据冗余的定义就是存在重复的数据，会浪费存储空间，可能导致数据不一致等问题","source":"数据库基础","difficulty":"简单"},{"id":"choice-391","type":"choice","globalNumber":391,"page":"choice_351-400.html","answer":"A","analysis":"Ghost 可以对系统进行分区备份和整盘备份，用于系统数据的备份和恢复","source":"系统维护基础","difficulty":"简单"},{"id":"choice-392","type":"choice","globalNumber":392,"page":"choice_351-400.html","answer":"A","analysis":"RPO（Recovery Point Objective）表示恢复点目标，指灾难发生后，系统和数据必须恢复到的时间点要求；RTO（Recovery Time Objective）表示恢复时间目标","source":"数据备份与恢复基础","difficulty":"中等"},{"id":"choice-393","type":"choice","globalNumber":393,"page":"choice_351-400.html","answer":"B","analysis":"在 Windows 系统中，在用户名后加 \"\"可创建隐藏账号，netuserhack 123456 /add 是创建隐藏账号的命令","source":"网络安全基础","difficulty":"中等"},{"id":"choice-394","type":"choice","globalNumber":394,"page":"choice_351-400.html","answer":"C","analysis":"文件型病毒主要感染 COM 和 EXE 等可执行文件；感染磁盘引导记录、寄生在磁盘引导区或主引导区的是引导型病毒；Flip 病毒是引导型病毒","source":"网络安全基础","difficulty":"中等"},{"id":"choice-395","type":"choice","globalNumber":395,"page":"choice_351-400.html","answer":"A","analysis":"/etc/passwd 和 /etc/group 文件存储用户和组的重要信息，对其设置写保护可防止非法修改，保障账号安全。删除相关文件会导致系统异常；设置强密码重要，但不是最关键措施","source":"UNIX/Linux 系统安全","difficulty":"中等"},{"id":"choice-396","type":"choice","globalNumber":396,"page":"choice_351-400.html","answer":"D","analysis":"复合型病毒是指恶意代码通过多种方式传播，兼具多种病毒特性，如同时具备文件感染和网络传播能力","source":"网络安全基础","difficulty":"中等"},{"id":"choice-397","type":"choice","globalNumber":397,"page":"choice_351-400.html","answer":"D","analysis":"进程注入技术、端口反向连接技术常用于恶意代码攻击。“超级管理技术” 表述不准确，可能指获取超级用户权限相关技术，也与恶意代码攻击有关。而 “自动生产技术” 不属于恶意代码攻击技术","source":"网络安全基础","difficulty":"中等"},{"id":"choice-398","type":"choice","globalNumber":398,"page":"choice_351-400.html","answer":"D","analysis":"计算机病毒可感染多种类型文件，包括可执行文件、文本文件等；传播途径有读写磁盘、网络、移动存储设备等多种方式，并非仅通过软件复制传播","source":"网络安全基础","difficulty":"中等"},{"id":"choice-399","type":"choice","globalNumber":399,"page":"choice_351-400.html","answer":"A","analysis":"行为检测法就是利用病毒感染文件时的特有行为和特性来检测病毒；校验和法是通过计算文件校验和判断文件是否被修改；主动防御法是一种综合性的安全防护理念；“特征行为法” 表述不准确","source":"网络安全基础","difficulty":"中等"},{"id":"choice-400","type":"choice","globalNumber":400,"page":"choice_351-400.html","answer":"B","analysis":"计算机病毒可能破坏程序或数据、使网络阻塞、导致 CPU 使用率过高。“控制面板” 中无 “本地连接” 图标可能是网络设置问题、驱动问题等，不一定是由计算机病毒引起","source":"网络安全基础","difficulty":"中等"},{"id":"judgment-001","type":"judgment","globalNumber":1,"page":"judgment_1-50.html","answer":"正确","analysis":"在装机过程中，带电插拔硬件容易产生瞬间电流，可能会超出芯片或部件的承受范围，从而烧坏它们，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-002","type":"judgment","globalNumber":2,"page":"judgment_1-50.html","answer":"错误","analysis":"数据库在计算机系统中通常是以文件的形式存储在磁盘等存储设备上的，如常见的关系型数据库会有数据文件、日志文件等，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-003","type":"judgment","globalNumber":3,"page":"judgment_1-50.html","answer":"错误","analysis":"IEEE802.11b 工作在 2.4GHz 频段，而不是 5GHz 频段，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-004","type":"judgment","globalNumber":4,"page":"judgment_1-50.html","answer":"错误","analysis":"《数据安全法》适用于在中华人民共和国境内开展的数据处理活动及其安全监管，在境外处理境内数据的活动，有条件地适用本法，并非境内外所有活动都适用，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-005","type":"judgment","globalNumber":5,"page":"judgment_1-50.html","answer":"错误","analysis":"窃取他人加密保护的信息或非法侵入他人密码保障系统属于违法行为，即使经过批准也不允许，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-006","type":"judgment","globalNumber":6,"page":"judgment_1-50.html","answer":"正确","analysis":"OSI 参考模型分层的目的就是让每一层专注于特定功能，各层之间主要与紧邻的上下层进行数据交互，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-007","type":"judgment","globalNumber":7,"page":"judgment_1-50.html","answer":"正确","analysis":"双绞线通过不同的编码方式可以传输模拟信号，如传统电话线路；也可以通过特定的数字编码传输数字信号，如以太网中的双绞线，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-008","type":"judgment","globalNumber":8,"page":"judgment_1-50.html","answer":"错误","analysis":"光纤是通过光信号来传输数据的，它不传输电信号，利用光在光纤中的全反射原理进行信息传输，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-009","type":"judgment","globalNumber":9,"page":"judgment_1-50.html","answer":"正确","analysis":"操作系统作为系统软件，管理计算机硬件资源，为用户提供操作界面，处于处理机和用户之间，起到承上启下的作用，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-010","type":"judgment","globalNumber":10,"page":"judgment_1-50.html","answer":"正确","analysis":"UNIX 操作系统的文件系统采用分级树型结构，以根目录 “/” 为起点，方便文件的组织和管理，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-011","type":"judgment","globalNumber":11,"page":"judgment_1-50.html","answer":"正确","analysis":"计算机病毒是人为编制的、具有自我复制能力并能对计算机系统造成破坏的程序，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-012","type":"judgment","globalNumber":12,"page":"judgment_1-50.html","answer":"错误","analysis":"计算机染上恶意代码后，格式化磁盘是一种极端的处理方式，可能会导致重要数据丢失。通常应先尝试使用杀毒软件进行查杀等其他方式解决，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-013","type":"judgment","globalNumber":13,"page":"judgment_1-50.html","answer":"正确","analysis":"恶意代码具有多种危害，可破坏软件系统、篡改或删除数据，在某些情况下还可能影响硬件正常运行，如导致硬件过热等，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-014","type":"judgment","globalNumber":14,"page":"judgment_1-50.html","answer":"错误","analysis":"木马程序主要特点是隐藏自身，窃取用户信息，而不是直接破坏软硬件系统，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-015","type":"judgment","globalNumber":15,"page":"judgment_1-50.html","answer":"错误","analysis":"防病毒的错误警告可能是误报，并不一定是系统真的产生了问题，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-016","type":"judgment","globalNumber":16,"page":"judgment_1-50.html","answer":"错误","analysis":"WWW 服务默认使用 TCP 端口 80，但也可以使用其他端口，通过配置服务器可以更改端口号，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-017","type":"judgment","globalNumber":17,"page":"judgment_1-50.html","answer":"错误","analysis":"使用电子邮件发送邮件时，不需要收件人的邮政编码，只需要正确的电子邮箱地址即可，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-018","type":"judgment","globalNumber":18,"page":"judgment_1-50.html","answer":"错误","analysis":"静态 IP 地址是手动配置且固定不变的；DHCP 服务器分配的 IP 地址是动态的，有租约期限，并非永久租用，所以该说法错误。","source":"未提供","difficulty":"较低"},{"id":"judgment-019","type":"judgment","globalNumber":19,"page":"judgment_1-50.html","answer":"正确","analysis":"在实际配置中，DHCP 服务器分配 IP 地址的租期可根据需求设置，理论上最大租期时间可以设置为无限，但实际中很少这样设置，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-020","type":"judgment","globalNumber":20,"page":"judgment_1-50.html","answer":"正确","analysis":"LanFree 备份通过 SAN（存储区域网络）等技术实现数据备份，数据直接在存储设备之间传输，不经过局域网，避免占用局域网带宽等网络资源，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-021","type":"judgment","globalNumber":21,"page":"judgment_1-50.html","answer":"正确","analysis":"计算机网络利用通信技术实现计算机之间的数据传输，同时依靠计算机技术对数据进行处理和管理，是两者结合的成果，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-022","type":"judgment","globalNumber":22,"page":"judgment_1-50.html","answer":"正确","analysis":"TCP/IP 体系结构从功能上分为这四个层次，各层分工协作实现网络通信，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-023","type":"judgment","globalNumber":23,"page":"judgment_1-50.html","answer":"正确","analysis":"HDLC（高级数据链路控制）协议属于 OSI/RM（开放系统互连参考模型）的数据链路层协议，用于在数据链路层进行数据传输控制，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-024","type":"judgment","globalNumber":24,"page":"judgment_1-50.html","answer":"正确","analysis":"SMTP（简单邮件传输协议）用于邮件的发送，POP3（邮局协议版本 3）用于邮件的接收，两者协同实现主机间电子邮件的收发，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-025","type":"judgment","globalNumber":25,"page":"judgment_1-50.html","answer":"正确","analysis":"ping 命令通过发送 ICMP（网际控制报文协议）回显请求报文来测试两台主机之间的网络连通性，是常用的网络测试工具，所以该说法正确。","source":"未提供","difficulty":"较低"},{"id":"judgment-026","type":"judgment","globalNumber":26,"page":"judgment_1-50.html","answer":"错误","analysis":"DNS 的主要功能是将域名解析为 IP 地址，方便用户通过域名 制文件，保持文件原貌，这两种模式满足不同文件传输需求。","source":"未提供","difficulty":"较低"},{"id":"judgment-100","type":"judgment","globalNumber":100,"page":"judgment_51-100.html","answer":"错误","analysis":"一般客户机和服务器之间域名查询为递归方式查询，客户机向本地域名服务器发出查询请求后，本地域名服务器会代替客户机完成整个查询过程并返回结果；而非递归方式是服务器只返回部分信息，让客户机继续查询。","source":"未提供","difficulty":"中等"}];

function readStore(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function writeStore(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function removeStore(k){try{localStorage.removeItem(k)}catch(e){}}
function deepClone(v){return JSON.parse(JSON.stringify(v))}
function normalize(s){return String(s??'').trim().replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\s+/g,'').toLowerCase()}
function acceptable(value,answer){const list=Array.isArray(answer)?answer:[answer];return list.some(a=>normalize(value)===normalize(a))}
function exactSet(a,b){if(!Array.isArray(a)||!Array.isArray(b))return false;const x=[...new Set(a)].sort(),y=[...new Set(b)].sort();return x.length===y.length&&x.every((v,i)=>v===y[i])}
function hasUserValue(val,type){if(val===undefined||val===null)return false;if(type==='multi')return Array.isArray(val)&&val.length>0;if(type==='fill')return Array.isArray(val)&&val.some(v=>String(v??'').trim()!=='');return String(val).trim()!==''}
function isRecordAnswered(rec){return !!rec&&rec.locked===true&&typeof rec.correct==='boolean'}
function checkValue(q,val){if(q.type==='multi')return exactSet(val,q.answer);if(q.type==='fill'){const vals=Array.isArray(val)?val:[];return vals.length===q.blanks.length&&q.blanks.every((a,i)=>acceptable(vals[i],a));}return val===q.answer}
function newProgress(mode){return {answers:{},pins:[],seenIds:[],currentPage:PAGE_FILE,currentId:null,seconds:0,timerRunning:true,runStartedAt:Date.now(),mode:mode||'practice',submitted:false,examOrder:{},wrongIds:[]}}

} else if(!state){state=newProgress('practice');}
if(state.currentPage==null)state.currentPage=PAGE_FILE;
if(!Array.isArray(state.seenIds))state.seenIds=[];
if(!state.answers)state.answers={};if(!Array.isArray(state.pins))state.pins=[];if(!state.examOrder)state.examOrder={};

if(state.mode==='exam'&&!state.submitted&&!state.examOrder[PAGE_FILE]){
  const arr=QUESTIONS.map(q=>q.id);for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}state.examOrder[PAGE_FILE]=arr;

function fmt(s){s=Math.max(0,Math.floor(s||0));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')}

 currentQuestions=displayQuestions();

function renderFill(card,q){

 const stem=document.createElement('div');stem.className='fill-stem';let html=escapeHtml(q.stem);for(let i=0;i<(q.blanks||[]).length;i++){const circ='①②③④⑤⑥⑦⑧⑨⑩'[i]||String(i+1);html=html.replaceAll('___'+circ+'___','<span class="fill-marker">'+circ+'</span>');}stem.innerHTML=html;card.appendChild(stem);
 const box=document.createElement('div');box.className='fill-inputs';
 (q.blanks||[]).forEach((ans,i)=>{const circ='①②③④⑤⑥⑦⑧⑨⑩'[i]||String(i+1);const item=document.createElement('div');item.className='fill-item';const label=document.createElement('label');label.textContent=circ;item.appendChild(label);const inp=document.createElement('input');inp.maxLength=20;inp.setAttribute('aria-label','第'+circ+'空');inp.value=Array.isArray(rec?.value)?(rec.value[i]||''):'';if(locked){inp.disabled=true;inp.classList.add(acceptable(inp.value,ans)?'correct':'wrong');}else{inp.addEventListener('input',()=>{const vals=[...box.querySelectorAll('input')].map(x=>x.value);state.answers[q.id]={value:vals,locked:false,correct:null,draft:true};saveProgress();});}item.appendChild(inp);box.appendChild(item);});

 if(!locked&&state.mode!=='exam'){const btn=document.createElement('button');btn.className='fill-submit';btn.textContent='提交答案';btn.onclick=()=>{const vals=[...box.querySelectorAll('input')].map(i=>i.value);const correct=checkValue(q,vals);state.answers[q.id]={value:vals,locked:true,correct};saveProgress();render();showAnalysis(q.id);};card.appendChild(btn);}

function escapeHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

   else state.answers[q.id]={value:key,locked:false,correct:null,draft:true};

 if(q.type==='multi'){
   let arr=rec&&Array.isArray(rec.value)?[...rec.value]:[];
   if(!(q.answer||[]).includes(key)){if(!arr.includes(key))arr.push(key);state.answers[q.id]={value:arr,locked:true,correct:false};saveProgress();render();showAnalysis(q.id);return;}
   arr=arr.includes(key)?arr.filter(x=>x!==key):[...arr,key];
   if((q.answer||[]).every(x=>arr.includes(x))){state.answers[q.id]={value:arr,locked:true,correct:true};}
   else state.answers[q.id]={value:arr,locked:false,correct:null,draft:true};
   saveProgress();render();if(state.answers[q.id].locked)showAnalysis(q.id);return;
 }
 const correct=key===q.answer;state.answers[q.id]={value:key,locked:true,correct};saveProgress();render();showAnalysis(q.id);
}
function renderNumbers(){
 const list=document.getElementById('numberList');list.innerHTML='';
 for(const q of currentQuestions){const d=document.createElement('button');d.type='button';d.className='num-item';d.textContent=shortLabel(q);const rec=state.answers[q.id];if(isRecordAnswered(rec)){d.classList.add(rec.correct?'correct':'wrong');}else if(state.submitted&&rec&&rec.locked){d.classList.add(rec.correct?'correct':'wrong');}if(state.pins.includes(q.id))d.classList.add('pinned');if(state.currentId===q.id)d.classList.add('current');d.onclick=()=>{state.currentId=q.id;saveProgress();document.querySelector(`.question-card[data-id="${q.id}"]`)?.scrollIntoView({behavior:'smooth',block:'start'});render();showAnalysis(q.id);};list.appendChild(d);}
}
function renderPins(){
 const list=document.getElementById('pinList');list.innerHTML='';const metas=state.pins.map(id=>questionMap.get(id)).filter(Boolean);
 if(!metas.length){const s=document.createElement('span');s.className='muted';s.textContent='暂无图钉题目';list.appendChild(s);return;}
 for(const q of metas){const d=document.createElement('button');d.type='button';d.className='pin-item';d.textContent=shortLabel(q);d.onclick=()=>jumpQuestion(q.id);list.appendChild(d);}
}
function answerDisplay(q,val){if(val===undefined||val===null)return '未作答';if(q.type==='fill'){return (Array.isArray(val)?val:[]).map((v,i)=>('①②③④⑤⑥⑦⑧⑨⑩'[i]||String(i+1))+' '+(String(v||'').trim()||'（空）')).join('；')||'未作答';}if(Array.isArray(val))return val.join('、')||'未作答';return String(val)===''?'未作答':String(val)}
function correctDisplay(q){if(q.type==='fill')return (q.blanks||[]).map((v,i)=>('①②③④⑤⑥⑦⑧⑨⑩'[i]||String(i+1))+' '+(Array.isArray(v)?v.join(' / '):v)).join('；');return Array.isArray(q.answer)?q.answer.join('、'):q.answer}
function showAnalysis(id){const box=document.getElementById('analysis');box.innerHTML='';const q=QUESTIONS.find(x=>x.id===id);if(!q)return;const rec=state.answers[id];if((!rec||(!rec.locked&&!state.submitted))&&!state.submitted)return;
 const mine=rec?answerDisplay(q,rec.value):'未作答';const lines=[['我的答案：',mine],['正确答案：',correctDisplay(q)],['解析：',q.analysis||'未提供'],['来源：',q.source||'未提供'],['难度：',q.difficulty||'未提供']];
 for(const [label,val] of lines){const div=document.createElement('div');div.className='analysis-line';const strong=document.createElement('strong');strong.textContent=label;div.appendChild(strong);div.appendChild(document.createTextNode(String(val)));box.appendChild(div);}
}
function togglePin(id){state.pins=state.pins.includes(id)?state.pins.filter(x=>x!==id):[...state.pins,id];saveProgress();render();}
function jumpQuestion(id){const q=questionMap.get(id);if(!q)return;const target=q.page||PAGE_FILE;if(target!==PAGE_FILE){state.currentPage=target;state.currentId=id;saveProgress();writeStore(JUMP_KEY,{page:target,id});location.href=target;return;}state.currentId=id;saveProgress();document.querySelector(`.question-card[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'start'});render();showAnalysis(id);}
function prevPageFor(page){if(DEMO)return 'example_index.html';const i=pageOrder.indexOf(page);return i>0?pageOrder[i-1]:'index.html'}
function nextPageFor(page){if(DEMO)return null;const i=pageOrder.indexOf(page);return i>=0&&i<pageOrder.length-1?pageOrder[i+1]:null}
function gotoPage(page){if(!page)return;state.seconds=secondsNow();if(state.timerRunning)state.runStartedAt=Date.now();state.currentPage=page;saveProgress();location.href=page;}
function saveTemp(){state.seconds=secondsNow();state.timerRunning=false;state.runStartedAt=null;saveProgress();location.href=DEMO?'example_index.html':'index.html';}
function exportProgress(){const payload={progress:state,lastResult:readStore(LAST_KEY)};openDialog('导出进度','复制下方 JSON，或下载为 quiz_progress.json。',JSON.stringify(payload,null,2),[{label:'复制文本',secondary:true,fn:()=>{const t=document.getElementById('dialogText');t.select();try{navigator.clipboard?.writeText(t.value)}catch(e){}document.execCommand?.('copy');}},{label:'下载 JSON',fn:()=>{const blob=new Blob([document.getElementById('dialogText').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quiz_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}},{label:'关闭',secondary:true,fn:closeDialog}]);}
function importProgress(){openDialog('导入进度','粘贴之前导出的 JSON。确认后将覆盖当前进度。','',[{label:'导入并恢复',fn:()=>{let val;try{val=JSON.parse(document.getElementById('dialogText').value)}catch(e){alert('JSON 格式错误');return;}const p=val.progress||val;if(!p||typeof p!=='object'||!p.answers){alert('没有找到有效的刷题进度数据');return;}if(!confirm('导入后将覆盖当前进度，确定继续？'))return;writeStore(PROGRESS_KEY,p);if(val.lastResult)writeStore(LAST_KEY,val.lastResult);closeDialog();alert('导入成功，正在恢复页面。');location.href=p.currentPage||PAGE_FILE;}},{label:'取消',secondary:true,fn:closeDialog}]);}
function clearProgress(){if(!confirm('确定清空刷题进度、计时和图钉？上一次交卷记录会保留。'))return;removeStore(PROGRESS_KEY);alert('进度已清空。');location.href=DEMO?'example_index.html':'index.html';}
function openDialog(title,message,value,actions){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogMessage').textContent=message;document.getElementById('dialogText').value=value||'';document.getElementById('dialogActions').innerHTML='';for(const a of actions){const b=document.createElement('button');b.className='btn '+(a.secondary?'light':'');b.textContent=a.label;b.onclick=a.fn;document.getElementById('dialogActions').appendChild(b);}document.getElementById('dialogShade').classList.add('open');}
function closeDialog(){document.getElementById('dialogShade').classList.remove('open');}
function submitPaper(){if(state.submitted){alert('本次已交卷。');location.href=DEMO?'example_result.html':'result.html';return;}if(!confirm('确定交卷？交卷后将停止计时并锁定答案。'))return;
 state.seconds=secondsNow();state.timerRunning=false;state.runStartedAt=null;
 if(state.mode==='exam'){
   for(const id of state.seenIds){const meta=questionMap.get(id);if(!meta)continue;const rec=state.answers[id];if(!rec||!hasUserValue(rec.value,meta.type))continue;const correct=checkValue(meta,rec.value);state.answers[id]={...rec,locked:true,correct,draft:false};}
 }
 state.submitted=true;
 const ids=[...new Set([...(state.seenIds||[]),...Object.keys(state.answers||{})])].filter(id=>questionMap.has(id));
 const wrongIds=ids.filter(id=>{const rec=state.answers[id];return isRecordAnswered(rec)&&rec.correct===false;});
 const result={mode:state.mode,timeSeconds:state.seconds,time:fmt(state.seconds),submittedAt:new Date().toLocaleString(),questionIds:ids,answers:deepClone(state.answers),pins:[...state.pins],wrongIds,submitted:true};
 writeStore(PROGRESS_KEY,state);writeStore(LAST_KEY,result);location.href=DEMO?'example_result.html':'result.html';
}
function timerTick(){document.getElementById('timer').textContent=fmt(secondsNow());if(secondsNow()%5===0){state.seconds=secondsNow();if(state.timerRunning)state.runStartedAt=Date.now();saveProgress();}}
function togglePanel(){document.getElementById('infoPanel').classList.toggle('expanded');const b=document.getElementById('toggleBtn');b.textContent=document.getElementById('infoPanel').classList.contains('expanded')?'收起':'展开';}
function initNav(){const prev=prevPageFor(PAGE_FILE),next=nextPageFor(PAGE_FILE);const prevLabel=DEMO?'上一页':'上一页';for(const id of ['desktopPrev','mobilePrev']){const el=document.getElementById(id);if(prev==='index.html'||prev==='example_index.html'){el.onclick=()=>gotoPage(prev);el.href=prev;}else{el.onclick=()=>gotoPage(prev);el.href=prev;}}
 for(const id of ['desktopNext','mobileNext']){const el=document.getElementById(id);if(!next){el.disabled=true;el.removeAttribute('href');el.onclick=null;}else{el.disabled=false;el.href=next;el.onclick=(ev)=>{ev.preventDefault();gotoPage(next);};}}
}
function seedDemo(){if(!DEMO||state.mode!=='practice'||state.seeded)return;state.answers={
 'choice-001':{value:'B',locked:true,correct:true},
 'choice-image-063':{value:'C',locked:true,correct:false},
 'multi-001':{value:['A'],locked:false,correct:null,draft:true},
 'judgment-001':{value:'错误',locked:true,correct:false},
 'fill-001':{value:['空气滤清器','错误答案','柴油滤清器'],locked:true,correct:false}
 };state.pins=['choice-image-063'];state.seenIds=QUESTIONS.map(q=>q.id);state.seeded=true;writeStore(PROGRESS_KEY,state);}
if(DEMO&&!readStore(PROGRESS_KEY)){seedDemo();}
const demoInitialState=readStore(PROGRESS_KEY);
if(DEMO&&demoInitialState&&!demoInitialState.seeded&&state.mode==='practice'){seedDemo();}
render();initNav();
if(jump&&jump.page===PAGE_FILE){setTimeout(()=>document.querySelector(`.question-card[data-id="${jump.id}"]`)?.scrollIntoView({behavior:'smooth',block:'start'}),120);}
timerInterval=setInterval(timerTick,1000);
window.addEventListener('beforeunload',()=>{state.seconds=secondsNow();if(state.timerRunning)state.runStartedAt=Date.now();saveProgress();});

</script></body></html>
