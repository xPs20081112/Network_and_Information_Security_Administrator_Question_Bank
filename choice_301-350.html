button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#f7f3ff;color:var(--ink);padding:10px 14px;transition:transform .12s,background .12s,border-color .12s}button:hover{background:#eee7ff;border-color:var(--accent)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
a{color:inherit}.site-wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:24px 24px 42px}.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#6e58bd,#4d3b91);color:#fff;font-weight:800;box-shadow:0 8px 22px #5a469a33}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{margin:0;font-size:clamp(24px,3vw,36px);line-height:1.2;letter-spacing:-.03em}h2{margin:0;font-size:20px}h3{margin:0;font-size:15px}.subtitle{color:var(--muted);font-size:13px;margin-top:6px}.panel{background:var(--panel);border:1px solid rgba(92,70,151,.23);border-radius:20px;box-shadow:0 12px 32px rgba(75,55,140,.08);backdrop-filter:blur(2px)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-hint{font-size:12px;color:var(--muted)}.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#e9e2ff;color:#534095;font-size:12px;font-weight:700}.footnote{font-size:12px;color:#665984;line-height:1.6}.hidden{display:none!important}

const QUESTIONS=[{"id":"choice:301","type":"choice","number":301,"stem":"黑客端口扫描最基本的方法是 (　　)","options":[{"key":"A","text":"TCP ACK 扫描"},{"key":"B","text":"TCP FIN 扫描"},{"key":"C","text":"TCP connect () 扫描"},{"key":"D","text":"FTP 反弹扫描"}],"answer":"C","explanation":"TCP connect () 扫描是通过调用系统的 connect 函数来尝试连接目标端口，若连接成功则说明端口开放，这种方式简单直接，是最基本的端口扫描方法。而 TCP ACK 扫描主要用于判断端口是否被过滤；TCP FIN 扫描用于在特定情况下检测端口状态；FTP 反弹扫描则利用 FTP 服务器进行间接扫描，相对复杂，不是最基本的方法","source":"网络安全基础","difficulty":"易"},{"id":"choice:302","type":"choice","number":302,"stem":"下列哪个不属于常见的 XSS 攻击手段和目的 (　　)","options":[{"key":"A","text":"盗用 cookie，获取敏感信息"},{"key":"B","text":"利用可被攻击的域受到其他域信任的特定，以受信任来源身份请求一些平时不允许的操作"},{"key":"C","text":"利用 iframe 以用户的身份执行一些管理动作"},{"key":"D","text":"注入 payload 读取服务器上的文件"}],"answer":"D","explanation":"XSS 攻击主要是针对用户端的攻击，通过在网页中注入恶意脚本，实现盗用 cookie 获取敏感信息、利用信任关系进行非法操作、利用 iframe 执行管理动作等。而注入 payload 读取服务器上的文件通常属于文件注入漏洞利用，不属于常见的 XSS 攻击范畴","source":"网络安全漏洞原理与防范","difficulty":"中"},{"id":"choice:303","type":"choice","number":303,"stem":"网络攻击的发展趋势是 (　　)","options":[{"key":"A","text":"黑客攻击"},{"key":"B","text":"病毒攻击"},{"key":"C","text":"木马攻击"},{"key":"D","text":"黑客技术与网络病毒日益融合"}],"answer":"D","explanation":"随着技术发展，黑客技术与网络病毒不再孤立存在，二者相互融合，形成更具威胁的攻击方式。黑客攻击、病毒攻击、木马攻击是传统的攻击形式，并非当前的发展趋势","source":"网络安全发展趋势研究","difficulty":"易"},{"id":"choice:304","type":"choice","number":304,"stem":"不可否认的安全目标对发生的专门行为提供保证，它不包括 (　　)","options":[{"key":"A","text":"源发的不可否认"},{"key":"B","text":"提交的不可否认"},{"key":"C","text":"传递的不可否认"},{"key":"D","text":"时间的不可否认"}],"answer":"D","explanation":"不可否认性安全目标主要包括源发的不可否认（保证信息发送者不能否认发送过信息）、提交的不可否认（保证信息提交者不能否认提交过信息）、传递的不可否认（保证信息在传递过程中的不可否认性），时间的不可否认不属于不可否认安全目标的范畴","source":"信息安全基础理论","difficulty":"易"},{"id":"choice:305","type":"choice","number":305,"stem":"在网络安全中，中断指攻击者破坏网络系统的资源，使之变成无效的或者无用的，这是对 (　　)","options":[{"key":"A","text":"可用性的攻击"},{"key":"B","text":"保密性的攻击"},{"key":"C","text":"完整性的攻击"},{"key":"D","text":"可控性的攻击"}],"answer":"A","explanation":"可用性是指网络系统资源可被授权实体访问并按要求使用的特性。中断攻击破坏资源使其不可用，是对可用性的攻击。保密性侧重于信息不被泄露；完整性强调信息不被篡改；可控性指对信息的传播及内容具有控制能力","source":"网络安全概念与攻击类型","difficulty":"易"},{"id":"choice:306","type":"choice","number":306,"stem":"恶意代码是指为达到恶意目的而专门设计的程序或代码。以下恶意代码中，属于脚本病毒的是 (　　)","options":[{"key":"A","text":"Worm.Sasser.f"},{"key":"B","text":"Trojan.Huigezi.a"},{"key":"C","text":"Harm.formatC.f"},{"key":"D","text":"Script.Redlof"}],"answer":"D","explanation":"脚本病毒通常以脚本语言编写，如 JavaScript、VBScript 等。Script.Redlof 从命名可判断属于脚本病毒。Worm.Sasser.f 是蠕虫病毒；Trojan.Huigezi.a 是木马病毒；Harm.formatC.f 是一种破坏性程序，不属于脚本病毒","source":"恶意代码分析与防范","difficulty":"中"},{"id":"choice:307","type":"choice","number":307,"stem":"下列针对口令攻击的说法不正确的是 (　　)","options":[{"key":"A","text":"口令要有规律的定期更换"},{"key":"B","text":"口令要没有规律的定期更换"},{"key":"C","text":"口令不建议使用连续或相同的字母或数字"},{"key":"D","text":"口令不建议使用生日日期"}],"answer":"A","explanation":"有规律的定期更换口令容易被攻击者根据规律猜测出口令，应无规律地定期更换。使用连续或相同字母数字、生日日期作为口令安全性较低，容易被破解","source":"口令安全策略与攻击防范","difficulty":"易"},{"id":"choice:308","type":"choice","number":308,"stem":"在口令攻击中，与 SQL 注入攻击原理相同的是 (　　)","options":[{"key":"A","text":"口令枚举法"},{"key":"B","text":"万能密码"},{"key":"C","text":"撞库"},{"key":"D","text":"验证码"}],"answer":"B","explanation":"SQL 注入攻击是通过在输入字段中注入恶意 SQL 语句来绕过认证或获取数据。万能密码也是利用程序对用户输入验证的漏洞，通过特殊构造的字符串来绕过口令验证，二者原理相似。口令枚举法是逐个尝试可能的口令；撞库是利用已泄露的账号密码在其他系统尝试登录；验证码是用于防止自动化攻击，与 SQL 注入原理不同","source":"网络安全攻击技术与防范","difficulty":"中"},{"id":"choice:309","type":"choice","number":309,"stem":"端口扫描检测工具发现被端口扫描攻击后，正确的处理方法是 (　　)","options":[{"key":"A","text":"添加路由器设备"},{"key":"B","text":"在计算机上安装杀毒软件"},{"key":"C","text":"部署入侵检测系统"},{"key":"D","text":"增加值班人员"}],"answer":"C","explanation":"部署入侵检测系统可以实时监测网络活动，发现端口扫描等异常行为并及时报警和采取相应措施。添加路由器设备不能直接应对端口扫描攻击；安装杀毒软件主要针对病毒等恶意软件，对端口扫描攻击防护有限；增加值班人员不能有效及时地检测和处理端口扫描攻击","source":"网络安全防护技术与策略","difficulty":"中"},{"id":"choice:310","type":"choice","number":310,"stem":"目前不用于数据存储的存储设备主要有 (　　)","options":[{"key":"A","text":"磁盘（包括磁盘阵列）"},{"key":"B","text":"磁带（包括磁带机和磁带库）"},{"key":"C","text":"光盘"},{"key":"D","text":"内存"}],"answer":"D","explanation":"内存主要用于计算机运行时临时存储数据和程序指令，断电后数据丢失，不适合长期稳定存储数据。磁盘、磁带、光盘都可用于数据的长期存储","source":"数据存储技术基础","difficulty":"易"},{"id":"choice:311","type":"choice","number":311,"stem":"在存储资源统一管理的前提下，应按照一下哪个顺序实现数据的自动分级存储 (　　)","options":[{"key":"A","text":"近线、在线、归档、离线"},{"key":"B","text":"在线、近线、离线、归档"},{"key":"C","text":"在线、离线、近线、归档"},{"key":"D","text":"近线、离线、归档、在线"}],"answer":"B","explanation":"在线存储的数据可随时快速访问，用于频繁使用的数据；近线存储性能次之，用于访问频率稍低的数据；离线存储数据访问不便，用于长期保存但很少访问的数据；归档存储用于法规遵从性等长期保存需求的数据。按照数据访问频率和使用场景，合理顺序是在线、近线、离线、归档","source":"数据存储管理与优化","difficulty":"中"},{"id":"choice:312","type":"choice","number":312,"stem":"数据销毁的方法最正确的是 (　　)","options":[{"key":"A","text":"覆写法"},{"key":"B","text":"消磁法"},{"key":"C","text":"捣碎法 / 剪碎法"},{"key":"D","text":"覆写法、消磁法、捣碎法 / 剪碎法"}],"answer":"D","explanation":"覆写法是用新数据覆盖原有数据；消磁法用于磁性存储介质，破坏其数据记录；捣碎法 / 剪碎法物理破坏存储介质。多种方法结合能更彻底地销毁数据，单一方法可能存在数据残留风险","source":"数据安全与销毁技术","difficulty":"易"},{"id":"choice:313","type":"choice","number":313,"stem":"数据冗余可能导致的问题有 (　　)","options":[{"key":"A","text":"数据访问速度变慢"},{"key":"B","text":"数据更易丢失"},{"key":"C","text":"浪费存储空间，难以修改"},{"key":"D","text":"容易造成业务系统不稳定"}],"answer":"C","explanation":"数据冗余意味着相同数据多次存储，会浪费存储空间。并且当需要修改数据时，由于存在多个副本，修改操作复杂且容易出现不一致的情况。数据冗余一般不会直接导致数据访问速度变慢、更易丢失或业务系统不稳定","source":"数据库原理与数据管理","difficulty":"易"},{"id":"choice:314","type":"choice","number":314,"stem":"在用安装了 Windows 操作系统的电脑时，一般建议电脑中重要的资料最好不要保存在 C 盘中，下列观点最合理的是 (　　)","options":[{"key":"A","text":"这种说法没有根据"},{"key":"B","text":"文件存储在 C 盘容易被系统文件覆盖"},{"key":"C","text":"C 盘是默认系统盘，不能存储其他文件"},{"key":"D","text":"C 盘最容易遭到木马病毒的攻击，而且重装系统时会删除 C 盘上的所有文件，如果备份不及时会造成严重影响"}],"answer":"D","explanation":"C 盘作为系统盘，是木马病毒攻击的常见目标。同时，重装系统时通常会格式化 C 盘，导致数据丢失。文件存储在 C 盘不一定会被系统文件覆盖；C 盘可以存储其他文件","source":"Windows 系统安全与数据存储","difficulty":"易"},{"id":"choice:315","type":"choice","number":315,"stem":"为节约存储空间，在经历初次备份后应选择 (　　)","options":[{"key":"A","text":"整盘备份"},{"key":"B","text":"增量备份"},{"key":"C","text":"自定义备份"},{"key":"D","text":"文件备份"}],"answer":"B","explanation":"增量备份只备份自上次备份（包括完全备份和增量备份）以来发生变化的数据，相比整盘备份，大大减少了存储空间占用。自定义备份和文件备份没有突出节约存储空间的优势","source":"数据备份与恢复技术","difficulty":"易"},{"id":"choice:316","type":"choice","number":316,"stem":"以下关于 Windows 操作系统身份标识与鉴别，说法不正确的是 (　　)","options":[{"key":"A","text":"Windows 操作系统远程登录经历了 SMB 鉴别机制、LM 鉴别机制、NTLM 鉴别机制、Kerberos 鉴别体系等阶段"},{"key":"B","text":"完整的安全标识符 (SID）包括用户和组的安全描述，48 比特的身份特权、修订版本和可变的验证值"},{"key":"C","text":"本地安全授权机构 (LSA) 生成用户账户在该系统内唯一的安全标识符 (SID)"},{"key":"D","text":"用户对鉴别信息的操作，如更改密码等都通过一个以 Administrator 权限运行的服务 “Security-AccountsManager” 来实现"}],"answer":"D","explanation":"用户对鉴别信息的操作，如更改密码等是通过 “Winlogon” 进程和 “Security-AccountsManager”（SAM）数据库协同完成，并非仅通过以 Administrator 权限运行的 “Security-AccountsManager” 服务来实现。A、B、C 选项描述均正确","source":"Windows 系统安全机制","difficulty":"中"},{"id":"choice:317","type":"choice","number":317,"stem":"用 vi 打开一个文件，用字母 “new” 来代替字母 “old” 的命令是 (　　)","options":[{"key":"A","text":":r/old/new"},{"key":"B","text":":s/old/new"},{"key":"C","text":":%s/old/new/g"},{"key":"D","text":":s/old/new/g"}],"answer":"C","explanation":"在 vi 编辑器中，:% s/old/new/g 命令表示在整个文件中全局替换，将所有的 “old” 替换为 “new”。:r 命令用于读取文件内容；:s/old/new 只替换每行中首次出现的 “old”；:s/old/new/g 只在当前行进行全局替换","source":"Linux 文本编辑器使用","difficulty":"中"},{"id":"choice:318","type":"choice","number":318,"stem":"恶意代码指没有作用却会带来危险的代码，下列不属于恶意代码的是 (　　)","options":[{"key":"A","text":"病毒程序"},{"key":"B","text":"广告程序"},{"key":"C","text":"间谍程序"},{"key":"D","text":"应用程序"}],"answer":"D","explanation":"应用程序是为满足用户某种需求而开发的具有特定功能的程序，正常情况下不会带来恶意危害。病毒程序、广告程序（部分恶意广告程序会侵犯用户隐私等）、间谍程序都属于恶意代码范畴","source":"恶意代码识别与防范","difficulty":"易"},{"id":"choice:319","type":"choice","number":319,"stem":"下面关于计算机木马说法错误的是 (　　)","options":[{"key":"A","text":"Word 文档也会感染木马"},{"key":"B","text":"尽量不要点击来历不明的网站链接"},{"key":"C","text":"杀毒软件对防木马病毒具有重要作用"},{"key":"D","text":"只要不访问互联网，就能避免感染木马"}],"answer":"D","explanation":"即使不访问互联网，计算机仍可能通过移动存储设备等途径感染木马。Word 文档可通过宏病毒等方式感染木马；来历不明的网站链接可能隐藏木马下载链接；杀毒软件能检测和清除木马病毒","source":"计算机木马防范知识","difficulty":"易"},{"id":"choice:320","type":"choice","number":320,"stem":"以下不属于杀毒软件的是 (　　)","options":[{"key":"A","text":"McAfee VirusScan"},{"key":"B","text":"Norton AntiVirus"},{"key":"C","text":"Kapersky"},{"key":"D","text":"WannaCry"}],"answer":"D","explanation":"McAfee VirusScan、Norton AntiVirus、Kapersky 都是常见的杀毒软件。WannaCry 是一种勒索病毒，会对计算机数据进行加密勒索，并非杀毒软件","source":"杀毒软件识别与使用","difficulty":"易"},{"id":"choice:321","type":"choice","number":321,"stem":"对于学生来说，职业素养培养最大的意义是 (　　)","options":[{"key":"A","text":"有利于个人成长"},{"key":"B","text":"提高就业竞争力"},{"key":"C","text":"提高学习能力"},{"key":"D","text":"提高身体素质"}],"answer":"B","explanation":"职业素养的提升能让学生在就业市场中更具优势，相比个人成长、学习能力提升等，提高就业竞争力更直接体现其最大意义，所以选 B","source":"职业素养教育基础课程相关 ID","difficulty":"易"},{"id":"choice:322","type":"choice","number":322,"stem":"字长是 CPU 的主要性能指标之一，它表示 (　　)","options":[{"key":"A","text":"CPU 最大的有效数字位数"},{"key":"B","text":"CPU 最长的十进制整数的位数"},{"key":"C","text":"CPU 一次能处理二进制数据的位数"},{"key":"D","text":"CPU 计算结果的有效数字长度"}],"answer":"C","explanation":"字长指的就是 CPU 一次能处理二进制数据的位数，用来衡量 CPU 性能，所以 C 正确","source":"计算机组成原理相关 ID","difficulty":"易"},{"id":"choice:323","type":"choice","number":323,"stem":"操作系统的发展过程是 (　　)","options":[{"key":"A","text":"原始操作系统，管理程序，操作系统"},{"key":"B","text":"原始操作系统，操作系统，管理程序"},{"key":"C","text":"管理程序，原始操作系统，操作系统"},{"key":"D","text":"管理程序，操作系统，原始操作系统"}],"answer":"C","explanation":"操作系统的发展是从早期简单的管理程序，到出现原始操作系统，再逐步发展为功能完善的现代操作系统，C 选项顺序正确","source":"操作系统概论相关 ID","difficulty":"易"},{"id":"choice:324","type":"choice","number":324,"stem":"云计算技术中最为关键的支撑技术之一就是 (　　)","options":[{"key":"A","text":"物联网技术"},{"key":"B","text":"大数据技术"},{"key":"C","text":"虚拟化技术"},{"key":"D","text":"5G 通信技术"}],"answer":"C","explanation":"虚拟化技术能实现资源的灵活分配和高效利用，是云计算的关键支撑技术，所以 C 正确","source":"云计算技术基础相关 ID","difficulty":"易"},{"id":"choice:325","type":"choice","number":325,"stem":"网络层位于通信子网的 (　　) 层","options":[{"key":"A","text":"最高"},{"key":"B","text":"中间"},{"key":"C","text":"最低"},{"key":"D","text":"不属于通信子网"}],"answer":"A","explanation":"通信子网包含物理层、数据链路层和网络层，网络层处于最高层，负责将数据从源端传输到目的端，所以 A 正确","source":"计算机网络原理相关 ID","difficulty":"易"},{"id":"choice:326","type":"choice","number":326,"stem":"单模光纤的传输方向是 (　　)","options":[{"key":"A","text":"散射"},{"key":"B","text":"衍射"},{"key":"C","text":"沿光纤直径方向"},{"key":"D","text":"全反射"}],"answer":"C","explanation":"单模光纤只允许一束光沿光纤直径方向传播，相比多模光纤，其传输性能更好、距离更远，所以 C 正确","source":"光纤通信技术相关 ID","difficulty":"易"},{"id":"choice:327","type":"choice","number":327,"stem":"以下哪项不是存放在路由器的随机存取存储器（RAM）中的 (　　)","options":[{"key":"A","text":"启动配置文件"},{"key":"B","text":"运行配置文件"},{"key":"C","text":"IP 路由表"},{"key":"D","text":"ARP 缓存"}],"answer":"A","explanation":"启动配置文件存储在非易失性存储器（NVRAM）中，运行配置文件、IP 路由表、ARP 缓存等存于 RAM，断电后 RAM 中数据丢失，所以 A 正确","source":"网络设备配置与管理相关 ID","difficulty":"易"},{"id":"choice:328","type":"choice","number":328,"stem":"当 AP 中配置 SSID 加密类型为 WEP 加密（密码为 12345），MAC 层认证方式为 open - system，而客户端输入的密码为 54321 会出现以下哪种现象 (　　)","options":[{"key":"A","text":"客户端可以成功连接 AP，但无法正常通信"},{"key":"B","text":"客户端可以成功连接 AP，也可以正常通信，但数据报文为明文传输"},{"key":"C","text":"客户端会提示密码错误，要求重新输入"},{"key":"D","text":"客户端无法成功连接 AP"}],"answer":"A","explanation":"open - system 认证方式下，客户端可先连接 AP，但由于密码错误，加密数据无法正常解密，导致无法正常通信，所以 A 正确","source":"无线网络技术相关 ID","difficulty":"中"},{"id":"choice:329","type":"choice","number":329,"stem":"下列选择中不属于数据库中的故障是 (　　)","options":[{"key":"A","text":"计算机电源故障"},{"key":"B","text":"系统故障"},{"key":"C","text":"介质故障"},{"key":"D","text":"计算机病毒"}],"answer":"A","explanation":"计算机电源故障是硬件层面的一般性故障，不属于数据库特有的故障类型；系统故障、介质故障、计算机病毒都可能影响数据库正常运行，所以 A 正确","source":"数据库原理相关 ID","difficulty":"易"},{"id":"choice:330","type":"choice","number":330,"stem":"合伙期限届满，合伙人继续执行合伙事务，其他合伙人没有提出异议的，原合伙合同继续有效，但是合伙期限为 (　　)","options":[{"key":"A","text":"定期"},{"key":"B","text":"永久"},{"key":"C","text":"60 年"},{"key":"D","text":"不定期"}],"answer":"D","explanation":"根据法律规定，合伙期限届满后合伙人继续执行合伙事务且无异议，合伙合同继续有效但变为不定期，所以 D 正确","source":"商法相关 ID","difficulty":"易"},{"id":"choice:331","type":"choice","number":331,"stem":"依据本法规定，开展数据处理活动应当依照法律、法规的规定，建立健全 (　　) 管理制度","options":[{"key":"A","text":"全流程数据安全"},{"key":"B","text":"“谁处理谁负责”"},{"key":"C","text":"风险评估"},{"key":"D","text":"应急处置"}],"answer":"A","explanation":"开展数据处理活动需保障数据全流程的安全性，建立全流程数据安全管理制度是关键，所以 A 正确","source":"数据安全法律法规相关 ID","difficulty":"易"},{"id":"choice:332","type":"choice","number":332,"stem":"公民、法人和其他组织可以依法使用 (　　) 保护网络与信息安全","options":[{"key":"A","text":"核心密码"},{"key":"B","text":"普通密码"},{"key":"C","text":"商用密码"},{"key":"D","text":"民用密码"}],"answer":"C","explanation":"核心密码、普通密码用于保护国家秘密信息等特定领域；公民、法人和其他组织可依法使用商用密码保护网络与信息安全，无民用密码说法，所以 C 正确","source":"密码学与信息安全相关 ID","difficulty":"易"},{"id":"choice:333","type":"choice","number":333,"stem":"能够使主机或路由器报告差错情况和提供有关异常情况的报告是 (　　) 协议的功能","options":[{"key":"A","text":"ICMP"},{"key":"B","text":"TCP"},{"key":"C","text":"IP"},{"key":"D","text":"HTTP"}],"answer":"A","explanation":"ICMP 协议用于在 IP 网络中传递差错和控制信息，使主机或路由器能报告差错和异常情况，TCP 用于可靠传输，IP 负责寻址和路由，HTTP 用于超文本传输，所以 A 正确","source":"计算机网络协议相关 ID","difficulty":"易"},{"id":"choice:334","type":"choice","number":334,"stem":"在 TCP/IP 模型中网络接口层规定了 OSI 模型的 (　　)","options":[{"key":"A","text":"物理和数据链路层"},{"key":"B","text":"数据链路和网络层"},{"key":"C","text":"物理层"},{"key":"D","text":"表示层"}],"answer":"A","explanation":"TCP/IP 模型的网络接口层对应 OSI 模型的物理层和数据链路层，负责处理物理介质上的数据传输，所以 A 正确","source":"计算机网络体系结构相关 ID","difficulty":"易"},{"id":"choice:335","type":"choice","number":335,"stem":"在以太网中，双绞线使用 (　　) 与其他设备连接起来","options":[{"key":"A","text":"AUI 接口"},{"key":"B","text":"RJ - 11 接口"},{"key":"C","text":"RJ - 45 接口"},{"key":"D","text":"BNC 接口"}],"answer":"C","explanation":"在以太网中，双绞线通常使用 RJ - 45 接口连接其他设备，RJ - 11 接口常用于电话连接，AUI 接口用于连接粗同轴电缆，BNC 接口用于连接细同轴电缆，所以 C 正确","source":"计算机网络布线相关 ID","difficulty":"易"},{"id":"choice:336","type":"choice","number":336,"stem":"在以下几种传输媒体中，哪种传输速率最高 (　　)","options":[{"key":"A","text":"双绞线"},{"key":"B","text":"同轴电缆"},{"key":"C","text":"光纤"},{"key":"D","text":"通信卫星"}],"answer":"C","explanation":"光纤利用光信号传输数据，具有带宽大、传输速率高、抗干扰能力强等优点，相比双绞线、同轴电缆和通信卫星，其传输速率最高，所以 C 正确","source":"通信传输技术相关 ID","difficulty":"易"},{"id":"choice:337","type":"choice","number":337,"stem":"IPv4 地址中的前三位为 110 表示该地址属于 (　　)","options":[{"key":"A","text":"A 类地址"},{"key":"B","text":"B 类地址"},{"key":"C","text":"C 类地址"},{"key":"D","text":"D 类地址"}],"answer":"C","explanation":"IPv4 地址分类中，A 类地址前 1 位为 0，B 类地址前 2 位为 10，C 类地址前 3 位为 110，D 类地址前 4 位为 1110，所以 C 正确","source":"网络地址规划与管理相关 ID","difficulty":"易"},{"id":"choice:338","type":"choice","number":338,"stem":"下面关于 IP 地址规划，说法错误的有 (　　)","options":[{"key":"A","text":"IP 地址分配尽量分配连续的 IP 地址空间"},{"key":"B","text":"相同的业务和功能尽量分配连续的 IP 地址空间"},{"key":"C","text":"IP 地址的分配必须采用 VLSM 技术"},{"key":"D","text":"IP 地址规划对于路由器路由没有任何作用"}],"answer":"D","explanation":"IP 地址规划能优化路由表，提高路由器转发效率，对路由至关重要；分配时尽量分配连续空间方便管理，VLSM 技术可灵活划分子网，但不是必须采用，所以 D 错误","source":"网络地址规划与管理相关 ID","difficulty":"易"},{"id":"choice:339","type":"choice","number":339,"stem":"以下路由方式，表项要由网络管理员手动配置的是 (　　)","options":[{"key":"A","text":"OSPF 路由"},{"key":"B","text":"静态路由"},{"key":"C","text":"直接路由"},{"key":"D","text":"动态路由"}],"answer":"B","explanation":"静态路由的路由表项需要网络管理员手动配置；OSPF 路由、动态路由是路由器自动学习生成路由表项；直接路由是路由器直连网络的路由，无需手动配置，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易"},{"id":"choice:340","type":"choice","number":340,"stem":"在缺省的情况下，如果一台路由器在所有接口同时运行了 RIP 和 OSPF 两种动态路由协议，下列说法中正确的是 (　　)","options":[{"key":"A","text":"针对到达同一网络的路径，在路由表中只会显示 RIP 发现的那一条，因为 RIP 协议的优先级更高"},{"key":"B","text":"针对到达同一网络的路径，在路由表中只会显示 OSPF 发现的那一条，因为 OSPF 协议的优先级更高"},{"key":"C","text":"针对到达同一网络的路径，在路由表中只会显示 RIP 发现的那一条，因为 RIP 协议的花费值 (metric) 更小"},{"key":"D","text":"针对到达同一网络的路径，在路由表中只会显示 OSPF 发现的那一条，因为 OSPF 协议的花费值 (metric) 更小"}],"answer":"B","explanation":"在缺省情况下，OSPF 协议的优先级高于 RIP 协议，所以路由表中会优先显示 OSPF 发现的到达同一网络的路径，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易"},{"id":"choice:341","type":"choice","number":341,"stem":"以下对操作系统的描述，不准确的是 (　　)","options":[{"key":"A","text":"方便用户的程序集合"},{"key":"B","text":"控制和管理计算机系统的硬件和软件资源"},{"key":"C","text":"是计算机硬件和软件资源的集合"},{"key":"D","text":"合理地组织计算机工作流程"}],"answer":"C","explanation":"操作系统是控制和管理计算机硬件与软件资源的程序，并非硬件和软件资源的集合，A、B、D 选项描述正确","source":"计算机操作系统基础","difficulty":"中等"},{"id":"choice:342","type":"choice","number":342,"stem":"可能给系统造成影响或者破坏的人包括 (　　)","options":[{"key":"A","text":"所有网络与信息系统使用者"},{"key":"B","text":"只有黑客"},{"key":"C","text":"只有骇客"},{"key":"D","text":"只有恶意程序"}],"answer":"A","explanation":"所有网络与信息系统使用者都可能因误操作、恶意行为等给系统造成影响或破坏，黑客、骇客、恶意程序只是其中一部分","source":"网络安全基础","difficulty":"简单"},{"id":"choice:343","type":"choice","number":343,"stem":"通过存取控制机制来防止由 (　　) 所造成的文件不安全性","options":[{"key":"A","text":"人为因素"},{"key":"B","text":"自然因素"},{"key":"C","text":"系统因素"},{"key":"D","text":"硬件因素"}],"answer":"A","explanation":"存取控制机制主要针对人为的非法访问等行为，自然因素、系统因素、硬件因素并非存取控制机制能防范的","source":"信息安全技术","difficulty":"中等"},{"id":"choice:344","type":"choice","number":344,"stem":"防病毒产品可以实施在网络中的 (　　) 三个层次中","options":[{"key":"A","text":"网关、服务器、桌面"},{"key":"B","text":"互联网、内部网、桌面"},{"key":"C","text":"防火墙、代理服务器、邮件处理服务器"},{"key":"D","text":"网关、桌面、无线设备"}],"answer":"A","explanation":"网关、服务器、桌面是网络中常见的可部署防病毒产品的层次，其他选项不符合常规部署层次","source":"网络安全防护技术","difficulty":"中等"},{"id":"choice:345","type":"choice","number":345,"stem":"关于非对称密钥加密算法下列说法错误的是 (　　)","options":[{"key":"A","text":"多数算法都是基于某个数学难题的"},{"key":"B","text":"即可实现加密，也可实现数字签名"},{"key":"C","text":"收发双方持有不同的密钥"},{"key":"D","text":"加密效率优于对称密钥加密算法"}],"answer":"D","explanation":"非对称密钥加密算法加密和解密使用不同密钥，基于数学难题，可用于加密和数字签名，但加密效率低于对称密钥加密算法","source":"密码学基础","difficulty":"中等"},{"id":"choice:346","type":"choice","number":346,"stem":"部署大中型 IPSec VPN 时，从安全性和维护成本考虑，建议采取 (　　) 技术手段提供设备间的身份验证","options":[{"key":"A","text":"预共享密钥"},{"key":"B","text":"数字证书"},{"key":"C","text":"路由协议验证"},{"key":"D","text":"802.1x"}],"answer":"B","explanation":"数字证书安全性高，适合大中型网络；预共享密钥安全性较弱；路由协议验证、802.1x 不用于 IPSec VPN 设备间身份验证","source":"VPN 技术与应用","difficulty":"中等"},{"id":"choice:347","type":"choice","number":347,"stem":"Web 的工作模式是 (　　)","options":[{"key":"A","text":"客户端 / 服务器端"},{"key":"B","text":"浏览器 / 服务器端"},{"key":"C","text":"浏览器 / 浏览器"},{"key":"D","text":"浏览器 / 客户端"}],"answer":"B","explanation":"Web 工作模式是浏览器向服务器请求资源，服务器响应，即浏览器 / 服务器端模式","source":"Web 开发基础","difficulty":"简单"},{"id":"choice:348","type":"choice","number":348,"stem":"以下属于 HTML 文件的有 (　　)","options":[{"key":"A","text":"hello.htm"},{"key":"B","text":"hello.xml"},{"key":"C","text":"hello.aspx"},{"key":"D","text":"hello.jsp"}],"answer":"A","explanation":".htm 是 HTML 文件的常见扩展名，.xml 是可扩展标记语言文件，.aspx 是ASP.NET文件，.jsp 是 Java Server Pages 文件","source":"HTML 基础","difficulty":"简单"},{"id":"choice:349","type":"choice","number":349,"stem":"以下文件中，不属于 vsftpd 的配置文件的是 (　　)","options":[{"key":"A","text":"/etc/vsftpd/vsftp.conf"},{"key":"B","text":"/etc/vsftpd/vsftpd.conf"},{"key":"C","text":"/etc/vsftpd/ftpusers"},{"key":"D","text":"/etc/vsftpd/user_list"}],"answer":"A","explanation":"vsftpd 的配置文件有 /etc/vsftpd/vsftpd.conf、/etc/vsftpd/ftpusers、/etc/vsftpd/user_list，A 选项文件名错误","source":"Linux 服务器配置","difficulty":"中等"},{"id":"choice:350","type":"choice","number":350,"stem":"某大型网络上管理 20 台服务器和近 1000 台客户机。其中一些 Windows Server 2012 R2 服务器正在使用手动指定的 IP 地址。现在希望这些服务器能从 DHCP 服务器获取其 IP 设置，但是不能改变它们已有的 IP 地址。那么，(　　) 方法能够完成此要求","options":[{"key":"A","text":"为所有服务器定义更长的租用期"},{"key":"B","text":"为这些服务器创建独立的作用域"},{"key":"C","text":"为这些服务器添加客户保留"},{"key":"D","text":"从 DHCP 作用域中排除这些 IP 地址"}],"answer":"C","explanation":"添加客户保留可让特定服务器使用固定 IP 从 DHCP 获取设置，A、B、D 选项无法满足需求","source":"DHCP 技术应用","difficulty":"中等"}];

const PROGRESS_KEY='quiz_progress_v2', SESSION_KEY='exam_session_v2', RESULT_KEY='last_result_v2';
const $=id=>document.getElementById(id);
function readJSON(key,fallback=null){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function writeJSON(key,v){try{localStorage.setItem(key,JSON.stringify(v));return true}catch(e){return false}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fileForId(id){const [type,raw]=id.split(':');const n=Number(raw),start=Math.floor((n-1)/50)*50+1,end=Math.min(start+49,TYPE_COUNTS[type]||50);return `${type}_${start}-${end}.html`}
function freshProgress(mode='practice',file=THIS_FILE,wrongIds=[]){return {version:2,mode,status:'active',answers:{},examAnswers:{},examResults:null,pinned:[],currentFile:file,currentId:null,lastVisitedId:null,elapsedSec:0,startedAt:Date.now(),timerRunning:true,orderByFile:{},wrongIds,createdAt:Date.now()}}
let progress=readJSON(PROGRESS_KEY,null);
if(!progress){progress=freshProgress('practice',THIS_FILE);writeJSON(PROGRESS_KEY,progress)}
progress.answers=progress.answers||{};progress.examAnswers=progress.examAnswers||{};progress.pinned=progress.pinned||[];progress.orderByFile=progress.orderByFile||{};progress.wrongIds=progress.wrongIds||[];
const lastResult=readJSON(RESULT_KEY,null);
const query=new URLSearchParams(location.search);const requestedId=query.get('id');
if(requestedId&&lastResult&&lastResult.items&&lastResult.items[requestedId]){
 progress.mode='exam';progress.status='submitted';progress.timerRunning=false;progress.startedAt=0;progress.examResults=lastResult.items;progress.pinned=lastResult.pinned||progress.pinned;progress.currentFile=THIS_FILE;progress.currentId=requestedId;progress.lastVisitedId=requestedId;writeJSON(PROGRESS_KEY,progress);
}
if(progress.status==='active'&&progress.timerRunning&&(!progress.startedAt||progress.startedAt<0))progress.startedAt=Date.now();
if(progress.mode==='exam'&&!progress.orderByFile[THIS_FILE]){
 const ids=QUESTIONS.map(q=>q.id),shuffled=ids.slice();for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}progress.orderByFile[THIS_FILE]=shuffled;writeJSON(PROGRESS_KEY,progress);
}
progress.currentFile=THIS_FILE;
if(requestedId&&QUESTIONS.some(q=>q.id===requestedId)){progress.currentId=requestedId;progress.lastVisitedId=requestedId;}
writeJSON(PROGRESS_KEY,progress);
let activeQuestions=QUESTIONS.slice();
if(progress.mode==='wrong')activeQuestions=QUESTIONS.filter(q=>progress.wrongIds.includes(q.id));
if(progress.mode==='exam'&&progress.orderByFile[THIS_FILE]){const index=new Map(activeQuestions.map(q=>[q.id,q]));activeQuestions=progress.orderByFile[THIS_FILE].map(id=>index.get(id)).filter(Boolean)}
function getExamResults(){return progress.examResults||lastResult?.items||{}}
function getAttempt(q){if(progress.mode==='exam')return progress.status==='submitted'?getExamResults()[q.id]||null:null;return progress.answers[q.id]||null}
function getSelected(q){if(progress.mode==='exam'&&progress.status!=='submitted')return progress.examAnswers[q.id]??null;const a=getAttempt(q);return a&&a.answered?a.value:null}
function isPinned(id){return progress.pinned.includes(id)}
function isLocked(q){if(progress.mode==='exam')return progress.status==='submitted';const a=progress.answers[q.id];return !!(a&&a.locked)}
function modeFiles(){if(progress.mode!=='wrong')return PAGE_FILES;return PAGE_FILES.filter(file=>progress.wrongIds.some(id=>fileForId(id)===file))}
function currentFileIndex(){return modeFiles().indexOf(THIS_FILE)}
function updateTimerValue(){let sec=Math.max(0,Math.floor(Number(progress.elapsedSec)||0));if(progress.timerRunning&&progress.startedAt)sec+=Math.floor((Date.now()-progress.startedAt)/1000);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
function elapsedNow(){let sec=Math.max(0,Math.floor(Number(progress.elapsedSec)||0));if(progress.timerRunning&&progress.startedAt)sec+=Math.floor((Date.now()-progress.startedAt)/1000);return sec}
function persist(){progress.currentFile=THIS_FILE;writeJSON(PROGRESS_KEY,progress)}
function updateTimer(){const t=updateTimerValue();document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=t)}
function pauseClock(){progress.elapsedSec=elapsedNow();progress.startedAt=0;progress.timerRunning=false;persist()}
function resumeClock(){if(progress.status==='submitted')return;progress.timerRunning=true;progress.startedAt=Date.now();persist()}
function answerClass(q,opt){const att=getAttempt(q);if(progress.mode==='exam'&&progress.status!=='submitted'){return getSelected(q)===opt.key?'selected':''}if(progress.mode==='exam'&&progress.status==='submitted'){if(opt.key===q.answer)return 'correct';if(att&&att.answered&&att.value===opt.key&&att.correct===false)return 'chosen-wrong';return ''}if(!att||!att.answered)return '';if(opt.key===q.answer)return 'correct';if(att.value===opt.key&&att.correct===false)return 'chosen-wrong';return ''}
function renderOption(q,opt){const chosen=getSelected(q)===opt.key,locked=isLocked(q);let classes='option-btn '+answerClass(q,opt);let label=q.type==='choice'?`<span class="option-key">${opt.key}</span><span>${esc(opt.text)}</span>`:`<span class="option-key">${opt.key==='正确'?'✓':'×'}</span><span>${esc(opt.text)}</span>`;return `<button type="button" class="${classes}" data-qid="${q.id}" data-opt="${esc(opt.key)}" ${locked?'disabled':''}>${label}</button>`}
function explanationHTML(q,att){if(!att||!att.answered)return '';const mine=att.value==null||att.value===''?'未作答':att.value;const right=q.answer;return `<div class="explanation"><div class="explanation-row"><span class="explanation-label">我的答案：</span>${esc(mine)}</div><div class="explanation-row"><span class="explanation-label">正确答案：</span>${esc(right)}</div><div class="explanation-row"><span class="explanation-label">解析：</span>${esc(q.explanation||'未提供')}</div><div class="source-line"><span class="explanation-label">来源：</span>${esc(q.source||'未提供')}　<span class="explanation-label">难度：</span>${esc(q.difficulty||'未提供')}</div></div>`}
function qStatus(q){const att=getAttempt(q);if(!att||att.correct===undefined)return '';return att.correct?'correct':'wrong'}
function renderQuestion(q){const att=getAttempt(q),selected=getSelected(q),classes=['question-card',qStatus(q),isPinned(q.id)?'pinned':'',q.id===progress.currentId?'current':''].filter(Boolean).join(' ');const shown=progress.mode==='exam'&&progress.status==='submitted'?att:(progress.mode==='exam'?null:att);return `<article class="${classes}" id="q-${q.id.replace(':','-')}" data-question-id="${q.id}"><div class="question-top"><div class="question-no"><span class="q-type-badge">${q.type==='choice'?'单选题':'判断题'}</span><span>第 ${q.number} 题</span></div><button type="button" class="pin-btn ${isPinned(q.id)?'active':''}" data-pin="${q.id}" aria-pressed="${isPinned(q.id)}">${isPinned(q.id)?'★ 已图钉':'☆ 图钉'}</button></div><p class="question-stem">${esc(q.stem)}</p><div class="options">${q.options.map(opt=>renderOption(q,opt)).join('')}</div>${explanationHTML(q,shown)}</article>`}
function renderNumbers(){const wrapIds=['numberGridDesktop','numberGridMobile'];const html=activeQuestions.map(q=>{const cls=['number-button',qStatus(q),isPinned(q.id)?'pinned':'',q.id===progress.currentId?'current':'',progress.mode==='exam'&&progress.status!=='submitted'&&getSelected(q)!==null?'selected':''].filter(Boolean).join(' ');return `<button class="${cls}" type="button" data-goto="${q.id}" aria-label="第 ${q.number} 题">${q.number}</button>`}).join('')||'<span class="footnote">暂无数据</span>';wrapIds.forEach(id=>{if($(id))$(id).innerHTML=html})}
function renderPins(){const ids=progress.pinned.slice().sort((a,b)=>{const [ta,na]=a.split(':');const [tb,nb]=b.split(':');return ta===tb?Number(na)-Number(nb):(ta==='choice'?-1:1)});const grouped={choice:[],judgment:[]};ids.forEach(id=>{const type=id.split(':')[0];if(grouped[type])grouped[type].push(id)});const html=Object.entries(grouped).filter(([,list])=>list.length).map(([type,list])=>`<div class="pin-group"><div class="pin-group-title">${type==='choice'?'单选题':'判断题'}</div>${list.map(id=>{const num=id.split(':')[1];return `<a class="pin-link" href="${fileForId(id)}?id=${encodeURIComponent(id)}#q-${id.replace(':','-')}">${num}</a>`}).join('')}</div>`).join('')||'<span class="footnote">暂无图钉题目</span>';['pinsDesktop','pinsMobile'].forEach(id=>{if($(id))$(id).innerHTML=html})}
function renderMode(){const labels={practice:'做题模式',exam:'考试模式',wrong:'错题模式'};document.querySelectorAll('[data-mode]').forEach(el=>el.textContent=labels[progress.mode]||'做题模式');const isExam=progress.mode==='exam'&&progress.status!=='submitted';['submitDesktop','submitMobile'].forEach(id=>{if($(id))$(id).classList.toggle('hidden',!isExam)});document.querySelectorAll('[data-save-label]').forEach(el=>el.textContent=progress.status==='submitted'?'返回首页':'暂存并返回首页');$('quizPageTitle').textContent=progress.mode==='wrong'?'错题复习':progress.mode==='exam'?'考试练习':'练习题目';if(progress.status==='submitted')$('modeNotice').textContent='本次考试已交卷，计时已停止；题目只读并显示解析。';else if(progress.mode==='exam')$('modeNotice').textContent='考试模式：交卷前不判对错；所有题目统一交卷判题，未作答按错误计入。';else if(progress.mode==='wrong')$('modeNotice').textContent='错题模式：题目来自最近一次考试交卷错题，答完后查看解析。';else $('modeNotice').textContent='做题模式：提交选项后立即判题并显示解析。'}
function renderPagers(){const files=modeFiles(),idx=currentFileIndex(),prev=idx>0?files[idx-1]:null,next=idx>=0&&idx<files.length-1?files[idx+1]:null;['prevDesktop','prevMobile'].forEach(id=>{if($(id))$(id).disabled=!prev});['nextDesktop','nextMobile'].forEach(id=>{if($(id))$(id).disabled=!next});['pagerDesktopLabel','pagerMobileLabel'].forEach(id=>{if($(id))$(id).textContent=`分页 ${Math.max(0,idx+1)} / ${files.length}`})}
function renderCurrentExplanation(){const q=activeQuestions.find(x=>x.id===progress.currentId)||activeQuestions[0];let content='';if(q){const att=getAttempt(q);if(att&&att.answered)content=explanationHTML(q,att)}['currentExplanationDesktop','currentExplanationMobile'].forEach(id=>{if($(id))$(id).innerHTML=content})}
function render(){if(!activeQuestions.some(q=>q.id===progress.currentId)){progress.currentId=activeQuestions[0]?.id||null;persist()}const list=$('questionList');list.innerHTML=activeQuestions.length?activeQuestions.map(renderQuestion).join(''):'<div class="empty-page"><h2>暂无数据</h2><p>当前模式下没有需要显示的题目。</p><a href="index.html">返回首页</a></div>';renderNumbers();renderPins();renderMode();renderPagers();updateTimer();renderCurrentExplanation();bindQuestionEvents();if(requestedId&&activeQuestions.some(q=>q.id===requestedId)){setTimeout(()=>scrollToQuestion(requestedId),100)}else if(progress.currentId&&activeQuestions.some(q=>q.id===progress.currentId)&&location.hash){setTimeout(()=>scrollToQuestion(progress.currentId),100)}}
function scrollToQuestion(id){const el=$(`q-${id.replace(':','-')}`);if(el){progress.currentId=id;progress.lastVisitedId=id;persist();document.querySelectorAll('.question-card.current').forEach(c=>c.classList.remove('current'));el.classList.add('current');el.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('[data-goto]').forEach(b=>b.classList.toggle('current',b.dataset.goto===id));renderCurrentExplanation()}}
function answerQuestion(qid,value){const q=QUESTIONS.find(x=>x.id===qid);if(!q)return;if(progress.status==='submitted')return;if(progress.mode==='exam'){progress.examAnswers[qid]=value;progress.currentId=qid;progress.lastVisitedId=qid;persist();render();const el=$(`q-${qid.replace(':','-')}`);if(el)el.scrollIntoView({block:'nearest'});return;}const previous=progress.answers[qid];if(previous&&previous.locked)return;const correct=value===q.answer;progress.answers[qid]={answered:true,value,correct,locked:true,answeredAt:Date.now()};progress.currentId=qid;progress.lastVisitedId=qid;persist();render();const el=$(`q-${qid.replace(':','-')}`);if(el)el.scrollIntoView({block:'nearest'})}
function togglePin(qid){const i=progress.pinned.indexOf(qid);if(i>=0)progress.pinned.splice(i,1);else progress.pinned.push(qid);progress.currentId=qid;persist();render()}
function bindQuestionEvents(){document.querySelectorAll('[data-qid][data-opt]').forEach(btn=>btn.addEventListener('click',()=>answerQuestion(btn.dataset.qid,btn.dataset.opt)));document.querySelectorAll('[data-pin]').forEach(btn=>btn.addEventListener('click',()=>togglePin(btn.dataset.pin)));document.querySelectorAll('[data-goto]').forEach(btn=>btn.addEventListener('click',()=>scrollToQuestion(btn.dataset.goto)))}
function goPage(which){const files=modeFiles(),i=currentFileIndex(),target=which==='prev'?files[i-1]:files[i+1];if(!target)return;progress.currentFile=target;if(progress.currentId)progress.lastVisitedId=progress.currentId;persist();location.href=target}
function saveAndReturn(){if(progress.status==='submitted'){location.href='index.html';return;}pauseClock();progress.status='paused';progress.currentFile=THIS_FILE;persist();location.href='index.html'}
function localTimeText(d){return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function submitExam(){if(progress.mode!=='exam'||progress.status==='submitted')return;if(!confirm('确定交卷吗？交卷后所有题目统一判题，未作答题目按错误计入，且无法继续修改。'))return;const session=readJSON(SESSION_KEY,null)||{ids:ALL_IDS,answerKey:ANSWER_KEY,createdAt:progress.createdAt};const ids=Array.isArray(session.ids)&&session.ids.length?session.ids:ALL_IDS;const answerKey=session.answerKey||ANSWER_KEY;const items={};let correct=0;const perType={choice:{total:0,correct:0},judgment:{total:0,correct:0}};ids.forEach(id=>{const ans=progress.examAnswers[id]??null;const right=answerKey[id]??ANSWER_KEY[id]??null;const ok=ans!==null&&ans!==''&&ans===right;if(ok)correct++;const type=id.split(':')[0];if(!perType[type])perType[type]={total:0,correct:0};perType[type].total++;if(ok)perType[type].correct++;items[id]={answered:ans!==null&&ans!=='',value:ans,correct:ok,correctAnswer:right,pinned:progress.pinned.includes(id)}});pauseClock();const r={version:2,mode:'exam',submittedAt:Date.now(),testTime:localTimeText(new Date()),elapsedSec:progress.elapsedSec,total:ids.length,correct,perType,items,pinned:progress.pinned.slice(),sessionStartedAt:session.createdAt||progress.createdAt};writeJSON(RESULT_KEY,r);progress.status='submitted';progress.timerRunning=false;progress.startedAt=0;progress.examResults=items;progress.lastResultAt=r.submittedAt;persist();location.href='result.html'}
function navigateFromQid(id){const f=fileForId(id);if(f===THIS_FILE){scrollToQuestion(id)}else{progress.currentFile=f;progress.currentId=id;persist();location.href=`${f}?id=${encodeURIComponent(id)}#q-${id.replace(':','-')}`}}
['prevDesktop','prevMobile'].forEach(id=>$(id)?.addEventListener('click',()=>goPage('prev')));['nextDesktop','nextMobile'].forEach(id=>$(id)?.addEventListener('click',()=>goPage('next')));['saveDesktop','saveMobile'].forEach(id=>$(id)?.addEventListener('click',saveAndReturn));['submitDesktop','submitMobile'].forEach(id=>$(id)?.addEventListener('click',submitExam));$('mobileToggle')?.addEventListener('click',()=>{const d=$('mobileDrawer');const open=d.classList.toggle('hidden')===false;$('mobileToggle').textContent=open?'收起信息栏':'展开信息栏'});
setInterval(()=>{updateTimer();if(progress.timerRunning&&progress.status==='active'){progress.elapsedSec=elapsedNow();progress.startedAt=Date.now();persist()}},1000);
render();
</script></body></html>
