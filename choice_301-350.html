rong{border-color:#F0B7BB;background:var(--bad);color:#8B1E28}.option.is-wrong .option-label{background:#FFC9CD;color:#8B1E28}.option:disabled{opacity:1;cursor:default}.option:disabled:not(.is-correct):not(.is-wrong){color:var(--ink)}.analysis-block{margin-top:16px;padding:15px 16px;background:#F8F7FC;border:1px solid #E8E4F2;border-left:4px solid #A895E8;border-radius:12px;font-size:.92rem}.analysis-block h4{margin:0 0 8px;font-size:.95rem}.analysis-line{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.analysis-line strong{color:#55447F}.image-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.question-image{max-width:min(100%,360px);max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}.fill-inputs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}.fill-field{display:grid;gap:5px;min-width:min(100%,190px);flex:1}.fill-field input{width:100%;border:1px solid #D8D3E5;border-radius:10px;padding:11px 12px;min-height:44px}.fill-field input.is-correct{border-color:#82C99C;background:#EAF8EF}.fill-field input.is-wrong{border-color:#E99BA1;background:#FFF0F0}.fill-submit{margin-top:4px}.sidebar{position:fixed;z-index:20;top:18px;right:18px;bottom:18px;width:318px;padding:15px;background:#fff;border:1px solid #E2DDEA;border-radius:20px;box-shadow:0 8px 32px rgba(35,25,65,.11);display:flex;flex-direction:column;gap:13px;min-height:0}.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 10px;border-bottom:1px solid var(--line)}.timer-label{font-size:.78rem;color:var(--muted);font-weight:700}.timer-value{font-size:1.32rem;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.25}.side-toggle{border:1px solid var(--line);border-radius:10px;background:#FBFAFE;padding:7px 10px;color:var(--primary-dark);font-size:.82rem;font-weight:750}.sidebar-details{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding:0 2px 8px}.side-section-title{font-size:.86rem;font-weight:850;margin:0 0 8px}.sidebar.collapsed .sidebar-details{display:none}.number-button.is-selected{background:#F2EDFF;border-color:#C3B3FF;color:#59458F}.side-question-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.number-button{min-width:0;min-height:34px;padding:3px;border:1px solid #E5E1EC;border-radius:9px;background:white;color:#4E495D;font-weight:700;font-size:.83rem;font-variant-numeric:tabular-nums}.number-button.is-correct{background:var(--good);border-color:#B2DCC1;color:var(--good-ink)}.number-button.is-wrong{background:var(--bad);border-color:#F0B5B9;color:var(--bad-ink)}.number-button.is-current{box-shadow:inset 0 0 0 2px #9F8AE9;background:#F5F0FF}.number-button.is-pinned{border:2px solid #E1AD1F}.pin-list{display:flex;flex-wrap:wrap;gap:7px}.pin-chip{min-width:42px;padding:5px 8px;border:2px solid #E1AD1F;border-radius:9px;background:var(--pin-soft);font-weight:800;color:#6C5110}.side-muted{color:var(--muted);font-size:.84rem}.sidebar-footer{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px;background:#fff}.pager-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-exit{width:100%}.mode-label{font-size:.77rem;color:var(--muted);font-weight:700}.mobile-only{display:none}.storage-warning{margin:8px 0 0}.empty-questions{padding:30px;text-align:center;border:1px dashed #D6D0E3;border-radius:16px;color:var(--muted);background:#fff}.blank-marker{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;color:#6A559D;font-weight:850}.quiz-bottom-spacer{height:25px}

<script>
const PAGE_FILE = "choice_301-350.html";
const PAGE_QUESTIONS = [{"id":"choice-301","type":"choice","number":301,"globalNumber":301,"stem":"黑客端口扫描最基本的方法是 (　　)","images":[],"options":{"A":"TCP ACK 扫描","B":"TCP FIN 扫描","C":"TCP connect () 扫描","D":"FTP 反弹扫描"},"answer":"C","analysis":"TCP connect () 扫描是通过调用系统的 connect 函数来尝试连接目标端口，若连接成功则说明端口开放，这种方式简单直接，是最基本的端口扫描方法。而 TCP ACK 扫描主要用于判断端口是否被过滤；TCP FIN 扫描用于在特定情况下检测端口状态；FTP 反弹扫描则利用 FTP 服务器进行间接扫描，相对复杂，不是最基本的方法","source":"网络安全基础","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-302","type":"choice","number":302,"globalNumber":302,"stem":"下列哪个不属于常见的 XSS 攻击手段和目的 (　　)","images":[],"options":{"A":"盗用 cookie，获取敏感信息","B":"利用可被攻击的域受到其他域信任的特定，以受信任来源身份请求一些平时不允许的操作","C":"利用 iframe 以用户的身份执行一些管理动作","D":"注入 payload 读取服务器上的文件"},"answer":"D","analysis":"XSS 攻击主要是针对用户端的攻击，通过在网页中注入恶意脚本，实现盗用 cookie 获取敏感信息、利用信任关系进行非法操作、利用 iframe 执行管理动作等。而注入 payload 读取服务器上的文件通常属于文件注入漏洞利用，不属于常见的 XSS 攻击范畴","source":"网络安全漏洞原理与防范","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-303","type":"choice","number":303,"globalNumber":303,"stem":"网络攻击的发展趋势是 (　　)","images":[],"options":{"A":"黑客攻击","B":"病毒攻击","C":"木马攻击","D":"黑客技术与网络病毒日益融合"},"answer":"D","analysis":"随着技术发展，黑客技术与网络病毒不再孤立存在，二者相互融合，形成更具威胁的攻击方式。黑客攻击、病毒攻击、木马攻击是传统的攻击形式，并非当前的发展趋势","source":"网络安全发展趋势研究","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-304","type":"choice","number":304,"globalNumber":304,"stem":"不可否认的安全目标对发生的专门行为提供保证，它不包括 (　　)","images":[],"options":{"A":"源发的不可否认","B":"提交的不可否认","C":"传递的不可否认","D":"时间的不可否认"},"answer":"D","analysis":"不可否认性安全目标主要包括源发的不可否认（保证信息发送者不能否认发送过信息）、提交的不可否认（保证信息提交者不能否认提交过信息）、传递的不可否认（保证信息在传递过程中的不可否认性），时间的不可否认不属于不可否认安全目标的范畴","source":"信息安全基础理论","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-305","type":"choice","number":305,"globalNumber":305,"stem":"在网络安全中，中断指攻击者破坏网络系统的资源，使之变成无效的或者无用的，这是对 (　　)","images":[],"options":{"A":"可用性的攻击","B":"保密性的攻击","C":"完整性的攻击","D":"可控性的攻击"},"answer":"A","analysis":"可用性是指网络系统资源可被授权实体访问并按要求使用的特性。中断攻击破坏资源使其不可用，是对可用性的攻击。保密性侧重于信息不被泄露；完整性强调信息不被篡改；可控性指对信息的传播及内容具有控制能力","source":"网络安全概念与攻击类型","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-306","type":"choice","number":306,"globalNumber":306,"stem":"恶意代码是指为达到恶意目的而专门设计的程序或代码。以下恶意代码中，属于脚本病毒的是 (　　)","images":[],"options":{"A":"Worm.Sasser.f","B":"Trojan.Huigezi.a","C":"Harm.formatC.f","D":"Script.Redlof"},"answer":"D","analysis":"脚本病毒通常以脚本语言编写，如 JavaScript、VBScript 等。Script.Redlof 从命名可判断属于脚本病毒。Worm.Sasser.f 是蠕虫病毒；Trojan.Huigezi.a 是木马病毒；Harm.formatC.f 是一种破坏性程序，不属于脚本病毒","source":"恶意代码分析与防范","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-307","type":"choice","number":307,"globalNumber":307,"stem":"下列针对口令攻击的说法不正确的是 (　　)","images":[],"options":{"A":"口令要有规律的定期更换","B":"口令要没有规律的定期更换","C":"口令不建议使用连续或相同的字母或数字","D":"口令不建议使用生日日期"},"answer":"A","analysis":"有规律的定期更换口令容易被攻击者根据规律猜测出口令，应无规律地定期更换。使用连续或相同字母数字、生日日期作为口令安全性较低，容易被破解","source":"口令安全策略与攻击防范","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-308","type":"choice","number":308,"globalNumber":308,"stem":"在口令攻击中，与 SQL 注入攻击原理相同的是 (　　)","images":[],"options":{"A":"口令枚举法","B":"万能密码","C":"撞库","D":"验证码"},"answer":"B","analysis":"SQL 注入攻击是通过在输入字段中注入恶意 SQL 语句来绕过认证或获取数据。万能密码也是利用程序对用户输入验证的漏洞，通过特殊构造的字符串来绕过口令验证，二者原理相似。口令枚举法是逐个尝试可能的口令；撞库是利用已泄露的账号密码在其他系统尝试登录；验证码是用于防止自动化攻击，与 SQL 注入原理不同","source":"网络安全攻击技术与防范","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-309","type":"choice","number":309,"globalNumber":309,"stem":"端口扫描检测工具发现被端口扫描攻击后，正确的处理方法是 (　　)","images":[],"options":{"A":"添加路由器设备","B":"在计算机上安装杀毒软件","C":"部署入侵检测系统","D":"增加值班人员"},"answer":"C","analysis":"部署入侵检测系统可以实时监测网络活动，发现端口扫描等异常行为并及时报警和采取相应措施。添加路由器设备不能直接应对端口扫描攻击；安装杀毒软件主要针对病毒等恶意软件，对端口扫描攻击防护有限；增加值班人员不能有效及时地检测和处理端口扫描攻击","source":"网络安全防护技术与策略","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-310","type":"choice","number":310,"globalNumber":310,"stem":"目前不用于数据存储的存储设备主要有 (　　)","images":[],"options":{"A":"磁盘（包括磁盘阵列）","B":"磁带（包括磁带机和磁带库）","C":"光盘","D":"内存"},"answer":"D","analysis":"内存主要用于计算机运行时临时存储数据和程序指令，断电后数据丢失，不适合长期稳定存储数据。磁盘、磁带、光盘都可用于数据的长期存储","source":"数据存储技术基础","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-311","type":"choice","number":311,"globalNumber":311,"stem":"在存储资源统一管理的前提下，应按照一下哪个顺序实现数据的自动分级存储 (　　)","images":[],"options":{"A":"近线、在线、归档、离线","B":"在线、近线、离线、归档","C":"在线、离线、近线、归档","D":"近线、离线、归档、在线"},"answer":"B","analysis":"在线存储的数据可随时快速访问，用于频繁使用的数据；近线存储性能次之，用于访问频率稍低的数据；离线存储数据访问不便，用于长期保存但很少访问的数据；归档存储用于法规遵从性等长期保存需求的数据。按照数据访问频率和使用场景，合理顺序是在线、近线、离线、归档","source":"数据存储管理与优化","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-312","type":"choice","number":312,"globalNumber":312,"stem":"数据销毁的方法最正确的是 (　　)","images":[],"options":{"A":"覆写法","B":"消磁法","C":"捣碎法 / 剪碎法","D":"覆写法、消磁法、捣碎法 / 剪碎法"},"answer":"D","analysis":"覆写法是用新数据覆盖原有数据；消磁法用于磁性存储介质，破坏其数据记录；捣碎法 / 剪碎法物理破坏存储介质。多种方法结合能更彻底地销毁数据，单一方法可能存在数据残留风险","source":"数据安全与销毁技术","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-313","type":"choice","number":313,"globalNumber":313,"stem":"数据冗余可能导致的问题有 (　　)","images":[],"options":{"A":"数据访问速度变慢","B":"数据更易丢失","C":"浪费存储空间，难以修改","D":"容易造成业务系统不稳定"},"answer":"C","analysis":"数据冗余意味着相同数据多次存储，会浪费存储空间。并且当需要修改数据时，由于存在多个副本，修改操作复杂且容易出现不一致的情况。数据冗余一般不会直接导致数据访问速度变慢、更易丢失或业务系统不稳定","source":"数据库原理与数据管理","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-314","type":"choice","number":314,"globalNumber":314,"stem":"在用安装了 Windows 操作系统的电脑时，一般建议电脑中重要的资料最好不要保存在 C 盘中，下列观点最合理的是 (　　)","images":[],"options":{"A":"这种说法没有根据","B":"文件存储在 C 盘容易被系统文件覆盖","C":"C 盘是默认系统盘，不能存储其他文件","D":"C 盘最容易遭到木马病毒的攻击，而且重装系统时会删除 C 盘上的所有文件，如果备份不及时会造成严重影响"},"answer":"D","analysis":"C 盘作为系统盘，是木马病毒攻击的常见目标。同时，重装系统时通常会格式化 C 盘，导致数据丢失。文件存储在 C 盘不一定会被系统文件覆盖；C 盘可以存储其他文件","source":"Windows 系统安全与数据存储","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-315","type":"choice","number":315,"globalNumber":315,"stem":"为节约存储空间，在经历初次备份后应选择 (　　)","images":[],"options":{"A":"整盘备份","B":"增量备份","C":"自定义备份","D":"文件备份"},"answer":"B","analysis":"增量备份只备份自上次备份（包括完全备份和增量备份）以来发生变化的数据，相比整盘备份，大大减少了存储空间占用。自定义备份和文件备份没有突出节约存储空间的优势","source":"数据备份与恢复技术","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-316","type":"choice","number":316,"globalNumber":316,"stem":"以下关于 Windows 操作系统身份标识与鉴别，说法不正确的是 (　　)","images":[],"options":{"A":"Windows 操作系统远程登录经历了 SMB 鉴别机制、LM 鉴别机制、NTLM 鉴别机制、Kerberos 鉴别体系等阶段","B":"完整的安全标识符 (SID）包括用户和组的安全描述，48 比特的身份特权、修订版本和可变的验证值","C":"本地安全授权机构 (LSA) 生成用户账户在该系统内唯一的安全标识符 (SID)","D":"用户对鉴别信息的操作，如更改密码等都通过一个以 Administrator 权限运行的服务 “Security-AccountsManager” 来实现"},"answer":"D","analysis":"用户对鉴别信息的操作，如更改密码等是通过 “Winlogon” 进程和 “Security-AccountsManager”（SAM）数据库协同完成，并非仅通过以 Administrator 权限运行的 “Security-AccountsManager” 服务来实现。A、B、C 选项描述均正确","source":"Windows 系统安全机制","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-317","type":"choice","number":317,"globalNumber":317,"stem":"用 vi 打开一个文件，用字母 “new” 来代替字母 “old” 的命令是 (　　)","images":[],"options":{"A":":r/old/new","B":":s/old/new","C":":%s/old/new/g","D":":s/old/new/g"},"answer":"C","analysis":"在 vi 编辑器中，:% s/old/new/g 命令表示在整个文件中全局替换，将所有的 “old” 替换为 “new”。:r 命令用于读取文件内容；:s/old/new 只替换每行中首次出现的 “old”；:s/old/new/g 只在当前行进行全局替换","source":"Linux 文本编辑器使用","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-318","type":"choice","number":318,"globalNumber":318,"stem":"恶意代码指没有作用却会带来危险的代码，下列不属于恶意代码的是 (　　)","images":[],"options":{"A":"病毒程序","B":"广告程序","C":"间谍程序","D":"应用程序"},"answer":"D","analysis":"应用程序是为满足用户某种需求而开发的具有特定功能的程序，正常情况下不会带来恶意危害。病毒程序、广告程序（部分恶意广告程序会侵犯用户隐私等）、间谍程序都属于恶意代码范畴","source":"恶意代码识别与防范","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-319","type":"choice","number":319,"globalNumber":319,"stem":"下面关于计算机木马说法错误的是 (　　)","images":[],"options":{"A":"Word 文档也会感染木马","B":"尽量不要点击来历不明的网站链接","C":"杀毒软件对防木马病毒具有重要作用","D":"只要不访问互联网，就能避免感染木马"},"answer":"D","analysis":"即使不访问互联网，计算机仍可能通过移动存储设备等途径感染木马。Word 文档可通过宏病毒等方式感染木马；来历不明的网站链接可能隐藏木马下载链接；杀毒软件能检测和清除木马病毒","source":"计算机木马防范知识","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-320","type":"choice","number":320,"globalNumber":320,"stem":"以下不属于杀毒软件的是 (　　)","images":[],"options":{"A":"McAfee VirusScan","B":"Norton AntiVirus","C":"Kapersky","D":"WannaCry"},"answer":"D","analysis":"McAfee VirusScan、Norton AntiVirus、Kapersky 都是常见的杀毒软件。WannaCry 是一种勒索病毒，会对计算机数据进行加密勒索，并非杀毒软件","source":"杀毒软件识别与使用","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-321","type":"choice","number":321,"globalNumber":321,"stem":"对于学生来说，职业素养培养最大的意义是 (　　)","images":[],"options":{"A":"有利于个人成长","B":"提高就业竞争力","C":"提高学习能力","D":"提高身体素质"},"answer":"B","analysis":"职业素养的提升能让学生在就业市场中更具优势，相比个人成长、学习能力提升等，提高就业竞争力更直接体现其最大意义，所以选 B","source":"职业素养教育基础课程相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-322","type":"choice","number":322,"globalNumber":322,"stem":"字长是 CPU 的主要性能指标之一，它表示 (　　)","images":[],"options":{"A":"CPU 最大的有效数字位数","B":"CPU 最长的十进制整数的位数","C":"CPU 一次能处理二进制数据的位数","D":"CPU 计算结果的有效数字长度"},"answer":"C","analysis":"字长指的就是 CPU 一次能处理二进制数据的位数，用来衡量 CPU 性能，所以 C 正确","source":"计算机组成原理相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-323","type":"choice","number":323,"globalNumber":323,"stem":"操作系统的发展过程是 (　　)","images":[],"options":{"A":"原始操作系统，管理程序，操作系统","B":"原始操作系统，操作系统，管理程序","C":"管理程序，原始操作系统，操作系统","D":"管理程序，操作系统，原始操作系统"},"answer":"C","analysis":"操作系统的发展是从早期简单的管理程序，到出现原始操作系统，再逐步发展为功能完善的现代操作系统，C 选项顺序正确","source":"操作系统概论相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-324","type":"choice","number":324,"globalNumber":324,"stem":"云计算技术中最为关键的支撑技术之一就是 (　　)","images":[],"options":{"A":"物联网技术","B":"大数据技术","C":"虚拟化技术","D":"5G 通信技术"},"answer":"C","analysis":"虚拟化技术能实现资源的灵活分配和高效利用，是云计算的关键支撑技术，所以 C 正确","source":"云计算技术基础相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-325","type":"choice","number":325,"globalNumber":325,"stem":"网络层位于通信子网的 (　　) 层","images":[],"options":{"A":"最高","B":"中间","C":"最低","D":"不属于通信子网"},"answer":"A","analysis":"通信子网包含物理层、数据链路层和网络层，网络层处于最高层，负责将数据从源端传输到目的端，所以 A 正确","source":"计算机网络原理相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-326","type":"choice","number":326,"globalNumber":326,"stem":"单模光纤的传输方向是 (　　)","images":[],"options":{"A":"散射","B":"衍射","C":"沿光纤直径方向","D":"全反射"},"answer":"C","analysis":"单模光纤只允许一束光沿光纤直径方向传播，相比多模光纤，其传输性能更好、距离更远，所以 C 正确","source":"光纤通信技术相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-327","type":"choice","number":327,"globalNumber":327,"stem":"以下哪项不是存放在路由器的随机存取存储器（RAM）中的 (　　)","images":[],"options":{"A":"启动配置文件","B":"运行配置文件","C":"IP 路由表","D":"ARP 缓存"},"answer":"A","analysis":"启动配置文件存储在非易失性存储器（NVRAM）中，运行配置文件、IP 路由表、ARP 缓存等存于 RAM，断电后 RAM 中数据丢失，所以 A 正确","source":"网络设备配置与管理相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-328","type":"choice","number":328,"globalNumber":328,"stem":"当 AP 中配置 SSID 加密类型为 WEP 加密（密码为 12345），MAC 层认证方式为 open - system，而客户端输入的密码为 54321 会出现以下哪种现象 (　　)","images":[],"options":{"A":"客户端可以成功连接 AP，但无法正常通信","B":"客户端可以成功连接 AP，也可以正常通信，但数据报文为明文传输","C":"客户端会提示密码错误，要求重新输入","D":"客户端无法成功连接 AP"},"answer":"A","analysis":"open - system 认证方式下，客户端可先连接 AP，但由于密码错误，加密数据无法正常解密，导致无法正常通信，所以 A 正确","source":"无线网络技术相关 ID","difficulty":"中","file":"choice_301-350.html"},{"id":"choice-329","type":"choice","number":329,"globalNumber":329,"stem":"下列选择中不属于数据库中的故障是 (　　)","images":[],"options":{"A":"计算机电源故障","B":"系统故障","C":"介质故障","D":"计算机病毒"},"answer":"A","analysis":"计算机电源故障是硬件层面的一般性故障，不属于数据库特有的故障类型；系统故障、介质故障、计算机病毒都可能影响数据库正常运行，所以 A 正确","source":"数据库原理相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-330","type":"choice","number":330,"globalNumber":330,"stem":"合伙期限届满，合伙人继续执行合伙事务，其他合伙人没有提出异议的，原合伙合同继续有效，但是合伙期限为 (　　)","images":[],"options":{"A":"定期","B":"永久","C":"60 年","D":"不定期"},"answer":"D","analysis":"根据法律规定，合伙期限届满后合伙人继续执行合伙事务且无异议，合伙合同继续有效但变为不定期，所以 D 正确","source":"商法相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-331","type":"choice","number":331,"globalNumber":331,"stem":"依据本法规定，开展数据处理活动应当依照法律、法规的规定，建立健全 (　　) 管理制度","images":[],"options":{"A":"全流程数据安全","B":"“谁处理谁负责”","C":"风险评估","D":"应急处置"},"answer":"A","analysis":"开展数据处理活动需保障数据全流程的安全性，建立全流程数据安全管理制度是关键，所以 A 正确","source":"数据安全法律法规相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-332","type":"choice","number":332,"globalNumber":332,"stem":"公民、法人和其他组织可以依法使用 (　　) 保护网络与信息安全","images":[],"options":{"A":"核心密码","B":"普通密码","C":"商用密码","D":"民用密码"},"answer":"C","analysis":"核心密码、普通密码用于保护国家秘密信息等特定领域；公民、法人和其他组织可依法使用商用密码保护网络与信息安全，无民用密码说法，所以 C 正确","source":"密码学与信息安全相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-333","type":"choice","number":333,"globalNumber":333,"stem":"能够使主机或路由器报告差错情况和提供有关异常情况的报告是 (　　) 协议的功能","images":[],"options":{"A":"ICMP","B":"TCP","C":"IP","D":"HTTP"},"answer":"A","analysis":"ICMP 协议用于在 IP 网络中传递差错和控制信息，使主机或路由器能报告差错和异常情况，TCP 用于可靠传输，IP 负责寻址和路由，HTTP 用于超文本传输，所以 A 正确","source":"计算机网络协议相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-334","type":"choice","number":334,"globalNumber":334,"stem":"在 TCP/IP 模型中网络接口层规定了 OSI 模型的 (　　)","images":[],"options":{"A":"物理和数据链路层","B":"数据链路和网络层","C":"物理层","D":"表示层"},"answer":"A","analysis":"TCP/IP 模型的网络接口层对应 OSI 模型的物理层和数据链路层，负责处理物理介质上的数据传输，所以 A 正确","source":"计算机网络体系结构相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-335","type":"choice","number":335,"globalNumber":335,"stem":"在以太网中，双绞线使用 (　　) 与其他设备连接起来","images":[],"options":{"A":"AUI 接口","B":"RJ - 11 接口","C":"RJ - 45 接口","D":"BNC 接口"},"answer":"C","analysis":"在以太网中，双绞线通常使用 RJ - 45 接口连接其他设备，RJ - 11 接口常用于电话连接，AUI 接口用于连接粗同轴电缆，BNC 接口用于连接细同轴电缆，所以 C 正确","source":"计算机网络布线相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-336","type":"choice","number":336,"globalNumber":336,"stem":"在以下几种传输媒体中，哪种传输速率最高 (　　)","images":[],"options":{"A":"双绞线","B":"同轴电缆","C":"光纤","D":"通信卫星"},"answer":"C","analysis":"光纤利用光信号传输数据，具有带宽大、传输速率高、抗干扰能力强等优点，相比双绞线、同轴电缆和通信卫星，其传输速率最高，所以 C 正确","source":"通信传输技术相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-337","type":"choice","number":337,"globalNumber":337,"stem":"IPv4 地址中的前三位为 110 表示该地址属于 (　　)","images":[],"options":{"A":"A 类地址","B":"B 类地址","C":"C 类地址","D":"D 类地址"},"answer":"C","analysis":"IPv4 地址分类中，A 类地址前 1 位为 0，B 类地址前 2 位为 10，C 类地址前 3 位为 110，D 类地址前 4 位为 1110，所以 C 正确","source":"网络地址规划与管理相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-338","type":"choice","number":338,"globalNumber":338,"stem":"下面关于 IP 地址规划，说法错误的有 (　　)","images":[],"options":{"A":"IP 地址分配尽量分配连续的 IP 地址空间","B":"相同的业务和功能尽量分配连续的 IP 地址空间","C":"IP 地址的分配必须采用 VLSM 技术","D":"IP 地址规划对于路由器路由没有任何作用"},"answer":"D","analysis":"IP 地址规划能优化路由表，提高路由器转发效率，对路由至关重要；分配时尽量分配连续空间方便管理，VLSM 技术可灵活划分子网，但不是必须采用，所以 D 错误","source":"网络地址规划与管理相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-339","type":"choice","number":339,"globalNumber":339,"stem":"以下路由方式，表项要由网络管理员手动配置的是 (　　)","images":[],"options":{"A":"OSPF 路由","B":"静态路由","C":"直接路由","D":"动态路由"},"answer":"B","analysis":"静态路由的路由表项需要网络管理员手动配置；OSPF 路由、动态路由是路由器自动学习生成路由表项；直接路由是路由器直连网络的路由，无需手动配置，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-340","type":"choice","number":340,"globalNumber":340,"stem":"在缺省的情况下，如果一台路由器在所有接口同时运行了 RIP 和 OSPF 两种动态路由协议，下列说法中正确的是 (　　)","images":[],"options":{"A":"针对到达同一网络的路径，在路由表中只会显示 RIP 发现的那一条，因为 RIP 协议的优先级更高","B":"针对到达同一网络的路径，在路由表中只会显示 OSPF 发现的那一条，因为 OSPF 协议的优先级更高","C":"针对到达同一网络的路径，在路由表中只会显示 RIP 发现的那一条，因为 RIP 协议的花费值 (metric) 更小","D":"针对到达同一网络的路径，在路由表中只会显示 OSPF 发现的那一条，因为 OSPF 协议的花费值 (metric) 更小"},"answer":"B","analysis":"在缺省情况下，OSPF 协议的优先级高于 RIP 协议，所以路由表中会优先显示 OSPF 发现的到达同一网络的路径，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易","file":"choice_301-350.html"},{"id":"choice-341","type":"choice","number":341,"globalNumber":341,"stem":"以下对操作系统的描述，不准确的是 (　　)","images":[],"options":{"A":"方便用户的程序集合","B":"控制和管理计算机系统的硬件和软件资源","C":"是计算机硬件和软件资源的集合","D":"合理地组织计算机工作流程"},"answer":"C","analysis":"操作系统是控制和管理计算机硬件与软件资源的程序，并非硬件和软件资源的集合，A、B、D 选项描述正确","source":"计算机操作系统基础","difficulty":"中等","file":"choice_301-350.html"},{"id":"choice-342","type":"choice","number":342,"globalNumber":342,"stem":"可能给系统造成影响或者破坏的人包括 (　　)","images":[],"options":{"A":"所有网络与信 if(progress.mode==="exam"&&!examSession){showStorageWarning("没有读取到当前考试会话，已禁止自动开始或重新打乱。请返回首页并导入之前导出的进度，或在同源静态站点中重新进入考试。")}
if(progress.mode==="review")lastResult=readKey(STORAGE_KEYS.result);
if(progress.mode==="wrong"){const routes=activeRoutes();if(!routes.length){alert("暂无数据：没有可复习的错题。");location.href="index.html";return}if(!routes.some(r=>r.file===PAGE_FILE)){progress.currentFile=routes[0].file;progress.currentId=routes[0].ids.find(id=>(progress.wrongIds||[]).includes(id))||routes[0].ids[0];saveProgress();location.replace(progress.currentFile);return}}
if(progress.mode!=="wrong"&&progress.mode!=="exam"&&progress.mode!=="review"&&progress.mode!=="practice"){progress.mode="practice";progress.currentFile=PAGE_FILE;progress.currentId=PAGE_QUESTIONS[0]?.id||null;saveProgress()}
if(progress.currentFile!==PAGE_FILE){progress.currentFile=PAGE_FILE;if(!progress.currentId||!questionMap[progress.currentId])progress.currentId=idsForPage()[0]||null;saveProgress()}
const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
document.addEventListener("input",e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||!input.dataset.qid||input.dataset.blank===undefined||isReadOnly())return;const id=input.dataset.qid;const idx=Number(input.dataset.blank);const s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};s.blanks=s.blanks||[];s.blanks[idx]=input.value.slice(0,20);progress.answers[id]=s;});
function selfTestMapping(){const testOrder=["B","C","D","A"];const map={};testOrder.forEach((k,i)=>map[k]=String.fromCharCode(65+i));if(map.A!=="D")throw new Error("选项映射自测失败");const expected=["A","C"].map(k=>map[k]).sort().join(",");if(expected!=="B,D")throw new Error("多选题映射自测失败")}
try{selfTestMapping()}catch(e){showStorageWarning("答案映射检查未通过，已阻止继续作答。请返回首页重新进入考试。");}
