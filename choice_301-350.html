const DEMO=false;
const QUESTIONS=[{"id":"choice-301","type":"choice","globalNumber":301,"stem":"黑客端口扫描最基本的方法是 (　　)","images":[],"options":{"A":"TCP ACK 扫描","B":"TCP FIN 扫描","C":"TCP connect () 扫描","D":"FTP 反弹扫描"},"answer":"C","analysis":"TCP connect () 扫描是通过调用系统的 connect 函数来尝试连接目标端口，若连接成功则说明端口开放，这种方式简单直接，是最基本的端口扫描方法。而 TCP ACK 扫描主要用于判断端口是否被过滤；TCP FIN 扫描用于在特定情况下检测端口状态；FTP 反弹扫描则利用 FTP 服务器进行间接扫描，相对复杂，不是最基本的方法","source":"网络安全基础","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-302","type":"choice","globalNumber":302,"stem":"下列哪个不属于常见的 XSS 攻击手段和目的 (　　)","images":[],"options":{"A":"盗用 cookie，获取敏感信息","B":"利用可被攻击的域受到其他域信任的特定，以受信任来源身份请求一些平时不允许的操作","C":"利用 iframe 以用户的身份执行一些管理动作","D":"注入 payload 读取服务器上的文件"},"answer":"D","analysis":"XSS 攻击主要是针对用户端的攻击，通过在网页中注入恶意脚本，实现盗用 cookie 获取敏感信息、利用信任关系进行非法操作、利用 iframe 执行管理动作等。而注入 payload 读取服务器上的文件通常属于文件注入漏洞利用，不属于常见的 XSS 攻击范畴","source":"网络安全漏洞原理与防范","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-303","type":"choice","globalNumber":303,"stem":"网络攻击的发展趋势是 (　　)","images":[],"options":{"A":"黑客攻击","B":"病毒攻击","C":"木马攻击","D":"黑客技术与网络病毒日益融合"},"answer":"D","analysis":"随着技术发展，黑客技术与网络病毒不再孤立存在，二者相互融合，形成更具威胁的攻击方式。黑客攻击、病毒攻击、木马攻击是传统的攻击形式，并非当前的发展趋势","source":"网络安全发展趋势研究","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-304","type":"choice","globalNumber":304,"stem":"不可否认的安全目标对发生的专门行为提供保证，它不包括 (　　)","images":[],"options":{"A":"源发的不可否认","B":"提交的不可否认","C":"传递的不可否认","D":"时间的不可否认"},"answer":"D","analysis":"不可否认性安全目标主要包括源发的不可否认（保证信息发送者不能否认发送过信息）、提交的不可否认（保证信息提交者不能否认提交过信息）、传递的不可否认（保证信息在传递过程中的不可否认性），时间的不可否认不属于不可否认安全目标的范畴","source":"信息安全基础理论","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-305","type":"choice","globalNumber":305,"stem":"在网络安全中，中断指攻击者破坏网络系统的资源，使之变成无效的或者无用的，这是对 (　　)","images":[],"options":{"A":"可用性的攻击","B":"保密性的攻击","C":"完整性的攻击","D":"可控性的攻击"},"answer":"A","analysis":"可用性是指网络系统资源可被授权实体访问并按要求使用的特性。中断攻击破坏资源使其不可用，是对可用性的攻击。保密性侧重于信息不被泄露；完整性强调信息不被篡改；可控性指对信息的传播及内容具有控制能力","source":"网络安全概念与攻击类型","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-306","type":"choice","globalNumber":306,"stem":"恶意代码是指为达到恶意目的而专门设计的程序或代码。以下恶意代码中，属于脚本病毒的是 (　　)","images":[],"options":{"A":"Worm.Sasser.f","B":"Trojan.Huigezi.a","C":"Harm.formatC.f","D":"Script.Redlof"},"answer":"D","analysis":"脚本病毒通常以脚本语言编写，如 JavaScript、VBScript 等。Script.Redlof 从命名可判断属于脚本病毒。Worm.Sasser.f 是蠕虫病毒；Trojan.Huigezi.a 是木马病毒；Harm.formatC.f 是一种破坏性程序，不属于脚本病毒","source":"恶意代码分析与防范","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-307","type":"choice","globalNumber":307,"stem":"下列针对口令攻击的说法不正确的是 (　　)","images":[],"options":{"A":"口令要有规律的定期更换","B":"口令要没有规律的定期更换","C":"口令不建议使用连续或相同的字母或数字","D":"口令不建议使用生日日期"},"answer":"A","analysis":"有规律的定期更换口令容易被攻击者根据规律猜测出口令，应无规律地定期更换。使用连续或相同字母数字、生日日期作为口令安全性较低，容易被破解","source":"口令安全策略与攻击防范","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-308","type":"choice","globalNumber":308,"stem":"在口令攻击中，与 SQL 注入攻击原理相同的是 (　　)","images":[],"options":{"A":"口令枚举法","B":"万能密码","C":"撞库","D":"验证码"},"answer":"B","analysis":"SQL 注入攻击是通过在输入字段中注入恶意 SQL 语句来绕过认证或获取数据。万能密码也是利用程序对用户输入验证的漏洞，通过特殊构造的字符串来绕过口令验证，二者原理相似。口令枚举法是逐个尝试可能的口令；撞库是利用已泄露的账号密码在其他系统尝试登录；验证码是用于防止自动化攻击，与 SQL 注入原理不同","source":"网络安全攻击技术与防范","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-309","type":"choice","globalNumber":309,"stem":"端口扫描检测工具发现被端口扫描攻击后，正确的处理方法是 (　　)","images":[],"options":{"A":"添加路由器设备","B":"在计算机上安装杀毒软件","C":"部署入侵检测系统","D":"增加值班人员"},"answer":"C","analysis":"部署入侵检测系统可以实时监测网络活动，发现端口扫描等异常行为并及时报警和采取相应措施。添加路由器设备不能直接应对端口扫描攻击；安装杀毒软件主要针对病毒等恶意软件，对端口扫描攻击防护有限；增加值班人员不能有效及时地检测和处理端口扫描攻击","source":"网络安全防护技术与策略","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-310","type":"choice","globalNumber":310,"stem":"目前不用于数据存储的存储设备主要有 (　　)","images":[],"options":{"A":"磁盘（包括磁盘阵列）","B":"磁带（包括磁带机和磁带库）","C":"光盘","D":"内存"},"answer":"D","analysis":"内存主要用于计算机运行时临时存储数据和程序指令，断电后数据丢失，不适合长期稳定存储数据。磁盘、磁带、光盘都可用于数据的长期存储","source":"数据存储技术基础","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-311","type":"choice","globalNumber":311,"stem":"在存储资源统一管理的前提下，应按照一下哪个顺序实现数据的自动分级存储 (　　)","images":[],"options":{"A":"近线、在线、归档、离线","B":"在线、近线、离线、归档","C":"在线、离线、近线、归档","D":"近线、离线、归档、在线"},"answer":"B","analysis":"在线存储的数据可随时快速访问，用于频繁使用的数据；近线存储性能次之，用于访问频率稍低的数据；离线存储数据访问不便，用于长期保存但很少访问的数据；归档存储用于法规遵从性等长期保存需求的数据。按照数据访问频率和使用场景，合理顺序是在线、近线、离线、归档","source":"数据存储管理与优化","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-312","type":"choice","globalNumber":312,"stem":"数据销毁的方法最正确的是 (　　)","images":[],"options":{"A":"覆写法","B":"消磁法","C":"捣碎法 / 剪碎法","D":"覆写法、消磁法、捣碎法 / 剪碎法"},"answer":"D","analysis":"覆写法是用新数据覆盖原有数据；消磁法用于磁性存储介质，破坏其数据记录；捣碎法 / 剪碎法物理破坏存储介质。多种方法结合能更彻底地销毁数据，单一方法可能存在数据残留风险","source":"数据安全与销毁技术","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-313","type":"choice","globalNumber":313,"stem":"数据冗余可能导致的问题有 (　　)","images":[],"options":{"A":"数据访问速度变慢","B":"数据更易丢失","C":"浪费存储空间，难以修改","D":"容易造成业务系统不稳定"},"answer":"C","analysis":"数据冗余意味着相同数据多次存储，会浪费存储空间。并且当需要修改数据时，由于存在多个副本，修改操作复杂且容易出现不一致的情况。数据冗余一般不会直接导致数据访问速度变慢、更易丢失或业务系统不稳定","source":"数据库原理与数据管理","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-314","type":"choice","globalNumber":314,"stem":"在用安装了 Windows 操作系统的电脑时，一般建议电脑中重要的资料最好不要保存在 C 盘中，下列观点最合理的是 (　　)","images":[],"options":{"A":"这种说法没有根据","B":"文件存储在 C 盘容易被系统文件覆盖","C":"C 盘是默认系统盘，不能存储其他文件","D":"C 盘最容易遭到木马病毒的攻击，而且重装系统时会删除 C 盘上的所有文件，如果备份不及时会造成严重影响"},"answer":"D","analysis":"C 盘作为系统盘，是木马病毒攻击的常见目标。同时，重装系统时通常会格式化 C 盘，导致数据丢失。文件存储在 C 盘不一定会被系统文件覆盖；C 盘可以存储其他文件","source":"Windows 系统安全与数据存储","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-315","type":"choice","globalNumber":315,"stem":"为节约存储空间，在经历初次备份后应选择 (　　)","images":[],"options":{"A":"整盘备份","B":"增量备份","C":"自定义备份","D":"文件备份"},"answer":"B","analysis":"增量备份只备份自上次备份（包括完全备份和增量备份）以来发生变化的数据，相比整盘备份，大大减少了存储空间占用。自定义备份和文件备份没有突出节约存储空间的优势","source":"数据备份与恢复技术","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-316","type":"choice","globalNumber":316,"stem":"以下关于 Windows 操作系统身份标识与鉴别，说法不正确的是 (　　)","images":[],"options":{"A":"Windows 操作系统远程登录经历了 SMB 鉴别机制、LM 鉴别机制、NTLM 鉴别机制、Kerberos 鉴别体系等阶段","B":"完整的安全标识符 (SID）包括用户和组的安全描述，48 比特的身份特权、修订版本和可变的验证值","C":"本地安全授权机构 (LSA) 生成用户账户在该系统内唯一的安全标识符 (SID)","D":"用户对鉴别信息的操作，如更改密码等都通过一个以 Administrator 权限运行的服务 “Security-AccountsManager” 来实现"},"answer":"D","analysis":"用户对鉴别信息的操作，如更改密码等是通过 “Winlogon” 进程和 “Security-AccountsManager”（SAM）数据库协同完成，并非仅通过以 Administrator 权限运行的 “Security-AccountsManager” 服务来实现。A、B、C 选项描述均正确","source":"Windows 系统安全机制","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-317","type":"choice","globalNumber":317,"stem":"用 vi 打开一个文件，用字母 “new” 来代替字母 “old” 的命令是 (　　)","images":[],"options":{"A":":r/old/new","B":":s/old/new","C":":%s/old/new/g","D":":s/old/new/g"},"answer":"C","analysis":"在 vi 编辑器中，:% s/old/new/g 命令表示在整个文件中全局替换，将所有的 “old” 替换为 “new”。:r 命令用于读取文件内容；:s/old/new 只替换每行中首次出现的 “old”；:s/old/new/g 只在当前行进行全局替换","source":"Linux 文本编辑器使用","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-318","type":"choice","globalNumber":318,"stem":"恶意代码指没有作用却会带来危险的代码，下列不属于恶意代码的是 (　　)","images":[],"options":{"A":"病毒程序","B":"广告程序","C":"间谍程序","D":"应用程序"},"answer":"D","analysis":"应用程序是为满足用户某种需求而开发的具有特定功能的程序，正常情况下不会带来恶意危害。病毒程序、广告程序（部分恶意广告程序会侵犯用户隐私等）、间谍程序都属于恶意代码范畴","source":"恶意代码识别与防范","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-319","type":"choice","globalNumber":319,"stem":"下面关于计算机木马说法错误的是 (　　)","images":[],"options":{"A":"Word 文档也会感染木马","B":"尽量不要点击来历不明的网站链接","C":"杀毒软件对防木马病毒具有重要作用","D":"只要不访问互联网，就能避免感染木马"},"answer":"D","analysis":"即使不访问互联网，计算机仍可能通过移动存储设备等途径感染木马。Word 文档可通过宏病毒等方式感染木马；来历不明的网站链接可能隐藏木马下载链接；杀毒软件能检测和清除木马病毒","source":"计算机木马防范知识","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-320","type":"choice","globalNumber":320,"stem":"以下不属于杀毒软件的是 (　　)","images":[],"options":{"A":"McAfee VirusScan","B":"Norton AntiVirus","C":"Kapersky","D":"WannaCry"},"answer":"D","analysis":"McAfee VirusScan、Norton AntiVirus、Kapersky 都是常见的杀毒软件。WannaCry 是一种勒索病毒，会对计算机数据进行加密勒索，并非杀毒软件","source":"杀毒软件识别与使用","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-321","type":"choice","globalNumber":321,"stem":"对于学生来说，职业素养培养最大的意义是 (　　)","images":[],"options":{"A":"有利于个人成长","B":"提高就业竞争力","C":"提高学习能力","D":"提高身体素质"},"answer":"B","analysis":"职业素养的提升能让学生在就业市场中更具优势，相比个人成长、学习能力提升等，提高就业竞争力更直接体现其最大意义，所以选 B","source":"职业素养教育基础课程相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-322","type":"choice","globalNumber":322,"stem":"字长是 CPU 的主要性能指标之一，它表示 (　　)","images":[],"options":{"A":"CPU 最大的有效数字位数","B":"CPU 最长的十进制整数的位数","C":"CPU 一次能处理二进制数据的位数","D":"CPU 计算结果的有效数字长度"},"answer":"C","analysis":"字长指的就是 CPU 一次能处理二进制数据的位数，用来衡量 CPU 性能，所以 C 正确","source":"计算机组成原理相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-323","type":"choice","globalNumber":323,"stem":"操作系统的发展过程是 (　　)","images":[],"options":{"A":"原始操作系统，管理程序，操作系统","B":"原始操作系统，操作系统，管理程序","C":"管理程序，原始操作系统，操作系统","D":"管理程序，操作系统，原始操作系统"},"answer":"C","analysis":"操作系统的发展是从早期简单的管理程序，到出现原始操作系统，再逐步发展为功能完善的现代操作系统，C 选项顺序正确","source":"操作系统概论相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-324","type":"choice","globalNumber":324,"stem":"云计算技术中最为关键的支撑技术之一就是 (　　)","images":[],"options":{"A":"物联网技术","B":"大数据技术","C":"虚拟化技术","D":"5G 通信技术"},"answer":"C","analysis":"虚拟化技术能实现资源的灵活分配和高效利用，是云计算的关键支撑技术，所以 C 正确","source":"云计算技术基础相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-325","type":"choice","globalNumber":325,"stem":"网络层位于通信子网的 (　　) 层","images":[],"options":{"A":"最高","B":"中间","C":"最低","D":"不属于通信子网"},"answer":"A","analysis":"通信子网包含物理层、数据链路层和网络层，网络层处于最高层，负责将数据从源端传输到目的端，所以 A 正确","source":"计算机网络原理相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-326","type":"choice","globalNumber":326,"stem":"单模光纤的传输方向是 (　　)","images":[],"options":{"A":"散射","B":"衍射","C":"沿光纤直径方向","D":"全反射"},"answer":"C","analysis":"单模光纤只允许一束光沿光纤直径方向传播，相比多模光纤，其传输性能更好、距离更远，所以 C 正确","source":"光纤通信技术相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-327","type":"choice","globalNumber":327,"stem":"以下哪项不是存放在路由器的随机存取存储器（RAM）中的 (　　)","images":[],"options":{"A":"启动配置文件","B":"运行配置文件","C":"IP 路由表","D":"ARP 缓存"},"answer":"A","analysis":"启动配置文件存储在非易失性存储器（NVRAM）中，运行配置文件、IP 路由表、ARP 缓存等存于 RAM，断电后 RAM 中数据丢失，所以 A 正确","source":"网络设备配置与管理相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-328","type":"choice","globalNumber":328,"stem":"当 AP 中配置 SSID 加密类型为 WEP 加密（密码为 12345），MAC 层认证方式为 open - system，而客户端输入的密码为 54321 会出现以下哪种现象 (　　)","images":[],"options":{"A":"客户端可以成功连接 AP，但无法正常通信","B":"客户端可以成功连接 AP，也可以正常通信，但数据报文为明文传输","C":"客户端会提示密码错误，要求重新输入","D":"客户端无法成功连接 AP"},"answer":"A","analysis":"open - system 认证方式下，客户端可先连接 AP，但由于密码错误，加密数据无法正常解密，导致无法正常通信，所以 A 正确","source":"无线网络技术相关 ID","difficulty":"中","page":"choice_301-350.html"},{"id":"choice-329","type":"choice","globalNumber":329,"stem":"下列选择中不属于数据库中的故障是 (　　)","images":[],"options":{"A":"计算机电源故障","B":"系统故障","C":"介质故障","D":"计算机病毒"},"answer":"A","analysis":"计算机电源故障是硬件层面的一般性故障，不属于数据库特有的故障类型；系统故障、介质故障、计算机病毒都可能影响数据库正常运行，所以 A 正确","source":"数据库原理相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-330","type":"choice","globalNumber":330,"stem":"合伙期限届满，合伙人继续执行合伙事务，其他合伙人没有提出异议的，原合伙合同继续有效，但是合伙期限为 (　　)","images":[],"options":{"A":"定期","B":"永久","C":"60 年","D":"不定期"},"answer":"D","analysis":"根据法律规定，合伙期限届满后合伙人继续执行合伙事务且无异议，合伙合同继续有效但变为不定期，所以 D 正确","source":"商法相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-331","type":"choice","globalNumber":331,"stem":"依据本法规定，开展数据处理活动应当依照法律、法规的规定，建立健全 (　　) 管理制度","images":[],"options":{"A":"全流程数据安全","B":"“谁处理谁负责”","C":"风险评估","D":"应急处置"},"answer":"A","analysis":"开展数据处理活动需保障数据全流程的安全性，建立全流程数据安全管理制度是关键，所以 A 正确","source":"数据安全法律法规相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-332","type":"choice","globalNumber":332,"stem":"公民、法人和其他组织可以依法使用 (　　) 保护网络与信息安全","images":[],"options":{"A":"核心密码","B":"普通密码","C":"商用密码","D":"民用密码"},"answer":"C","analysis":"核心密码、普通密码用于保护国家秘密信息等特定领域；公民、法人和其他组织可依法使用商用密码保护网络与信息安全，无民用密码说法，所以 C 正确","source":"密码学与信息安全相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-333","type":"choice","globalNumber":333,"stem":"能够使主机或路由器报告差错情况和提供有关异常情况的报告是 (　　) 协议的功能","images":[],"options":{"A":"ICMP","B":"TCP","C":"IP","D":"HTTP"},"answer":"A","analysis":"ICMP 协议用于在 IP 网络中传递差错和控制信息，使主机或路由器能报告差错和异常情况，TCP 用于可靠传输，IP 负责寻址和路由，HTTP 用于超文本传输，所以 A 正确","source":"计算机网络协议相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-334","type":"choice","globalNumber":334,"stem":"在 TCP/IP 模型中网络接口层规定了 OSI 模型的 (　　)","images":[],"options":{"A":"物理和数据链路层","B":"数据链路和网络层","C":"物理层","D":"表示层"},"answer":"A","analysis":"TCP/IP 模型的网络接口层对应 OSI 模型的物理层和数据链路层，负责处理物理介质上的数据传输，所以 A 正确","source":"计算机网络体系结构相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-335","type":"choice","globalNumber":335,"stem":"在以太网中，双绞线使用 (　　) 与其他设备连接起来","images":[],"options":{"A":"AUI 接口","B":"RJ - 11 接口","C":"RJ - 45 接口","D":"BNC 接口"},"answer":"C","analysis":"在以太网中，双绞线通常使用 RJ - 45 接口连接其他设备，RJ - 11 接口常用于电话连接，AUI 接口用于连接粗同轴电缆，BNC 接口用于连接细同轴电缆，所以 C 正确","source":"计算机网络布线相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-336","type":"choice","globalNumber":336,"stem":"在以下几种传输媒体中，哪种传输速率最高 (　　)","images":[],"options":{"A":"双绞线","B":"同轴电缆","C":"光纤","D":"通信卫星"},"answer":"C","analysis":"光纤利用光信号传输数据，具有带宽大、传输速率高、抗干扰能力强等优点，相比双绞线、同轴电缆和通信卫星，其传输速率最高，所以 C 正确","source":"通信传输技术相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-337","type":"choice","globalNumber":337,"stem":"IPv4 地址中的前三位为 110 表示该地址属于 (　　)","images":[],"options":{"A":"A 类地址","B":"B 类地址","C":"C 类地址","D":"D 类地址"},"answer":"C","analysis":"IPv4 地址分类中，A 类地址前 1 位为 0，B 类地址前 2 位为 10，C 类地址前 3 位为 110，D 类地址前 4 位为 1110，所以 C 正确","source":"网络地址规划与管理相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-338","type":"choice","globalNumber":338,"stem":"下面关于 IP 地址规划，说法错误的有 (　　)","images":[],"options":{"A":"IP 地址分配尽量分配连续的 IP 地址空间","B":"相同的业务和功能尽量分配连续的 IP 地址空间","C":"IP 地址的分配必须采用 VLSM 技术","D":"IP 地址规划对于路由器路由没有任何作用"},"answer":"D","analysis":"IP 地址规划能优化路由表，提高路由器转发效率，对路由至关重要；分配时尽量分配连续空间方便管理，VLSM 技术可灵活划分子网，但不是必须采用，所以 D 错误","source":"网络地址规划与管理相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-339","type":"choice","globalNumber":339,"stem":"以下路由方式，表项要由网络管理员手动配置的是 (　　)","images":[],"options":{"A":"OSPF 路由","B":"静态路由","C":"直接路由","D":"动态路由"},"answer":"B","analysis":"静态路由的路由表项需要网络管理员手动配置；OSPF 路由、动态路由是路由器自动学习生成路由表项；直接路由是路由器直连网络的路由，无需手动配置，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-340","type":"choice","globalNumber":340,"stem":"在缺省的情况下，如果一台路由器在所有接口同时运行了 RIP 和 OSPF 两种动态路由协议，下列说法中正确的是 (　　)","images":[],"options":{"A":"针对到达同一网络的路径，在路由表中只会显示 RIP 发现的那一条，因为 RIP 协议的优先级更高","B":"针对到达同一网络的路径，在路由表中只会显示 OSPF 发现的那一条，因为 OSPF 协议的优先级更高","C":"针对到达同一网络的路径，在路由表中只会显示 RIP 发现的那一条，因为 RIP 协议的花费值 (metric) 更小","D":"针对到达同一网络的路径，在路由表中只会显示 OSPF 发现的那一条，因为 OSPF 协议的花费值 (metric) 更小"},"answer":"B","analysis":"在缺省情况下，OSPF 协议的优先级高于 RIP 协议，所以路由表中会优先显示 OSPF 发现的到达同一网络的路径，所以 B 正确","source":"路由与交换技术相关 ID","difficulty":"易","page":"choice_301-350.html"},{"id":"choice-341","type":"choice","globalNumber":341,"stem":"以下对操作系统的描述，不准确的是 (　　)","images":[],"options":{"A":"方便用户的程序集合","B":"控制和管理计算机系统的硬件和软件资源","C":"是计算机硬件和软件资源的集合","D":"合理地组织计算机工作流程"},"answer":"C","analysis":"操作系统是控制和管理计算机硬件与软件资源的程序，并非硬件和软件资源的集合，A、B、D 选项描述正确","source":"计算机操作系统基础","difficulty":"中等","page":"choice_301-350.html"},{"id":"choice-342","type":"choice","globalNumber":342,"stem":"可能给系统造成影响或者破坏的人包括 (　　)","images":[],"options":{"A":"所有网络与信息系统使用者","B":"只有黑客","C":"只有骇客","D":"只有恶意程序"},"answer":"A","analysis":"所有网络与信息系统使用者都可能因误操作、恶意行为等给系统造成影响或破坏，黑客、骇客、恶意程序只是其中一部分","source":"网络安全基础","difficulty":"简单","page":"choice_301-350.html"},{"id":"choice-343","type":"choice","globalNumber":343,"stem":"通过存取控制机制来防止由 (　　) 所造成的文件不安全性","images":[],"options":{"A":"人为因素","B":"自然因素","C":"系统因素","D":"硬件因素"},"answer":"A","analysis":"存取控制机制主要针对人为的非法访问等行为，自然因素、系统因素、硬件因素并非存取控制机制能防范的","source":"信息安全技术","difficulty":"中等","page":"choice_301-350.html"},{"id":"choice-344","type":"choice","globalNumber":344,"stem":"防病毒产品可以实施在网络中的 (　　) 三个层次中","images":[],"options":{"A":"网关、服务器、桌面","B":"互联网、内部网、桌面","C":"防火墙、代理服务器、邮件处理服务器","D":"网关、桌面、无线设备"},"answer":"A","analysis":"网关、服务器、桌面是网络中常见的可部署防病毒产品的层次，其他选项不符合常规部署层次","source":"网络安全防护技术","difficulty":"中等","page":"choice_301-350.html"},{"id":"choice-345","type":"choice","globalNumber":345,"stem":"关于非对称密钥加密算法下列说法错误的是 (　　)","images":[],"options":{"A":"多数算法都是基于某个数学难题的","B":"即可实现加密，也可实现数字签名","C":"收发双方持有不同的密钥","D":"加密效率优于对称密钥加密算法"},"answer":"D","analysis":"非对称密钥加密算法加密和解密使用不同密钥，基于数学难题，可用于加密和数字签名，但加密效率低于对称密钥加密算法","source":"密码学基础","difficulty":"中等","page":"choice_301-350.html"},{"id":"choice-346","type":"choice","globalNumber":346,"stem":"部署大中型 IPSec VPN 时，从安全性和维护成本考虑，建议采取 (　　) 技术手段提供设备间的身份验证","images":[],"options":{"A":"预共享密钥","B":"数字证书","C":"路由协议验证","D":"802.1x"},"answer":"B","analysis":"数字证书安全性高，适合大中型网络；预共享密钥安全性较弱；路由协议验证、802.1x 不用于 IPSec VPN 设备间身份验证","source":"VPN 技术与应用","difficulty":"中等","page":"choice_301-350.html"},{"id":"choice-347","type":"choice","globalNumber":347,"stem":"Web 的工作模式是 (　　)","images":[],"options":{"A":"客户端 / 服务器端","B":"浏览器 / 服务器端","C":"浏览器 / 浏览器","D":"浏览器 / 客户端"},"answer":"B","analysis":"Web 工作模式是浏览器向服务器请求资源，服务器响应，即浏览器 / 服务器端模式","source":"Web 开发基础","difficulty":"简单","page":"choice_301-350.html"},{"id":"choice-348","type":"choice","globalNumber":348,"stem":"以下属于 HTML 文件的有 (　　)","images":[],"options":{"A":"hello.htm","B":"hello.xml","C":"hello.aspx","D":"hello.jsp"},"answer":"A","analysis":".htm 是 HTML 文件的常见扩展名，.xml 是可扩展标记语言文件，.aspx 是ASP.NET文件，.jsp 是 Java Server Pages 文件","source":"HTML 基础","difficulty":"简单","page":"choice_301-350.html"},{"id":"choice-349","type":"choice","globalNumber":349,"stem":"以下文件中，不属于 vsftpd 的配置文件的是 (　　)","images":[],"options":{"A":"/etc/vsftpd/vsftp.conf","B":"/etc/vsftpd/vsftpd.conf","C":"/etc/vsftpd/ftpusers","D":"/etc/vsftpd/user_list"},"answer":"A","analysis":"vsftpd 的配置文件有 /etc/vsftpd/vsftpd.conf、/etc/vsftpd/ftpusers、/etc/vsftpd/user_list，A 选项文件名错误","source":"Linux 服务器配置","difficulty":"中等","page":"choice_301-350.html"},{"id":"choice-350","type":"choice","globalNumber":350,"stem":"某大型网络上管理 20 台服务器和近 1000 台客户机。其中一些 Windows Server 2012 R2 服务器正在使用手动指定的 IP 地址。现在希望这些服务器能从 DHCP 服务器获取其 IP 设置，但是不能改变它们已有的 IP 地址。那么，(　　) 方法能够完成此要求","images":[],"options":{"A":"为所有服务器定义更长的租用期","B":"为这些服务器创建独立的作用域","C":"为这些服务器添加客户保留","D":"从 DHCP 作用域中排除这些 IP 地址"},"answer":"C","analysis":"添加客户保留可让特定服务器使用固定 IP 从 DHCP 获取设置，A、B、D 选项无法满足需求","source":"DHCP 技术应用","difficulty":"中等","page":"choice_301-350.html"}];
const BANK_META=[{"id":"choice-001","type":"choice","globalNumber":1,"page":"choice_1-50.html","answer":"A","analysis":"提高劳动生产力的关键因素有很多，如技术创新、科学管理等，加强职业道德建设并非提高劳动生产力的关键，B、C、D 选项对加强职业道德建设意义的描述均正确","source":"职业道德与计算机基础综合课程","difficulty":"中等"},{"id":"choice-002","type":"choice","globalNumber":2,"page":"choice_1-50.html","answer":"B","analysis":"尽职尽责要求从业者对工作认真负责、全身心投入，是高尚道德情操在职业活动中的重要体现。忠于职守强调坚守岗位；廉洁奉公侧重于廉洁自律；恪守信用主要关乎诚信，相比之下 B 更符合题意","source":"职业道德与计算机基础综合课程","difficulty":"中等"},{"id":"choice-003","type":"choice","globalNumber":3,"page":"choice_1-50.html","answer":"D","analysis":"规范性和专业性体现在从业人员需遵循职业规范和特定职业内容调整行为。相对稳定性和连续性侧重于职业特点的传承；操作性和准强度性强调操作和约束程度；普适性和广泛性指适用范围，均不符合题意","source":"职业道德与计算机基础综合课程","difficulty":"中等"},{"id":"choice-004","type":"choice","globalNumber":4,"page":"choice_1-50.html","answer":"C","analysis":"诚实侧重于真实、不虚假，守信侧重于遵守承诺，二者含义有区别但紧密相关，A、B、D 选项表述正确","source":"职业道德与计算机基础综合课程","difficulty":"中等"},{"id":"choice-005","type":"choice","globalNumber":5,"page":"choice_1-50.html","answer":"C","analysis":"职业纪律有明确的规定，用于约束从业者行为，不具有模糊性；职业纪律具有一定强制性，但并非法律强制性，B 选项错误","source":"职业道德与计算机基础综合课程","difficulty":"中等"},{"id":"choice-006","type":"choice","globalNumber":6,"page":"choice_1-50.html","answer":"C","analysis":"字长指 CPU 一次能处理二进制数据的位数，这是其基本概念，A、B、D 选项对字长的理解错误","source":"计算机硬件基础课程","difficulty":"中等"},{"id":"choice-007","type":"choice","globalNumber":7,"page":"choice_1-50.html","answer":"C","analysis":"操作系统是系统软件，不是应用软件；其提供的人机交互接口其他软件可以使用；操作系统中既有程序也有数据，A、B、D 选项错误","source":"操作系统基础课程","difficulty":"中等"},{"id":"choice-008","type":"choice","globalNumber":8,"page":"choice_1-50.html","answer":"C","analysis":"虚拟化技术可实现资源的虚拟划分和灵活调配，是云计算的关键支撑技术。物联网技术侧重于物物相连；大数据技术用于数据处理；5G 通信技术提供高速通信，均不是云计算最关键的支撑技术","source":"云计算技术基础课程","difficulty":"中等"},{"id":"choice-009","type":"choice","globalNumber":9,"page":"choice_1-50.html","answer":"D","analysis":"OSI/RM 模型从低到高依次为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层，物理层处于最低层","source":"计算机网络基础课程","difficulty":"中等"},{"id":"choice-010","type":"choice","globalNumber":10,"page":"choice_1-50.html","answer":"A","analysis":"TCP/IP 协议体系结构的 IP 层负责网络层功能，与 OSI 模型的网络层相对应，B、C、D 选项错误","source":"计算机网络协议课程","difficulty":"中等"},{"id":"choice-011","type":"choice","globalNumber":11,"page":"choice_1-50.html","answer":"A","analysis":"通信子网包括物理层、数据链路层和网络层，网络层在通信子网中处于最高层，B、C、D 选项错误","source":"计算机网络基础课程","difficulty":"中等"},{"id":"choice-012","type":"choice","globalNumber":12,"page":"choice_1-50.html","answer":"C","analysis":"目前最常用的超五类非屏蔽双绞线由 8 根线芯组成，这是常见网络布线知识，A、B、D 选项错误","source":"计算机网络布线课程","difficulty":"简单"},{"id":"choice-013","type":"choice","globalNumber":13,"page":"choice_1-50.html","answer":"D","analysis":"netstat -r 命令用于显示路由表信息，netstat -a 用于显示所有连接和侦听端口；netstat -n 以数字形式显示地址和端口号；netstat -e 用于显示以太网统计信息，A、B、C 选项错误","source":"计算机网络管理课程","difficulty":"中等"},{"id":"choice-014","type":"choice","globalNumber":14,"page":"choice_1-50.html","answer":"A","analysis":"计算机电源故障属于硬件故障，并非数据库特有的故障类型。系统故障、介质故障、计算机病毒都可能导致数据库出现问题，B、C、D 选项属于数据库故障","source":"数据库原理与应用课程","difficulty":"中等"},{"id":"choice-015","type":"choice","globalNumber":15,"page":"choice_1-50.html","answer":"B","analysis":"合同解除是针对有效合同而言，使其提前终止法律效力。无效合同自始无效，无需解除；可撤销合同在撤销前有效，撤销后自始无效；效力待定合同需经追认等才能确定效力，A、C、D 选项错误","source":"合同法基础课程","difficulty":"中等"},{"id":"choice-016","type":"choice","globalNumber":16,"page":"choice_1-50.html","answer":"B","analysis":"HTTP 是超文本传输协议，用于 WWW 客户与 WWW 服务器之间传输信息。HTML 是超文本标记语言，用于描述网页结构；SMTP 用于邮件发送；IMAP 用于邮件接收，A、C、D 选项错误","source":"计算机网络应用课程","difficulty":"中等"},{"id":"choice-017","type":"choice","globalNumber":17,"page":"choice_1-50.html","answer":"A","analysis":"TCP/IP 模型的网络接口层对应 OSI 模型的物理层和数据链路层，负责处理物理介质上的信号传输和数据帧的封装、解封装，B、C、D 选项错误","source":"计算机网络协议课程","difficulty":"中等"},{"id":"choice-018","type":"choice","globalNumber":18,"page":"choice_1-50.html","answer":"C","analysis":"光纤利用光信号传输数据，具有带宽大、传输速率高、抗干扰能力强等优点，相比双绞线、同轴电缆和通信卫星，传输速率最高，A、B、D 选项错误","source":"计算机网络传输介质课程","difficulty":"中等"},{"id":"choice-019","type":"choice","globalNumber":19,"page":"choice_1-50.html","answer":"B","analysis":"组播地址用于将信息发送给一组主机，单播地址用于一对一通信；主机地址和网络地址是 IP 地址的组成部分，并非用于向一组主机发送信息，A、C、D 选项错误","source":"计算机网络 IP 地址课程","difficulty":"中等"},{"id":"choice-020","type":"choice","globalNumber":20,"page":"choice_1-50.html","answer":"C","analysis":"IPv6 地址长度为 128 位，相比 IPv4 的 32 位地址空间大大扩展，A、B、D 选项错误","source":"计算机网络 IP 地址课程","difficulty":"中等"},{"id":"choice-021","type":"choice","globalNumber":21,"page":"choice_1-50.html","answer":"A","analysis":"在路由器命令中，“router#show version” 用于查看版本及引导信息；“router#show ip router” 用于查看 IP 路由表；“router#show interface” 用于查看接口信息；“router#show run” 用于查看当前运行配置，所以 A 正确","source":"网络设备配置基础","difficulty":"易"},{"id":"choice-022","type":"choice","globalNumber":22,"page":"choice_1-50.html","answer":"D","analysis":"802.11n 向下兼容 802.11a、802.11b、802.11g 等标准，而 802.11a 与 802.11b、802.11g 工作频段不同，不兼容；802.11 和 802.11a 也不兼容，所以 D 正确","source":"无线网络技术基础","difficulty":"中"},{"id":"choice-023","type":"choice","globalNumber":23,"page":"choice_1-50.html","answer":"B","analysis":"引导扇区病毒主要感染计算机的主引导记录（MBR），DATA 是数据，E-Mail 是电子邮件，Word 是文档格式，均不是引导扇区病毒感染的主要对象，所以 B 正确","source":"计算机病毒原理","difficulty":"易"},{"id":"choice-024","type":"choice","globalNumber":24,"page":"choice_1-50.html","answer":"B","analysis":"目前的防病毒软件能查出已知名的恶意代码，并清除部分恶意代码，但无法清除已感染的任何恶意代码和任何已感染的文件，也不能查出并清除所有恶意代码，所以 B 正确","source":"计算机安全防护技术","difficulty":"易"},{"id":"choice-025","type":"choice","globalNumber":25,"page":"choice_1-50.html","answer":"A","analysis":"防病毒产品可部署在网关、服务器、桌面三个层次，实现网络不同层面的防护；互联网、内部网不是具体的部署层次；防火墙、代理服务器、邮件处理服务器只是网络设备，不是完整的部署层次；无线设备表述不全面，所以 A 正确","source":"网络安全防护体系","difficulty":"中"},{"id":"choice-026","type":"choice","globalNumber":26,"page":"choice_1-50.html","answer":"B","analysis":"DES 加密算法是典型的对称加密算法；Caesar 替代法、Vigenere 算法是古典加密算法，不属于对称加密算法的典型代表；Diffie - Hellman 加密算法是一种非对称加密算法，所以 B 正确","source":"加密技术基础","difficulty":"中"},{"id":"choice-027","type":"choice","globalNumber":27,"page":"choice_1-50.html","answer":"C","analysis":"FTP 是 File Transfer Protocol 的缩写，代表文件传输；电子邮件常用协议是 SMTP、POP3 等；远程登陆常用协议是 Telnet；网络会议有多种软件和协议，所以 C 正确","source":"网络协议基础","difficulty":"易"},{"id":"choice-028","type":"choice","globalNumber":28,"page":"choice_1-50.html","answer":"A","analysis":"在 Linux 系统的 vsftpd 服务器配置中，设置 chroot_list_enable=NO，chroot_local_user=Yes 可将所有本地用户锁定在主目录，重启服务使配置生效，B 选项中 chroot - list - enable 书写错误，C、D 选项配置错误，所以 A 正确","source":"Linux 服务器配置","difficulty":"中"},{"id":"choice-029","type":"choice","globalNumber":29,"page":"choice_1-50.html","answer":"C","analysis":"Windows 服务器文件系统主要使用基于角色的访问控制，通过为不同角色分配权限来控制访问；强制访问控制和自主访问控制不是 Windows 服务器文件系统的主要访问控制方式；基于防火墙的控制主要针对网络流量，而非文件系统访问，所以 C 正确","source":"Windows 服务器管理","difficulty":"中"},{"id":"choice-030","type":"choice","globalNumber":30,"page":"choice_1-50.html","answer":"B","analysis":"在 samba 文件服务器中，“smbpasswd -d zhang3” 用于禁用用户 zhang3；“smbpasswd -a zhang3” 用于添加用户；“smbpasswd -e zhang3” 用于启用用户；“smbpasswd -x zhang3” 用于删除用户，所以 B 正确","source":"Linux 服务器配置","difficulty":"中"},{"id":"choice-031","type":"choice","globalNumber":31,"page":"choice_1-50.html","answer":"B","analysis":"DHCP 服务器的主要功能是动态分配 IP 地址，为网络中的设备自动提供 IP 配置信息；主机名、账户、密码不是 DHCP 服务器分配的主要内容，所以 B 正确","source":"网络服务配置（DHCP）","difficulty":"易"},{"id":"choice-032","type":"choice","globalNumber":32,"page":"choice_1-50.html","answer":"B","analysis":"Access 端口只能属于一个 VLAN，接收和发送该 VLAN 的报文；Trunk 端口可以接收和发送多个 VLAN 的报文，且默认情况下会给不同 VLAN 的报文打标签；Hybrid 端口可以灵活配置接收和发送多个 VLAN 的报文；Trunk 端口接收和发送的报文通常都带有 VLAN 标签，所以 B 正确","source":"网络交换技术","difficulty":"中"},{"id":"choice-033","type":"choice","globalNumber":33,"page":"choice_1-50.html","answer":"C","analysis":"根端口在非根网桥上，用于向根网桥发送数据；指定端口不仅在根网桥上存在，在非根网桥上也存在，它是每个 LAN 中距离根网桥最近的端口，负责转发数据，所以 C 描述错误","source":"生成树协议（STP）","difficulty":"中"},{"id":"choice-034","type":"choice","globalNumber":34,"page":"choice_1-50.html","answer":"A","analysis":"在思科交换机上，进入配置模式（Switch (config)#）后，使用 “spanning - tree mode mst” 命令可将生成树模式设置为 mstp；B 选项未在配置模式下；C、D 选项命令格式错误，所以 A 正确","source":"思科交换机配置（生成树协议）","difficulty":"中"},{"id":"choice-035","type":"choice","globalNumber":35,"page":"choice_1-50.html","answer":"C","analysis":"思科交换机中，使用 privilege 命令可以为特权模式配置 16 个层次的命令级别，所以 C 正确","source":"思科交换机配置（权限管理）","difficulty":"中"},{"id":"choice-036","type":"choice","globalNumber":36,"page":"choice_1-50.html","answer":"A","analysis":"在思科交换机上执行 “Router#dir” 命令，默认显示的是 flash 闪存设备的文件系统；nvram 设备主要存储启动配置文件等；network 网络文件系统和 opaque 本地产生的虚拟文件系统不是 “dir” 命令默认显示的内容，所以 A 正确","source":"思科交换机配置（文件管理）","difficulty":"易"},{"id":"choice-037","type":"choice","globalNumber":37,"page":"choice_1-50.html","answer":"B","analysis":"在思科路由器配置本地用户时，若设置明文密码，使用 “Router (config)#username abc password 123456” 命令；“Router (config)#username abc secret 123456” 是设置加密密码；C、D 选项未在配置模式下，所以 B 正确","source":"思科路由器配置（用户认证）","difficulty":"中"},{"id":"choice-038","type":"choice","globalNumber":38,"page":"choice_1-50.html","answer":"B","analysis":"同第 35 题，思科路由器中，privilege 命令可为特权模式配置 16 个层次的命令级别，所以 B 正确","source":"思科路由器配置（权限管理）","difficulty":"中"},{"id":"choice-039","type":"choice","globalNumber":39,"page":"choice_1-50.html","answer":"A","analysis":"在思科路由器上，使用 “Router#copy running - config startup - config” 命令可将当前运行配置保存到启动配置文件；“cp” 是 Linux 系统的复制命令，在思科路由器中不适用；“write” 和 “save” 在思科路由器保存配置的场景下命令格式错误，所以 A 正确","source":"思科路由器配置（配置管理）","difficulty":"中"},{"id":"choice-040","type":"choice","globalNumber":40,"page":"choice_1-50.html","answer":"B","analysis":"在 Windows 系统中，用户账号有唯一的安全标识符（SID），删除并重新创建同名用户后，新用户的 SID 与原用户不同，Windows 不认为是同一个用户，所以新用户无权访问原用户设置权限的文件夹；A 选项新建用户并非都需重新授权访问所有文件；C 选项用户被删除，其文件夹不会自动删除；D 选项新建用户不会继承原用户权限，所以 B 正确","source":"Windows 操作系统管理","difficulty":"中"},{"id":"choice-041","type":"choice","globalNumber":41,"page":"choice_1-50.html","answer":"C","analysis":"口令暴力破解通常通过不断尝试错误密码来获取访问权限，账号锁定策略可有效对抗此类攻击。当错误登录次数达到一定阈值锁定账号，使攻击者难以持续尝试。而分布式拒绝服务攻击（DDoS）主要通过大量请求使服务器瘫痪；病毒传染是恶意程序传播；缓冲区溢出攻击利用程序漏洞，均与账号锁定策略无关","source":"信息安全基础","difficulty":"易"},{"id":"choice-042","type":"choice","globalNumber":42,"page":"choice_1-50.html","answer":"C","analysis":"Windows 系统补丁更新设置有多种方式，并非只能自动更新，也不是不能选择是否安装更新。用户可以设置为下载更新后自行选择是否安装，且不仅能更新系统补丁，也能接收其他 Microsoft 产品的更新","source":"Windows 操作系统应用","difficulty":"中"},{"id":"choice-043","type":"choice","globalNumber":43,"page":"choice_1-50.html","answer":"B","analysis":"在 /etc/lilo.conf 文件中，“image=” 选项用于指定内核映像文件路径，通过设置该选项指向新内核，可使系统启动时默认使用新内核，同时旧内核依然保留有效。“boot=” 用于指定引导设备；“install=” 用于指定安装引导扇区的文件；“map=” 用于指定映射文件，均不符合题意","source":"Linux 系统管理","difficulty":"中"},{"id":"choice-044","type":"choice","globalNumber":44,"page":"choice_1-50.html","answer":"B","analysis":"在 Linux 系统中，root 用户是系统管理员，其用户 ID（UID）和组 ID（GID）均为 0，这是系统默认的设定，用于区分不同用户和用户组的权限等属性","source":"Linux 系统基础","difficulty":"易"},{"id":"choice-045","type":"choice","globalNumber":45,"page":"choice_1-50.html","answer":"B","analysis":"当尝试删除一个用户的主组时，如果组内还有用户存在，系统会阻止删除操作并提示该错误。组不存在会有其他报错提示；这不是系统错误也并非命令参数出错","source":"Linux 用户与组管理","difficulty":"中"},{"id":"choice-046","type":"choice","globalNumber":46,"page":"choice_1-50.html","answer":"C","analysis":"在 Linux 系统中，若 root 口令丢失，进入单用户模式可以绕过正常的用户认证机制，方便修改 root 口令。使用软盘或光盘启动直接进入系统无法修改口令；重新安装系统过于繁琐，且会丢失数据","source":"Linux 系统安全","difficulty":"中"},{"id":"choice-047","type":"choice","globalNumber":47,"page":"choice_1-50.html","answer":"B","analysis":"在 Red Hat Linux 系统中，内核的源程序通常存放在 /usr/src 目录下。/usr/local 一般用于存放本地安装的软件；/lib 是存放系统库文件的目录；/usr/share 用于存放共享数据，如文档、图标等","source":"Linux 系统基础","difficulty":"易"},{"id":"choice-048","type":"choice","globalNumber":48,"page":"choice_1-50.html","answer":"A","analysis":"在 Linux 中，chmod 命令用于修改文件权限。权限数字 7 表示读（4）、写（2）、执行（1）权限都有，5 表示读（4）和执行（1）权限。755 表示文件属主有读、写、执行权限，组和其他用户有读和执行权限。700 表示文件属主有读、写、执行权限，组和其他用户无任何权限；chmod ux+rwx test 语法错误；chmod g-w test 只是去掉组用户的写权限，不符合要求","source":"Linux 文件权限管理","difficulty":"中"},{"id":"choice-049","type":"choice","globalNumber":49,"page":"choice_1-50.html","answer":"C","analysis":"在 SQL Server 的混合模式下，SQL Server 既可以使用 Windows 身份验证（根据已在 Windows 网络中登录的用户的网络安全属性进行验证），也可以使用 SQL Server 自身的身份验证（用户输入用户名和密码）。A 选项描述错误，不是 Windows 提交给 SQL Server 验证；B 选项也错误，不是 SQL Server 提交给 Windows 验证；D 选项登录到本地 Windows 的用户并非无限制访问，需要权限设置","source":"SQL Server 数据库管理","difficulty":"中"},{"id":"choice-050","type":"choice","globalNumber":50,"page":"choice_1-50.html","answer":"D","analysis":"域名解析的两种主要方式是反复解析和递归解析。递归解析是指域名服务器接到查询请求后，会代替客户端向其他域名服务器进行查询，直到得到最终结果返回给客户端；反复解析是指客户端每次向不同的域名服务器发送查询请求，直到获得结果。不存在直接解析和间接解析这种说法","source":"计算机网络基础","difficulty":"中"},{"id":"choice-051","type":"choice","globalNumber":51,"page":"choice_51-100.html","answer":"C","analysis":"在国内，通过购买服务器空间运营商备案是相对简单方便的方式。运营商会协助用户完成备案流程，提供相关指导和支持。微软和谷歌官网不提供国内域名备案服务；通过国家工业和信息化部 ICP 域名信息备案网站自主备案相对繁琐，需要用户自己处理较多事项","source":"域名管理与备案","difficulty":"易"},{"id":"choice-052","type":"choice","globalNumber":52,"page":"choice_51-100.html","answer":"C","analysis":"数字声频带（Digital Audio Tape，DAT）通常采用螺旋扫描方式读写数据。盒式带、1/4 英寸磁带、数字线形带一般不采用这种方式","source":"数据备份与恢复","difficulty":"难"},{"id":"choice-053","type":"choice","globalNumber":53,"page":"choice_51-100.html","answer":"B","analysis":"增量备份只备份自上次备份（完全备份或增量备份）以来更改的数据，所以比完全备份使用空间少；差异备份备份自上次完全备份以来更改的数据，恢复时只需使用最近一次完全备份和最近一次差异备份副本，而增量备份恢复时可能需要多个增量备份副本，所以差异备份恢复速度比增量备份快；差异备份因为只备份部分数据，所以比完全备份备份速度快；完全备份恢复时只需使用该完全备份副本，使用副本最少","source":"数据备份与恢复","difficulty":"中"},{"id":"choice-054","type":"choice","globalNumber":54,"page":"choice_51-100.html","answer":"B","analysis":"根据相关规定，电子公告服务提供者记录备份应当保存 60 天，以满足监管和追溯等需求","source":"网络服务管理法规","difficulty":"易"},{"id":"choice-055","type":"choice","globalNumber":55,"page":"choice_51-100.html","answer":"A","analysis":"SMTP（简单邮件传输协议）用于发送邮件，负责将邮件从客户端发送到邮件服务器，以及在邮件服务器之间传输邮件。POP（邮局协议）用于接收邮件，从邮件服务器下载邮件到客户端。FTP（文件传输协议）用于文件传输，与邮件发送无关","source":"电子邮件服务与协议","difficulty":"易"},{"id":"choice-056","type":"choice","globalNumber":56,"page":"choice_51-100.html","answer":"C","analysis":"国际标准化组织（ISO）定义的网络管理五大功能包括故障管理（检测和处理网络故障）、配置管理（管理网络设备的配置）、性能管理（监控和优化网络性能）、安全管理（保障网络安全）、计费管理（统计网络资源使用情况进行计费），不包括操作管理","source":"网络管理基础","difficulty":"易"},{"id":"choice-057","type":"choice","globalNumber":57,"page":"choice_51-100.html","answer":"B","analysis":"网络测试仪专门用于测试网线的连通性、线序、长度等参数。数字电压表用于测量电压；时域反射仪主要用于检测电缆中的故障位置；“电缆检测其” 表述不准确，不是常见测试工具","source":"网络布线与测试","difficulty":"易"},{"id":"choice-058","type":"choice","globalNumber":58,"page":"choice_51-100.html","answer":"B","analysis":"netstat -an 命令可以用于查看系统当前开放的端口以及端口对应的连接状态等信息。nslookup 用于域名解析；net use 用于管理网络连接；net share 用于管理共享资源","source":"网络命令与工具","difficulty":"易"},{"id":"choice-059","type":"choice","globalNumber":59,"page":"choice_51-100.html","answer":"C","analysis":"硬件诊断工具可检测硬件故障，软件诊断工具可辅助检测软件问题，各种测试命令能帮助排查网络等问题。入侵防御系统主要用于防范网络攻击，并非故障诊断工具","source":"网络故障排除","difficulty":"易"},{"id":"choice-060","type":"choice","globalNumber":60,"page":"choice_51-100.html","answer":"D","analysis":"XSS（跨站脚本攻击）常见手段包括盗用 cookie 获取敏感信息、利用域信任关系执行未授权操作、利用 iframe 以用户身份执行管理动作等。注入 payload 读取服务器上的文件属于文件注入攻击，不属于 XSS 攻击","source":"网络安全攻击与防范","difficulty":"中"},{"id":"choice-061","type":"choice","globalNumber":61,"page":"choice_51-100.html","answer":"D","analysis":"DNS 缓存中毒会篡改域名解析结果，导致用户访问合法域名时被导向其他非法或不健康网站；ARP 欺骗主要针对局域网内的地址解析；DHCP 欺骗干扰动态 IP 分配；TCP SYN 攻击主要影响 TCP 连接建立，与域名访问异常无关","source":"网络安全基础","difficulty":"中等"},{"id":"choice-062","type":"choice","globalNumber":62,"page":"choice_51-100.html","answer":"B","analysis":"威胁通常由目标、代理（攻击者）、事件等组成，信息不属于威胁的基本组成部分","source":"网络安全概念","difficulty":"简单"},{"id":"choice-063","type":"choice","globalNumber":63,"page":"choice_51-100.html","answer":"C","analysis":"主动攻击发生时，攻击行为已经在实施，难以实时阻止。但可以通过技术手段进行诊断、检测和在攻击前预防","source":"网络安全基础","difficulty":"中等"},{"id":"choice-064","type":"choice","globalNumber":64,"page":"choice_51-100.html","answer":"C","analysis":"DDoS 攻击通过大量请求使目标系统资源耗尽，无法正常提供服务，破坏的是系统的可用性","source":"网络安全基础","difficulty":"中等"},{"id":"choice-065","type":"choice","globalNumber":65,"page":"choice_51-100.html","answer":"D","analysis":"TFN 是典型的拒绝服务攻击程序，通过大量流量使目标系统瘫痪","source":"网络安全基础","difficulty":"中等"},{"id":"choice-066","type":"choice","globalNumber":66,"page":"choice_51-100.html","answer":"B","analysis":"操作系统漏洞直接影响系统安全，是网络安全管理中需要重点关注和解决的问题。硬件故障、人为失误和路由器被攻击不属于以查缺补漏为首要目的的计算机系统安全事件范畴","source":"网络安全基础","difficulty":"中等"},{"id":"choice-067","type":"choice","globalNumber":67,"page":"choice_51-100.html","answer":"D","analysis":"sqlmap 是专门用于自动化 SQL 注入检测和利用的工具。nmap 用于网络扫描；nessus 用于漏洞扫描；msf 是一个渗透测试框架","source":"网络安全基础","difficulty":"中等"},{"id":"choice-068","type":"choice","globalNumber":68,"page":"choice_51-100.html","answer":"D","analysis":"漏洞扫描可以发现系统和网络中的安全漏洞，为安全评估和等级保护提供重要依据，是关键技术。入侵检测、防火墙和加密虽也重要，但不是最关键的","source":"网络安全基础","difficulty":"中等"},{"id":"choice-069","type":"choice","globalNumber":69,"page":"choice_51-100.html","answer":"D","analysis":"分级存储综合考虑数据的重要性、访问频率、保留时间等因素来优化存储策略","source":"存储技术基础","difficulty":"中等"},{"id":"choice-070","type":"choice","globalNumber":70,"page":"choice_51-100.html","answer":"D","analysis":"umask 用于设置文件创建时的默认权限掩码，不是文件系统备份和恢复命令。tar 和 cpio 可用于备份和恢复，backup 不是 UNIX/Linux 系统常用的此类命令","source":"UNIX/Linux 系统管理","difficulty":"中等"},{"id":"choice-071","type":"choice","globalNumber":71,"page":"choice_51-100.html","answer":"B","analysis":"在用户名后加\"\"可以创建隐藏账号，netuserahck123456 /add 为正确创建命令","source":"Windows 系统安全","difficulty":"中等"},{"id":"choice-072","type":"choice","globalNumber":72,"page":"choice_51-100.html","answer":"A","analysis":"隐藏详细错误信息，只给出笼统提示，主要目的是最小化反馈信息，防止攻击者利用错误信息进行攻击","source":"Web 安全开发","difficulty":"中等"},{"id":"choice-073","type":"choice","globalNumber":73,"page":"choice_51-100.html","answer":"B","analysis":"在 UNIX 系统中，新建文件默认许可位通常是 666，新建程序默认许可位通常是 777","source":"UNIX/Linux 系统管理","difficulty":"中等"},{"id":"choice-074","type":"choice","globalNumber":74,"page":"choice_51-100.html","answer":"D","analysis":"复合型病毒结合了多种恶意代码的传播方式和特性","source":"恶意代码防范","difficulty":"中等"},{"id":"choice-075","type":"choice","globalNumber":75,"page":"choice_51-100.html","answer":"A","analysis":"恶意软件保护主要包括病毒防护以及 Windows Defender 提供的防护功能","source":"恶意代码防范","difficulty":"中等"},{"id":"choice-076","type":"choice","globalNumber":76,"page":"choice_51-100.html","answer":"D","analysis":"WannaCry 是一种勒索病毒，不是杀毒软件。McAfee VirusScan、Norton AntiVirus、Kapersky 都是知名杀毒软件","source":"恶意代码防范","difficulty":"简单"},{"id":"choice-077","type":"choice","globalNumber":77,"page":"choice_51-100.html","answer":"A","analysis":"行为检测法就是依据病毒特有的行为来检测病毒","source":"恶意代码防范","difficulty":"中等"},{"id":"choice-078","type":"choice","globalNumber":78,"page":"choice_51-100.html","answer":"B","analysis":"“控制面板” 窗口中无 “本地连接” 图标可能是多种原因导致，不一定是计算机病毒造成。而破坏程序或数据、使网络阻塞、使 CPU 使用率过高都可能是病毒的行为表现","source":"恶意代码防范","difficulty":"中等"},{"id":"choice-079","type":"choice","globalNumber":79,"page":"choice_51-100.html","answer":"D","analysis":"虽然应急响应管理过程有标准阶段划分，但并不能绝对确保事件处理成功，还受多种因素影响","source":"信息安全应急响应","difficulty":"中等"},{"id":"choice-080","type":"choice","globalNumber":80,"page":"choice_51-100.html","answer":"A","analysis":"敏捷开发模型主要关注开发流程和团队协作效率，对直接提升软件安全性作用不大。而安全意识培训、规范编码和增加安全测试环节都有助于提高软件安全性","source":"软件安全开发","difficulty":"中等"},{"id":"choice-081","type":"choice","globalNumber":81,"page":"choice_51-100.html","answer":"B","analysis":"“士不素养，不可以重国” 意思是士人没有经过修炼涵养，就不能担当国家重任，所以 “素养” 本义是修炼涵养。此处无课程 ID 信息，难以精准判断课程 ID；从对文言文理解角度，有一定文化知识储备要求，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-082","type":"choice","globalNumber":82,"page":"choice_51-100.html","answer":"A","analysis":"职业道德是为了规范职业行为，其目标最终是服务群众，满足群众需求，这是职业存在的价值体现。无课程 ID，从对职业道德基本概念理解，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-083","type":"choice","globalNumber":83,"page":"choice_51-100.html","answer":"D","analysis":"职业道德具有整合、导向、规范功能，协调功能不属于职业道德具体功能。缺乏课程 ID 信息，从对职业道德功能的记忆考查，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-084","type":"choice","globalNumber":84,"page":"choice_51-100.html","answer":"D","analysis":"执业谨慎、信誉至上是诚实守信的要求，不是爱岗敬业内容。课程 ID 缺失，从对职业道德规范的区分考查，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-085","type":"choice","globalNumber":85,"page":"choice_51-100.html","answer":"C","analysis":"公民道德建设以诚实守信为重点，这是公民道德建设的基本要求。因无课程 ID，从对公民道德建设重点的记忆，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-086","type":"choice","globalNumber":86,"page":"choice_51-100.html","answer":"D","analysis":"字长指 CPU 一次能处理二进制数据的位数，这是计算机基础知识中对 CPU 性能指标的定义。课程 ID 未提及，对计算机基础概念记忆，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-087","type":"choice","globalNumber":87,"page":"choice_51-100.html","answer":"B","analysis":"RAM（随机存取存储器）存取速度最快，U 盘、光盘、硬盘存取速度相对较慢。无课程 ID，考查计算机存储设备知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-088","type":"choice","globalNumber":88,"page":"choice_51-100.html","answer":"B","analysis":"操作系统可管理计算机硬盘、实现虚拟存储器、进行用户管理，但对程序进行编译不是操作系统直接完成的功能，编译由专门的编译程序完成。课程 ID 未知，从操作系统功能区分考查，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-089","type":"choice","globalNumber":89,"page":"choice_51-100.html","answer":"C","analysis":"创建关联需在两个表的相同数据类型的字段间进行，级联更新是主键表字段值变化时外键表关联字段自动更新，不是外键表变主键表变。无课程 ID，考查数据库关联知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-090","type":"choice","globalNumber":90,"page":"choice_51-100.html","answer":"A","analysis":"计算机网络体系结构采用分层配对结构，便于网络的设计、实现和管理。课程 ID 未提供，对计算机网络基础概念考查，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-091","type":"choice","globalNumber":91,"page":"choice_51-100.html","answer":"C","analysis":"用于传输模拟信号的同轴电缆特征阻抗为 75Ω，这是通信领域关于同轴电缆的基础知识。课程 ID 缺乏，对特定通信知识记忆，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-092","type":"choice","globalNumber":92,"page":"choice_51-100.html","answer":"A","analysis":"双机容错利用系统冗余，在一台主机故障时另一台接替工作，保障系统稳定运行。课程 ID 不明，从计算机系统可靠性技术概念考查，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-093","type":"choice","globalNumber":93,"page":"choice_51-100.html","answer":"B","analysis":"合同解除针对的是有效合同，无效合同自始无效无需解除，可撤销合同是撤销，效力待定合同是追认等处理。课程 ID 未给，考查合同相关法律知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-094","type":"choice","globalNumber":94,"page":"choice_51-100.html","answer":"D","analysis":"合伙期限届满后合伙人继续执行事务且无异议，原合同继续有效但期限变为不定期。课程 ID 缺失，考查合伙合同法律规定，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-095","type":"choice","globalNumber":95,"page":"choice_51-100.html","answer":"A","analysis":"开展数据处理活动要建立健全全流程数据安全管理制度，保障数据安全。课程 ID 未知，从数据安全管理规定考查，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-096","type":"choice","globalNumber":96,"page":"choice_51-100.html","answer":"B","analysis":"静态路由的表项需要网络管理员手动配置，OSPF 路由、动态路由是自动学习生成路由表项，直接路由是直接相连网络的路由。课程 ID 未提及，考查网络路由知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-097","type":"choice","globalNumber":97,"page":"choice_51-100.html","answer":"A","analysis":"当 IP 报文生存时间值等于 1 时，为防止报文在网络中无限循环，路由器会丢掉该报文。课程 ID 缺乏，考查网络路由知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-098","type":"choice","globalNumber":98,"page":"choice_51-100.html","answer":"A","analysis":"无线家用宽带路由器天线数量多不代表接入速度就快，速度还受多种因素影响；信号穿越钢筋混凝土墙会大幅衰减，它是胖 AP 且有 DHCP 服务功能。课程 ID 未给，考查无线网络设备知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-099","type":"choice","globalNumber":99,"page":"choice_51-100.html","answer":"D","analysis":"无线控制器管理的一般是瘦 AP，不是胖 AP；它可集中控制 AP、有扩展性、能了解 AP 工作状态。课程 ID 未知，考查无线网络设备知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-100","type":"choice","globalNumber":100,"page":"choice_51-100.html","answer":"D","analysis":"包过滤防火墙不能阻止所有网络攻击行为，它有一定局限性；其他选项对防火墙的描述正确。课程 ID 未提及，考查网络安全设备知识，难度中等","source":"未提供","difficulty":"中等"},{"id":"choice-101","type":"choice","globalNumber":101,"page":"choice_101-150.html","answer":"A","analysis":"分时操作系统支持多个用户同时使用计算机，具有交互性、同时性（多路性）、独立性和及时性的特点。交互性允许用户与系统进行交互操作；同时性（多路性）指多个用户可同时使用计算机；独立性保证每个用户的操作相互独立；及时性确保系统能及时响应用户请求。","source":"操作系统基础","difficulty":"易"},{"id":"choice-102","type":"choice","globalNumber":102,"page":"choice_101-150.html","answer":"A","analysis":"在 Linux 系统中，/etc/passwd 文件存放系统账户的基本信息，如用户名、用户 ID、组 ID 等。shadow 文件存放用户密码的加密信息；gshadow 文件用于存放组密码等相关信息；group 文件用于存放组的相关信息。","source":"Linux 系统管理基础","difficulty":"易"},{"id":"choice-103","type":"choice","globalNumber":103,"page":"choice_101-150.html","answer":"A","analysis":"存取控制机制主要用于限制用户对文件的访问权限，防止因人为的非法访问、误操作等因素造成文件不安全性。自然因素（如自然灾害）、系统因素（如系统故障）和硬件因素（如硬件损坏）通常不是存取控制机制能防范的。","source":"计算机安全基础","difficulty":"易"},{"id":"choice-104","type":"choice","globalNumber":104,"page":"choice_101-150.html","answer":"C","analysis":"iptables -P INPUT DROP 命令用于设置 INPUT 链的默认策略为 DROP，即默认禁止所有进入本地的数据包，从而禁止与本地进程进行通信。A 选项中 -I INPUT ACCEPT 是在 INPUT 链插入允许规则；B 选项 -A INPUT ACCEPT 是在 INPUT 链追加允许规则；D 选项 -t nat 表示使用 nat 表，不符合要求。","source":"Linux 网络配置与安全","difficulty":"中"},{"id":"choice-105","type":"choice","globalNumber":105,"page":"choice_101-150.html","answer":"D","analysis":"特洛伊木马主要用于窃取用户的敏感信息，如计算机名字、硬件信息、即时通信 APP 的账户与密码等，以达到非法目的。它一般不会窃取系统文件来直接获取利益，系统文件的获取对攻击者的直接价值相对较小。","source":"网络安全基础","difficulty":"易"},{"id":"choice-106","type":"choice","globalNumber":106,"page":"choice_101-150.html","answer":"B","analysis":"恶意代码传播到新系统后对系统产生影响，这体现了其破坏性。目的性是恶意代码编写的意图；传播性是恶意代码扩散的能力；隐蔽性是恶意代码隐藏自身的特性，都不符合 “对系统产生影响” 这一表现手段的描述。","source":"网络安全基础","difficulty":"易"},{"id":"choice-107","type":"choice","globalNumber":107,"page":"choice_101-150.html","answer":"C","analysis":"GPG 加密算法采用非对称加密，计算量大、处理速度慢，使用公钥和私钥两个密码。由于其处理速度慢的特点，并不适合加密长数据，更适合加密少量关键数据（如密钥等）。","source":"加密技术基础","difficulty":"中"},{"id":"choice-108","type":"choice","globalNumber":108,"page":"choice_101-150.html","answer":"B","analysis":"当 Web 服务器访问人数超过上限导致过载时，会返回 503 Service Unavailable 状态码，表示服务器当前无法处理请求。200 OK 表示请求成功；403 Forbidden 表示服务器拒绝执行请求；302 Move temporarily 表示资源临时重定向。","source":"Web 服务器配置与管理","difficulty":"易"},{"id":"choice-109","type":"choice","globalNumber":109,"page":"choice_101-150.html","answer":"A","analysis":"vsftpd 的配置文件常见的有 /etc/vsftpd/vsftpd.conf（主配置文件）、/etc/vsftpd/ftpusers（用于限制不能登录 FTP 的用户）、/etc/vsftpd/user_list（可用于控制用户登录 FTP 的权限）。A 选项中文件名错误，应为 /etc/vsftpd/vsftpd.conf。","source":"FTP 服务器配置与管理","difficulty":"易"},{"id":"choice-110","type":"choice","globalNumber":110,"page":"choice_101-150.html","answer":"A","analysis":"samba 服务有多种安全模式，默认的安全模式等级是 user。在 user 模式下，用户访问 samba 共享资源时需要提供用户名和密码进行身份验证。","source":"Samba 服务器配置与管理","difficulty":"易"},{"id":"choice-111","type":"choice","globalNumber":111,"page":"choice_101-150.html","answer":"D","analysis":"域名系统 DNS 的主要功能是将人们易于记忆的域名转换为计算机能够识别的 IP 地址，实现网络中主机的访问定位。它并不主要用于存放主机域名、IP 地址或邮件地址。","source":"域名系统与 DNS 配置","difficulty":"易"},{"id":"choice-112","type":"choice","globalNumber":112,"page":"choice_101-150.html","answer":"B","analysis":"在 DHCP 作用域上创建 DHCP 保留，可以为指定的设备（如 Server2）分配固定的 IP 地址，同时该设备还能从 DHCP 服务器获取 DNS 设置和 WINS 设置。创建多播范围用于多播通信；给 server2 分配静态 IP 地址无法从 DHCP 服务器获取 DNS 和 WINS 设置；创建在 DHCP 范围之外的区域与需求无关。","source":"DHCP 服务器配置与管理","difficulty":"中"},{"id":"choice-113","type":"choice","globalNumber":113,"page":"choice_101-150.html","answer":"B","analysis":"Trunk 端口用于在交换机之间传输多个 VLAN 的数据帧，当需要 VLAN 跨交换机时，通常将交换机之间的连接端口设置为 Trunk 端口。Access 端口只能属于一个 VLAN；Hybrid 端口也可用于多 VLAN 通信，但默认情况下主要用于连接终端设备；Console 口用于交换机的配置管理，不用于 VLAN 跨交换机通信。","source":"VLAN 配置与管理","difficulty":"易"},{"id":"choice-114","type":"choice","globalNumber":114,"page":"choice_101-150.html","answer":"D","analysis":"并非所有主机和交换机都能识别带有 VLAN 标签的数据帧，一些老旧设备可能不支持 VLAN 功能，无法识别 VLAN 标签。A、B、C 选项关于 VLAN 的描述均正确，VLAN 是逻辑网络，可缩小广播域，解决广播带来的问题。","source":"VLAN 配置与管理","difficulty":"易"},{"id":"choice-115","type":"choice","globalNumber":115,"page":"choice_101-150.html","answer":"C","analysis":"生成树协议首先比较网桥优先级，优先级数值越小越优先成为根网桥；当网桥优先级相同时，比较 MAC 地址，MAC 地址最小的成为根网桥。A 选项中优先级数值最大错误；B 选项缺少网桥优先级相同的前提；D 选项 MAC 地址最大错误。","source":"生成树协议与网络冗余","difficulty":"中"},{"id":"choice-116","type":"choice","globalNumber":116,"page":"choice_101-150.html","answer":"B","analysis":"在思科交换机上，Switch (config)#spanning-tree VLAN 10 root primary 命令用于将当前网桥设置为 VLAN 10 的根网桥。A 选项命令不完整；C 选项 root secondary 用于设置为备份根网桥；D 选项命令格式错误。","source":"思科交换机配置","difficulty":"易"},{"id":"choice-117","type":"choice","globalNumber":117,"page":"choice_101-150.html","answer":"B","analysis":"在思科三层交换机上，在接口配置模式下使用 Switch (config-if)#no switchport 命令可以将物理端口从二层交换模式转换成三层路由模式。A 选项 router 命令错误；C 选项不在接口配置模式下；D 选项同样不在接口配置模式下。","source":"思科三层交换机配置","difficulty":"易"},{"id":"choice-118","type":"choice","globalNumber":118,"page":"choice_101-150.html","answer":"B","analysis":"在交换机全局配置模式下，使用 Switch (config)#enable password 123456 命令可以设置用户进入特权视图的密码。A 选项 password 命令错误；C 选项 enable 123456 命令格式错误；D 选项不在配置模式下。","source":"思科交换机配置","difficulty":"易"},{"id":"choice-119","type":"choice","globalNumber":119,"page":"choice_101-150.html","answer":"D","analysis":"在思科路由器的全局配置模式下，使用 Router (config)#ip domain-name localname 命令配置本机域名。A、B 选项不在配置模式下；C 选项命令中 domain 和 name 之间不应有空格。","source":"思科路由器配置与安全","difficulty":"易"},{"id":"choice-120","type":"choice","globalNumber":120,"page":"choice_101-150.html","answer":"B","analysis":"思科路由器可以通过 privilege 命令为特权模式配置 16 个（0 - 15）层次的命令级别，数字越大，安全级别越高，权限也越高。思科路由器 IOS 系统默认有用户模式和特权模式，并没有管理员模式，也不是默认有 16 个级别。","source":"思科路由器配置与安全","difficulty":"中"},{"id":"choice-121","type":"choice","globalNumber":121,"page":"choice_101-150.html","answer":"A","analysis":"微软管理控制台是 Windows Server 2008 R2 中用于统一管理工具的界面；管理工具是一个宽泛概念；转发器与管理界面无关；域控制器用于管理域，并非管理工具的统一界面","source":"操作系统基础","difficulty":"易"},{"id":"choice-122","type":"choice","globalNumber":122,"page":"choice_101-150.html","answer":"B","analysis":"本地用户账户存在于本地计算机；域用户账户存在于域中；计算机账户用于管理计算机；临时账户概念不符","source":"操作系统基础","difficulty":"易"},{"id":"choice-123","type":"choice","globalNumber":123,"page":"choice_101-150.html","answer":"B","analysis":"工作组中各计算机独立管理，属于分散管理模式；集中管理模式与之相反；连续和有层次不属于工作组管理模式特点","source":"操作系统基础","difficulty":"易"},{"id":"choice-124","type":"choice","globalNumber":124,"page":"choice_101-150.html","answer":"D","analysis":"打印权限控制打印相关操作；文件大小是文件本身属性；访问权限控制对文件或文件夹的访问；磁盘配额用于限制用户磁盘空间使用","source":"操作系统基础","difficulty":"易"},{"id":"choice-125","type":"choice","globalNumber":125,"page":"choice_101-150.html","answer":"B","analysis":"shadow 存放用户密码的加密信息；group 存放用户组信息；passwd 存放用户账号基本信息；gshadow 存放用户组密码的加密信息","source":"Linux 操作系统基础","difficulty":"易"},{"id":"choice-126","type":"choice","globalNumber":126,"page":"choice_101-150.html","answer":"B","analysis":"/bin 存放二进制可执行文件；/dev 存放外部设备文件；/boot 存放系统启动相关文件；/home 存放用户主目录","source":"Linux 操作系统基础","difficulty":"易"},{"id":"choice-127","type":"choice","globalNumber":127,"page":"choice_101-150.html","answer":"D","analysis":"less 用于查看文件内容；tar 用于打包和解包文件；cat 用于查看或连接文件；mkdir 用于创建目录","source":"Linux 操作系统基础","difficulty":"易"},{"id":"choice-128","type":"choice","globalNumber":128,"page":"choice_101-150.html","answer":"B","analysis":"在 Linux 权限数字表示中，4 代表读权限，所以给所有人读取权限是 444；2 代表写权限，1 代表执行权限","source":"Linux 操作系统基础","difficulty":"易"},{"id":"choice-129","type":"choice","globalNumber":129,"page":"choice_101-150.html","answer":"B","analysis":"增量备份只备份自上次备份以来更改的数据，比完全备份使用空间少；差异备份恢复时只需使用最近一次完全备份和最近一次差异备份副本，比增量备份恢复速度快；差异备份备份自上次完全备份以来更改的数据，比完全备份速度快；完全备份恢复时只需一个副本","source":"数据备份与恢复技术","difficulty":"中"},{"id":"choice-130","type":"choice","globalNumber":130,"page":"choice_101-150.html","answer":"B","analysis":"定期备份按一定周期备份数据；人工备份依赖人工操作；本地备份在本地存储备份数据；异地备份将数据备份到异地，可避免本地安全事件影响，保证关键服务和数据可用性","source":"数据备份与恢复技术","difficulty":"易"},{"id":"choice-131","type":"choice","globalNumber":131,"page":"choice_101-150.html","answer":"D","analysis":"双机热备份和双机互备方式在主系统故障时都需切换主机；多处理器协同方式主要涉及处理器协同工作；群集并发存取方式通过集群技术实现多节点并发访问，故障时无需切换主机系统","source":"主机系统高可用技术","difficulty":"中"},{"id":"choice-132","type":"choice","globalNumber":132,"page":"choice_101-150.html","answer":"C","analysis":"Web 服务器数据包括文件和数据库数据，所以备份包括文件备份和数据库备份；系统文件备份范围太宽泛，不具体针对 Web 服务器","source":"Web 服务器管理与维护","difficulty":"易"},{"id":"choice-133","type":"choice","globalNumber":133,"page":"choice_101-150.html","answer":"C","analysis":"IPSec 是网络层安全协议；SMTP 是简单邮件传输协议，用于邮件发送，但不具备加密和签名功能；S/MIME 用于安全电子邮件，支持加密和签名；TCP/IP 是网络通信协议族，并非专门的安全电子邮件协议","source":"网络安全协议","difficulty":"易"},{"id":"choice-134","type":"choice","globalNumber":134,"page":"choice_101-150.html","answer":"D","analysis":"上午 8 点、中午 12 点、下午 3 点都在公司工作时间内，备份可能影响正常业务；凌晨 1 点公司无人使用 FTP 服务器，适合备份","source":"数据备份策略","difficulty":"易"},{"id":"choice-135","type":"choice","globalNumber":135,"page":"choice_101-150.html","answer":"C","analysis":"网络安全服务包括认证、访问控制、数据保密性、数据完整性、不可否认性；安全策略是网络安全规划的一部分，数字签名是实现不可否认性等的技术手段，并非独立的网络安全服务组成部分","source":"网络安全基础","difficulty":"易"},{"id":"choice-136","type":"choice","globalNumber":136,"page":"choice_101-150.html","answer":"A","analysis":"协议分析仪可对各层协议进行分析，并非仅对应第七层；其他选项对协议分析仪的功能、操作要求等描述正确","source":"网络测试技术","difficulty":"中"},{"id":"choice-137","type":"choice","globalNumber":137,"page
