*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#F7F6FB;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7560BD;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.42}a{color:var(--primary-dark)}.hidden{display:none!important}.muted{color:var(--muted)}.eyebrow{font-size:.78rem;letter-spacing:.09em;color:var(--primary-dark);font-weight:750}.brand-title{margin:.2rem 0 .35rem;font-size:clamp(1.7rem,3vw,2.45rem);line-height:1.25;letter-spacing:-.035em}.btn{border:1px solid var(--line);border-radius:12px;padding:.72rem 1rem;min-height:44px;background:#fff;color:var(--ink);font-weight:650;transition:background-color .15s,border-color .15s,transform .15s}.btn:hover:not(:disabled){border-color:#B6A4F3;background:#FBF9FF}.btn-primary{background:var(--primary);border-color:var(--primary);color:#2A2145}.btn-primary:hover:not(:disabled){background:#B6A4F4;border-color:#B6A4F4}.btn-quiet{background:#F2EFF9;border-color:#E8E2F6}.btn-danger{color:#9B2330;border-color:#F0CDCF;background:#FFF8F8}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;background:var(--primary-light);color:#59458F;padding:.28rem .65rem;font-size:.8rem;font-weight:700}.storage-warning{margin:12px 0;padding:11px 13px;border:1px solid #EBD7A4;background:#FFF9E9;border-radius:12px;color:#6F5310;font-size:.88rem}.status-good{color:var(--good-ink)}.status-bad{color:var(--bad-ink)}

.quiz-topbar{max-width:1600px;margin:0 auto;padding:22px 24px 8px}.quiz-topline{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.quiz-topbar h1{font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.25;margin:2px 0}.quiz-topbar p{margin:6px 0 0;color:var(--muted);font-size:.92rem}.quiz-layout{max-width:1600px;margin:0 auto;padding:14px 24px 50px;display:block}.quiz-main{min-width:0;margin-right:354px}.question-list{display:grid;gap:14px}.question-card{scroll-margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 4px 18px rgba(43,32,77,.035);min-width:0}.question-card.is-current{border:2px solid #A994F0;padding:17px;background:#FDFCFF}.question-card.is-pinned{box-shadow:inset 4px 0 0 #F0C34E,0 4px 18px rgba(43,32,77,.035)}.question-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.question-title{font-size:.87rem;color:var(--primary-dark);font-weight:800}.question-stem{font-size:1.04rem;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere;margin:9px 0 16px}.pin-button{flex:0 0 auto;border:1px solid #E5D8A9;background:#FFF9E7;color:#795D14;border-radius:10px;min-height:38px;padding:5px 10px;font-size:.84rem;font-weight:700}.pin-button.is-on{background:#FFEDB7;border-color:#DBAB23;color:#674600}.options{display:grid;gap:9px}.option{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:12px 13px;border:1px solid #E8E5EF;border-radius:12px;background:white;color:var(--ink);min-height:46px;white-space:pre-wrap;overflow-wrap:anywhere}.option-label{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:8px;background:#F1EFF7;color:#52486A;font-size:.86rem;font-weight:850}.option-text{flex:1;min-width:0}.option.is-selected{border-color:#B7A7EA;background:#F8F5FF}.option.is-correct{border-color:#A9DEC0;background:var(--good);color:#165D35}.option.is-correct .option-label{background:#BCE8CB;color:#165D35}.option.is-wrong{border-color:#F0B7BB;background:var(--bad);color:#8B1E28}.option.is-wrong .option-label{background:#FFC9CD;color:#8B1E28}.option:disabled{opacity:1;cursor:default}.option:disabled:not(.is-correct):not(.is-wrong){color:var(--ink)}.analysis-block{margin-top:16px;padding:15px 16px;background:#F8F7FC;border:1px solid #E8E4F2;border-left:4px solid #A895E8;border-radius:12px;font-size:.92rem}.analysis-block h4{margin:0 0 8px;font-size:.95rem}.analysis-line{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.analysis-line strong{color:#55447F}.image-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.question-image{max-width:min(100%,360px);max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}.fill-inputs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}.fill-field{display:grid;gap:5px;min-width:min(100%,190px);flex:1}.fill-field input{width:100%;border:1px solid #D8D3E5;border-radius:10px;padding:11px 12px;min-height:44px}.fill-field input.is-correct{border-color:#82C99C;background:#EAF8EF}.fill-field input.is-wrong{border-color:#E99BA1;background:#FFF0F0}.fill-submit{margin-top:4px}.sidebar{position:fixed;z-index:20;top:18px;right:18px;bottom:18px;width:318px;padding:15px;background:#fff;border:1px solid #E2DDEA;border-radius:20px;box-shadow:0 8px 32px rgba(35,25,65,.11);display:flex;flex-direction:column;gap:13px;min-height:0}.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 10px;border-bottom:1px solid var(--line)}.timer-label{font-size:.78rem;color:var(--muted);font-weight:700}.timer-value{font-size:1.32rem;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.25}.side-toggle{border:1px solid var(--line);border-radius:10px;background:#FBFAFE;padding:7px 10px;color:var(--primary-dark);font-size:.82rem;font-weight:750}.sidebar-details{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding:0 2px 8px}.side-section-title{font-size:.86rem;font-weight:850;margin:0 0 8px}.sidebar.collapsed .sidebar-details{display:none}.number-button.is-selected{background:#F2EDFF;border-color:#C3B3FF;color:#59458F}.side-question-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.number-button{min-width:0;min-height:34px;padding:3px;border:1px solid #E5E1EC;border-radius:9px;background:white;color:#4E495D;font-weight:700;font-size:.83rem;font-variant-numeric:tabular-nums}.number-button.is-correct{background:var(--good);border-color:#B2DCC1;color:var(--good-ink)}.number-button.is-wrong{background:var(--bad);border-color:#F0B5B9;color:var(--bad-ink)}.number-button.is-current{box-shadow:inset 0 0 0 2px #9F8AE9;background:#F5F0FF}.number-button.is-pinned{border:2px solid #E1AD1F}.pin-list{display:flex;flex-wrap:wrap;gap:7px}.pin-chip{min-width:42px;padding:5px 8px;border:2px solid #E1AD1F;border-radius:9px;background:var(--pin-soft);font-weight:800;color:#6C5110}.side-muted{color:var(--muted);font-size:.84rem}.sidebar-footer{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px;background:#fff}.pager-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-exit{width:100%}.mode-label{font-size:.77rem;color:var(--muted);font-weight:700}.mobile-only{display:none}.storage-warning{margin:8px 0 0}.empty-questions{padding:30px;text-align:center;border:1px dashed #D6D0E3;border-radius:16px;color:var(--muted);background:#fff}.blank-marker{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;color:#6A559D;font-weight:850}.quiz-bottom-spacer{height:25px}

<script>
const PAGE_FILE = "choice_101-150.html";
const PAGE_QUESTIONS = [{"id":"choice-101","type":"choice","number":101,"globalNumber":101,"stem":"分时操作系统的特点是 (　　)","images":[],"options":{"A":"交互性、同时性 (多路性)、独立性、及时性","B":"可靠性、交互性、动态性、及时性","C":"可靠性、交互性、独立性、及时性","D":"交互性、同时性 (多路性)、独立性、动态性"},"answer":"A","analysis":"分时操作系统支持多个用户同时使用计算机，具有交互性、同时性（多路性）、独立性和及时性的特点。交互性允许用户与系统进行交互操作；同时性（多路性）指多个用户可同时使用计算机；独立性保证每个用户的操作相互独立；及时性确保系统能及时响应用户请求。","source":"操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-102","type":"choice","number":102,"globalNumber":102,"stem":"存放系统账户的文件是 (　　)","images":[],"options":{"A":"passwd","B":"shadow","C":"gshadow","D":"group"},"answer":"A","analysis":"在 Linux 系统中，/etc/passwd 文件存放系统账户的基本信息，如用户名、用户 ID、组 ID 等。shadow 文件存放用户密码的加密信息；gshadow 文件用于存放组密码等相关信息；group 文件用于存放组的相关信息。","source":"Linux 系统管理基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-103","type":"choice","number":103,"globalNumber":103,"stem":"通过存取控制机制来防止由 (　　) 所造成的文件不安全性","images":[],"options":{"A":"人为因素","B":"自然因素","C":"系统因素","D":"硬件因素"},"answer":"A","analysis":"存取控制机制主要用于限制用户对文件的访问权限，防止因人为的非法访问、误操作等因素造成文件不安全性。自然因素（如自然灾害）、系统因素（如系统故障）和硬件因素（如硬件损坏）通常不是存取控制机制能防范的。","source":"计算机安全基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-104","type":"choice","number":104,"globalNumber":104,"stem":"设置 iptables 防火墙策略，默认禁止与本地进程进行通信，以下语法正确的是 (　　)","images":[],"options":{"A":"iptables -t filter -I INPUT ACCEPT","B":"iptables -t filter -A INPUT ACCEPT","C":"iptables -P INPUT DROP","D":"iptables -t nat -A INPUT ACCEPT"},"answer":"C","analysis":"iptables -P INPUT DROP 命令用于设置 INPUT 链的默认策略为 DROP，即默认禁止所有进入本地的数据包，从而禁止与本地进程进行通信。A 选项中 -I INPUT ACCEPT 是在 INPUT 链插入允许规则；B 选项 -A INPUT ACCEPT 是在 INPUT 链追加允许规则；D 选项 -t nat 表示使用 nat 表，不符合要求。","source":"Linux 网络配置与安全","difficulty":"中","file":"choice_101-150.html"},{"id":"choice-105","type":"choice","number":105,"globalNumber":105,"stem":"哪一项不是特洛伊木马所窃取的信息 (　　)","images":[],"options":{"A":"计算机名字","B":"硬件信息","C":"即时通信 APP 的账户与密码","D":"系统文件"},"answer":"D","analysis":"特洛伊木马主要用于窃取用户的敏感信息，如计算机名字、硬件信息、即时通信 APP 的账户与密码等，以达到非法目的。它一般不会窃取系统文件来直接获取利益，系统文件的获取对攻击者的直接价值相对较小。","source":"网络安全基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-106","type":"choice","number":106,"globalNumber":106,"stem":"(　　) 是恶意代码的表现手段。任何恶意代码传播到了新的软硬件系统后，都会对系统产生不同程度的影响","images":[],"options":{"A":"目的性","B":"破坏性","C":"传播性","D":"隐蔽性"},"answer":"B","analysis":"恶意代码传播到新系统后对系统产生影响，这体现了其破坏性。目的性是恶意代码编写的意图；传播性是恶意代码扩散的能力；隐蔽性是恶意代码隐藏自身的特性，都不符合 “对系统产生影响” 这一表现手段的描述。","source":"网络安全基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-107","type":"choice","number":107,"globalNumber":107,"stem":"以下不属于 GPG 加密算法特点的是 (　　)","images":[],"options":{"A":"计算量大","B":"处理速度慢","C":"适合加密长数据","D":"使用两个密码"},"answer":"C","analysis":"GPG 加密算法采用非对称加密，计算量大、处理速度慢，使用公钥和私钥两个密码。由于其处理速度慢的特点，并不适合加密长数据，更适合加密少量关键数据（如密钥等）。","source":"加密技术基础","difficulty":"中","file":"choice_101-150.html"},{"id":"choice-108","type":"choice","number":108,"globalNumber":108,"stem":"当 Web 服务器访问人数超过了设计访问人数上限，将可能出现的 HTTP 状态码是 (　　)","images":[],"options":{"A":"200 OK 请求成功，请求所希望的响应头或数据体将随此响应返回","B":"503 Service Unavailable 由于临时的服务器维护或者过载，服务器当前无法处理请求","C":"403 Forbidden 服务器已经理解请求，但是拒绝执行它","D":"302 Move temporarily 请求的资源现在临时从不同的 URI 响应请求"},"answer":"B","analysis":"当 Web 服务器访问人数超过上限导致过载时，会返回 503 Service Unavailable 状态码，表示服务器当前无法处理请求。200 OK 表示请求成功；403 Forbidden 表示服务器拒绝执行请求；302 Move temporarily 表示资源临时重定向。","source":"Web 服务器配置与管理","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-109","type":"choice","number":109,"globalNumber":109,"stem":"以下文件中，不属于 vsftpd 的配置文件的是 (　　)","images":[],"options":{"A":"/etc/vsftpd/vsftp.conf","B":"/etc/vsftpd/vsftpd.conf","C":"/etc/vsftpd/ftpusers","D":"/etc/vsftpd/user_list"},"answer":"A","analysis":"vsftpd 的配置文件常见的有 /etc/vsftpd/vsftpd.conf（主配置文件）、/etc/vsftpd/ftpusers（用于限制不能登录 FTP 的用户）、/etc/vsftpd/user_list（可用于控制用户登录 FTP 的权限）。A 选项中文件名错误，应为 /etc/vsftpd/vsftpd.conf。","source":"FTP 服务器配置与管理","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-110","type":"choice","number":110,"globalNumber":110,"stem":"samba 服务的默认安全模式等级是 (　　)","images":[],"options":{"A":"user","B":"share","C":"server","D":"ads"},"answer":"A","analysis":"samba 服务有多种安全模式，默认的安全模式等级是 user。在 user 模式下，用户访问 samba 共享资源时需要提供用户名和密码进行身份验证。","source":"Samba 服务器配置与管理","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-111","type":"choice","number":111,"globalNumber":111,"stem":"域名系统 DNS 的作用是 (　　)","images":[],"options":{"A":"存放主机域名","B":"存放 IP 地址","C":"存放邮件地址","D":"将域名转换成 IP 地址"},"answer":"D","analysis":"域名系统 DNS 的主要功能是将人们易于记忆的域名转换为计算机能够识别的 IP 地址，实现网络中主机的访问定位。它并不主要用于存放主机域名、IP 地址或邮件地址。","source":"域名系统与 DNS 配置","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-112","type":"choice","number":112,"globalNumber":112,"stem":"有一台名称为 server1 的 DHCP 服务器和一台名称为 server2 的应用程序服务器。这两台服务器运行 Windows Server 2008 R2。DHCP 服务器包含一个作用域。您需要确保 Server2 上总是收到相同的 IP 地址，Server2 上也必须从 server1 上接收到 DNS 设置和 WINS 设置，应该 (　　)","images":[],"options":{"A":"创建一个多播范围","B":"在 DHCP 作用域上创建一个 DHCP 保留","C":"给 server2 分配一个静态 IP 地址","D":"创建一个在 DHCP 范围之外的区域"},"answer":"B","analysis":"在 DHCP 作用域上创建 DHCP 保留，可以为指定的设备（如 Server2）分配固定的 IP 地址，同时该设备还能从 DHCP 服务器获取 DNS 设置和 WINS 设置。创建多播范围用于多播通信；给 server2 分配静态 IP 地址无法从 DHCP 服务器获取 DNS 和 WINS 设置；创建在 DHCP 范围之外的区域与需求无关。","source":"DHCP 服务器配置与管理","difficulty":"中","file":"choice_101-150.html"},{"id":"choice-113","type":"choice","number":113,"globalNumber":113,"stem":"当需要 VLAN 跨交换机时，交换机与交换机之间连接的端口应该设置为 (　　) 端口","images":[],"options":{"A":"Access 端口","B":"Trunk 端口","C":"Hybrid 端口","D":"Console 口"},"answer":"B","analysis":"Trunk 端口用于在交换机之间传输多个 VLAN 的数据帧，当需要 VLAN 跨交换机时，通常将交换机之间的连接端口设置为 Trunk 端口。Access 端口只能属于一个 VLAN；Hybrid 端口也可用于多 VLAN 通信，但默认情况下主要用于连接终端设备；Console 口用于交换机的配置管理，不用于 VLAN 跨交换机通信。","source":"VLAN 配置与管理","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-114","type":"choice","number":114,"globalNumber":114,"stem":"下面说法错误的是 (　　)","images":[],"options":{"A":"VLAN 是不受物理区域和交换机限制的逻辑网络，它构成一个广播域","B":"VLAN 能解决局域网内由广播过多所带来的宽带利用率下降、安全性低等问题","C":"VLAN 的主要作用是缩小广播域，控制广播风暴","D":"所有主机和交换机都能识别带有 VLAN 标签的数据帧"},"answer":"D","analysis":"并非所有主机和交换机都能识别带有 VLAN 标签的数据帧，一些老旧设备可能不支持 VLAN 功能，无法识别 VLAN 标签。A、B、C 选项关于 VLAN 的描述均正确，VLAN 是逻辑网络，可缩小广播域，解决广播带来的问题。","source":"VLAN 配置与管理","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-115","type":"choice","number":115,"globalNumber":115,"stem":"生成树协议推举根网桥说法正确的是 (　　)","images":[],"options":{"A":"生成树协议推举网桥优先级数值最大的为根网桥","B":"生成树协议推举网桥 MAC 地址最小的为根网桥","C":"当网桥优先级相同时，生成树协议推举 MAC 地址最小的为根网桥","D":"当网桥优先级相同时，生成树协议推举 MAC 地址最大的为根网桥"},"answer":"C","analysis":"生成树协议首先比较网桥优先级，优先级数值越小越优先成为根网桥；当网桥优先级相同时，比较 MAC 地址，MAC 地址最小的成为根网桥。A 选项中优先级数值最大错误；B 选项缺少网桥优先级相同的前提；D 选项 MAC 地址最大错误。","source":"生成树协议与网络冗余","difficulty":"中","file":"choice_101-150.html"},{"id":"choice-116","type":"choice","number":116,"globalNumber":116,"stem":"思科交换机上设置当前网桥为 VLAN 10 的根网桥的命令是 (　　)","images":[],"options":{"A":"Switch(config)#spanning-tree VLAN 10 root","B":"Switch(config)#spanning-tree VLAN 10 root primary","C":"Switch(config)#spanning-tree VLAN 10 root secondary","D":"Switch(config)#spanning-tree VLAN 10 root 0"},"answer":"B","analysis":"在思科交换机上，Switch (config)#spanning-tree VLAN 10 root primary 命令用于将当前网桥设置为 VLAN 10 的根网桥。A 选项命令不完整；C 选项 root secondary 用于设置为备份根网桥；D 选项命令格式错误。","source":"思科交换机配置","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-117","type":"choice","number":117,"globalNumber":117,"stem":"思科三层交换机上将物理端口转换成三层模式的命令是 (　　)","images":[],"options":{"A":"Switch(config-if)#router","B":"Switch(config-if)#no switchport","C":"Switch(config)#router","D":"Switch(config)#no switchport"},"answer":"B","analysis":"在思科三层交换机上，在接口配置模式下使用 Switch (config-if)#no switchport 命令可以将物理端口从二层交换模式转换成三层路由模式。A 选项 router 命令错误；C 选项不在接口配置模式下；D 选项同样不在接口配置模式下。","source":"思科三层交换机配置","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-118","type":"choice","number":118,"globalNumber":118,"stem":"设置用户进入交换机的特权视图的密码的命令是 (　　)","images":[],"options":{"A":"Switch(config)#password 123456","B":"Switch(config)#enable password 123456","C":"Switch#enable 123456","D":"Switch#enable password 123456"},"answer":"B","analysis":"在交换机全局配置模式下，使用 Switch (config)#enable password 123456 命令可以设置用户进入特权视图的密码。A 选项 password 命令错误；C 选项 enable 123456 命令格式错误；D 选项不在配置模式下。","source":"思科交换机配置","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-119","type":"choice","number":119,"globalNumber":119,"stem":"根据 SSH 的认证机制，必需要给本机配置一个域名才能生成密钥对进行加密。思科路由器上配置本机域名的命令是 (　　)","images":[],"options":{"A":"Router#ip domain name localname","B":"Router#ip domain-name localname","C":"Router(config)#ip domain name localname","D":"Router(config)#ip domain-name localname"},"answer":"D","analysis":"在思科路由器的全局配置模式下，使用 Router (config)#ip domain-name localname 命令配置本机域名。A、B 选项不在配置模式下；C 选项命令中 domain 和 name 之间不应有空格。","source":"思科路由器配置与安全","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-120","type":"choice","number":120,"globalNumber":120,"stem":"下面说法正确的是 (　　)","images":[],"options":{"A":"思科路由器可以通过 privilege 命令为特权模式配置 16 个（0 - 15）层次的命令级别，数字越大，安全级别越低","B":"思科路由器可以通过 privilege 命令为特权模式配置 16 个（0 - 15）层次的命令级别，数字越大，安全级别越高","C":"思科路由器 IOS 系统默认有三个级别：用户模式，管理员模式，特权模式","D":"思科路由器 IOS 系统默认有 16 个级别，分别用 0 - 15 的数字表示，每个级别都设定有不同的命令"},"answer":"B","analysis":"思科路由器可以通过 privilege 命令为特权模式配置 16 个（0 - 15）层次的命令级别，数字越大，安全级别越高，权限也越高。思科路由器 IOS 系统默认有用户模式和特权模式，并没有管理员模式，也不是默认有 16 个级别。","source":"思科路由器配置与安全","difficulty":"中","file":"choice_101-150.html"},{"id":"choice-121","type":"choice","number":121,"globalNumber":121,"stem":"Windows Server 2008 R2 提供了很多管理工具，为了便于使用，它们具有统一的管理界面，这个界面称为 (　　)","images":[],"options":{"A":"微软管理控制台","B":"管理工具","C":"转发器","D":"域控制器"},"answer":"A","analysis":"微软管理控制台是 Windows Server 2008 R2 中用于统一管理工具的界面；管理工具是一个宽泛概念；转发器与管理界面无关；域控制器用于管理域，并非管理工具的统一界面","source":"操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-122","type":"choice","number":122,"globalNumber":122,"stem":"在域的活动目录数据库中，管理员可以为用户创建用户账户，这种用户账户只存在于域中，所以称为 (　　)","images":[],"options":{"A":"本地用户账户","B":"域用户账户","C":"计算机账户","D":"临时账户"},"answer":"B","analysis":"本地用户账户存在于本地计算机；域用户账户存在于域中；计算机账户用于管理计算机；临时账户概念不符","source":"操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-123","type":"choice","number":123,"globalNumber":123,"stem":"工作组属于 (　　) 的管理模式，每台计算机的管理员分别管理各自的计算机，安全级别不高，只适用于小型网络","images":[],"options":{"A":"集中","B":"分散","C":"连续","D":"有层次"},"answer":"B","analysis":"工作组中各计算机独立管理，属于分散管理模式；集中管理模式与之相反；连续和有层次不属于工作组管理模式特点","source":"操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-124","type":"choice","number":124,"globalNumber":124,"stem":"在 NTFS 格式的分区中，管理员可以为每个用户账户设置 (　　)，从而限制用户可以使用磁盘空间的大小","images":[],"options":{"A":"打印权限","B":"文件大小","C":"访问权限","D":"磁盘配额"},"answer":"D","analysis":"打印权限控制打印相关操作；文件大小是文件本身属性；访问权限控制对文件或文件夹的访问；磁盘配额用于限制用户磁盘空间使用","source":"操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-125","type":"choice","number":125,"globalNumber":125,"stem":"Linux 操作系统中存放用户账号的文件是 (　　)","images":[],"options":{"A":"shadow","B":"group","C":"passwd","D":"gshadow"},"answer":"B","analysis":"shadow 存放用户密码的加密信息；group 存放用户组信息；passwd 存放用户账号基本信息；gshadow 存放用户组密码的加密信息","source":"Linux 操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-126","type":"choice","number":126,"globalNumber":126,"stem":"下面哪个系统目录中包含 Linux 使用的外部设备 (　　)","images":[],"options":{"A":"/bin","B":"/dev","C":"/boot","D":"/home"},"answer":"B","analysis":"/bin 存放二进制可执行文件；/dev 存放外部设备文件；/boot 存放系统启动相关文件；/home 存放用户主目录","source":"Linux 操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-127","type":"choice","number":127,"globalNumber":127,"stem":"Linux 系统中，创建目录的命令是 (　　)","images":[],"options":{"A":"less","B":"tar","C":"cat","D":"mkdir"},"answer":"D","analysis":"less 用于查看文件内容；tar 用于打包和解包文件；cat 用于查看或连接文件；mkdir 用于创建目录","source":"Linux 操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-128","type":"choice","number":128,"globalNumber":128,"stem":"Linux 要给所有的人读取权限，用数字表示 (　　)","images":[],"options":{"A":"441","B":"444","C":"222","D":"111"},"answer":"B","analysis":"在 Linux 权限数字表示中，4 代表读权限，所以给所有人读取权限是 444；2 代表写权限，1 代表执行权限","source":"Linux 操作系统基础","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-129","type":"choice","number":129,"globalNumber":129,"stem":"下列关于数据备份方法的描述中错误的是 (　　)","images":[],"options":{"A":"增量备份比完全备份使用的空间少","B":"差异备份比增量备份恢复的速度慢","C":"差异备份比完全备份的备份速度快","D":"恢复时完全备份使用的副本最少"},"answer":"B","analysis":"增量备份只备份自上次备份以来更改的数据，比完全备份使用空间少；差异备份恢复时只需使用最近一次完全备份和最近一次差异备份副本，比增量备份恢复速度快；差异备份备份自上次完全备份以来更改的数据，比完全备份速度快；完全备份恢复时只需一个副本","source":"数据备份与恢复技术","difficulty":"中","file":"choice_101-150.html"},{"id":"choice-130","type":"choice","number":130,"globalNumber":130,"stem":"(　　) 手段可以有效应对较大范围的安全事件的不良影响，保证关键服务和数据的可用性","images":[],"options":{"A":"定期备份","B":"异地备份","C":"人工备份","D":"本地备份"},"answer":"B","analysis":"定期备份按一定周期备份数据；人工备份依赖人工操作；本地备份在本地存储备份数据；异地备份将数据备份到异地，可避免本地安全事件影响，保证关键服务和数据可用性","source":"数据备份与恢复技术","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-131","type":"choice","number":131,"globalNumber":131,"stem":"主机系统高可用技术中在系统出现故障时不需要进行主机系统切换的是 (　　)","images":[],"options":{"A":"双机热备份方式","B":"双机互备方式","C":"多处理器协同方式","D":"群集并发存取方式"},"answer":"D","analysis":"双机热备份和双机互备方式在主系统故障时都需切换主机；多处理器协同方式主要涉及处理器协同工作；群集并发存取方式通过集群技术实现多节点并发访问，故障时无需切换主机系统","source":"主机系统高可用技术","difficulty":"中","file":"choice_101-150.html"},{"id":"choice-132","type":"choice","number":132,"globalNumber":132,"stem":"在 Windows 中，Web 服务器的备份有 (　　)","images":[],"options":{"A":"文件备份","B":"数据库备份","C":"文件备份和数据库备份","D":"系统文件备份"},"answer":"C","analysis":"Web 服务器数据包括文件和数据库数据，所以备份包括文件备份和数据库备份；系统文件备份范围太宽泛，不具体针对 Web 服务器","source":"Web 服务器管理与维护","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-133","type":"choice","number":133,"globalNumber":133,"stem":"目前发展很快的安全电子邮件协议是 (　　)，这是一个允许发送加密和有签名邮件的协议","images":[],"options":{"A":"IPSec","B":"SMTP","C":"S/MIME","D":"TCP/1P"},"answer":"C","analysis":"IPSec 是网络层安全协议；SMTP 是简单邮件传输协议，用于邮件发送，但不具备加密和签名功能；S/MIME 用于安全电子邮件，支持加密和签名；TCP/IP 是网络通信协议族，并非专门的安全电子邮件协议","source":"网络安全协议","difficulty":"易","file":"choice_101-150.html"},{"id":"choice-134","type":"choice", if(Array.isArray(q.images)&&q.images.length){const row=element("div","image-row");for(const src of q.images){if(!String(src).startsWith("data:image/"))continue;const im=element("img","question-image");im.src=src;im.alt="题目图片";im.loading="lazy";row.append(im)}if(row.childNodes.length)card.append(row)}
if(q.type==="fill"){
const fields=element("div","fill-inputs");const blankCount=(String(q.stem).match(/___[①②③④⑤⑥⑦⑧⑨⑩]___/g)||[]).length;const vals=Array.isArray(s.blanks)?s.blanks:[];for(let i=0;i<blankCount;i++){const field=element("label","fill-field");field.append(element("span","muted",`${["①","②","③","④","⑤","⑥"][i]||i+1} 空`));const input=element("input");input.maxLength=20;input.value=vals[i]||"";input.dataset.qid=q.id;input.dataset.blank=String(i);input.placeholder="输入答案（最多20字）";input.disabled=readOnly||Boolean(s.locked);if(s.answered&&s.correct)input.classList.add("is-correct");else if(s.answered&&!s.correct)input.classList.add("is-wrong");field.append(input);fields.append(field)}card.append(fields);if(!isExamOpen()&&!readOnly){const submit=element("button","btn btn-primary fill-submit","提交答案");submit.dataset.action="submit-fill";submit.dataset.qid=q.id;card.append(submit)}
}else{
const optionWrap=element("div","options");const order=optionsOrder(q);const labels=labelMapFor(q);const corr=correctKeys(q);const selected=Array.isArray(s.selectedKeys)?s.selectedKeys:[];const showJudged=(progress.mode==="practice"||progress.mode==="wrong")&&s.answered||progress.mode==="review"||s.answered&&progress.mode==="exam"&&progress.submitted;for(const key of order){const b=element("button","option");b.type="button";b.dataset.action="answer";b.dataset.qid=q.id;b.dataset.key=key;const lab=element("span","option-label",q.type==="judgment"?key:(labels[key]||key));const txt=element("span","option-text",q.options[key]);b.append(lab,txt);if(selected.includes(key))b.classList.add("is-selected");if(showJudged){if(s.correct===true){if(selected.includes(key))b.classList.add("is-correct")}else{if(corr.includes(key))b.classList.add("is-correct");else b.classList.add("is-wrong")}}else if(isExamOpen()&&selected.includes(key)){b.classList.add("is-correct")}else if(s.answered&&s.correct&&selected.includes(key)){b.classList.add("is-correct")}else if(s.answered&&!s.correct){if(corr.includes(key))b.classList.add("is-correct");else b.classList.add("is-wrong")}
b.disabled=readOnly||Boolean(s.locked);optionWrap.append(b)}card.append(optionWrap)}
const showAnalysis=progress.mode==="review"||(progress.mode==="practice"||progress.mode==="wrong")&&Boolean(s.answered)||(progress.mode==="exam"&&progress.submitted);if(showAnalysis)card.append(analysisBlock(q,s));return card}
function updateOneQuestion(id){const q=questionMap[id];if(!q)return;const old=$("q-"+id);if(old)old.replaceWith(renderQuestionCard(q));renderQuestionNavigation();renderPinList();renderTimer()}
function renderQuestionList(){const list=$("questionList");list.textContent="";const qs=currentVisibleQuestions();if(!qs.length){list.append(element("div","empty-questions",progress.mode==="wrong"?"当前分页没有需要复习的错题。":"当前分页暂无可显示的题目。"));return}for(const q of qs)list.append(renderQuestionCard(q));list.append(element("div","quiz-bottom-spacer"));}
function statusClass(qid){const q=questionMap[qid];if(!q)return "";const s=stateFor(q);if(progress.mode==="review")return s.correct?"is-correct":"is-wrong";if(progress.mode==="exam")return (s.selectedKeys||[]).length?"is-selected":"";if(s.answered)return s.correct?"is-correct":"is-wrong";return ""}
function renderQuestionNavigation(){const wrap=$("questionNav");wrap.textContent="";const qs=currentVisibleQuestions();wrap.append(element("div","side-section-title",typeName(qs[0]?.type||routeByFile(PAGE_FILE)?.type||"choice")));const grid=element("div","side-question-grid");for(const q of qs){const b=element("button","number-button",String(q.number));b.type="button";b.dataset.action="goto";b.dataset.qid=q.id;const s=stateFor(q);const cls=statusClass(q.id);if(cls)b.classList.add(cls);if(q.id===progress.currentId)b.classList.add("is-current");const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(pins.includes(q.id))b.classList.add("is-pinned");b.title=`${typeName(q.type)} 第${q.number}题`;grid.append(b)}wrap.append(grid)}
function renderPinList(){const wrap=$("pinList");wrap.textContent="";const pins=progress.mode==="review"?((lastResult&&lastResult.pins)||[]):(progress.pins||[]);if(!pins.length){wrap.append(element("div","side-muted","暂无图钉题目"));return}const known=pins.map(findMeta).filter(Boolean);const groupOrder=["choice","multi","judgment","fill"];for(const type of groupOrder){const items=known.filter(m=>m.type===type);if(!items.length)continue;wrap.append(element("div","side-section-title",typeName(type)));const row=element("div","pin-list");for(const m of items){const b=element("button","pin-chip",String(m.number));b.type="button";b.dataset.action="goto-meta";b.dataset.qid=m.id;b.title=typeName(m.type)+" 第"+m.number+"题";row.append(b)}wrap.append(row)}}
function routeForNavigation(){if(progress.mode==="wrong")return activeRoutes();return ROUTES}
function updatePager(){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);for(const b of document.querySelectorAll('[data-action="prev"],[data-action="next"]')){const isPrev=b.dataset.action==="prev";b.disabled=idx<0||(isPrev?idx===0:idx>=routes.length-1)}const submitVisible=isExamOpen();document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.classList.toggle("hidden",!submitVisible));document.querySelectorAll('[data-action="submit-exam"]').forEach(b=>b.disabled=!submitVisible)}
function renderMode(){const n=$("modeLabel");if(n)n.textContent=statusText();const s=$("pageInfo");if(s){const r=routeByFile(PAGE_FILE);s.textContent=r?`${typeName(r.type)} · ${r.start}–${r.end} 题`:"刷题"}const top=$("quizMainTitle");if(top)top.textContent=statusText();}
function scrollToQuestion(id){const card=$("q-"+id);if(!card)return;progress.currentId=id;progress.currentFile=PAGE_FILE;saveProgress();document.querySelectorAll(".question-card.is-current").forEach(n=>n.classList.remove("is-current"));card.classList.add("is-current");renderQuestionNavigation();const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}
function gotoQuestion(id){const m=findMeta(id);if(!m)return;if(m.file!==PAGE_FILE){progress.currentFile=m.file;progress.currentId=id;saveProgress();location.href=m.file;return}if(!questionMap[id])return;scrollToQuestion(id)}
function switchPage(delta){const routes=routeForNavigation();const idx=routes.findIndex(r=>r.file===PAGE_FILE);const target=routes[idx+delta];if(!target)return;const ids=target.ids.filter(id=>progress.mode!=="wrong"||(progress.wrongIds||[]).includes(id));let ordered=ids;if(progress.mode==="exam"&&examSession&&examSession.questionOrders[target.file])ordered=examSession.questionOrders[target.file].filter(id=>ids.includes(id));if(progress.mode==="review"&&lastResult&&lastResult.questionOrders&&lastResult.questionOrders[target.file])ordered=lastResult.questionOrders[target.file].filter(id=>ids.includes(id));progress.currentFile=target.file;progress.currentId=ordered[0]||ids[0]||null;saveProgress();location.href=target.file}
function togglePin(id){if(isReadOnly()||!id)return;const pins=new Set(progress.pins||[]);if(pins.has(id))pins.delete(id);else pins.add(id);progress.pins=[...pins];saveProgress();updateOneQuestion(id)}
function recordStats(q,correct,answered){if(!answered)return;progress.stats=progress.stats||{};progress.stats[q.id]={answered:true,correct:Boolean(correct),updatedAt:Date.now()}}
function answerQuestion(id,key){const q=questionMap[id];if(!q||isReadOnly())return;if(progress.mode==="wrong"&&!(progress.wrongIds||[]).includes(id))return;let s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};if(progress.mode==="exam"){
if(!isExamOpen())return;if(q.type==="multi"){const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set]}else s.selectedKeys=[key];s.answered=s.selectedKeys.length>0;s.locked=false;s.correct=null;progress.answers[id]=s;saveProgress();updateOneQuestion(id);return}
if(s.locked)return;if(q.type==="multi"){
const set=new Set(s.selectedKeys||[]);if(set.has(key))set.delete(key);else set.add(key);s.selectedKeys=[...set];const correct=new Set(correctKeys(q));const wrong=s.selectedKeys.some(k=>!correct.has(k));const complete=[...correct].every(k=>set.has(k))&&set.size===correct.size;if(wrong||complete){s.answered=true;s.locked=true;s.correct=!wrong&&complete;recordStats(q,s.correct,true)}else{s.answered=false;s.correct=null;s.locked=false}
}else{s.selectedKeys=[key];s.answered=true;s.locked=true;s.correct=answersMatch(q,s);recordStats(q,s.correct,true)}progress.answers[id]=s;saveProgress();updateOneQuestion(id)}
function submitFill(id){const q=questionMap[id];if(!q||isReadOnly()||progress.mode==="exam")return;const fields=[...document.querySelectorAll(`input[data-qid="${id}"][data-blank]`)];const vals=fields.map(n=>n.value.slice(0,20));if(!vals.some(v=>v.trim())){alert("请先填写答案。");return}const s={blanks:vals,selectedKeys:[],answered:true,locked:true};const correctAnswers=Array.isArray(q.blanks)?q.blanks:[];s.correct=correctAnswers.length===vals.length&&correctAnswers.every((v,i)=>normalizeText(v)===normalizeText(vals[i]));progress.answers[id]=s;recordStats(q,s.correct,true);saveProgress();updateOneQuestion(id)}
function exitToHome(){checkpointTimer();progress.active=true;progress.timerRunning=false;progress.timerStartedAt=null;saveProgress();if(examSession&&progress.mode==="exam"){examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession)}location.href="index.html"}
const ALL_META_MAP=Object.fromEntries(META.map(m=>[m.id,m]));
function submitExam(){if(!isExamOpen())return;if(!confirm("确定交卷吗？未作答的题目将按错误计入，本次考试将停止计时。"))return;const now=Date.now();progress.elapsedMs=getElapsed();progress.timerRunning=false;progress.timerStartedAt=null;examSession.elapsedMs=progress.elapsedMs;examSession.timerRunning=false;examSession.timerStartedAt=null;writeKey(STORAGE_KEYS.exam,examSession);const states={};const wrongIds=[];let total=0,correctCount=0;for(const m of META){const q=questionMap[m.id]||null;const answer=progress.answers[m.id]||{selectedKeys:[],blanks:[],answered:false,locked:false};const selected=Array.isArray(answer.selectedKeys)?answer.selectedKeys.slice():[];let hasAnswer=selected.length>0;if(m.type==="fill"){const blanks=Array.isArray(answer.blanks)?answer.blanks:[];hasAnswer=blanks.some(v=>String(v||"").trim()!=="")}
let correct=false;if(q){correct=hasAnswer&&answersMatch(q,answer)}else{const base=answer.correct;correct=hasAnswer&&base===true}
// This page includes only 50 questions, so exam submission must use source-independent answer snapshots captured at each page.
const snap=examSession.answerSnapshot&&examSession.answerSnapshot[m.id];if(snap){hasAnswer=!!snap.answered;correct=hasAnswer&&snap.correct===true;}
// The home page has no access to the page-specific current state; store all answers and their correctness in the shared progress object.
const allAnswer=progress.answers[m.id]||{};const answered=Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.length>0:(Array.isArray(allAnswer.blanks)&&allAnswer.blanks.some(v=>String(v||"").trim()!==""));
let finalCorrect=false;const ak=ANSWER_KEYS[m.id];if(answered&&ak){if(ak.type==="choice"||ak.type==="judgment")finalCorrect=allAnswer.selectedKeys?.length===1&&allAnswer.selectedKeys[0]===ak.answer;else if(ak.type==="multi"){const a=[...(allAnswer.selectedKeys||[])].sort(),b=[...(ak.answer||[])].sort();finalCorrect=a.length===b.length&&a.every((v,i)=>v===b[i])}else if(ak.type==="fill"){const norm=v=>String(v??"").normalize("NFKC").trim().toLowerCase();finalCorrect=(ak.blanks||[]).length===(allAnswer.blanks||[]).length&&(ak.blanks||[]).every((v,i)=>norm(v)==norm(allAnswer.blanks[i]))}}
states[m.id]={id:m.id,type:m.type,number:m.number,file:m.file,selectedKeys:Array.isArray(allAnswer.selectedKeys)?allAnswer.selectedKeys.slice():[],blanks:Array.isArray(allAnswer.blanks)?allAnswer.blanks.slice():[],answered,correct:finalCorrect};total++;if(finalCorrect)correctCount++;else wrongIds.push(m.id);
if(answered)progress.stats[m.id]={answered:true,correct:finalCorrect,updatedAt:now};}
const result={schema:2,resultId:"result-"+now.toString(36),mode:"考试模式",testAt:now,elapsedMs:progress.elapsedMs,total,correct:correctCount,accuracy:total?correctCount/total:0,wrongIds,questionStates:states,questionOrders:examSession.questionOrders||{},optionOrders:examSession.optionOrders||{},pins:(progress.pins||[]).slice()};writeKey(STORAGE_KEYS.result,result);progress.active=false;progress.mode=null;progress.answers={};progress.pins=result.pins.slice();progress.currentFile=null;progress.currentId=null;progress.timerRunning=false;progress.timerStartedAt=null;progress.completed=true;saveProgress();removeKey(STORAGE_KEYS.exam);location.href="result.html"}
function renderAll(){currentOrder=idsForPage();renderMode();renderQuestionList();renderQuestionNavigation();renderPinList();renderTimer();updatePager()}
function init(){progress=readProgress();examSession=readKey(STORAGE_KEYS.exam);lastResult=readKey(STORAGE_KEYS.result);const marker=readKey(STORAGE_KEYS.marker);if(location.protocol==="file:"){showStorageWarning("当前通过 file:// 直接打开。浏览器可能隔离不同 HTML 文件的本地存储；若跨页进度无法共享，请改用同源静态站点，或通过首页导入/导出备份。")}
if(!safeStorage)showStorageWarning("浏览器本地存储不可用，进度可能无法保存。请检查浏览器权限后再开始。")
if(!progress.active){const stats=progress.stats||{};const route=routeByFile(PAGE_FILE);progress={...baseProgress(),active:true,mode:"practice",answers:{},stats,pins:[],currentFile:PAGE_FILE,currentId:route?.ids?.[0]||null,elapsedMs:0,timerRunning:true,timerStartedAt:Date.now(),wrongIds:[],createdAt:Date.now()};saveProgress()}
if(progress.mode==="exam"&&!examSession){showStorageWarning("没有读取到当前考试会话，已禁止自动开始或重新打乱。请返回首页并导入之前导出的进度，或在同源静态站点中重新进入考试。")}
if(progress.mode==="review")lastResult=readKey(STORAGE_KEYS.result);
if(progress.mode==="wrong"){const routes=activeRoutes();if(!routes.length){alert("暂无数据：没有可复习的错题。");location.href="index.html";return}if(!routes.some(r=>r.file===PAGE_FILE)){progress.currentFile=routes[0].file;progress.currentId=routes[0].ids.find(id=>(progress.wrongIds||[]).includes(id))||routes[0].ids[0];saveProgress();location.replace(progress.currentFile);return}}
if(progress.mode!=="wrong"&&progress.mode!=="exam"&&progress.mode!=="review"&&progress.mode!=="practice"){progress.mode="practice";progress.currentFile=PAGE_FILE;progress.currentId=PAGE_QUESTIONS[0]?.id||null;saveProgress()}
if(progress.currentFile!==PAGE_FILE){progress.currentFile=PAGE_FILE;if(!progress.currentId||!questionMap[progress.currentId])progress.currentId=idsForPage()[0]||null;saveProgress()}
const header=$("modeStatus");if(header)header.textContent=statusText();const side=$("sidebar");const toggle=document.querySelector('[data-action="toggle-panel"]');if(window.matchMedia&&window.matchMedia("(max-width:760px)").matches){side.classList.add("collapsed");if(toggle)toggle.textContent="展开题号"}else{side.classList.remove("collapsed");if(toggle)toggle.textContent="收起题号"}renderAll();if(progress.currentId&&questionMap[progress.currentId])requestAnimationFrame(()=>{const target=document.getElementById("q-"+progress.currentId);if(target)target.scrollIntoView({behavior:"auto",block:"start"})});if(progress.timerRunning&&(!progress.mode||progress.mode!=="exam"||examSession))timerTick=setInterval(renderTimer,1000);setInterval(()=>{if(progress&&progress.active)checkpointTimer()},15000);window.addEventListener("pagehide",checkpointTimer);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpointTimer()});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.qid;switch(b.dataset.action){case"answer":answerQuestion(id,b.dataset.key);break;case"pin":togglePin(id);break;case"goto":case"goto-meta":gotoQuestion(id);break;case"prev":switchPage(-1);break;case"next":switchPage(1);break;case"exit":exitToHome();break;case"submit-exam":submitExam();break;case"submit-fill":submitFill(id);break;case"toggle-panel":$("sidebar").classList.toggle("collapsed");b.textContent=$("sidebar").classList.contains("collapsed")?"展开题号":"收起题号";break}});
document.addEventListener("input",e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||!input.dataset.qid||input.dataset.blank===undefined||isReadOnly())return;const id=input.dataset.qid;const idx=Number(input.dataset.blank);const s=progress.answers[id]||{selectedKeys:[],blanks:[],answered:false,locked:false};s.blanks=s.blanks||[];s.blanks[idx]=input.value.slice(0,20);progress.answers[id]=s;});
function selfTestMapping(){const testOrder=["B","C","D","A"];const map={};testOrder.forEach((k,i)=>map[k]=String.fromCharCode(65+i));if(map.A!=="D")throw new Error("选项映射自测失败");const expected=["A","C"].map(k=>map[k]).sort().join(",");if(expected!=="B,D")throw new Error("多选题映射自测失败")}
try{selfTestMapping()}catch(e){showStorageWarning("答案映射检查未通过，已阻止继续作答。请返回首页重新进入考试。");}
